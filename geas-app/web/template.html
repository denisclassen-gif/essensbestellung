<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEAS Hilfe</title>
<meta name="description" content="Einsatz-, Unterlagen- und Lernhilfe zu GEAS, Screening, Asyl und Rückführung für den Polizeivollzugsdienst">
<meta name="theme-color" content="#003d35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GEAS Hilfe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f2f3f5;
    --text: #15171a;
    --muted: #6b7078;
    --faint: #9aa0a8;
    --line: rgba(20, 24, 28, 0.09);
    --glass: rgba(255, 255, 255, 0.62);
    --glass-strong: rgba(255, 255, 255, 0.82);
    --glass-edge: rgba(255, 255, 255, 0.75);
    --shadow: 0 10px 30px rgba(15, 30, 35, 0.08), 0 2px 6px rgba(15, 30, 35, 0.05);
    --green: #006b5c;
    --deep: #003d35;
    --mint: #61c7b0;
    --amber: #ffbd47;
    --coral: #ff5c5e;
    --ok: #0f8a5f;
    --blob1: rgba(97, 199, 176, 0.38);
    --blob2: rgba(255, 189, 71, 0.22);
    --blob3: rgba(90, 87, 214, 0.16);
    --paper: #ffffff;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --smooth: cubic-bezier(0.22, 1, 0.36, 1);
    --tabbar-h: 74px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d0f;
      --text: #f2f4f5;
      --muted: #a0a6ae;
      --faint: #6d737b;
      --line: rgba(255, 255, 255, 0.09);
      --glass: rgba(34, 38, 42, 0.55);
      --glass-strong: rgba(34, 38, 42, 0.82);
      --glass-edge: rgba(255, 255, 255, 0.12);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --green: #3fbfa2;
      --ok: #3fcf8e;
      --blob1: rgba(63, 191, 162, 0.22);
      --blob2: rgba(255, 189, 71, 0.10);
      --blob3: rgba(110, 107, 234, 0.16);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  html { overflow-x: clip; }
  /* Beim Fokussieren/Scrollen bleiben Felder oberhalb von Knopf- und Reiterleiste sichtbar */
  html { scroll-padding-top: calc(env(safe-area-inset-top) + 70px); }
  body {
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px);
    overflow-x: hidden;
  }
  .rounded { font-family: ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; }
  button { font: inherit; color: inherit; }

  /* Hintergrund mit langsam wandernden Farbflächen */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg i { position: absolute; border-radius: 50%; filter: blur(90px); animation: drift 26s var(--smooth) infinite alternate; }
  .bg i:nth-child(1) { width: 440px; height: 440px; background: var(--blob1); left: -160px; top: -120px; }
  .bg i:nth-child(2) { width: 380px; height: 380px; background: var(--blob2); right: -150px; top: 38%; animation-delay: -8s; }
  .bg i:nth-child(3) { width: 340px; height: 340px; background: var(--blob3); left: -80px; bottom: -120px; animation-delay: -16s; }
  @keyframes drift { to { transform: translate(40px, 60px) scale(1.12); } }

  /* Glas */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--shadow);
    border-radius: 24px;
  }
  .press { transition: transform .35s var(--spring), box-shadow .3s; cursor: pointer; }
  .press:active { transform: scale(0.965); }

  /* Kopfleiste */
  header.top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; min-height: 52px;
    transition: background .3s, backdrop-filter .3s, border-color .3s;
    border-bottom: 1px solid transparent;
  }
  header.top.solid {
    background: var(--glass-strong);
    backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
    border-bottom-color: var(--line);
  }
  header.top h1 { font-size: 17px; margin: 0; flex: 1; text-align: center; opacity: 0; transition: opacity .25s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.top.solid h1, header.top.plain h1 { opacity: 1; }
  .back {
    display: inline-flex; align-items: center; gap: 2px; border: 0; cursor: pointer;
    padding: 8px 12px 8px 8px; border-radius: 999px; font-weight: 600; color: var(--green);
    background: var(--glass-strong); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .back svg { width: 20px; height: 20px; }
  .back[hidden] { display: none; }
  .spacer { width: 82px; flex: none; }

  main { max-width: 780px; margin: 0 auto; }
  .pad { padding: calc(env(safe-area-inset-top) + 64px) 20px 0; }
  .content { padding: 0 20px; }
  .overlap { margin-top: -30px; position: relative; z-index: 2; }

  /* Hero mit Parallax */
  .hero {
    position: relative; overflow: hidden; color: #fff;
    min-height: 330px; padding: calc(env(safe-area-inset-top) + 70px) 24px 50px;
    display: flex; flex-direction: column; justify-content: flex-end;
    background: linear-gradient(135deg, #075c50, #003d35 55%, #08242a);
  }
  .hero.indigo { background: linear-gradient(135deg, #5a57d6, #221e66); }
  .hero.coral { background: linear-gradient(135deg, #ff735a, #8c2a3d); }
  .hero .deco1, .hero .deco2 { position: absolute; border-radius: 50%; will-change: transform; }
  .hero .deco1 { width: 320px; height: 320px; border: 40px solid rgba(255,255,255,.09); right: -110px; top: -110px; }
  .hero .deco2 { width: 240px; height: 240px; background: rgba(97,199,176,.22); filter: blur(50px); left: -60px; bottom: -40px; }
  .hero .inner { position: relative; will-change: transform, opacity; }
  .hero h2 { font-size: 40px; line-height: 1.05; margin: 12px 0 8px; font-weight: 800; letter-spacing: -0.02em; }
  .hero p { margin: 0; opacity: .85; }
  .hero .sub { font-weight: 600; opacity: .95; }
  .emblem { width: 62px; height: 70px; display: block; }

  h3.sec { display: flex; justify-content: space-between; align-items: baseline; font-size: 23px; font-weight: 800; letter-spacing: -0.01em; margin: 28px 2px 12px; }
  h3.sec small { font-size: 14px; font-weight: 500; color: var(--muted); }

  /* Kacheln */
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .tile { min-width: 0; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
  .tile { display: flex; flex-direction: column; gap: 8px; padding: 16px; min-height: 136px; text-align: left; border: 0; width: 100%; }
  .tile .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .tile .t { font-weight: 700; font-size: 17px; margin-top: auto; line-height: 1.25; }
  .tile .s { font-size: 13px; color: var(--muted); line-height: 1.3; }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
  .ico {
    width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; flex: none; color: #fff;
    box-shadow: 0 4px 12px var(--c-shadow, rgba(0,0,0,.2));
  }
  .ico svg { width: 22px; height: 22px; }
  .ico.lg { width: 56px; height: 56px; border-radius: 17px; }
  .ico.lg svg { width: 28px; height: 28px; }
  .ico.sm { width: 38px; height: 38px; border-radius: 11px; }
  .ico.sm svg { width: 19px; height: 19px; }
  .rowtile { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 20px; width: 100%; border: 0; text-align: left; margin-bottom: 10px; }
  .rowtile .txt { flex: 1; min-width: 0; }
  .rowtile .t { font-weight: 700; }
  .rowtile .s { font-size: 13px; color: var(--muted); }
  .rowtile .end { font-size: 13px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chev { color: var(--faint); width: 16px; height: 16px; flex: none; }

  .herocard { padding: 20px; border-radius: 28px; display: flex; flex-direction: column; gap: 12px; width: 100%; border: 0; text-align: left; }
  .herocard h4 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
  .herocard p { margin: 0; color: var(--muted); }
  .cta {
    display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 700;
    padding: 14px 18px; border-radius: 16px; background: linear-gradient(90deg, var(--c1), var(--c2));
    box-shadow: 0 8px 22px var(--c-shadow);
  }
  .cta svg { width: 20px; height: 20px; }

  .carousel { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 6px 20px 14px; margin: 0 -20px; scrollbar-width: none; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel .card { flex: 0 0 230px; height: 178px; padding: 18px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 10px; }
  .carousel .n { font-size: 34px; font-weight: 800; }

  .note { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 20px; margin-bottom: 10px; font-size: 15px; }
  .note svg { width: 22px; height: 22px; flex: none; margin-top: 1px; }

  /* Knöpfe */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; border: 0; border-radius: 18px;
    font-weight: 700; font-size: 17px; cursor: pointer; margin: 10px 0; color: #fff;
    background: linear-gradient(135deg, var(--c1, #0a7a68), var(--c2, #004f44));
    box-shadow: 0 10px 24px var(--c-shadow, rgba(0, 90, 76, .3));
    transition: transform .35s var(--spring), box-shadow .3s, opacity .2s;
  }
  .btn:active { transform: scale(0.97); box-shadow: 0 3px 10px var(--c-shadow, rgba(0, 90, 76, .3)); }
  .btn svg { width: 20px; height: 20px; }
  .btn.glassy { color: var(--text); background: var(--glass); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: var(--shadow); }
  .btn.danger { color: var(--coral); }
  .btn:disabled { opacity: .4; pointer-events: none; }
  .hstack { display: flex; gap: 12px; }
  .hstack > * { flex: 1; }

  /* Fortschritt */
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--mint), var(--green)); transition: width .6s var(--smooth); min-width: 8px; }
  .ring { width: 76px; height: 76px; flex: none; }
  .small { font-size: 13px; color: var(--muted); }

  /* Prosa */
  .prose { padding: 18px; margin-bottom: 14px; }
  .prose h4 { margin: 0 0 10px; font-size: 19px; }
  .prose p { margin: 0 0 8px; }
  .prose ul, .prose ol { margin: 0 0 8px; padding-left: 22px; }
  .prose li { margin-bottom: 6px; }
  .prose li::marker { color: var(--green); font-weight: 700; }
  .merke { padding: 18px; border-radius: 24px; background: rgba(255, 189, 71, .14); border: 1px solid rgba(255, 189, 71, .38); margin-bottom: 14px; }
  .merke b.h { color: #c77a00; display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  @media (prefers-color-scheme: dark) { .merke b.h { color: var(--amber); } }
  .merke ul { margin: 0; padding-left: 20px; }
  .merke b.h svg { width: 20px; height: 20px; flex: none; }

  /* Screening-Prüfung */
  .chipnum { display: inline-block; font-size: 12px; font-weight: 800; padding: 5px 11px; border-radius: 99px; background: rgba(0, 107, 92, .14); color: var(--green); }
  .qbig { font-size: 26px; font-weight: 800; line-height: 1.25; margin: 14px 0 16px; letter-spacing: -0.01em; }
  .answer { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 70px; padding: 18px; margin: 0 0 12px; border: 0; text-align: left; font-weight: 700; }
  .answer span { flex: 1; }
  .answer svg { width: 28px; height: 28px; color: var(--green); flex: none; }
  .examples { font-size: 15px; color: var(--muted); margin: 0 4px 18px; }
  .examples b { font-size: 12px; letter-spacing: .06em; }
  .examples ul { margin: 6px 0 0; padding-left: 18px; }
  .result { border-radius: 28px; padding: 22px; color: #fff; margin-bottom: 18px; box-shadow: 0 16px 34px var(--c-shadow); background: linear-gradient(135deg, var(--c1), var(--c2)); }
  .result svg { width: 48px; height: 48px; animation: pop .7s var(--spring) .1s both; }
  .result h2 { margin: 10px 0 8px; font-size: 32px; line-height: 1.1; letter-spacing: -0.01em; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .step { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-radius: 20px; width: 100%; border: 0; text-align: left; margin-bottom: 10px; }
  .step .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 800; font-size: 14px; color: var(--green); background: var(--line); transition: background .3s, color .3s, transform .4s var(--spring); }
  .step.on .dot { background: linear-gradient(135deg, #0a7a68, #004f44); color: #fff; transform: scale(1.08); }
  .step.on .txt > span:first-child { text-decoration: line-through; color: var(--muted); }
  .step .s { font-size: 13px; color: var(--muted); display: block; }
  .bottombar { position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px); display: flex; gap: 12px; margin-top: 18px; z-index: 5; }
  .bottombar .btn { margin: 0; }
  .bottombar .btn.glassy { background: var(--glass-strong); }
  .bottombar.fest { position: fixed; left: 50%; transform: translateX(-50%); width: min(calc(100% - 40px), 740px); margin: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 20px); }
  .platz-unten { height: 90px; }
  .bottombar.static { position: static; }
  pre.proto { white-space: pre-wrap; font-size: 13px; margin: 0 0 12px; font-family: ui-monospace, Menlo, monospace; }
  .frist { padding: 18px; }
  .frist .row { display: flex; gap: 14px; align-items: flex-start; margin: 14px 0; }
  .frist .d { font-size: 19px; font-weight: 800; }

  /* Formularfelder */
  .field { position: relative; margin-bottom: 14px; }
  .field input, .field textarea {
    width: 100%; font: inherit; color: var(--text); border-radius: 18px; padding: 28px 16px 12px; min-height: 66px;
    border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    outline: none; transition: border-color .2s, box-shadow .25s; resize: none; -webkit-appearance: none;
  }
  .field textarea { min-height: 96px; line-height: 1.4; }
  .field label { position: absolute; left: 17px; top: 21px; color: var(--muted); pointer-events: none; transition: all .3s var(--spring); display: flex; gap: 6px; align-items: center; }
  .field input:focus, .field textarea:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(0, 107, 92, .14); }
  .field input:focus + label, .field textarea:focus + label,
  .field input:not(:placeholder-shown) + label, .field textarea:not(:placeholder-shown) + label { top: 9px; font-size: 12px; font-weight: 700; }
  .field input:focus + label, .field textarea:focus + label { color: var(--green); }
  .field input::placeholder, .field textarea::placeholder { color: transparent; }
  .field input:focus::placeholder, .field textarea:focus::placeholder { color: var(--faint); }
  .field label { right: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field.ml label { position: static; white-space: normal; margin: 0 4px 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .field.ml textarea { padding: 14px 16px; }
  .field.ml textarea::placeholder { color: var(--faint); }
  .pflicht { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 99px; background: rgba(255, 92, 94, .15); color: var(--coral); }
  .pflicht.ok { background: rgba(15, 138, 95, .15); color: var(--ok); }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 4px 0; display: flex; gap: 6px; }
  .box { padding: 16px; border-radius: 20px; margin-bottom: 14px; }
  .box .lbl { font-weight: 700; font-size: 15px; display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--glass); border-radius: 16px; padding: 10px 14px; font-weight: 600; font-size: 15px; cursor: pointer;
    transition: transform .35s var(--spring), background .25s, color .25s, box-shadow .25s; display: inline-flex; gap: 6px; align-items: center; text-align: left;
  }
  .chip:active { transform: scale(.94); }
  .chip.on { background: linear-gradient(135deg, #0a7a68, #004f44); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(0, 90, 76, .3); }
  .chip svg { width: 14px; height: 14px; }
  .stepper { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 10px 20px; margin: 0 -20px; }
  .stepper::-webkit-scrollbar { display: none; }
  .stepper button { flex: none; border: 0; border-radius: 99px; padding: 8px 12px; font-size: 13px; font-weight: 700; background: var(--glass); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; transition: all .3s var(--smooth); }
  .stepper button svg { width: 14px; height: 14px; }
  .stepper button.done { color: var(--green); }
  .stepper button.cur { background: linear-gradient(135deg, #0a7a68, #004f44); color: #fff; }
  input[type=datetime-local] { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }

  /* Fallkarte */
  .casehead { border-radius: 28px; padding: 20px; color: #fff; background: linear-gradient(135deg, #075c50, #003d35 55%, #08242a); box-shadow: 0 16px 34px rgba(0, 61, 53, .35); }
  .casehead h4 { margin: 0; font-size: 28px; font-weight: 800; }
  .casehead .bar { background: rgba(255,255,255,.2); margin: 14px 0 8px; }
  .casehead .bar > div { background: #fff; }
  .casehead .btn { background: #fff; color: var(--deep); box-shadow: none; margin-bottom: 0; }
  .fristen2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .fristen2 > div { padding: 14px; border-radius: 20px; }

  /* Dokument (Papier) */
  .paper { background: var(--paper); color: #1c1c1e; border-radius: 16px; padding: 28px 24px; box-shadow: 0 20px 50px rgba(0,0,0,.18); font-size: 14px; margin-bottom: 18px; }
  .dok header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00584a; padding-bottom: 6px; margin-bottom: 14px; }
  .dok .marke { color: #00584a; font-weight: 700; letter-spacing: .04em; font-size: 11px; }
  .dok .entwurf { border: 1.5px solid #b26200; color: #b26200; font-weight: 700; font-size: 10px; padding: 2px 8px; border-radius: 10px; }
  .dok h1 { font-size: 22px; margin: 0; }
  .dok .unter { color: #6c6c70; margin: 2px 0 12px; }
  .dok h2 { font-size: 15px; color: #00584a; margin: 18px 0 6px; }
  .dok table { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
  .dok td { border: 0.5px solid #c7c7cc; padding: 5px 7px; vertical-align: top; }
  .dok td.l { width: 36%; background: #f2f2f7; font-weight: 600; }
  .dok p { margin: 0 0 6px; white-space: pre-wrap; }
  .dok footer { margin-top: 18px; border-top: 0.5px solid #c7c7cc; padding-top: 6px; color: #8e8e93; font-size: 11px; }
  .dok.neu { margin-top: 36px; padding-top: 24px; border-top: 1px dashed #c7c7cc; }
  #druck { display: none; }
  /* Word-Vorschau: freien Platz nicht zwischen fortlaufende Abschnitte verteilen (nur der letzte schiebt die Fußzeile nach unten) */
  section.docx > article:not(:last-of-type) { margin-bottom: 0 !important; }
  @media print {
    #druck.docxdruck .docx-wrapper { background: none !important; padding: 0 !important; }
    #druck.docxdruck section.docx { box-shadow: none !important; margin: 0 !important; page-break-after: always; }
    /* Zellschattierungen, Kopfbalken und Wasserzeichen wie im Original mitdrucken */
    #druck.docxdruck section.docx > article:not(:last-of-type) { margin-bottom: 0 !important; }
    #druck.docxdruck, #druck.docxdruck * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    body > *:not(#druck) { display: none !important; }
    #druck { display: block; color: #000; font: 10.5pt -apple-system, Helvetica, Arial, sans-serif; }
    #druck .dok.neu { page-break-before: always; margin-top: 0; padding-top: 0; border-top: 0; }
  }

  /* Quiz & Karten */
  .opt { display: block; width: 100%; text-align: left; padding: 16px; margin: 10px 0; border: 0; font-weight: 600; }
  .opt.ok { background: rgba(15, 138, 95, .16); box-shadow: inset 0 0 0 2px var(--ok); }

  .flip { margin-bottom: 8px; cursor: pointer; }
  .flip .face { min-height: 260px; display: grid; place-items: center; padding: 24px; text-align: center; white-space: pre-line; border-radius: 28px;
    background: var(--glass-strong); border: 1px solid var(--glass-edge); box-shadow: var(--shadow); }
  .flip.umgedreht .face { background: color-mix(in srgb, var(--green) 14%, var(--glass-strong)); }
  .flip .front { font-size: 23px; font-weight: 800; }
  .stat { display: flex; gap: 16px; align-items: center; padding: 18px; }
  .fristrow { display: flex; justify-content: space-between; gap: 12px; }
  .normchip { display: inline-block; font-weight: 800; padding: 3px 10px; border-radius: 99px; background: rgba(0, 107, 92, .14); color: var(--green); margin-right: 6px; }
  input[type=search] {
    width: 100%; padding: 15px 18px; border-radius: 20px; font: inherit; color: var(--text); outline: none; -webkit-appearance: none;
    border: 1px solid var(--glass-edge); background: var(--glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: var(--shadow);
  }
  input[type=search]:focus { box-shadow: 0 0 0 4px rgba(0, 107, 92, .16); }
  .check { display: flex; gap: 14px; align-items: flex-start; }
  .cbox { width: 28px; height: 28px; border-radius: 9px; background: var(--line); display: grid; place-items: center; flex: none; color: #fff; transition: all .35s var(--spring); }
  .cbox svg { width: 16px; height: 16px; opacity: 0; transform: scale(.4); transition: all .35s var(--spring); }
  .on .cbox { background: linear-gradient(135deg, #0a7a68, #004f44); }
  .on .cbox svg { opacity: 1; transform: none; }
  .on .strikeme { text-decoration: line-through; color: var(--muted); }

  /* Schwebende Reiterleiste (Liquid-Glass-Stil) */
  nav.tabs {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 40;
    width: min(calc(100% - 24px), 520px); height: var(--tabbar-h);
    display: flex; justify-content: space-around; align-items: center; padding: 6px;
    background: var(--glass-strong); backdrop-filter: blur(26px) saturate(190%); -webkit-backdrop-filter: blur(26px) saturate(190%);
    border: 1px solid var(--glass-edge); border-radius: 999px; box-shadow: 0 14px 40px rgba(0, 0, 0, .18);
  }
  nav.tabs .pill { position: absolute; top: 6px; bottom: 6px; border-radius: 999px; background: rgba(0, 107, 92, .13); transition: left .5s var(--spring), width .5s var(--spring); }
  nav.tabs button {
    position: relative; background: none; border: 0; color: var(--muted); font-size: 11px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; cursor: pointer; padding: 6px 0; transition: color .3s, transform .35s var(--spring);
  }
  nav.tabs button:active { transform: scale(.9); }
  nav.tabs button svg { width: 25px; height: 25px; }
  nav.tabs button.on { color: var(--green); }

  /* Übergänge */
  .enter-fwd { animation: inR .5s var(--smooth) both; }
  .enter-back { animation: inL .5s var(--smooth) both; }
  .enter-fade { animation: fadeUp .45s var(--smooth) both; }
  @keyframes inR { from { opacity: 0; transform: translateX(40px); } }
  @keyframes inL { from { opacity: 0; transform: translateX(-40px); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .45s; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  html.vt-fwd::view-transition-old(root) { animation-name: outL; }
  html.vt-fwd::view-transition-new(root) { animation-name: inR; }
  html.vt-back::view-transition-old(root) { animation-name: outR; }
  html.vt-back::view-transition-new(root) { animation-name: inL; }
  @keyframes outL { to { opacity: 0; transform: translateX(-40px); } }
  @keyframes outR { to { opacity: 0; transform: translateX(40px); } }
  .reveal { opacity: 0; transform: translateY(18px) scale(.98); transition: opacity .6s var(--smooth), transform .6s var(--smooth); }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }

  /* Modale Einführung */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 60; display: grid; place-items: end center; animation: fadeIn .3s both; }
  @keyframes fadeIn { from { opacity: 0; } }

  .sheet input[type=text], .sheet input[type=tel] { width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); color: var(--text); font: inherit; }
  a { color: var(--green); }
  /* ===== Erscheinungsbild Polizei Sachsen (nur interne Ausgabe, Klasse wird per Inhalt gesetzt) =====
     Polizeiblau #002664, Hellblau #0082c4, Sachsengrün #008444, Schrift Arial, „Welle“ als Gestaltungselement */
  html.polizei {

  html.polizei .sheet .emb { background: #fff; border: 1px solid var(--line); box-shadow: none; border-radius: 18px; }

  .hrg-karte { border: 1.5px solid var(--f); border-top-width: 5px; border-radius: 8px; padding: .45em; font-size: .8em; line-height: 1.3; text-align: center; }
  .hrg-karte .hrg-ico { display: block; width: 1.8em; height: 1.8em; margin: 0 auto .2em; color: var(--f); }

  @media (max-width: 560px) { .hr-bildschirm .hrg-ablauf { flex-direction: column; } .hr-bildschirm .hrg-pfeil { transform: rotate(90deg); } .hr-bildschirm .hrg-vergleich { grid-template-columns: 1fr; grid-auto-flow: row; } }

const fmtDatum = d => d.toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) + " Uhr";
const lokalISO = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
const richterFrist = a => new Date(a.getFullYear(), a.getMonth(), a.getDate() + 1, 23, 59);
// Fristberechnung nach Art. 3 VO (EWG, Euratom) Nr. 1182/71 mit den gesetzlichen Feiertagen in Sachsen (Art. 2 Abs. 1)
const ostersonntag = j => { const a = j % 19, b = Math.floor(j / 100), c = j % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), monat = Math.floor((h + l - 7 * m + 114) / 31), tag = ((h + l - 7 * m + 114) % 31) + 1; return new Date(j, monat - 1, tag); };
const FEIERTAGE = {};
const feiertageSachsen = j => FEIERTAGE[j] || (FEIERTAGE[j] = (() => {
  const o = ostersonntag(j), os = n => new Date(j, o.getMonth(), o.getDate() + n);
  const bb = new Date(j, 10, 22); while (bb.getDay() !== 3) bb.setDate(bb.getDate() - 1); // Buß- und Bettag: Mittwoch vor dem 23. November
  return Object.fromEntries([[new Date(j, 0, 1), "Neujahr"], [os(-2), "Karfreitag"], [os(1), "Ostermontag"], [new Date(j, 4, 1), "1. Mai"], [os(39), "Christi Himmelfahrt"], [os(50), "Pfingstmontag"], [new Date(j, 9, 3), "Tag der Deutschen Einheit"], [new Date(j, 9, 31), "Reformationstag"], [bb, "Buß- und Bettag"], [new Date(j, 11, 25), "1. Weihnachtstag"], [new Date(j, 11, 26), "2. Weihnachtstag"]].map(([d, n]) => [d.toDateString(), n]));
})());

const arbeitstag = d => d.getDay() !== 0 && d.getDay() !== 6 && !feiertag(d);
const WTAG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
// Inland: 3 Tage (Art. 8 Abs. 4 Screening-VO). Tag des Aufgriffs zählt nicht (Art. 3 Abs. 1 UAbs. 2), Ende mit Ablauf des letzten Tages (Abs. 2 Buchst. b),
// Ende an Sa/So/Feiertag → Ablauf des folgenden Arbeitstags (Abs. 4), mindestens zwei Arbeitstage (Abs. 5).
function screeningFristInfo(a) {
  const tag = n => new Date(a.getFullYear(), a.getMonth(), a.getDate() + n);

      <b style="font-size:20px">Unterlagen-Assistent</b>
      ${F ? `<span class="small">${esc(name || "Aktueller Fall")}</span>${bar(fertig / sch.length)}<span class="small">${fertig} von ${sch.length} Schritten vollständig</span>`
          : `<span class="small">Fall anlegen – die App erstellt alle Unterlagen zum Drucken.</span>`}
    </span>${svg("chevr", 2.2).replace("<svg", '<svg class="chev"')}</button>`;
}

// ================= Screening-Prüfung =================
const SP = C.screening;
function maxTiefe(id) { const k = SP.knoten[id]; return k.typ !== "frage" ? 0 : 1 + Math.max(...k.antworten.map(a => maxTiefe(a.ziel))); }
function ScreeningWizard(imEinsatz) {
  let verlauf = [], aktuell = SP.start, erledigt = new Set();
  const tiefe = maxTiefe(SP.start);
  if (imEinsatz) bereich("screening");
  const protokoll = k => {
    const z = ["Screening-Prüfung – Prüfprotokoll", "Erstellt: " + fmtDatum(new Date()), ""];
    verlauf.forEach((v, i) => { const q = SP.knoten[v.id]; z.push(`${i + 1}. ${q.frage}`, `   Antwort: ${q.antworten[v.antwort].text}`); });
    z.push("", "Ergebnis: " + k.titel);
    if (k.rechtsgrundlage) z.push("Rechtsgrundlage: " + k.rechtsgrundlage);
    z.push("", "Erstellt mit " + C.meta.titel + " (inoffizielle Arbeitshilfe). Enthält keine personenbezogenen Daten.");
    return z.join("\n");
  };
  const leiste = () => verlauf.length ? `<div class="bottombar static"><button class="btn glassy" id="wb">${svg("chevl", 2.2)} Zurück</button><button class="btn glassy danger" id="wr">${svg("rotate")} Neu</button></div>` : "";
  const schritt = (richtung, fn) => uebergang(richtung, animiert => { fn(); render(animiert ? (richtung === "back" ? "enter-back" : "enter-fwd") : ""); });
  const neu = () => schritt("back", () => { verlauf = []; aktuell = SP.start; erledigt = new Set(); });
  const view = () => {
    const k = SP.knoten[aktuell];
    if (k.typ === "frage") {
      return {
        title: "Screening-Prüfung",
        html: `${bar(verlauf.length / tiefe)}
          <div style="margin-top:12px"><span class="chipnum">Frage ${verlauf.length + 1}</span> <span class="small"><b>${esc(k.schritt || "")}</b></span></div>
          <div class="qbig rounded">${esc(k.frage)}</div>
          ${k.hilfe ? `<div class="note glass">${svg("info").replace("<svg", '<svg style="color:#3a8ff0"')}<span>${inline(k.hilfe)}</span></div>` : ""}
          ${k.beispiele && k.beispiele.length ? `<div class="examples"><b>BEISPIELE</b><ul>${k.beispiele.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>` : ""}
          ${k.antworten.map((a, i) => `<button class="answer glass press" data-w="${i}"><span>${esc(a.text)}</span>${svg("arrowcircle")}</button>`).join("")}
          ${leiste()}`,
        bind
      };
    }
    const text = protokoll(k);
    const farbe = k.ergebnis === "screening" ? 2 : k.ergebnis === "kein" ? 0 : 4;
    const ue = (C.screening_uebergaenge || {})[aktuell];
    return {
      title: "Ergebnis",
      html: `<div class="result" style="${farbVars(farbe)}">${svg(k.ergebnis === "screening" ? "shieldalert" : k.ergebnis === "kein" ? "shieldcheck" : "info", 2)}
          <h2 class="rounded">${esc(k.titel)}</h2><div>${esc(k.kurz)}</div></div>
        ${ue && C.leitfaeden ? `<button class="btn" id="wLF" style="font-size:18px;padding:18px">${svg("arrowr", 2.4)} ${esc(ue.text)}</button>` : ""}
        ${ue && ue.handreichung && C.handreichungen && C.handreichungen[ue.handreichung] ? `<button class="btn glassy" id="wHR">${svg("print")} Handreichung „${esc(C.handreichungen[ue.handreichung].titel.replace(/^Handreichung:\s*/, ""))}“</button>` : ""}
        ${imEinsatz ? (k.ergebnis === "screening"
          ? `<button class="btn" id="wE" style="font-size:19px;padding:20px">${svg("arrowr", 2.4)} Weiter: Screening durchführen</button>`
          : `<div class="note glass" style="border:2px solid #008444"><span><b>Kein Screening.</b> Arbeite die Punkte unten ab – dann ist der Einsatz für die Screening-Hilfe beendet.</span></div>`)
          : k.ergebnis === "screening" ? `<button class="btn" id="wa">${svg("docs")} Unterlagen-Assistent starten</button>` : ""}
        ${k.schritte && k.schritte.length && !(imEinsatz && k.ergebnis === "screening") ? `<h3 class="sec">Das musst du jetzt tun <small>${erledigt.size}/${k.schritte.length}</small></h3>
          ${k.schritte.map((st, i) => `<button class="step glass press ${erledigt.has(i) ? "on" : ""}" data-st="${i}" role="checkbox" aria-checked="${erledigt.has(i)}">
            <span class="dot">${erledigt.has(i) ? svg("check", 3) .replace("<svg", '<svg style="width:16px;height:16px"') : i + 1}</span>
            <span class="txt"><span>${esc(st.text)}</span>${st.hinweis ? `<span class="s">${esc(st.hinweis)}</span>` : ""}</span></button>`).join("")}` : ""}
        ${k.fristen ? `<h3 class="sec">Fristen</h3>${fristenHTML()}` : ""}
        ${k.rechtsgrundlage ? `<p class="small" style="margin:16px 4px"><b>Rechtsgrundlage:</b> ${esc(k.rechtsgrundlage)}</p>` : ""}
        <h3 class="sec">Prüfprotokoll</h3>
        <div class="glass" style="padding:16px"><pre class="proto">${esc(text)}</pre>
          <button class="btn glassy" id="wc" style="margin:0">${svg("copy")} Protokoll kopieren</button></div>
        ${k.ergebnis === "screening" ? `<button class="btn glassy" id="wl">${svg("list")} Checkliste „Screening durchführen“</button>` : ""}
        <button class="btn glassy" id="wn">${svg("rotate")} Neue Prüfung starten</button>
        ${leiste()}`,
      bind: () => {
        bind();
        app.querySelectorAll("[data-st]").forEach(el => el.onclick = () => {
          vibrate(); const i = +el.dataset.st; erledigt.has(i) ? erledigt.delete(i) : erledigt.add(i);
          el.classList.toggle("on", erledigt.has(i)); el.setAttribute("aria-checked", erledigt.has(i));
          el.querySelector(".dot").innerHTML = erledigt.has(i) ? svg("check", 3).replace("<svg", '<svg style="width:16px;height:16px"') : i + 1;
          const h = app.querySelector("h3.sec small"); if (h) h.textContent = `${erledigt.size}/${k.schritte.length}`;
        });
        fristenBind();
        $("wc").onclick = () => {
          const knopf = $("wc");
          const ok = () => { knopf.innerHTML = svg("check") + " Kopiert"; };
          if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, () => alert(text)); else alert(text);
        };
        const wl = $("wl"); if (wl) wl.onclick = () => go(() => Checkliste("screening-inland"));
        const wa = $("wa"); if (wa) wa.onclick = () => go(FallUebersicht);
        const wE = $("wE"); if (wE) wE.onclick = () => { vibrate(); imEinsatz("ja", k.titel); };
        const wLF = $("wLF"); if (wLF) wLF.onclick = () => { vibrate(); go(ue.knoten ? Leitfaden(ue.leitfaden, ue.knoten) : () => LeitfadenStart(ue.leitfaden)); };
        const wHR = $("wHR"); if (wHR) wHR.onclick = () => { vibrate(); go(() => Handreichung(ue.handreichung)); };
        if (imEinsatz && k.ergebnis !== "screening") imEinsatz("nein", k.titel, true);
        $("wn").onclick = neu;
      }
    };
  };
  function bind() {
    app.querySelectorAll("[data-w]").forEach(el => el.onclick = () => {
      vibrate();
      const i = +el.dataset.w;
      schritt("fwd", () => { verlauf.push({ id: aktuell, antwort: i }); aktuell = SP.knoten[aktuell].antworten[i].ziel; erledigt = new Set(); });
    });
    const wb = $("wb"); if (wb) wb.onclick = () => { vibrate(); schritt("back", () => { const l = verlauf.pop(); aktuell = l.id; erledigt = new Set(); }); };
    const wr = $("wr"); if (wr) wr.onclick = () => { vibrate(); neu(); };
  }
  return view;
}

// ================= Unterlagen-Assistent =================
const FELDER = Object.fromEntries(C.fall.schritte.flatMap(s => s.felder).map(f => [f.id, f]));
const TRENNER = "; ";
const wert = id => (F && F.werte[id]) || "";
const auswahl = id => wert(id).split(TRENNER).filter(Boolean);
function setze(id, v) { if (!F) return; if (v) F.werte[id] = v; else delete F.werte[id]; fallSpeichern(); }
function erfuellt(b) {
  if (!b) return true;
  const l = auswahl(b.feld);
  if (b.wert.startsWith("!")) return l.length > 0 && !l.includes(b.wert.slice(1));
  if (b.wert.startsWith("~")) return !l.includes(b.wert.slice(1));   // sichtbar, solange nicht dieser Wert gewählt ist
  return l.includes(b.wert);
}
const sichtbar = f => erfuellt(f.bedingung);
const leer = id => !wert(id).trim();
const offenIn = s => s.felder.filter(f => f.pflicht && sichtbar(f) && leer(f.id));
const offenDok = d => d.pflichtfelder.map(id => FELDER[id]).filter(f => f && sichtbar(f) && leer(f.id));
const relevant = d => erfuellt(d.bedingung);
const istUma = () => wert("uma") === "Ja" || auswahl("vulnerabilitaet").includes("Unbegleitete:r Minderjährige:r");
// Screening-Fall? Angabe im Fall, sonst Ergebnis der Prüfung im geführten Einsatz – ohne Angabe gilt: Screening
const istScreening = () => { const w = wert("screening_fall"); if (w) return !w.startsWith("Nein"); return !(S.einsatz && S.einsatz.pruefung === "nein"); };
// Betreff der Aufgriffsmeldung an das BAMF (Checkliste Meldeverfahren)
const bamfBetreff = () => `${wert("haft") === "Ja" ? "HAFT – " : ""}${istUma() ? "Aufgriff uM" : wert("asyl") === "Ja" ? "Asyl" : "Aufgriff"} – ${wert("azr_nummer").trim() || "[AZR-Nummer]"}`;
const aufgriff = () => { const w = wert("aufgriff_zeit"); return w ? new Date(w) : null; };

function FallUebersicht() {
  if (!F) {
    return {
      title: "Unterlagen",
      html: `<div class="enter-fade">${ico("docs", 2, "lg")}
        <h2 class="rounded" style="font-size:34px;margin:14px 0 8px;letter-spacing:-.01em">Unterlagen-Assistent</h2>
        <p style="color:var(--muted);margin:0 0 20px">Die App führt dich durch alle Angaben des Screenings und erstellt daraus automatisch die Unterlagen – fertig zum Drucken oder als PDF.</p>
        ${[["Fall anlegen", "Die Aufgriffszeit wird automatisch gesetzt.", "plus"], ["Schritt für Schritt erfassen", `${C.fall.schritte.length} kurze Schritte, Pflichtfelder sind markiert.`, "list"], ["Unterlagen erzeugen", `${C.dokumente.length} Dokumente – nur die, die im Fall nötig sind.`, "print"]]
          .map(([t, s, ic], i) => `<div class="rowtile glass reveal" style="cursor:default">${ico(ic, i + 1, "sm")}<span class="txt"><span class="t">${t}</span><br><span class="s">${s}</span></span></div>`).join("")}
        <button class="btn" id="fn">${svg("plus", 2.4)} Neuen Fall anlegen</button>
        <div class="note glass">${svg("lock").replace("<svg", '<svg style="color:var(--green)"')}<span class="small">${esc(C.fall.hinweis)}</span></div></div>`,
      bind: () => $("fn").onclick = () => { vibrate(); F = { angelegt: Date.now(), werte: { aufgriff_zeit: lokalISO(new Date()), screening_zeit: lokalISO(new Date()) } }; fallSpeichern(); go(Erfassung(0)); }
    };
  }
  const sch = C.fall.schritte, fertig = sch.filter(s => offenIn(s).length === 0).length;
  const name = [wert("name"), wert("vorname")].filter(Boolean).join(", ");
  const docs = C.dokumente.filter(relevant);
  const a = aufgriff(), fest = wert("festgehalten") === "Ja";
  const loescht = new Date(F.angelegt + AUFBEWAHRUNG);
  return {
    title: "Unterlagen",
    html: `<div class="casehead reveal">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><h4 class="rounded">${esc(name || "Neuer Fall")}</h4>
          <div style="opacity:.85">${wert("vorgang") ? "Vorgang " + esc(wert("vorgang")) : "Vorgangsnummer noch offen"}</div></div>${EMBLEM(40)}</div>
        ${bar(fertig / sch.length)}
        <div class="small" style="color:rgba(255,255,255,.85);display:flex;justify-content:space-between"><span>${fertig} von ${sch.length} Schritten vollständig</span><span>Löschung ${loescht.toLocaleDateString("de-DE")}</span></div>
        <button class="btn" id="fw">${svg("pencil")} ${fertig === sch.length ? "Angaben prüfen" : "Weiter erfassen"}</button></div>
      ${a ? `<div class="fristen2">
        <div class="glass reveal"><div class="small"><b>Richter bis</b></div>${fest ? `<b style="color:var(--coral)">${fmtDatum(richterFrist(a))}</b>` : `<span class="small">nur bei Festhalten</span>`}</div>
        <div class="glass reveal"><div class="small"><b>Screening bis</b></div><b style="color:#e08600">${fmtDatum(screeningFrist(a))}</b></div></div>` : ""}
      <h3 class="sec">Erfassung <small>${fertig}/${sch.length} vollständig</small></h3>
      ${sch.map((s, i) => { const o = offenIn(s).length; return rowtile(`data-s="${i}"`, `${i + 1}. ${s.titel}`, o ? `${o} Pflichtangabe${o === 1 ? "" : "n"} offen` : "Vollständig", o ? s.icon : "check", o ? i + 1 : 0); }).join("")}
      ${C.vorlagen ? `<h3 class="sec">Originalformulare <small>Word</small></h3>
      <div class="glass reveal" style="padding:16px;margin-bottom:6px"><p style="margin:0 0 4px"><b>Die App füllt alle Original-Formulare für diesen Fall automatisch aus</b> – ein Klick: speichern oder drucken.</p>
        <p class="small" style="margin:0">Dateiname: <b>${esc(dateiBasis())}.docx</b></p>
        <button class="btn" id="fo" style="margin-bottom:0">${svg("docs")} Alle Unterlagen erstellen</button></div>
      ` : `<h3 class="sec">Unterlagen <small>${docs.length} Dokumente</small></h3>
      <div class="grid2">${docs.map((d, i) => { const o = offenDok(d).length; return tile(`d-${d.id}`, d.titel, d.untertitel, d.icon, i + 2, o ? `${o} offen` : "Bereit"); }).join("")}</div>
      <button class="btn" id="fa2" style="${farbVars(2)}">${svg("print")} Alle Unterlagen drucken / als PDF</button>`}
      <button class="btn glassy danger" id="fl">${svg("trash")} Fall abschließen und löschen</button>
      <div class="note glass">${svg("lock").replace("<svg", '<svg style="color:var(--green)"')}<span class="small">${esc(C.fall.hinweis)}</span></div>`,
    bind: () => {
      $("fw").onclick = () => { vibrate(); const i = sch.findIndex(s => offenIn(s).length); go(Erfassung(i < 0 ? 0 : i)); };
      on("[data-s]", el => go(Erfassung(+el.dataset.s)));
      if (!C.vorlagen) {
        docs.forEach(d => $("d-" + d.id).onclick = () => { vibrate(); go(() => Dokument([d], d.titel)); });
        $("fa2").onclick = () => { vibrate(); go(() => Dokument(docs, "Alle Unterlagen")); };
      }
      if ($("fo")) $("fo").onclick = () => { vibrate(); go(Originalformulare); };
      $("fl").onclick = () => { if (confirm("Fall und alle Daten endgültig löschen? Vorher die Unterlagen in das Vorgangsbearbeitungssystem übernehmen.")) { F = null; fallSpeichern(); if (C.vorlagen) { VORLAGEN_ERGEBNIS = []; VORLAGEN_DATEIEN = []; KORREKTUREN = {}; } neuZeichnen(); } };
    }
  };
}

function feldHTML(f) {
  const v = wert(f.id);
  const pf = f.pflicht ? `<span class="pflicht ${v ? "ok" : ""}">Pflicht</span>` : "";
  const hint = f.hinweis ? `<div class="hint">${svg("info").replace("<svg", '<svg style="width:15px;height:15px;flex:none"')}${esc(f.hinweis)}</div>` : "";
  if (f.typ === "text" || f.typ === "mehrzeilig") {
    const inp = f.typ === "text"
      ? `<input id="i-${f.id}" data-f="${f.id}" value="${esc(v)}" placeholder="${esc(f.platzhalter || " ")}" autocomplete="off">`
      : `<textarea id="i-${f.id}" data-f="${f.id}" rows="3" placeholder="${esc(f.platzhalter || "")}">${esc(v)}</textarea>`;
    return f.typ === "text"
      ? `<div class="field">${inp}<label for="i-${f.id}">${esc(f.label)} ${pf}</label>${hint}</div>`
      : `<div class="field ml"><label for="i-${f.id}">${esc(f.label)} ${pf}</label>${inp}${hint}</div>`;
  }
  if (f.typ === "datumzeit") {
    return `<div class="box glass"><div class="lbl">${esc(f.label)} ${pf}</div>
      ${v ? `<div style="display:flex;gap:10px;align-items:center"><input type="datetime-local" data-dt="${f.id}" value="${esc(v)}"><button class="chip" data-clr="${f.id}" aria-label="Zeit entfernen">✕</button></div>`
          : `<button class="chip" data-now="${f.id}" style="color:var(--green)">${svg("clock")} Jetzt eintragen</button>`}${hint}</div>`;
  }
  if (f.typ === "liste") {
    return `<div class="box glass"><label class="lbl" for="i-${f.id}">${esc(f.label)} ${pf}</label>
      <select id="i-${f.id}" data-sel="${f.id}" style="width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--text);font:inherit;font-size:17px">
        <option value="">– bitte wählen –</option>${f.optionen.map(o => `<option ${v === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>${hint}</div>`;
  }
  const gew = auswahl(f.id);
  return `<div class="box glass"><div class="lbl">${esc(f.label)} ${pf}${f.typ === "mehrfach" ? '<span class="small">Mehrfachauswahl</span>' : ""}</div>
    <div class="chips">${f.optionen.map(o => `<button class="chip ${gew.includes(o) ? "on" : ""}" data-chip="${f.id}" data-o="${esc(o)}">${gew.includes(o) ? svg("check", 3) : ""}${esc(o)}</button>`).join("")}</div>${hint}</div>`;
}

function Erfassung(start, nur) {
  let index = start;
  const sch = nur ? C.fall.schritte.filter(x => nur.includes(x.id)) : C.fall.schritte;
  const view = () => {
    bereich("screening");
    const s = sch[index], o = offenIn(s).length;
    return {
      title: `Schritt ${index + 1} von ${sch.length}`,
      html: `${bar((index + 1) / sch.length)}
        <div class="stepper" id="stp">${sch.map((x, i) => `<button class="${i === index ? "cur" : offenIn(x).length ? "" : "done"}" data-g="${i}">${offenIn(x).length ? icon(x.icon) : svg("check", 2.6)}${esc(x.titel)}</button>`).join("")}</div>
        <div style="display:flex;gap:14px;align-items:center;margin:8px 0 6px">${ico(s.icon, index + 1, "lg")}
          <div><h2 class="rounded" style="margin:0;font-size:30px">${esc(s.titel)}</h2>
          <div class="small" id="offen" style="font-weight:700;color:${o ? "var(--coral)" : "var(--ok)"}">${o ? `${o} Pflichtangabe${o === 1 ? "" : "n"} offen` : "Alle Pflichtangaben erfasst"}</div></div></div>
        <p class="small" style="font-size:15px">${esc(s.beschreibung)}</p>
        <div id="felder">${s.felder.filter(sichtbar).map(feldHTML).join("")}</div>
        <div class="platz-unten"></div>
        <div class="bottombar fest">
          ${index > 0 ? `<button class="btn glassy" id="ep" style="flex:.6">${svg("chevl", 2.2)} Zurück</button>` : ""}
          ${index < sch.length - 1 ? `<button class="btn" id="en">Weiter ${svg("chevr", 2.2)}</button>` : nur ? `<button class="btn" id="ez" style="${farbVars(2)}">${svg("check", 2.4)} Fertig – zurück zum Einsatz</button>` : `<button class="btn" id="ef" style="${farbVars(2)}">${svg("docs")} Fertig – zu den Unterlagen</button>`}
        </div>`,
      bind: () => {
        const cur = app.querySelector("#stp .cur"); cur && cur.scrollIntoView({ inline: "center", block: "nearest" });
        const gehe = z => { if (z === index) return; vibrate(); const r = z > index ? "fwd" : "back"; uebergang(r, anim => { index = z; render(anim ? (r === "fwd" ? "enter-fwd" : "enter-back") : ""); }); };
        app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => gehe(+b.dataset.g));
        const ep = $("ep"); if (ep) ep.onclick = () => gehe(index - 1);
        const en = $("en"); if (en) en.onclick = () => gehe(index + 1);
        const ez = $("ez"); if (ez) ez.onclick = () => { vibrate(); zurueck(); };
        const ef = $("ef"); if (ef) ef.onclick = () => { vibrate(); stack.pop(); if (stack[stack.length - 1] !== FallUebersicht) stack.push(FallUebersicht); uebergang("back", anim => render(anim ? "enter-back" : "")); };
        verdrahten();
      }
    };
    function aktualisieren(struktur) {
      // Pflicht-Anzeige und bedingte Felder aktualisieren, ohne den Fokus zu verlieren
      const o = offenIn(sch[index]).length, el = $("offen");
      el.textContent = o ? `${o} Pflichtangabe${o === 1 ? "" : "n"} offen` : "Alle Pflichtangaben erfasst";
      el.style.color = o ? "var(--coral)" : "var(--ok)";
      if (struktur) { $("felder").innerHTML = sch[index].felder.filter(sichtbar).map(feldHTML).join(""); verdrahten(); }
      app.querySelectorAll(".pflicht").forEach(p => { const f = p.closest(".field, .box")?.querySelector("[data-f],[data-dt],[data-chip],[data-now],[data-sel]"); const id = f && (f.dataset.f || f.dataset.dt || f.dataset.chip || f.dataset.now || f.dataset.sel); if (id) p.classList.toggle("ok", !leer(id)); });
      const stp = app.querySelectorAll("#stp button"); sch.forEach((x, i) => { if (i !== index) stp[i].className = offenIn(x).length ? "" : "done"; });
    }
    function verdrahten() {
      app.querySelectorAll("[data-f]").forEach(el => {
        el.oninput = () => { setze(el.dataset.f, el.value); if (el.tagName === "TEXTAREA") { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; } aktualisieren(false); };

// Dokumente erzeugen
function platzhalter(id) {
  if (id === "heute") return fmtDatum(new Date());
  const a = aufgriff();
  if (id === "frist_richter") { if (wert("festgehalten") === "Nein") return "entfällt – kein Festhalten"; return a ? fmtDatum(richterFrist(a)) : "—"; }
  if (id === "frist_screening") return a ? fmtDatum(screeningFrist(a)) : "—";
  if (id === "bamf_betreff") return bamfBetreff();
  if (id === "bamf_anlagen") return ((C.bamf_meldung || {}).anlagen || []).map((x, k) => `${k + 1}. ${x}`).join("\n");
  const v = wert(id).trim();
  if (!v) return "—";
  if (FELDER[id] && FELDER[id].typ === "datumzeit") { const d = new Date(v); if (!isNaN(d)) return fmtDatum(d); }
  return v;
}
const einsetzen = t => t.replace(/\{\{(\w+)\}\}/g, (_, id) => platzhalter(id));
function blockHTML(text) {
  let html = "", tab = [], liste = [], abs = [];
  const fertig = () => {
    if (tab.length) { html += `<table>${tab.join("")}</table>`; tab = []; }
    if (liste.length) { html += `<ul>${liste.join("")}</ul>`; liste = []; }
    if (abs.length) { html += `<p>${abs.join("\n")}</p>`; abs = []; }
  };
  for (const z of text.split("\n")) {
    if (z.startsWith("| ")) {
      if (liste.length || abs.length) fertig();
      const t = z.slice(2).split(" | ");
      tab.push(`<tr><td class="l">${inline(t[0])}</td><td>${inline(t.slice(1).join(" | "))}</td></tr>`);
    } else if (z.startsWith("• ")) {
      if (tab.length || abs.length) fertig();
      liste.push(`<li>${inline(z.slice(2))}</li>`);
    } else if (!z.trim()) {
      if (!abs.length) { fertig(); html += "<p>&nbsp;</p>"; } else fertig();
    } else {
      if (tab.length || liste.length) fertig();
      abs.push(inline(z));
    }
  }
  fertig();
  return html;
}

function Quiz(fragenIn, titel, pruefung = false) {
  const fragen = shuffle(fragenIn);
  let i = 0, punkte = 0, gewaehlt = null;
  const view = () => {
    if (i >= fragen.length) {
      const q = punkte / fragen.length;
      return {
        title: titel,

          <p class="small" style="font-size:16px">${q >= .8 ? "Sehr gut – bestanden." : q >= .6 ? "Bestanden – einzelne Themen wiederholen." : "Nicht bestanden – Kapitel noch einmal durcharbeiten."}</p></div>
          <button class="btn" id="again">${svg("rotate")} Noch einmal</button>`,
        bind: () => $("again").onclick = () => { stack[stack.length - 1] = Quiz(fragenIn, titel, pruefung); render("enter-fade"); }
      };
    }
    const f = fragen[i];
    const cls = j => gewaehlt === null ? "" : pruefung ? (j === gewaehlt ? "sel" : "") : j === f.richtig ? "ok" : j === gewaehlt ? "bad" : "";
    return {
      title: titel,
      html: `${bar(i / fragen.length)}<div class="small" style="margin-top:10px">Frage ${i + 1} von ${fragen.length}</div>
        <div class="qtitle rounded">${esc(f.frage)}</div>
        ${f.antworten.map((a, j) => `<button class="opt glass press ${cls(j)}" data-a="${j}" ${gewaehlt !== null ? "disabled" : ""}>${esc(a)}</button>`).join("")}
        ${gewaehlt !== null && !pruefung ? `<div class="expl glass enter-fade"><b style="color:${gewaehlt === f.richtig ? "var(--ok)" : "var(--coral)"}">${gewaehlt === f.richtig ? "Richtig" : "Leider falsch"}</b><div>${esc(f.erklaerung)}</div></div>` : ""}
        ${gewaehlt !== null ? `<button class="btn" id="next">${i + 1 < fragen.length ? "Weiter" : "Auswertung"} ${svg("chevr", 2.2)}</button>` : ""}`,
      bind: () => {
        app.querySelectorAll("[data-a]").forEach(el => el.onclick = () => {
          if (gewaehlt !== null) return;
          vibrate();
          gewaehlt = +el.dataset.a;
          const ok = gewaehlt === f.richtig;
          if (ok) punkte++;
          const st = S.quiz[f.frage] || { r: 0, f: 0 };
          ok ? st.r++ : st.f++; st.ok = ok; S.quiz[f.frage] = st; save();
          neuZeichnen();
        });
        const n = $("next");
        if (n) n.onclick = () => { vibrate(); uebergang("fwd", anim => { i++; gewaehlt = null; render(anim ? "enter-fwd" : ""); }); };
      }
    };
  };
  return view;
}

function onboarding(erneut = false) {
  if (!erneut) { try { if (localStorage.getItem("geas.onboarding.v2") === "1") return; } catch (e) {} }
  const seiten = C.onboarding;
  let i = 0;
  const m = document.createElement("div");

  const icons = { "hand.wave": "wave", "checkmark.shield": "shieldcheck", "exclamationmark.triangle": "alert", "square.grid.2x2": "grid", "lock.shield": "lock" };

      <div class="small" style="display:flex;justify-content:space-between"><span>Einführung ${i + 1} von ${seiten.length}</span>${last ? "" : '<a href="#" id="oj">Zum letzten Schritt</a>'}</div>

        <button class="btn" id="og" disabled>Los geht's</button>` :
        `<div class="hstack">${i > 0 ? `<button class="btn glassy" id="op">Zurück</button>` : ""}<button class="btn" id="on">Weiter</button></div>`}
    </div>`;
    const q = s => m.querySelector(s);
    if (q("#oj")) q("#oj").onclick = e => { e.preventDefault(); i = seiten.length - 1; draw(); };
    if (q("#op")) q("#op").onclick = () => { i--; draw(); };
    if (q("#on")) q("#on").onclick = () => { vibrate(); i++; draw(); };

  };
  draw();
  m.querySelector(".sheet").style.animation = "";
  document.body.appendChild(m);

  if (rPr) wKinder(rPr, "color").filter(c => /^(808080|7f7f7f|a6a6a6|bfbfbf)$/i.test(c.getAttributeNS(W_NS, "val") || c.getAttribute("w:val") || "") || (c.getAttributeNS(W_NS, "themeShade") || c.getAttribute("w:themeShade"))).forEach(n => rPr.removeChild(n));
  let ziel = inhalt;
  if (!wKinder(inhalt, "r").length) {
    const ps = Array.from(inhalt.getElementsByTagNameNS(W_NS, "p"));
    if (ps.length) { ziel = ps[0]; ps.slice(1).forEach(p => p.parentNode.removeChild(p)); }
  }
  // Leerzeilen im Feld (z. B. Behörde/Dienststelle: „Textfeld“ + 4 Zeilenumbrüche) bestimmen die Höhe im Original – Anzahl beibehalten
  const altUmbrueche = Array.from(ziel.getElementsByTagNameNS(W_NS, "br")).filter(b => !(b.getAttributeNS(W_NS, "type") || b.getAttribute("w:type"))).length;
  Array.from(ziel.childNodes).filter(n => n.localName === "r").forEach(n => ziel.removeChild(n));
  const r = doc.createElementNS(W_NS, "w:r");
  if (rPr) r.appendChild(rPr);
  String(text).split("\n").forEach((zeile, i) => {
    if (i) r.appendChild(doc.createElementNS(W_NS, "w:br"));
    const t = doc.createElementNS(W_NS, "w:t");
    t.setAttributeNS(XML_NS, "xml:space", "preserve");
    t.textContent = zeile;
    r.appendChild(t);
  });
  for (let k = String(text).split("\n").length - 1; k < altUmbrueche; k++) r.appendChild(doc.createElementNS(W_NS, "w:br"));
  ziel.appendChild(r);
}

function hakenSetzen(sdt, an) {
  const doc = sdt.ownerDocument, pr = wKinder(sdt, "sdtPr")[0];
  const cb = pr.getElementsByTagNameNS(W14_NS, "checkbox")[0];
  if (!cb) return false;
  let checked = cb.getElementsByTagNameNS(W14_NS, "checked")[0];
  if (!checked) { checked = doc.createElementNS(W14_NS, "w14:checked"); cb.insertBefore(checked, cb.firstChild); }
  checked.setAttributeNS(W14_NS, "w14:val", an ? "1" : "0");
  const zustand = cb.getElementsByTagNameNS(W14_NS, an ? "checkedState" : "uncheckedState")[0];
  const code = zustand ? parseInt(zustand.getAttributeNS(W14_NS, "val"), 16) : (an ? 0x2612 : 0x2610);
  const t = wKinder(sdt, "sdtContent")[0].getElementsByTagNameNS(W_NS, "t")[0];
  if (t) t.textContent = String.fromCharCode(code);
  return true;
}

function datumTeile(roh) {
  let m = String(roh || "").match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (m) return { t: m[1].padStart(2, "0"), m: m[2].padStart(2, "0"), j: m[3] };
  m = String(roh || "").match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return { t: m[3], m: m[2], j: m[1] };
  return null;
}

// Passenden Listeneintrag finden: exakt, dann Anfang, dann gemeinsame ersten 4 Buchstaben (Syrien → syrisch)
function listeTreffer(optionen, wert) {
  const w = norm(wert);
  if (!w) return null;
  const exakt = optionen.find(o => norm(o.text) === w);
  if (exakt) return exakt;
  // Mehrdeutig (z. B. „Kurdisch“ → mehrere Dialekte): nicht raten, sondern auswählen lassen
  const anfang = optionen.filter(o => norm(o.text).startsWith(w));
  if (anfang.length > 1) return null;
  return anfang[0]
    || optionen.find(o => w.startsWith(norm(o.text)))
    || (w.length >= 4 ? optionen.find(o => norm(o.text).includes(w)) : null)   // Syrien → Arabische Republik Syrien
    || (w.length >= 4 ? optionen.find(o => norm(o.text).slice(0, 4) === w.slice(0, 4)) : null)
    || null;
}

const listeAus = roh => String(roh || "").split(/\s*[,;\n]\s*|\s+und\s+/).map(s => s.trim()).filter(Boolean);

function regelWert(regel) {
  // mehrere Angaben untereinander, z. B. Kommentarfeld: „Aufgriffszeitpunkt: …“, „Sicherheitsrisiko: …“
  if (regel.art === "zusammen") return regel.teile.map(t => {
    if (t.wenn && !bedingungErfuellt(t.wenn)) return "";
    const roh = wert(t.feld).trim();
    const v = roh && FELDER[t.feld] && FELDER[t.feld].typ === "datumzeit" ? new Date(roh).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) + " Uhr" : roh;
    return v ? (t.label ? t.label + ": " + v : v) : "";
  }).filter(Boolean).join("\n");
  const roh = regel.wert ? wert(regel.wert).trim() : "";
  if (regel.art === "liste") return listeAus(roh)[regel.index] || "";
  if (regel.art === "zeile") {
    const zeile = roh.split("\n").map(z => z.trim()).filter(Boolean)[regel.index];
    return zeile ? (zeile.split(/\s*[,;]\s*/)[regel.spalte] || "") : "";
  }
  if (regel.abbildung && regel.abbildung[roh]) return regel.abbildung[roh];
  return roh;
}

const bedingungErfuellt = w => !w || auswahl(w.feld).some(x => w.enthaelt.includes(x));

// Screening-Formular: Felder über Titel (+ Vorkommen) ansprechen
function screeningBefuellen(doc, cfg, korrekturen) {
  const sdts = Array.from(doc.getElementsByTagNameNS(W_NS, "sdt")).map(s => ({ s, ...sdtInfo(s) }));
  const bericht = { gesetzt: 0, offen: [], listen: {} };
  for (const regel of cfg.regeln) {
    const passend = sdts.filter(x => x.alias === regel.alias && (!regel.typ || x.typ === regel.typ));
    const ziel = passend[regel.n || 0];
    if (!ziel) continue;
    if (regel.art === "haken" || regel.art === "haken_immer") {
      if (regel.art === "haken_immer" || bedingungErfuellt(regel.wenn)) { hakenSetzen(ziel.s, true); bericht.gesetzt++; }
      continue;
    }
    if (regel.wenn && !bedingungErfuellt(regel.wenn)) continue;
    if (ziel.typ === "dropdown") {
      bericht.listen[regel.alias] = ziel.optionen;
      const gesucht = regel.art === "auswahl_fest" ? regel.suche : regelWert(regel);
      if (!gesucht) continue;
      const treffer = korrekturen[regel.alias] ? ziel.optionen.find(o => o.text === korrekturen[regel.alias]) : listeTreffer(ziel.optionen, gesucht);
      if (treffer) {
        laufText(ziel.s, treffer.text);
        const dd = ziel.pr.getElementsByTagNameNS(W_NS, "dropDownList")[0] || ziel.pr.getElementsByTagNameNS(W_NS, "comboBox")[0];
        if (dd) dd.setAttributeNS(W_NS, "w:lastValue", treffer.wert || treffer.text);
        bericht.gesetzt++;
      } else bericht.offen.push({ alias: regel.alias, wert: gesucht, optionen: ziel.optionen });
      continue;
    }
    const v = regelWert(regel);
    if (!v) continue;
    if (ziel.typ === "date") {
      const d = datumTeile(v);
      if (d) {
        const dt = ziel.pr.getElementsByTagNameNS(W_NS, "date")[0];
        dt.setAttributeNS(W_NS, "w:fullDate", `${d.j}-${d.m}-${d.t}T00:00:00Z`);
        laufText(ziel.s, `${d.t}.${d.m}.${d.j}`);
      } else laufText(ziel.s, v);
    } else laufText(ziel.s, v);
    bericht.gesetzt++;
  }
  return bericht;
}

// Andere Vorlagen: Kopfdaten über Tabellenbeschriftungen, Geschlecht über Kästchen, Absätze nach Überschrift
function zelleSetzen(tc, text, vorlageZelle) {
  const doc = tc.ownerDocument;
  const p = tc.getElementsByTagNameNS(W_NS, "p")[0];
  if (!p || !text) return false;
  const r = doc.createElementNS(W_NS, "w:r");
  const muster = vorlageZelle && vorlageZelle.getElementsByTagNameNS(W_NS, "r")[0];
  const rPr = (muster && wKinder(muster, "rPr")[0]) || wKinder(wKinder(p, "pPr")[0], "rPr")[0];
  if (rPr) { const k = rPr.cloneNode(true); wKinder(k, "b").forEach(n => k.removeChild(n)); r.appendChild(k); }
  String(text).split("\n").forEach((zeile, i) => {
    if (i) r.appendChild(doc.createElementNS(W_NS, "w:br"));
    const t = doc.createElementNS(W_NS, "w:t"); t.setAttributeNS(XML_NS, "xml:space", "preserve"); t.textContent = zeile; r.appendChild(t);
  });
  p.appendChild(r);
  return true;
}

function kopfWert(regel) {
  const teile = regel.wert.map(id => id === "@heute" ? new Date().toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" })
    : FELDER[id] && FELDER[id].typ === "datumzeit" && wert(id) ? new Date(wert(id)).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" })
    : wert(id).trim()).filter(Boolean);
  return teile.join(regel.trenner || " ");
}

// Geschlecht ankreuzen: Die Kästchen stehen in allen Vorlagen in der Reihenfolge männlich – weiblich – divers
function geschlechtAnkreuzen(sdts) {
  const i = { "männlich": 0, "weiblich": 1, "divers": 2 }[wert("geschlecht")];
  const kaestchen = sdts.filter(x => x.getElementsByTagNameNS(W14_NS, "checkbox").length);
  return i !== undefined && kaestchen.length >= 3 && hakenSetzen(kaestchen[i], true);
}

function kopfdatenBefuellen(doc, cfg, opt = {}) {
  const bericht = { gesetzt: 0, offen: [], listen: {} };
  for (const tbl of Array.from(doc.getElementsByTagNameNS(W_NS, "tbl"))) {
    const zeilen = wKinder(tbl, "tr");
    zeilen.forEach((tr, zi) => {
      const zellen = wKinder(tr, "tc");
      zellen.forEach((tc, ci) => {
        const beschriftung = wText(tc).replace(/\s+/g, " ").trim();
        const kurz = beschriftung.split("|")[0].trim();   // zweisprachig: „Name | Surname“
        const regel = cfg.kopfdaten.find(k => k.label === beschriftung || k.label === kurz);
        if (!regel) return;   // Kopfdaten stehen oft mehrfach (z. B. Empfangsbestätigung auf Seite 2) – jede Stelle ausfüllen
        if (regel.lage === "haken") {
          if (geschlechtAnkreuzen(zellen.slice(ci + 1).flatMap(z => Array.from(z.getElementsByTagNameNS(W_NS, "sdt"))))) bericht.gesetzt++;
          return;
        }
        const v = kopfWert(regel);
        if (!v) return;
        let ziel = null;
        if (regel.lage === "rechts") ziel = zellen.slice(ci + 1).find(z => !wText(z).trim());   // erste freie Zelle (Sprachfassungen haben dazwischen die Übersetzung)
        if (regel.lage === "oben" && zi > 0) {
          // Die Zeile direkt über der Beschriftung ist die Schreiblinie
          const oben = wKinder(zeilen[zi - 1], "tc")[ci];
          ziel = oben;
        }
        if (ziel && !wText(ziel).trim() && zelleSetzen(ziel, v, tc)) bericht.gesetzt++;
      });
    });
  }
  // Rein fremdsprachige Kopftabelle (z. B. Fragebogen auf Arabisch): Zeilen in fester Reihenfolge
  const pos = opt.fremd && (cfg.positionen || {})[opt.art];
  if (pos) {
    const tbl = doc.getElementsByTagNameNS(W_NS, "tbl")[0];
    const zeilen = tbl ? wKinder(tbl, "tr") : [];
    pos.forEach((id, zi) => {
      const zellen = zeilen[zi] ? wKinder(zeilen[zi], "tc") : [];
      if (id === "@geschlecht") { if (geschlechtAnkreuzen(Array.from(zeilen[zi] ? zeilen[zi].getElementsByTagNameNS(W_NS, "sdt") : []))) bericht.gesetzt++; return; }
      const ziel = zellen.slice(1).find(z => !wText(z).trim());
      const v = kopfWert({ wert: id.split("+"), trenner: ", " });
      if (ziel && v && zelleSetzen(ziel, v, zellen[0])) bericht.gesetzt++;
    });
  }
  // Ankreuzfelder in einer Tabellenzeile anhand ihres Textes (z. B. „Die Personalien beruhen auf eigenen Angaben“)
  for (const regel of cfg.haken_zeile || []) {
    if (!bedingungErfuellt(regel.wenn)) continue;
    for (const tr of Array.from(doc.getElementsByTagNameNS(W_NS, "tr"))) {
      if (!wText(tr).replace(/[☐☒]/g, "").trim().startsWith(regel.text)) continue;
      const s = tr.getElementsByTagNameNS(W_NS, "sdt")[0];
      if (s && hakenSetzen(s, true)) bericht.gesetzt++;
    }
  }
  // Anrede: Name an den Absatz anhängen („Sehr geehrte/r Herr/Frau …“)
  for (const regel of cfg.anrede || []) {
    const v = regel.wert.map(id => wert(id).trim()).filter(Boolean).join(" ");
    const p = Array.from(doc.getElementsByTagNameNS(W_NS, "p")).find(p => wText(p).trim().startsWith(regel.beginnt));
    if (!v || !p) continue;
    const r = doc.createElementNS(W_NS, "w:r");
    const rPr = Array.from(p.getElementsByTagNameNS(W_NS, "rPr")).pop();
    if (rPr) r.appendChild(rPr.cloneNode(true));
    const t = doc.createElementNS(W_NS, "w:t"); t.setAttributeNS(XML_NS, "xml:space", "preserve"); t.textContent = (wText(p).endsWith(" ") ? "" : " ") + v + ",";
    r.appendChild(t); p.appendChild(r); bericht.gesetzt++;
  }
  // Schreiblinien „Name des Minderjährigen: ______“: Unterstriche durch den Wert ersetzen.
  // Nur die eigenen Textstücke des Absatzes (Textfelder stecken sonst verschachtelt im Anker-Absatz).
  const eigeneT = p => Array.from(p.getElementsByTagNameNS(W_NS, "t")).filter(t => { let a = t.parentNode; while (a && a.localName !== "p") a = a.parentNode; return a === p; });
  for (const regel of cfg.unterstriche || []) {
    const v = regel.wert.map(id => wert(id).trim()).filter(Boolean).join(regel.trenner || " ");
    if (!v) continue;
    for (const p of Array.from(doc.getElementsByTagNameNS(W_NS, "p"))) {
      const ts = eigeneT(p);
      if (!ts.map(t => t.textContent).join("").trim().startsWith(regel.beginnt)) continue;
      let ersetzt = false;
      for (const t of ts) {
        if (!t.textContent.includes("_")) continue;
        t.textContent = ersetzt ? t.textContent.replace(/_+/g, "") : t.textContent.replace(/_+/, (m, pos, str) => (str[pos - 1] === " " ? "" : " ") + v).replace(/_+/g, "");
        t.setAttributeNS(XML_NS, "xml:space", "preserve");
        ersetzt = true;
      }
      if (ersetzt) bericht.gesetzt++;
    }
  }
  // Absätze: Wert in den ersten leeren Absatz nach der Überschrift
  const absaetze = Array.from(doc.getElementsByTagNameNS(W_NS, "p"));
  for (const regel of cfg.absaetze || []) {
    const v = regel.wert.map(id => wert(id).trim()).filter(Boolean).join("\n");
    if (!v) continue;
    const i = absaetze.findIndex(p => wText(p).trim().startsWith(regel.nach_text));
    if (i < 0) continue;
    const leer = absaetze.slice(i + 1, i + 6).find(p => !wText(p).trim());
    if (leer) {
      const r = doc.createElementNS(W_NS, "w:r");
      v.split("\n").forEach((zeile, k) => { if (k) r.appendChild(doc.createElementNS(W_NS, "w:br")); const t = doc.createElementNS(W_NS, "w:t"); t.setAttributeNS(XML_NS, "xml:space", "preserve"); t.textContent = zeile; r.appendChild(t); });
      leer.appendChild(r); bericht.gesetzt++;
    }
  }
  return bericht;
}

// Textfelder (Word-Textboxen, z. B. Namensfeld der Belehrung): Reihenfolge im Dokument, Choice- und Fallback-Variante gemeinsam
function textfelderBefuellen(doc, regeln, bericht) {
  const gruppen = [];
  for (const tb of Array.from(doc.getElementsByTagNameNS(W_NS, "txbxContent"))) {
    const p = tb.getElementsByTagNameNS(W_NS, "p")[0];
    const id = p ? p.getAttributeNS(W14_NS, "paraId") : "";
    let g = gruppen.find(x => id && x.id === id);
    if (!g) gruppen.push(g = { id, boxen: [] });
    g.boxen.push(tb);
  }
  for (const regel of regeln || []) {
    const g = gruppen[regel.index];
    const v = regel.wert.map(id => wert(id).trim()).filter(Boolean).join(regel.trenner || " ");
    if (!g || !v || g.boxen.some(tb => wText(tb).trim())) continue;
    g.boxen.forEach(tb => zelleSetzen(tb, v, tb));
    bericht.gesetzt++;
  }
}

// Textfeld auf eine eigene Zeile setzen (oben und unten umbrechen), damit es keinen Text überdeckt oder verschiebt
function textfeldAnker(doc, regeln) {
  for (const r of regeln || []) {
    const anker = Array.from(doc.getElementsByTagNameNS(WP_NS, "anchor")).filter(a => a.getElementsByTagNameNS(W_NS, "txbxContent").length)[r.index];
    if (!anker) continue;
    const quadrat = anker.getElementsByTagNameNS(WP_NS, "wrapSquare")[0];
    if (quadrat && r.umbruch === "oben_unten") quadrat.parentNode.replaceChild(doc.createElementNS(WP_NS, "wp:wrapTopAndBottom"), quadrat);
    const v = anker.getElementsByTagNameNS(WP_NS, "positionV")[0];
    const off = v && v.getElementsByTagNameNS(WP_NS, "posOffset")[0];
    if (off && r.abstand_v !== undefined) off.textContent = String(r.abstand_v);
  }
}

const NACH_STRIKE = ["dstrike", "outline", "shadow", "emboss", "imprint", "noProof", "snapToGrid", "vanish", "webHidden", "color", "spacing", "w", "kern", "position", "sz", "szCs", "highlight", "u", "effect", "bdr", "shd", "fitText", "vertAlign", "rtl", "cs", "em", "lang", "eastAsianLayout", "specVanish", "oMath"];
// Absätze durchstreichen, die die Streife nicht erledigt (z. B. Aushändigung des Überprüfungsformulars)
function durchstreichen(doc, regeln, bericht) {
  for (const r of regeln || []) {
    if (r.wenn) { dokumenteImFall(); if (!dokumenteImFall.passt(r.wenn)) continue; }
    for (const p of Array.from(doc.getElementsByTagNameNS(W_NS, "p")).filter(p => wText(p).includes(r.enthaelt))) {
      for (const run of Array.from(p.getElementsByTagNameNS(W_NS, "r"))) {
        let rPr = wKinder(run, "rPr")[0];
        if (!rPr) { rPr = doc.createElementNS(W_NS, "w:rPr"); run.insertBefore(rPr, run.firstChild); }
        if (wKinder(rPr, "strike").length) continue;
        // Reihenfolge nach Word-Schema: <w:strike> steht vor dstrike, color, sz, u, lang …
        const danach = Array.from(rPr.childNodes).find(n => NACH_STRIKE.includes(n.localName));
        rPr.insertBefore(doc.createElementNS(W_NS, "w:strike"), danach || null);
      }
      if (bericht) bericht.gesetzt++;
    }
  }
}

function vorlageErkennen(doc) {
  const aliase = Array.from(doc.getElementsByTagNameNS(W_NS, "alias")).map(a => wAttr(a));
  // Nur den Kopf des Dokuments auswerten – im Fließtext werden andere Formulare oft erwähnt.
  // Gewinnt der Titel, der im Kopf am weitesten vorne steht (z. B. „Anlaufbescheinigung“ vor „… Inverwahrungnahme“).
  const kopf = wText(doc.documentElement).slice(0, 400);
  let bester = null;
  for (const e of C.vorlagen.erkennung) {
    if (e.sdt_alias) { if (aliase.includes(e.sdt_alias)) return e.id; continue; }
    const pos = kopf.indexOf(e.text);
    if (pos < 0 || (e.text2 && !kopf.toLowerCase().includes(e.text2))) continue;
    if (!bester || pos < bester.pos) bester = { id: e.id, pos };
  }
  return bester ? bester.id : "unbekannt";
}

const ART_KURZ = { inverwahrung: "Bescheinigung_Inverwahrung_21AsylG", inverwahrung50: "Bescheinigung_Inverwahrung_50AufenthG", abschluss: "Abschlusserklaerung", abschluss_ohne: "Abschlusserklaerung_ohne_Asylgesuch", abschluss_uma: "Abschlusserklaerung_umA", belehrung48: "Belehrung_48_62_AufenthG", fragebogen: "Fragebogen", fragebogen_uma: "Fragebogen_umA", belehrung15: "Belehrung_15_20_AsylG", info11: "Information_Art11", anlauf: "Anlaufbescheinigung", unbekannt: "Formular" };
function dateiBasis() {
  const geb = datumTeile(wert("geburtsdatum"));
  const teile = { azr_nummer: wert("azr_nummer") || "AZR-offen", name: wert("name") || "Name", vorname: wert("vorname") || "Vorname", geburtsdatum: geb ? `${geb.t}.${geb.m}.${geb.j}` : (wert("geburtsdatum") || "Geburtsdatum") };
  return (C.vorlagen.dateiname_screening || ["azr_nummer", "name", "vorname", "geburtsdatum"]).map(k => dateiSicher(teile[k] ?? wert(k))).join("_");
}
const dateiSicher = s => String(s || "").trim().replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, "_");

async function vorlageBefuellen(datei, korrekturen = {}, vorgabe = null) {
  const dateien = await zipLesen(await datei.arrayBuffer());
  const eintrag = dateien.find(d => d.name === "word/document.xml");
  if (!eintrag) throw new Error("In der Datei fehlt word/document.xml – ist es wirklich eine Word-Vorlage?");
  const xml = new TextDecoder().decode(eintrag.daten);
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("Word-Datei konnte nicht gelesen werden.");
  const art = vorgabe ? vorgabe.art : vorlageErkennen(doc);
  const fremd = !!(vorgabe && vorgabe.sprache);
  const bericht = art === "screening" ? screeningBefuellen(doc, C.vorlagen.screening, korrekturen) : kopfdatenBefuellen(doc, C.vorlagen, { art, fremd });
  if (art !== "screening") textfelderBefuellen(doc, (C.vorlagen.textfelder || {})[art], bericht);
  if (art !== "screening") textfeldAnker(doc, (C.vorlagen.textfeld_anker || {})[art]);
  if (art !== "screening") durchstreichen(doc, (C.vorlagen.durchstreichen || {})[art], bericht);

function speichern(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// Welche Dokumente braucht dieser Fall?
function dokumenteImFall() {
  const asyl = wert("asyl") === "Ja", uma = istUma();
  const hatDokumente = auswahl("dokumente").some(d => !d.startsWith("Kein"));
  const passt1 = w => w === "immer" || (w === "asyl" && asyl) || (w === "ohne_asyl" && !asyl) || (w === "uma" && uma) || (w === "erwachsen" && !uma) || (w === "dokumente" && hatDokumente) || (w === "ohne_asyl_oder_uma" && (!asyl || uma))
    || (w === "kein_rueckkehr" && !wert("weiterleitung").startsWith("Rückkehrverfahren"))
    || (w === "screening" && istScreening()) || (w === "ohne_screening" && !istScreening());
  const passt = w => w.split("+").every(passt1);   // z. B. "asyl+dokumente"
  dokumenteImFall.passt = passt;
  return (C.dokumentauswahl || []).filter(d => passt(d.wann));
}

let VORLAGEN_ERGEBNIS = [];   // nur im Arbeitsspeicher

// In der internen Ausgabe sind die aktuellen Vorlagen eingebaut – die App füllt sie automatisch aus
const eingebettet = k => { const el = document.getElementById("d:" + k); return el ? el.textContent.trim() : null; };

const b64Datei = (b64, name, typ) => new File([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], name, { type: typ });
const eingebaut = () => (C.vorlagen_eingebaut || []).map(v => b64Datei((typeof VORLAGEN_NEU !== "undefined" && VORLAGEN_NEU[v.name]) || v.daten, v.name, "application/vnd.openxmlformats-officedocument.wordprocessingml.document"));
const beilagenImFall = () => {
  if (!dokumenteImFall().length) return [];
  const passt = wann => dokumenteImFall.passt ? dokumenteImFall.passt(wann) : true;
  const liste = C.beilagen_liste || [];
  const spr = formularSprache();
  const aus = [];
  for (const typ of [...new Set(liste.map(b => b.typ))]) {
    const kand = liste.filter(b => b.typ === typ && passt(b.wann));
    if (!kand.length) continue;
    const wahl = (kand[0].sprache !== undefined && kand.find(b => b.sprache === spr)) || kand.find(b => b.sprache === "deutsch") || kand[0];
    aus.push({ ...wahl, titel: wahl.titel + (wahl.sprache && wahl.sprache !== "deutsch" ? ` (${wahl.sprache})` : ""), daten: eingebettet("bl/" + wahl.name) });
  }
