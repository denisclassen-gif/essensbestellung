Amtsgericht Leipzig","rolle":"Haftanträge, Durchsuchungsanordnungen","telefon":""},{"name":"Bundespolizei Flughafen Leipzig/Halle","rolle":"Übergabe bei Flugabschiebungen","telefon":""},{"name":"Dolmetscherdienst","rolle":"Sprachmittlung","telefon":""}],"quellen":["EU-Verordnungen 2024/1346–1359 (Amtsblatt der EU, Mai 2024)","GEAS-Anpassungsgesetz und GEAS-Anpassungsfolgegesetz (BGBl. 2026, in Kraft 12.06.2026)","Deutscher Bundestag, Beschluss vom 27.02.2026 (Drs. 21/1848)","Landesdirektion Sachsen – Sekundärmigrationszentrum (Medieninformation Juli 2026)","Landesdirektion Sachsen – Einrichtung Abschiebungshaft/Ausreisegewahrsam Dresden","Sächsisches Polizeivollzugsdienstgesetz (SächsPVDG), Novelle Landtagsbeschluss 24.06.2026","Aufenthaltsgesetz, Asylgesetz in der jeweils aktuellen Fassung (gesetze-im-internet.de)"],"onboarding":[{"icon":"hand.wave","titel":"Willkommen bei GEAS Hilfe","text":"Diese App hilft dir im Einsatz und beim Lernen rund um **GEAS**, **Asyl** und **Rückführung** – zugeschnitten auf die Polizei Sachsen und die PD Leipzig.\n\nIn 1 Minute zeigen wir dir, wie sie funktioniert."},{"icon":"checkmark.shield","titel":"Das Wichtigste: die Screening-Prüfung","text":"Du hast eine Person ohne Aufenthaltsnachweis angetroffen und weißt nicht, ob ein **Screening** nötig ist?\n\n1. Öffne den Reiter **Screening**.\n2. Tippe auf **Prüfung starten**.\n3. Beantworte **eine Frage nach der anderen**.\n4. Am Ende steht **eindeutig**, ob ein Screening durchzuführen ist – und **was du jetzt tun musst**, Schritt für Schritt.\n\nDu kannst jederzeit einen Schritt zurückgehen."},{"icon":"exclamationmark.triangle","titel":"Drei goldene Regeln","text":"1. **Erst abfragen, dann entscheiden.** INPOL, AZR, SIS, Eurodac – immer vor der Entscheidung.\n2. **Uhrzeit des Aufgriffs sofort notieren.** Wird festgehalten: unverzüglich die richterliche Entscheidung herbeiführen – ohne Anordnung spätestens mit **Ende des folgenden Tages** freilassen. Screening höchstens **3 Tage**.\n3. **Asyl sticht nichts aus.** Wer um Schutz bittet, wird trotzdem überprüft – das Gesuch wird **wörtlich** notiert und weitergeleitet.\n\nIm Zweifel: **Rücksprache** mit Dienstgruppenleitung bzw. Fachdienststelle."},{"icon":"square.grid.2x2","titel":"Was gibt es noch?","text":"• **Unterlagen** – Fall anlegen, Schritt für Schritt erfassen, alle Dokumente als PDF erzeugen\n• **Wissen** – 11 Kapitel zum Nachlesen, mit Suche und Glossar\n• **Einsatz** – Checklisten zum Abhaken, Fristen, Paragraphen\n• **Lernen** – Quiz, Fallbeispiele, Prüfung, Karteikarten\n• **Mehr** – eigene Telefonliste, Einführung erneut ansehen"},{"icon":"lock.shield","titel":"Wichtiger Hinweis","text":"Die App ist eine **inoffizielle Arbeitshilfe**. Sie ersetzt weder Gesetz, Erlass oder Dienstanweisung noch die Weisung der Führung oder der Ausländerbehörde. Erzeugte Unterlagen sind **Entwürfe** – maßgeblich sind die amtlichen Vordrucke.\n\n**Personendaten** nur im Unterlagen-Assistenten und nur auf dienstlich zugelassenen Geräten eingeben. Sie werden verschlüsselt gespeichert und nach 7 Tagen automatisch gelöscht."}],"screening":{"start":"q_eu","kurzanleitung":["Aufgriffszeit notieren – ab jetzt laufen die Fristen.","Eigensicherung und Personalien, Dokumente sichten.","Abfragen: INPOL, AZR, SIS, Eurodac/Fast-ID.","Screening-Prüfung in der App Schritt für Schritt beantworten.","Ergebnis befolgen. Bei „Screening durchführen“: Fall im Unterlagen-Assistenten anlegen – die App erstellt alle Unterlagen.","Festhalten? Richterliche Entscheidung unverzüglich herbeiführen – ohne Anordnung spätestens mit Ende des Folgetages freilassen (Fristenrechner)."],"grundsaetze":["Screening gilt nur für Drittstaatsangehörige – nie für EU-, EWR- oder Schweizer Staatsangehörige.","Screening im Inland nur, wenn es keinen Hinweis auf eine Kontrolle an einer EU-Außengrenze gibt und die Person noch nicht überprüft wurde (kein Screening-Vermerk, keine bekannte ED-Behandlung mit Asylantrag).","Legal eingereist und zu lange geblieben (z. B. Visum abgelaufen, 90 Tage überschritten) → kein Screening, sondern Rückkehrverfahren.","Nach Abschiebung/Ausreise ohne Kontrolle zurückgekehrt → erneutes Screening; eine Überstellung innerhalb der EU zählt nicht als Ausreise.","Ein Asylgesuch verhindert das Screening nicht.","Höchstdauer im Inland: 3 Tage. Festhalten: richterliche Entscheidung unverzüglich; ohne Anordnung Freilassung spätestens mit Ende des Tages nach dem Ergreifen.","Die Polizei prüft keine Asylgründe und stellt keine Gesundheit fest – das machen BAMF bzw. Gesundheitsbehörde."],"knoten":{"q_eu":{"typ":"frage","schritt":"Staatsangehörigkeit","frage":"Ist die Person Staatsangehörige/r eines EU-Staates, von Island, Liechtenstein, Norwegen oder der Schweiz?","hilfe":"Pass oder Personalausweis ansehen. Hat die Person keine Dokumente, gilt: „Nein / unklar“.","beispiele":["Ja: rumänischer Personalausweis, Schweizer Pass","Nein: syrischer Pass, afghanische Tazkira, keine Papiere"],"antworten":[{"text":"Ja – nachgewiesen","ziel":"e_eu"},{"text":"Nein / unklar / keine Papiere","ziel":"q_fam"}]},"q_fam":{"typ":"frage","schritt":"Freizügigkeit","frage":"Ist die Person nachweislich Familienangehörige/r einer Unionsbürgerin oder eines Unionsbürgers mit Freizügigkeitsrecht?","hilfe":"Nachweis ist z. B. eine „Aufenthaltskarte für Familienangehörige eines Unionsbürgers“. Eine bloße Behauptung reicht nicht. Plausible Angaben ohne Dokument: erst Gelegenheit zur Vorlage von Nachweisen geben und die Ausländerbehörde einbinden (Leitfaden EU-Freizügigkeit).","beispiele":["Ja: Aufenthaltskarte nach § 5 FreizügG/EU","Nein: nur mündliche Angabe, kein Dokument"],"antworten":[{"text":"Ja – mit Dokument nachgewiesen","ziel":"e_eu"},{"text":"Nein / nicht nachgewiesen","ziel":"q_status"}]},"q_status":{"typ":"frage","schritt":"Aufenthaltsnachweis","frage":"Hat die Person ein GÜLTIGES Dokument, das ihren Aufenthalt oder ihr Verfahren in Deutschland belegt?","hilfe":"Gültigkeitsdatum und Echtheit prüfen. Abgelaufene Visa oder überschrittene visumfreie Aufenthalte zählen NICHT als gültig – dafür gibt es eine eigene Antwort. Titel anderer Schengen-Staaten berechtigen nur zu 90 Tagen Aufenthalt in 180 Tagen in Deutschland.","beispiele":["Aufenthaltstitel (eAT), nationales Visum, gültiges Schengen-Visum","Duldung, Aufenthaltsgestattung, Ankunftsnachweis, Fiktionsbescheinigung","Aufenthaltserlaubnis zum vorübergehenden Schutz (z. B. Ukraine, § 24 AufenthG)","Abgelaufen: Schengen-Visum abgelaufen oder visumfreie 90 Tage überschritten (z. B. vietnamesische Person mit Besuchsvisum)"],"antworten":[{"text":"Ja – gültiges deutsches Dokument, gültiges Visum oder Titel eines anderen Schengen-Staates (höchstens 90 Tage in Deutschland)","ziel":"e_status"},{"text":"Titel eines anderen Schengen-Staates – aber länger als 90 Tage in Deutschland oder unklar","ziel":"e_anderer_staat"},{"text":"Nur ein ABGELAUFENES Visum / visumfreie 90 Tage überschritten","ziel":"e_overstay"},{"text":"Nein – gar nichts / unklar","ziel":"q_abfrage"}]},"q_abfrage":{"typ":"frage","schritt":"Datenbankabfrage","frage":"Ergebnis der Abfragen (INPOL, AZR, SIS, Eurodac/Fast-ID, VIS/EES): Was ist über die Person bekannt?","hilfe":"Noch nicht abgefragt? Dann JETZT abfragen – erst danach weiter. Gibt es mehrere Treffer, gilt die Antwort weiter oben. Eine frühere Abschiebung oder Ausreise immer mit der dritten Antwort erfassen.","beispiele":["VIS: Visum erteilt · EES: registrierte Einreise an einer Außengrenze","AZR: laufendes Asylverfahren in Sachsen · Eurodac-Treffer Italien","INPOL/AZR: Abschiebung 2025 vollzogen, Einreise- und Aufenthaltsverbot (§ 11 AufenthG)"],"antworten":[{"text":"VIS/EES-Treffer: Visum erteilt oder kontrollierte Einreise registriert","ziel":"e_overstay"},{"text":"Bekannt in Deutschland oder einem EU-Staat (Asylverfahren, Duldung, Eurodac) – ohne dokumentierte Ausreise","ziel":"e_bekannt"},{"text":"Frühere Abschiebung, Ausreise oder Einreiseverbot bekannt","ziel":"q_ausreise"},{"text":"Kein Treffer","ziel":"q_geboren"},{"text":"Abfrage gerade nicht möglich (Systemausfall)","ziel":"q_geboren"}]},"q_einreise":{"typ":"frage","schritt":"Einreise","frage":"Gibt es einen konkreten Hinweis, dass die Person bei der Einreise in den Schengen-Raum an einer Grenzkontrolle (Außengrenze) kontrolliert wurde?","hilfe":"Es zählen nur belegbare Hinweise, keine bloße Behauptung. Fehlen Belege → „Nein / kein Hinweis“.","beispiele":["Einreisestempel im Pass oder EES-Eintrag","Visum im Pass und Flugticket mit Ankunft an einem Schengen-Flughafen","Visumfreie Staatsangehörige (z. B. Kolumbien, Georgien) mit belegter Einreise per Flugzeug"],"antworten":[{"text":"Ja – belegbarer Hinweis auf kontrollierte Einreise","ziel":"e_overstay"},{"text":"Nein / kein Hinweis / unklar","ziel":"q_rueck"}]},"q_rueck":{"typ":"frage","schritt":"Rücküberstellung","frage":"Wird die Person UNMITTELBAR nach dem Aufgriff aufgrund eines bilateralen Abkommens an einen Nachbarstaat rücküberstellt?","hilfe":"Das betrifft praktisch nur Aufgriffe durch die Bundespolizei im grenznahen Raum. Im Bereich der PD Leipzig lautet die Antwort in aller Regel „Nein“.","beispiele":[],"antworten":[{"text":"Nein (Regelfall)","ziel":"e_screening"},{"text":"Ja – mit Bundespolizei abgestimmt","ziel":"e_rueck"}]},"e_screening":{"typ":"ergebnis","ergebnis":"screening","titel":"Screening durchführen","kurz":"Die Person ist nach Art. 7 Screening-VO und § 15b AufenthG zu überprüfen. Höchstdauer: 3 Tage.","fristen":true,"schritte":[{"text":"Aufgriffszeit notieren und unten in den Fristenrechner eintragen.","hinweis":"Tipp: Unterlagen-Assistent starten – er führt durch alle Angaben."},{"text":"Person in verständlicher Sprache belehren: Überprüfung nach Screening-VO.","hinweis":"Dolmetscher, keine Kinder oder Mitbewohner","dokumente":["info11"]},{"text":"Minderjährigkeit nicht auszuschließen? → sofort Jugendamt informieren, kindgerecht vorgehen. Hinweise auf besondere Schutzbedürftigkeit notieren und bei der Übergabe mitteilen.","hinweis":"Im Zweifel als minderjährig behandeln"},{"text":"Nur festhalten, wenn die Überprüfung sonst nicht oder nur unter erheblichen Schwierigkeiten möglich ist. Dann unverzüglich die richterliche Entscheidung herbeiführen. Ordnet das Gericht die Fortdauer nicht bis zum Ende des Tages nach dem Ergreifen an: freilassen. Festhalten beenden, sobald es nicht mehr nötig ist (§ 15b Abs. 3 AufenthG).","hinweis":"§ 15b AufenthG, Art. 104 GG"},{"text":"Wird die Person wegen Haftbefehl, Untersuchungs- oder Auslieferungshaft festgenommen? Dann kann auf das Screening verzichtet werden (Art. 18 Abs. 6 Screening-VO) – nicht bei Bagatelldelikten.","hinweis":"Schon begonnen: Überprüfungsformular mit dem Grund an die zuständige Stelle senden. Wird gescreent, gilt die 3-Tages-Frist voll."},{"text":"Identität prüfen: Dokumente sichten und sichern.","hinweis":"Datenträger nur nach § 48 Abs. 3a, 3b AufenthG"},{"text":"Sicherheitsabfragen vollständig durchführen (SIS, INPOL, weitere über die zuständige Stelle).","hinweis":null},{"text":"ED-Behandlung und Eurodac: ab 6 Jahren Fingerabdrücke und Lichtbild, unter 6 Jahren nur Lichtbild (§ 49 Abs. 8 AufenthG).","hinweis":null},{"text":"Vorläufige Gesundheitskontrolle durch die zuständige Gesundheitsbehörde veranlassen – nicht selbst durchführen.","hinweis":null},{"text":"Hinweise auf Vulnerabilität festhalten (Minderjährige, Schwangere, Kranke, Opfer von Folter oder Menschenhandel).","hinweis":null},{"text":"Überprüfungsformular ausfüllen – Punkt 3 und 6.4 bis 6.6 bleiben leer (macht die zuständige Behörde/LDS); Anlage „Sicherheitskontrolle“ nicht aushändigen.","hinweis":null},{"text":"Bittet die Person um Schutz: wörtlich notieren. Das Screening läuft trotzdem weiter.","hinweis":null},{"text":"Übergabe an die zuständige Stelle nach sächsischer Zuständigkeitsregelung (Asylverfahren oder Ausländerbehörde für die Rückkehr).","hinweis":"Erlasslage SMI beachten"},{"text":"Unterlagen noch am selben Tag weiterleiten – das Screening schließt die zuständige Behörde ab; die 3-Tages-Frist gilt für alles zusammen.","hinweis":null}],"rechtsgrundlage":"Art. 7 VO (EU) 2024/1356, § 15b AufenthG, § 71 Abs. 4a AufenthG"},"e_eu":{"typ":"ergebnis","ergebnis":"kein","titel":"Kein Screening","kurz":"Unionsbürger:innen, EWR- und Schweizer Staatsangehörige sowie ihre freizügigkeitsberechtigten Familienangehörigen fallen nicht unter die Screening-VO.","fristen":false,"schritte":[{"text":"Weiter nach allgemeinem Polizeirecht bzw. FreizügG/EU.","hinweis":null},{"text":"Bei Zweifeln an der Echtheit der Dokumente: Urkundenprüfung, ggf. Strafanzeige.","hinweis":null},{"text":"Bei Verlustfeststellung des Freizügigkeitsrechts: Ausländerbehörde informieren.","hinweis":null}],"rechtsgrundlage":"Art. 2 VO (EU) 2024/1356, FreizügG/EU"},"e_status":{"typ":"ergebnis","ergebnis":"kein","titel":"Kein Screening","kurz":"Die Person hat einen gültigen, bekannten Aufenthaltsstatus. Sie ist bereits im System erfasst.","fristen":false,"schritte":[{"text":"Echtheit und Gültigkeit des Dokuments sicher prüfen.","hinweis":null},{"text":"Auflagen prüfen, z. B. räumliche Beschränkung oder Wohnsitzauflage.","hinweis":"Erstverstoß § 86 AsylG (OWi), wiederholt § 85 AsylG"},{"text":"Ausschreibungen beachten (INPOL, SIS).","hinweis":null},{"text":"Bei Auffälligkeiten die zuständige Ausländerbehörde informieren.","hinweis":null}],"rechtsgrundlage":"Art. 7 VO (EU) 2024/1356 (kein Anwendungsfall)"},"e_bekannt":{"typ":"ergebnis","ergebnis":"kein","titel":"Kein erneutes Screening","kurz":"Die Person ist bereits erfasst, überprüft oder im Verfahren. Es geht im bestehenden Verfahren weiter.","fristen":false,"schritte":[{"text":"Treffer mit Aktenzeichen, Staat und Kategorie dokumentieren.","hinweis":null},{"text":"Ausschreibung vorhanden? Ausschreibung befolgen (z. B. Festnahme, Aufenthaltsermittlung).","hinweis":null},{"text":"Eurodac-Treffer eines anderen EU-Staates: ZAB bzw. Ausländerbehörde informieren – Zuständigkeitsverfahren nach AMM-VO.","hinweis":"Ggf. Überstellung"},{"text":"Bittet die Person um Schutz: wörtlich notieren und weiterleiten.","hinweis":null},{"text":"Festnahme nur bei Ausschreibung oder Haftgrund, z. B. § 62 Abs. 5 AufenthG – in Abstimmung mit der Ausländerbehörde.","hinweis":null},{"text":"Unerlaubten Aufenthalt prüfen (§ 95 AufenthG).","hinweis":null},{"text":"Unklar, ob die Person zwischenzeitlich den Schengen-Raum verlassen hatte? Bei der Ausländerbehörde klären – ergibt sich eine Ausreise, Prüfung neu starten.","hinweis":null}],"rechtsgrundlage":"Art. 7 VO (EU) 2024/1356, AMM-VO"},"e_overstay":{"typ":"ergebnis","ergebnis":"kein","titel":"Kein Screening – Rückkehrverfahren","kurz":"Die Person ist kontrolliert eingereist (z. B. mit Visum oder visumfrei) und hält sich jetzt unerlaubt auf – etwa weil die 90 Tage überschritten sind. Zuständig ist die Ausländerbehörde, nicht das Screening.","fristen":false,"schritte":[{"text":"Nachweis der kontrollierten Einreise dokumentieren (Stempel, EES, VIS, Visum).","hinweis":null},{"text":"Aufenthaltsdauer berechnen: 90 Tage in 180 Tagen (Schengen-Rechner, EES).","hinweis":null},{"text":"Strafbarkeit prüfen: unerlaubter Aufenthalt (§ 95 Abs. 1 Nr. 2 AufenthG).","hinweis":"Bei Duldung keine Strafbarkeit"},{"text":"Zuständige Ausländerbehörde informieren – sie entscheidet über die Rückkehr.","hinweis":null},{"text":"Bittet die Person um Schutz: wörtlich notieren und weiterleiten.","hinweis":null},{"text":"Festnahme nur bei Haftgrund (§ 62 Abs. 5 AufenthG) und in Abstimmung mit der Ausländerbehörde.","hinweis":null}],"rechtsgrundlage":"Art. 7 VO (EU) 2024/1356 (kein Anwendungsfall), §§ 50, 58, 95 AufenthG"},"e_rueck":{"typ":"ergebnis","ergebnis":"sonder","titel":"Von einem Screening kann abgesehen werden","kurz":"Bei unmittelbarer Rücküberstellung an einen Nachbarstaat aufgrund eines bilateralen Abkommens kann vom Screening abgesehen werden.","fristen":false,"schritte":[{"text":"Nur in Abstimmung mit der Bundespolizei.","hinweis":null},{"text":"Findet die Rücküberstellung doch nicht unmittelbar statt: Prüfung neu starten – dann ist ein Screening durchzuführen.","hinweis":null},{"text":"Alle Absprachen dokumentieren (wer, wann, Ergebnis).","hinweis":null}],"rechtsgrundlage":"Art. 7 Abs. 2 VO (EU) 2024/1356"},"q_ausreise":{"typ":"frage","schritt":"Frühere Ausreise","frage":"Hat die Person den Schengen-Raum nachweislich verlassen – und ist danach wieder hier?","hilfe":"Entscheidend ist, ob die Person den **Schengen-Raum** verlassen hat. Eine Überstellung oder Reise in einen anderen EU-/Schengen-Staat zählt **nicht** als Verlassen.","beispiele":["Ja: Abschiebung nach Syrien, Afghanistan, Georgien vollzogen; Grenzübertrittsbescheinigung; EES-Ausreise","Nein: Dublin-/AMM-Überstellung nach Italien; Abschiebung gescheitert; Person war untergetaucht"],"antworten":[{"text":"Ja – Ausreise aus dem Schengen-Raum ist dokumentiert","ziel":"q_wiedereinreise"},{"text":"Nein – nur innerhalb der EU / Schengen oder nie ausgereist","ziel":"e_bekannt"},{"text":"Unklar – Ausreise lässt sich nicht feststellen","ziel":"e_ausreise_unklar"}]},"q_wiedereinreise":{"typ":"frage","schritt":"Erneute Einreise","frage":"Wie ist die Person nach der Ausreise wieder in den Schengen-Raum gekommen?","hilfe":"Nur belegbare Kontrollen zählen (Stempel, EES-Eintrag, Visum mit Flugbuchung). Angaben der Person ohne Beleg → „Ohne Kontrolle / unklar“.","beispiele":["Mit Kontrolle: neues Visum, Einreisestempel Flughafen Frankfurt","Ohne Kontrolle: über die Balkanroute, geschleust im Lkw, keine Angaben"],"antworten":[{"text":"Mit Grenzkontrolle (belegt)","ziel":"e_wieder_kontrolliert"},{"text":"Ohne Kontrolle / geschleust / unklar","ziel":"e_wiedereinreise"}]},"q_geboren":{"typ":"frage","schritt":"Geburt","frage":"Ist die Person im Schengen-Raum geboren und hat ihn seitdem nie verlassen?","hilfe":"Wer hier geboren ist, hat die Außengrenze nie überschritten – ein Screening kommt dann nicht in Betracht. Typischer Fall: Kinder unerlaubt aufhältiger Eltern.","beispiele":["Ja: Kind, in Leipzig geboren (Geburtsurkunde)","Nein / unklar: keine Unterlagen, Angaben widersprüchlich"],"antworten":[{"text":"Ja – Geburt im Schengen-Raum belegt","ziel":"e_geboren"},{"text":"Nein / unklar","ziel":"q_einreise"}]},"e_anderer_staat":{"typ":"ergebnis","ergebnis":"kein","titel":"Kein Screening – Titel eines anderen Schengen-Staates","kurz":"Die Person ist mit einem Aufenthaltstitel eines anderen Schengen-Staates erlaubt eingereist. Hält sie sich länger als 90 Tage in 180 Tagen in Deutschland auf, ist der Aufenthalt hier unerlaubt – ein Screening ist trotzdem nicht durchzuführen.","fristen":false,"schritte":[{"text":"Titel, Ausstellerstaat und Gültigkeit dokumentieren; Echtheit prüfen.","hinweis":null},{"text":"Aufenthaltsdauer in Deutschland feststellen (Angaben, Belege, EES).","hinweis":null},{"text":"Bei Überschreitung: unerlaubter Aufenthalt – Strafbarkeit prüfen (§ 95 AufenthG).","hinweis":null},{"text":"Ausländerbehörde informieren: Die Person ist grundsätzlich zur Rückkehr in den Staat verpflichtet, der den Titel ausgestellt hat.","hinweis":"Art. 6 Abs. 2 Rückführungsrichtlinie 2008/115/EG"},{"text":"Bittet die Person um Schutz: wörtlich notieren und weiterleiten.","hinweis":null}],"rechtsgrundlage":"Art. 7 VO (EU) 2024/1356 (kein Anwendungsfall), Art. 21 SDÜ, § 95 AufenthG"},"e_wiedereinreise":{"typ":"ergebnis","ergebnis":"screening","titel":"Screening durchführen – erneute unerlaubte Einreise","kurz":"Die Person hat den Schengen-Raum verlassen und ist ohne Kontrolle zurückgekommen. Das ist ein neuer unerlaubter Grenzübertritt: Screening nach Art. 7 Screening-VO und § 15b AufenthG – zusätzlich Einreiseverbot und Strafbarkeit prüfen.","fristen":true,"schritte":[{"text":"Aufgriffszeit notieren und unten in den Fristenrechner eintragen.","hinweis":"Tipp: Unterlagen-Assistent starten – er führt durch alle Angaben."},{"text":"Person in verständlicher Sprache belehren: Überprüfung nach Screening-VO.","hinweis":"Dolmetscher, keine Kinder oder Mitbewohner","dokumente":["info11"]},{"text":"Minderjährigkeit nicht auszuschließen? → sofort Jugendamt informieren, kindgerecht vorgehen. Hinweise auf besondere Schutzbedürftigkeit notieren und bei der Übergabe mitteilen.","hinweis":"Im Zweifel als minderjährig behandeln"},{"text":"Nur festhalten, wenn die Überprüfung sonst nicht oder nur unter erheblichen Schwierigkeiten möglich ist. Dann unverzüglich die richterliche Entscheidung herbeiführen. Ordnet das Gericht die Fortdauer nicht bis zum Ende des Tages nach dem Ergreifen an: freilassen. Festhalten beenden, sobald es nicht mehr nötig ist (§ 15b Abs. 3 AufenthG).","hinweis":"§ 15b AufenthG, Art. 104 GG"},{"text":"Wird die Person wegen Haftbefehl, Untersuchungs- oder Auslieferungshaft festgenommen? Dann kann auf das Screening verzichtet werden (Art. 18 Abs. 6 Screening-VO) – nicht bei Bagatelldelikten.","hinweis":"Schon begonnen: Überprüfungsformular mit dem Grund an die zuständige Stelle senden. Wird gescreent, gilt die 3-Tages-Frist voll."},{"text":"Einreise- und Aufenthaltsverbot prüfen (§ 11 AufenthG): Einreise trotz Verbots ist eine Straftat – Strafanzeige nach § 95 Abs. 2 Nr. 1 AufenthG.","hinweis":"Frist des Verbots beachten"},{"text":"SIS-/INPOL-Ausschreibung (z. B. Einreiseverweigerung, Festnahme) befolgen.","hinweis":null},{"text":"Frühere Daten (Eurodac, AZR, ED-Bestand) zum Abgleich der Identität nutzen – die ED-Behandlung wird trotzdem neu durchgeführt.","hinweis":null},{"text":"ZAB/LDS sofort informieren: Abschiebung bzw. ggf. Zurückschiebung (§ 57 Abs. 2 AufenthG) und Haft (§ 62 Abs. 3 Satz 1 Nr. 4 AufenthG) prüfen lassen.","hinweis":null},{"text":"Identität prüfen: Dokumente sichten und sichern.","hinweis":"Datenträger nur nach § 48 Abs. 3a, 3b AufenthG"},{"text":"Sicherheitsabfragen vollständig durchführen (SIS, INPOL, weitere über die zuständige Stelle).","hinweis":null},{"text":"ED-Behandlung und Eurodac: ab 6 Jahren Fingerabdrücke und Lichtbild, unter 6 Jahren nur Lichtbild (§ 49 Abs. 8 AufenthG).","hinweis":null},{"text":"Vorläufige Gesundheitskontrolle durch die zuständige Gesundheitsbehörde veranlassen – nicht selbst durchführen.","hinweis":null},{"text":"Hinweise auf Vulnerabilität festhalten (Minderjährige, Schwangere, Kranke, Opfer von Folter oder Menschenhandel).","hinweis":null},{"text":"Überprüfungsformular ausfüllen – Punkt 3 und 6.4 bis 6.6 bleiben leer (macht die zuständige Behörde/LDS); Anlage „Sicherheitskontrolle“ nicht aushändigen.","hinweis":null},{"text":"Bittet die Person um Schutz: wörtlich notieren. Nach früherem Asylverfahren handelt es sich regelmäßig um einen Folgeantrag – Entscheidung durch das BAMF. Das Screening läuft weiter.","hinweis":null},{"text":"Übergabe an die zuständige Stelle nach sächsischer Zuständigkeitsregelung (Asylverfahren oder Ausländerbehörde für die Rückkehr).","hinweis":"Erlasslage SMI beachten"},{"text":"Unterlagen noch am selben Tag weiterleiten – das Screening schließt die zuständige Behörde ab; die 3-Tages-Frist gilt für alles zusammen.","hinweis":null}],"rechtsgrundlage":"Art. 7 VO (EU) 2024/1356, § 15b AufenthG, §§ 11, 57, 95 Abs. 2 Nr. 1 AufenthG"},"e_wieder_kontrolliert":{"typ":"ergebnis","ergebnis":"kein","titel":"Kein Screening – erneute kontrollierte Einreise","kurz":"Die Person ist nach früherer Ausreise wieder mit Grenzkontrolle eingereist (z. B. mit neuem Visum). Ein Screening entfällt. Besteht ein Einreiseverbot, ist die Einreise trotzdem strafbar.","fristen":false,"schritte":[{"text":"Beleg der kontrollierten Einreise dokumentieren (Stempel, EES, Visum).","hinweis":null},{"text":"Einreise- und Aufenthaltsverbot prüfen – ggf. Strafanzeige nach § 95 Abs. 2 Nr. 1 AufenthG.","hinweis":null},{"text":"Wurde das Visum trotz Verbots erteilt? Hinweis an Ausländerbehörde (Rücknahme/Annullierung prüfen).","hinweis":null},{"text":"ZAB/LDS bzw. Ausländerbehörde informieren; Festnahme nur bei Haftgrund (§ 62 Abs. 5 AufenthG).","hinweis":null},{"text":"Bittet die Person um Schutz: wörtlich notieren und weiterleiten (ggf. Folgeantrag).","hinweis":null}],"rechtsgrundlage":"Art. 7 VO (EU) 2024/1356 (kein Anwendungsfall), §§ 11, 95 AufenthG"},"e_ausreise_unklar":{"typ":"ergebnis","ergebnis":"sonder","titel":"Klären: Ist die Person ausgereist?","kurz":"Ohne Nachweis einer Ausreise gilt die Person als weiterhin hier aufhältig und bekannt – dann kein erneutes Screening. Die Frage muss aber zeitnah geklärt werden.","fristen":true,"schritte":[{"text":"Aufgriffszeit notieren – falls sich doch ein Screening ergibt, laufen die Fristen bereits.","hinweis":null},{"text":"Ausländerbehörde / ZAB sofort befragen: Abschiebung vollzogen? Grenzübertrittsbescheinigung? EES-Ausreise?","hinweis":null},{"text":"Person befragen (Dolmetscher): Wann und wie ausgereist, wann und wie wieder eingereist? Antworten wörtlich notieren.","hinweis":null},{"text":"Ergibt sich eine Ausreise aus dem Schengen-Raum: Prüfung neu starten und „Ja“ wählen.","hinweis":null},{"text":"Bleibt es unklar: weiter wie „bekannte Person“ – Ausschreibungen befolgen, § 95 AufenthG prüfen, Ausländerbehörde entscheidet.","hinweis":null}],"rechtsgrundlage":"Art. 7 VO (EU) 2024/1356"},"e_geboren":{"typ":"ergebnis","ergebnis":"kein","titel":"Kein Screening – im Schengen-Raum geboren","kurz":"Die Person hat die Außengrenze nie überschritten. Die Screening-VO setzt einen unerlaubten Grenzübertritt voraus – sie greift hier nicht.","fristen":false,"schritte":[{"text":"Geburtsnachweis dokumentieren (Geburtsurkunde, Melderegister).","hinweis":null},{"text":"Status der Eltern bzw. Sorgeberechtigten klären.","hinweis":null},{"text":"Minderjährige ohne Sorgeberechtigte: Jugendamt informieren.","hinweis":null},{"text":"Zuständige Ausländerbehörde informieren.","hinweis":null}],"rechtsgrundlage":"Art. 7 VO (EU) 2024/1356 (kein Anwendungsfall)"}}},"fall":{"hinweis":"Die Falldaten enthalten personenbezogene Daten. Sie werden nur verschlüsselt auf diesem Gerät gespeichert und nach 7 Tagen automatisch gelöscht. Nur auf dienstlich zugelassenen Geräten verwenden. Nach Übe ","label":"Weitere Abfragen (z. B. Europol/Interpol über zuständige Stelle)","typ":"text"},{"id":"treffer_details","label":"Treffer und sicherheitsrelevante Erkenntnisse","typ":"mehrzeilig","hinweis":"Bei „Treffer“ immer ausfüllen."},{"id":"sicherheit_anhaltspunkte","label":"Anhaltspunkte, dass von der Person eine Gefahr für die innere Sicherheit ausgeht?","typ":"auswahl","pflicht":true,"optionen":["Ja","Nein"],"hinweis":"Nur nach Auswertung aller Abfragen beantworten."}]},{"id":"biometrie","titel":"Biometrie","icon":"touchid","beschreibung":"Erkennungsdienstliche Behandlung und Eurodac-Erfassung.","felder":[{"id":"ed","label":"ED-Behandlung durchgeführt?","typ":"auswahl","pflicht":true,"optionen":["Ja","Nein"]},{"id":"eurodac","label":"Eurodac-Erfassung (Fingerabdrücke + Gesichtsbild)","typ":"auswahl","pflicht":true,"optionen":["Erfolgt","Nicht erfolgt","Nicht zulässig (unter 6 Jahre)"]},{"id":"biometrie_zeit","label":"Zeitpunkt der Erfassung","typ":"datumzeit"},{"id":"biometrie_bemerkung","label":"Bemerkungen (z. B. Verweigerung, Verletzungen der Fingerkuppen)","typ":"mehrzeilig"}]},{"id":"gesundheit","titel":"Gesundheit & Vulnerabilität","icon":"cross.case","beschreibung":"Vorläufige Gesundheitskontrolle veranlassen, Schutzbedürftigkeit erkennen.","felder":[{"id":"gesundheitsbehoerde","label":"Informierte Gesundheitsbehörde","typ":"text","pflicht":true},{"id":"gesundheit_zeit","label":"Informiert am (Datum, Uhrzeit)","typ":"datumzeit","pflicht":true},{"id":"beschwerden","label":"Erkennbare Beschwerden / Angaben zur Gesundheit","typ":"mehrzeilig","hinweis":"Nur Beobachtungen und Angaben – keine eigene Diagnose."},{"id":"vulnerabilitaet","label":"Hinweise auf besondere Schutzbedürftigkeit","typ":"mehrfach","pflicht":true,"optionen":["Keine erkennbar","Unbegleitete:r Minderjährige:r","Begleitete:r Minderjährige:r","Schwangerschaft","Behinderung","Ältere Person","Schwere Erkrankung / psychische Störung","Opfer von Folter / Gewalt","Hinweise auf Menschenhandel"]},{"id":"vulnerabilitaet_details","label":"Beobachtungen zur Schutzbedürftigkeit","typ":"mehrzeilig"},{"id":"jugendamt","label":"Jugendamt informiert (Stelle, Zeit, Ansprechperson)","typ":"text","bedingung":{"feld":"vulnerabilitaet","wert":"Unbegleitete:r Minderjährige:r"}}]},{"id":"schutz","titel":"Schutzersuchen","icon":"hand.raised","beschreibung":"Hat die Person um Schutz / Asyl gebeten?","felder":[{"id":"asyl","label":"Schutzersuchen geäußert?","typ":"auswahl","pflicht":true,"optionen":["Ja","Nein"]},{"id":"asyl_wortlaut","label":"Wortlaut (wörtlich, in der verwendeten Sprache)","typ":"mehrzeilig","pflicht":true,"bedingung":{"feld":"asyl","wert":"Ja"}},{"id":"asyl_zeit","label":"Zeitpunkt der Äußerung","typ":"datumzeit","pflicht":true,"bedingung":{"feld":"asyl","wert":"Ja"}}]},{"id":"festhalten","titel":"Festhalten","icon":"lock.shield","beschreibung":"Festhalten nur, wenn die Überprüfung sonst nicht oder nur unter erheblichen Schwierigkeiten möglich ist (§ 15b AufenthG). Dann unverzüglich die richterliche Entscheidung herbeiführen. Festhalten beenden, sobald Identität, Fingerabdrücke und Sicherheitskontrolle erledigt sind und keine Rückführung oder Überstellung zu sichern ist (§ 15b Abs. 3). Minderjährige grundsätzlich nicht in Überprüfungshaft (§ 15b Abs. 2 Satz 4 AufenthG i. V. m. § 70a AsylG).","felder":[{"id":"festgehalten","label":"Wird die Person festgehalten?","typ":"auswahl","pflicht":true,"optionen":["Ja","Nein"]},{"id":"festhalten_beginn","label":"Beginn des Festhaltens","typ":"datumzeit","pflicht":true,"bedingung":{"feld":"festgehalten","wert":"Ja"}},{"id":"festhalten_grund","label":"Warum ist die Überprüfung ohne Festhalten nicht möglich?","typ":"mehrzeilig","pflicht":true,"bedingung":{"feld":"festgehalten","wert":"Ja"},"hinweis":"Konkrete Tatsachen, z. B. keine Unterkunft, Fluchtverhalten, fehlende Mitwirkung."},{"id":"milderes_mittel","label":"Geprüfte mildere Mittel und warum sie nicht ausreichen","typ":"mehrzeilig","pflicht":true,"bedingung":{"feld": "mitwirkung_begruendung","label":"Begründung (fehlende Mitwirkung)","typ":"mehrzeilig","pflicht":true,"bedingung":{"feld":"mitwirkung","wert":"Nein"}},{"id":"uebergabe_an","label":"Übergeben an (Stelle, Name)","typ":"text","pflicht":true},{"id":"uebergabe_zeit","label":"Übergabe der Person (Zeit)","typ":"datumzeit","pflicht":true},{"id":"sichergestellt","label":"Sichergestellte / übergebene Gegenstände und Dokumente","typ":"mehrzeilig"},{"id":"bemerkungen","label":"Sonstige Bemerkungen","typ":"mehrzeilig"}]}]},"dokumente":[{"id":"formular","titel":"Überprüfungsformular","untertitel":"Angaben nach Art. 17 Screening-VO – Arbeitsentwurf","icon":"doc.text.fill","beschreibung":"Alle Angaben nach Art. 17 Screening-VO, gegliedert wie die Verordnung. Maßgeblich ist das amtliche Formular.","pflichtfelder":["vorgang","dienststelle","sachbearbeiter","aufgriff_zeit","aufgriff_ort","name","vorname","geburtsdatum","geschlecht","staatsangehoerigkeit","sprachen","wohnsitzlaender","angaben_quelle","dokumente","ausgangsstaat","reiseweg","grund","schleusung","familie_eu","ed","eurodac","gesundheitsbehoerde","vulnerabilitaet","asyl","mitwirkung","weiterleitung"],"abschnitte":[{"titel":"","text":"**Hinweis:** Arbeitsentwurf zur Vorbereitung. Maßgeblich sind das amtliche Überprüfungsformular und die Vorgaben der Dienststelle zur Befüllung und Übermittlung. Ergebnisse der Sicherheitskontrolle stehen in der separaten internen Anlage.\n\n| Vorgangsnummer | {{vorgang}}\n| AZR-Nummer | {{azr_nummer}}\n| Dienststelle | {{dienststelle}}\n| Sachbearbeitung | {{sachbearbeiter}} ({{erreichbarkeit}})"},{"titel":"1. Angaben zur Überprüfung","text":"| Zeitpunkt | {{aufgriff_zeit}}\n| Ort | {{aufgriff_ort}}\n| Anlass | {{anlass}}\n| Rechtsgrundlage | Art. 7 VO (EU) 2024/1356, § 15b AufenthG"},{"titel":"2. Angaben zur Person (Art. 17 Abs. 1 Buchst. a, b)","text":"| Familienname | {{name}}\n| Vorname(n) | {{vorname}}\n| Geburtsdatum | {{geburtsdatum}}\n| Geschlecht | {{geschlecht}}\n| Staatsangehörigkeit | {{staatsangehoerigkeit}}\n| Geburtsort | {{geburtsort}}\n| Weitere Personalien / Aliase | {{alias}}\n| Sprachkenntnisse | {{sprachen}}\n| Wohnsitzstaaten vor der Ankunft | {{wohnsitzlaender}}\n| Angaben beruhen auf | {{angaben_quelle}}"},{"titel":"3. Vorläufige Gesundheits- und Vulnerabilitätsprüfung (Art. 12)","text":"| Gesundheitsbehörde | {{gesundheitsbehoerde}}\n| Informiert am | {{gesundheit_zeit}}\n| Beobachtungen | {{beschwerden}}\n| Hinweise auf Schutzbedürftigkeit | {{vulnerabilitaet}}\n| Beobachtungen | {{vulnerabilitaet_details}}\n| Jugendamt | {{jugendamt}}"},{"titel":"4. Weitere verfahrensrelevante Angaben","text":"| Antrag auf internationalen Schutz | {{asyl}}\n| Wortlaut | {{asyl_wortlaut}}\n| Familienangehörige in einem Mitgliedstaat | {{familie_eu}}\n| Einzelheiten | {{familie_eu_details}}\n| Mitwirkung (Art. 9) erfüllt | {{mitwirkung}}\n| Begründung | {{mitwirkung_begruendung}}\n| Information nach Art. 11 erteilt | {{info_art11}}\n| Sprachmittlung | {{dolmetscher}}"},{"titel":"5. Einreise und Reiseweg (Art. 17 Abs. 1 Buchst. c, d, e)","text":"| Gründe für Ankunft / unerlaubte Einreise | {{grund}}\n| Einreise (ca.) | {{einreise_datum}}\n| Ort des Grenzübertritts | {{einreise_ort}}\n| Ausgangsstaat | {{ausgangsstaat}}\n| Reiseweg, Transitstaaten | {{reiseweg}}\n| Hinweise auf Schleusung | {{schleusung}}\n| Einzelheiten | {{schleusung_details}}"},{"titel":"6. Ergänzende Angaben","text":"| Drittstaaten mit möglichem Schutzantrag / Schutz | {{asyl_drittstaaten}}\n| Beabsichtigtes Ziel in der EU | {{ziel_eu}}\n| Mitgeführte Reise- und Identitätsdokumente | {{dokumente}}\n| Dokumentenangaben (Art, Nummer, Staat) | {{dokument_details}}"},{"titel":"7. Biometrie und Ergebnis","text":"| ED-Behandlung | {{ed}}\n| Eurodac | {{eurodac}}\n| Zeitpunkt | {{biometrie_zeit}}\n| Festgehalten | {{festgehalten}}\n| Weiterleitung | {{weiterleitung}}\n| Übergeben an | {{uebergabe_an}}\n| Zeitpunkt | {{uebergabe_zeit}}\n| Screening endet spätestens | {{frist_screening}}\n| Bemerkungen | {{bemerkungen}}\n\nLeipzig, {{heute}}\n\n\n______________________________\n{{sachbearbeiter}}"}]},{"id":"sicherheit","titel":"Anlage: Sicherheitskontrolle","untertitel":"Art. 15 Screening-VO – nur für den Dienstgebrauch, nicht aushändigen","icon":"lock.shield","beschreibung":"Ergebnisse der Datenbankabfragen. Getrennt vom Formular, damit sie nicht an die Person gelangen.","pflichtfelder":["vorgang","name","vorname","abfrage_inpol","abfrage_azr","abfrage_sis","abfrage_eurodac","abfrage_ees","abfrage_vis","sicherheit_anhaltspunkte"],"abschnitte":[{"titel":"","text":"**Diese Anlage darf der Person nicht ausgehändigt werden.**\n\n| Vorgangsnummer | {{vorgang}}\n| AZR-Nummer | {{azr_nummer}}\n| Dienststelle | {{dienststelle}}\n| Sachbearbeitung | {{sachbearbeiter}} ({{erreichbarkeit}})\n| Person | {{name}}, {{vorname}}, geb. {{geburtsdatum}}"},{"titel":"Abfragen","text":"| INPOL | {{abfrage_inpol}}\n| AZR | {{abfrage_azr}}\n| SIS | {{abfrage_sis}}\n| Eurodac / Fast-ID | {{abfrage_eurodac}}\n| EES | {{abfrage_ees}}\n| VIS | {{abfrage_vis}}\n| Weitere Abfragen | {{abfrage_weitere}}"},{"titel":"Ergebnis","text":"| Treffer und Erkenntnisse | {{treffer_details}}\n| Anhaltspunkte für eine Gefahr für die innere Sicherheit | {{sicherheit_anhaltspunkte}}\n\nLeipzig, {{heute}}\n\n\n______________________________\n{{sachbearbeiter}}"}]},{"id":"belehrung","titel":"Information zur Überprüfung","untertitel":"Art. 11 Screening-VO – Deutsch / English, zum Aushändigen","icon":"text.bubble.fill","beschreibung":"Information der Person nach Art. 11 Screening-VO und Hinweis auf die Mitwirkungspflicht (Art. 9), zweisprachig.","pflichtfelder":["name","vorname","aufgriff_zeit","sprachen"],"abschnitte":[{"titel":"Information über die Überprüfung (Screening)","text":"| Name | {{name}}, {{vorname}}\n| Datum / Uhrzeit | {{aufgriff_zeit}}\n| Sprachmittlung | {{dolmetscher}}"},{"titel":"Deutsch","text":"**Zweck und Dauer.** Sie werden nach Art. 7 der Verordnung (EU) 2024/1356 und § 15b Aufenthaltsgesetz überprüft (Screening). Damit wird festgestellt, wer Sie sind und welches Verfahren für Sie gilt. Die Überprüfung dauert höchstens drei Tage.\n\n**Ablauf.** Ihre Identität wird festgestellt; Ihre Angaben und Dokumente werden mit Datenbanken abgeglichen (Sicherheitskontrolle). Ihre Fingerabdrücke und ein Gesichtsbild werden aufgenommen und in Eurodac gespeichert. Eine Gesundheitsbehörde führt eine vorläufige Gesundheitskontrolle durch. Es wird geprüft, ob Sie besonderen Schutz oder besondere Unterstützung benötigen.\n\n**Ihre Pflichten.** Sie müssen während der Überprüfung für die Behörden erreichbar bleiben, mitwirken, wahrheitsgemäße Angaben machen und die Aufnahme Ihrer biometrischen Daten dulden (Art. 9 Screening-VO).\n\n**Ihre Rechte.** Sie können **jederzeit einen Antrag auf internationalen Schutz (Asyl)** stellen. Werden Sie festgehalten, wird unverzüglich eine richterliche Entscheidung herbeigeführt. Ordnet das Gericht die Fortdauer nicht bis zum Ende des folgenden Tages an, werden Sie freigelassen. Sie können einen Rechtsbeistand und auf Wunsch Ihr Konsulat benachrichtigen. Sie können Angaben im Überprüfungsformular widersprechen.\n\n**Nach der Überprüfung.** Sie werden an die zuständige Stelle weitergeleitet: in ein Asylverfahren, wenn Sie Schutz beantragen, oder in ein Rückkehrverfahren, wenn Sie kein Recht auf Aufenthalt haben. Wer die Voraussetzungen für Einreise und Aufenthalt nicht erfüllt, ist zur Ausreise verpflichtet.\n\n**Datenschutz.** Ihre Daten werden für die Überprüfung und die anschließenden Verfahren verarbeitet. Sie haben das Recht auf Auskunft, Berichtigung und Löschung nach den geltenden Datenschutzvorschriften."},{"titel":"English","text":"**Purpose and duration.** You are being screened under Article 7 of Regulation (EU) 2024/1356 and Section 15b of the German Residence Act. The screening establishes your identity and the procedure that applies to you. It lasts no longer than three days.\n\n**Steps.** Your identity is established; your data and documents are checked against databases (security check). Your fingerprints and a facial image are taken and stored in Eurodac. A health authority carries out a preliminary health check. It is checked whether you need special protection or support.\n\n**Your obligations.** During the screening you must remain available to the authorities, cooperate, provide truthful information and allow your biometric data to be taken (Article 9 of the Screening Regulation).\n\n**Your rights.** You may **apply for international protection (asylum) at any time**. If you are held, a court decision will be sought without delay. If the court has not ordered your continued detention by the end of the following day, you will be released. You may contact a lawyer and, if you wish, your consulate. You may object to information in the screening form.\n\n**After the screening.** You will be referred to the competent authority: to an asylum procedure if you apply for protection, or to a return procedure if you have no right to stay. Anyone who does not fulfil the conditions for entry and stay is obliged to leave.\n\n**Data protection.** Your data are processed for the screening and the subsequent procedures. You have the right of access, rectification and erasure under the applicable data protection rules."},{"titel":"Bestätigung / Confirmation","text":"Die Information wurde mir in einer Sprache erläutert, die ich verstehe. / This information was explained to me in a language I understand.\n\nSprache / Language: {{sprachen}}\n\n\n______________________________          ______________________________\nUnterschrift / Signature                           Sprachmittler:in / Interpreter\n\n\n______________________________\nInformierende:r Beamt:in ({{sachbearbeiter}}), {{heute}}\n\nUnterschrift verweigert: ☐"}]},{"id":"festhalten","titel":"Festhalten & Antrag auf Überprüfungshaft","untertitel":"§ 15b Abs. 1, 2 AufenthG, Art. 104 GG","icon":"building.columns.fill","beschreibung":"Vermerk über das Festhalten und Antrag auf richterliche Anordnung der Überprüfungshaft.","bedingung":{"feld":"festgehalten","wert":"Ja"},"pflichtfelder":["vorgang","dienststelle","sachbearbeiter","name","vorname","geburtsdatum","staatsangehoerigkeit","aufgriff_zeit","festhalten_beginn","festhalten_grund","milderes_mittel","fluchtgefahr","unterbringung","gericht"],"abschnitte":[{"titel":"","text":"An das {{gericht}}\n– Bereitschaftsdienst –\n\n| Vorgangsnummer | {{vorgang}}\n| Dienststelle | {{dienststelle}}\n| Sachbearbeitung | {{sachbearbeiter}} ({{erreichbarkeit}})"},{"titel":"Antrag auf Anordnung der Überprüfungshaft (§ 15b Abs. 1 Satz 2, Abs. 2 AufenthG)","text":"Es wird beantragt, gegen die nachstehend bezeichnete Person zur Sicherstellung der Überprüfung nach Art. 7 Abs. 1 VO (EU) 2024/1356 Überprüfungshaft nach § 15b Abs. 2 Satz 1 AufenthG bis längstens {{frist_screening}} anzuordnen.\n\n| Familienname | {{name}}\n| Vorname(n) | {{vorname}}\n| Geburtsdatum | {{geburtsdatum}}\n| Geschlecht | {{geschlecht}}\n| Staatsangehörigkeit | {{staatsangehoerigkeit}}"},{"titel":"Sachverhalt","text":"Die Person wurde am {{aufgriff_zeit}} in {{aufgriff_ort}} angetroffen (Anlass: {{anlass}}). Ein Aufenthaltsnachweis lag nicht vor. Hinweise auf eine Kontrolle an einer Außengrenze oder eine bereits erfolgte Überprüfung ergaben sich nicht.\n\n| Abfrage INPOL | {{abfrage_inpol}}\n| Abfrage AZR | {{abfrage_azr}}\n| Abfrage SIS | {{abfrage_sis}}\n| Eurodac / Fast-ID | {{abfrage_eurodac}}\n| Erkenntnisse | {{treffer_details}}"},{"titel":"Begründung","text":"Die Überprüfung kann ohne Festhalten nicht oder nur unter erheblichen Schwierigkeiten durchgeführt werden:\n\n{{festhalten_grund}}\n\nDie Überprüfungshaft ist zur ordnungsgemäßen Durchführung der Überprüfung erforderlich. Es besteht die Gefahr, dass die Person vom Ort der Überprüfung flieht (§ 15b Abs. 2 Satz 1 AufenthG):\n\n{{fluchtgefahr}}\n\n**Mildere Mittel:** {{milderes_mittel}}\n\n| Beginn des Festhaltens | {{festhalten_beginn}}\n| Ort des Festhaltens | {{unterbringung}}\n| Ohne richterliche Anordnung Freilassung spätestens | {{frist_richter}}\n| Höchstdauer der Überprüfung bis | {{frist_screening}}\n| Schutzersuchen | {{asyl}}\n| Hinweise Schutzbedürftigkeit | {{vulnerabilitaet}}\n| Benachrichtigungen | {{benachrichtigung}}\n| Sprachmittlung | {{dolmetscher}}\n\nWird die Fortdauer nicht bis zum Ende des Tages nach dem Ergreifen richterlich angeordnet, wird die Person freigelassen.\n\nLeipzig, {{heute}}\n\n\n______________________________\n{{sachbearbeiter}}"}]},{"id":"asyl","titel":"Vermerk Schutzersuchen","untertitel":"Weiterleitung an Aufnahmeeinrichtung / BAMF","icon":"hand.raised.fill","beschreibung":"Wörtliche Dokumentation des Asylgesuchs.","bedingung":{"feld":"asyl","wert":"Ja"},"pflichtfelder":["vorgang","name","vorname","geburtsdatum","staatsangehoerigkeit","asyl_wortlaut","asyl_zeit"],"abschnitte":[{"titel":"","text":"| Vorgangsnummer | {{vorgang}}\n| Dienststelle | {{dienststelle}}\n| Sachbearbeitung | {{sachbearbeiter}} ({{erreichbarkeit}})"},{"titel":"Vermerk über ein Schutzersuchen","text":"| Familienname | {{name}}\n| Vorname(n) | {{vorname}}\n| Geburtsdatum | {{geburtsdatum}}\n| Geschlecht | {{geschlecht}}\n| Staatsangehörigkeit | {{staatsangehoerigkeit}}\n| Sprachen | {{sprachen}}\n| Sprachmittlung | {{dolmetscher}}"},{"titel":"Äußerung","text":"Am {{asyl_zeit}} äußerte die Person im Rahmen der Überprüfung wörtlich:\n\n„{{asyl_wortlaut}}“\n\nDie Äußerung wird als Antrag auf internationalen Schutz (Stellen des Antrags) behandelt. Die Person wurde über das weitere Verfahren informiert. Das Screening wird fortgesetzt; die Weiterleitung an die zuständige Aufnahmeeinrichtung bzw. das BAMF wird veranlasst.\n\n| Hinweise Schutzbedürftigkeit | {{vulnerabilitaet}}\n| ED-Behandlung | {{ed}}\n| Eurodac | {{eurodac}}\n\nLeipzig, {{heute}}\n\n\n______________________________\n{{sachbearbeiter}}"}]},{"id":"gesundheit","titel":"Mitteilung Gesundheitsbehörde","untertitel":"Vorläufige Gesundheitskontrolle","icon":"cross.case.fill","beschreibung":"Veranlassung der vorläufigen Gesundheitskontrolle.","pflichtfelder":["vorgang","dienststelle","sachbearbeiter","gesundheitsbehoerde","gesundheit_zeit","name","vorname","geburtsdatum"],"abschnitte":[{"titel":"","text":"An: {{gesundheitsbehoerde}}\n\n| Vorgangsnummer | {{vorgang}}\n| Dienststelle | {{dienststelle}}\n| Sachbearbeitung | {{sachbearbeiter}} ({{erreichbarkeit}})"},{"titel":"Ersuchen um vorläufige Gesundheitskontrolle im Rahmen des Screenings","text":"Im Rahmen einer Überprüfung nach Art. 7 VO (EU) 2024/1356 wird um die vorläufige Gesundheitskontrolle folgender Person gebeten:\n\n| Familienname | {{name}}\n| Vorname(n) | {{vorname}}\n| Geburtsdatum | {{geburtsdatum}}\n| Geschlecht | {{geschlecht}}\n| Staatsangehörigkeit | {{staatsangehoerigkeit}}\n| Sprachen | {{sprachen}}\n| Aufenthaltsort | {{unterbringung}}\n| Informiert am | {{gesundheit_zeit}}"},{"titel":"Beobachtungen der Polizei (keine Diagnose)","text":"{{beschwerden}}\n\n| Hinweise Schutzbedürftigkeit | {{vulnerabilitaet}}\n| Beobachtungen | {{vulnerabilitaet_details}}\n| Screening endet spätestens | {{frist_screening}}\n\nLeipzig, {{heute}}\n\n\n______________________________\n{{sachbearbeiter}}"}]},{"id":"vulnerabilitaet","titel":"Vermerk Schutzbedürftigkeit","untertitel":"Mitteilung Jugendamt / Fachstelle","icon":"figure.and.child.holdinghands","beschreibung":"Dokumentation erkennbarer Vulnerabilität für die weiteren Stellen.","bedingung":{"feld":"vulnerabilitaet","wert":"!Keine erkennbar"},"pflichtfelder":["vorgang","name","vorname","geburtsdatum","vulnerabilitaet","vulnerabilitaet_details"],"abschnitte":[{"titel":"","text":"| Vorgangsnummer | {{vorgang}}\n| Dienststelle | {{dienststelle}}\n| Sachbearbeitung | {{sachbearbeiter}} ({{erreichbarkeit}})"},{"titel":"Vorläufige Vulnerabilitätsprüfung","text":"| Familienname | {{name}}\n| Vorname(n) | {{vorname}}\n| Geburtsdatum | {{geburtsdatum}}\n| Geschlecht | {{geschlecht}}\n| Staatsangehörigkeit | {{staatsangehoerigkeit}}\n| Hinweise | {{vulnerabilitaet}}\n| Jugendamt | {{jugendamt}}"},{"titel":"Beobachtungen","text":"{{vulnerabilitaet_details}}\n\n**Gesundheit:** {{beschwerden}}\n\nDie Hinweise wurden im Überprüfungsformular vermerkt und werden an die aufnehmende Stelle weitergegeben. Bei Minderjährigen erfolgt die Überprüfung kindgerecht und in Anwesenheit eines Vertreters.\n\nLeipzig, {{heute}}\n\n\n______________________________\n{{sachbearbeiter}}"}]},{"id":"abschluss","titel":"Abschluss- und Übergabevermerk","untertitel":"Ende des Screenings","icon":"checkmark.seal.fill","beschreibung":"Ergebnis, Weiterleitung, Übergabe und sichergestellte Gegenstände.","pflichtfelder":["vorgang","name","vorname","weiterleitung","uebergabe_an","uebergabe_zeit"],"abschnitte":[{"titel":"","text":"| Vorgangsnummer | {{vorgang}}\n| Dienststelle | {{dienststelle}}\n| Sachbearbeitung | {{sachbearbeiter}} ({{erreichbarkeit}})"},{"titel":"Abschluss der Überprüfung","text":"| Familienname | {{name}}\n| Vorname(n) | {{vorname}}\n| Geburtsdatum | {{geburtsdatum}}\n| Geschlecht | {{geschlecht}}\n| Staatsangehörigkeit | {{staatsangehoerigkeit}}\n| Beginn (Aufgriff) | {{aufgriff_zeit}}\n| Ende / Übergabe | {{uebergabe_zeit}}\n| Höchstdauer bis | {{frist_screening}}"},{"titel":"Ergebnis","text":"| Weiterleitung | {{weiterleitung}}\n| Übergeben an | {{uebergabe_an}}\n| Schutzersuchen | {{asyl}}\n| Eurodac | {{eurodac}}\n| Gesundheitskontrolle veranlasst bei | {{gesundheitsbehoerde}}\n| Schutzbedürftigkeit | {{vulnerabilitaet}}\n| Sichergestellte / übergebene Gegenstände | {{sichergestellt}}\n| Bemerkungen | {{bemerkungen}}\n\nÜbernommen:\n\n\n______________________________\n{{uebergabe_an}}\n\nLeipzig, {{heute}}\n\n\n______________________________\n{{sachbearbeiter}}"}]},{"id":"fristen","titel":"Fristenblatt","untertitel":"Alle Fristen auf einen Blick","icon":"clock.fill","beschreibung":"Automatisch berechnete Fristen ab Aufgriff.","pflichtfelder":["aufgriff_zeit"],"abschnitte":[{"titel":"","text":"| Vorgangsnummer | {{vorgang}}\n| Dienststelle | {{dienststelle}}\n| Sachbearbeitung | {{sachbearbeiter}} ({{erreichbarkeit}})\n| Person | {{name}}, {{vorname}}"},{"titel":"Fristen","text":"| Aufgriff | {{aufgriff_zeit}}\n| Festhalten seit | {{festhalten_beginn}}\n| Richterliche Entscheidung spätestens | {{frist_richter}}\n| Screening abgeschlossen spätestens | {{frist_screening}}\n\n**Ohne richterliche Entscheidung bis zum Ende des Tages nach dem Ergreifen ist die Person freizulassen.**\n\nHilfsrechnung ohne Gewähr – im Zweifel gilt die frühere Frist."}]}]}</script>
<script>
"use strict";
// Unveränderter Quelltext beim Laden – Grundlage für „Neue Fassung speichern“ (Verwaltung)
const QUELLTEXT = "<!doctype html>\n" + document.documentElement.outerHTML;
const C = JSON.parse(document.getElementById("content").textContent);
// Einstellungen (Anschriften, Postfächer …): Platzhalter {{e:schluessel}} in allen Texten ersetzen. Lokale Anpassungen (Verwaltung) haben Vorrang.
const ANPASSUNG_KEY = "geas.intern.anpassung.v1";
const ANPASSUNG = (() => { try { return JSON.parse(localStorage.getItem(ANPASSUNG_KEY) || "{}"); } catch (e) { return {}; } })();
const EINST = Object.fromEntries((C.einstellungen || []).map(e => [e.id, (ANPASSUNG.einstellungen || {})[e.id] ?? e.wert]));
if (ANPASSUNG.weisungen) C.weisungen = ANPASSUNG.weisungen;
(function ersetzen(o) {
  for (const k of Object.keys(o)) {
    if (k === "vorlagen_eingebaut" || k === "logo" || k === "stern" || k === "bild") continue;
    const v = o[k];
    if (typeof v === "string") { if (v.includes("{{e:")) o[k] = v.replace(/\{\{e:([\w-]+)\}\}/g, (m, id) => EINST[id] ?? m); }
    else if (v && typeof v === "object") ersetzen(v);
  }
})(C);
const POL = C.meta.theme === "polizei";
if (C.meta.copyright) { const m = document.createElement("meta"); m.name = "author"; m.content = C.meta.copyright; document.head.appendChild(m); }
if (POL) {
  document.documentElement.classList.add("polizei");
  document.querySelector('meta[name="theme-color"]').content = "#002664";
  document.title = C.meta.titel || document.title;
}

// ================= Speicher =================
const KEY = C.intern ? "geas.intern.progress.v1" : "geas.progress.v1";
const S = (() => {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  s.gelesen ||= []; s.quiz ||= {}; s.checklisten ||= {}; s.karten ||= []; s.modus ||= "alltag";
  return s;
})();

const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
function rich(text) {
  let html = "", list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (!line) { close(); continue; }
    let m;
    if (line.startsWith("• ")) {
      if (list !== "ul") { close(); html += "<ul>"; list = "ul"; }
      html += `<li>${inline(line.slice(2))}</li>`;
    } else if ((m = line.match(/^(\d+)\.\s(.*)$/))) {
      if (list !== "ol") { close(); html += `<ol start="${m[1]}">`; list = "ol"; }
      html += `<li>${inline(m[2])}</li>`;
    } else { close(); html += `<p>${inline(line)}</p>`; }
  }
  close();
  return html;
}

function uebergang(richtung, fn) {
  const html = document.documentElement;
  if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    html.classList.add(richtung === "back" ? "vt-back" : "vt-fwd");
    const t = document.startViewTransition(() => fn(false));
    t.finished.finally(() => html.classList.remove("vt-fwd", "vt-back"));
  } else fn(true, richtung);
}
function go(view, push = true) {
  uebergang(push ? "fwd" : "fade", animiert => {
    if (push) stack.push(view); else stack = [view];
    render(animiert ? (push ? "enter-fwd" : "enter-fade") : "");
  });
}
function zurueck() {
  if (stack.length < 2) return;
  uebergang("back", animiert => { stack.pop(); render(animiert ? "enter-back" : ""); });
}
backBtn.onclick = zurueck;
function render(anim = "", scroll = true) {
  const v = stack[stack.length - 1];
  BEREICH_NEU = undefined;
  const out = v();
  if (BEREICH_NEU !== undefined) BEREICH = BEREICH_NEU; else if (stack.length <= 1) BEREICH = null;
  if (BEREICH && S.bereich !== BEREICH) { S.bereich = BEREICH; save(); }
  heroView = !!out.hero;
  backBtn.hidden = stack.length <= 1;
  titleEl.textContent = out.title;
  topEl.classList.toggle("plain", !heroView);
  app.className = anim;
  app.innerHTML = out.hero ? out.html : `<div class="pad">${bereichsband()}${out.html}</div>`;
  out.bind && out.bind();
  const bbW = document.getElementById("bbW"); if (bbW) bbW.onclick = () => { vibrate(); zeigeTab("start"); };

  beobachten();

}

// Parallax & Kopfleiste
function onScroll() {
  const y = window.scrollY;
  const hero = app.querySelector(".hero");
  if (hero) {
    const inner = hero.querySelector(".inner"), d1 = hero.querySelector(".deco1"), d2 = hero.querySelector(".deco2");
    const h = hero.offsetHeight;
    inner.style.transform = `translateY(${y * 0.35}px)`;
    inner.style.opacity = Math.max(0, 1 - y / (h * 0.7));
    if (d1) d1.style.transform = `translateY(${y * 0.2}px)`;
    if (d2) d2.style.transform = `translateY(${y * -0.12}px)`;
    topEl.classList.toggle("solid", y > h - 90);
  } else {
    topEl.classList.toggle("solid", y > 4);
  }

// ================= Fristen =================
const fmtDatum = d => d.toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) + " Uhr";
const lokalISO = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
const richterFrist = a => new Date(a.getFullYear(), a.getMonth(), a.getDate() + 1, 23, 59);
// Fristberechnung nach Art. 3 VO (EWG, Euratom) Nr. 1182/71 mit den gesetzlichen Feiertagen in Sachsen (Art. 2 Abs. 1)
const ostersonntag = j => { const a = j % 19, b = Math.floor(j / 100), c = j % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), monat = Math.floor((h + l - 7 * m + 114) / 31), tag = ((h + l - 7 * m + 114) % 31) + 1; return new Date(j, monat - 1, tag); };
const FEIERTAGE = {};
const feiertageSachsen = j => FEIERTAGE[j] || (FEIERTAGE[j] = (() => {
  const o = ostersonntag(j), os = n => new Date(j, o.getMonth(), o.getDate() + n);
  const bb = new Date(j, 10, 22); while (bb.getDay() !== 3) bb.setDate(bb.getDate() - 1); // Buß- und Bettag: Mittwoch vor dem 23. November
  return Object.fromEntries([[new Date(j, 0, 1), "Neujahr"], [os(-2), "Karfreitag"], [os(1), "Ostermontag"], [new Date(j, 4, 1), "1. Mai"], [os(39), "Christi Himmelfahrt"], [os(50), "Pfingstmontag"], [new Date(j, 9, 3), "Tag der Deutschen Einheit"], [new Date(j, 9, 31), "Reformationstag"], [bb, "Buß- und Bettag"], [new Date(j, 11, 25), "1. Weihnachtstag"], [new Date(j, 11, 26), "2. Weihnachtstag"]].map(([d, n]) => [d.toDateString(), n]));
})());
const feiertag = d => feiertageSachsen(d.getFullYear())[d.toDateString()];
const arbeitstag = d => d.getDay() !== 0 && d.getDay() !== 6 && !feiertag(d);
const WTAG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
// Inland: 3 Tage (Art. 8 Abs. 4 Screening-VO). Tag des Aufgriffs zählt nicht (Art. 3 Abs. 1 UAbs. 2), Ende mit Ablauf des letzten Tages (Abs. 2 Buchst. b),
// Ende an Sa/So/Feiertag → Ablauf des folgenden Arbeitstags (Abs. 4), mindestens zwei Arbeitstage (Abs. 5).
function screeningFristInfo(a) {
  const tag = n => new Date(a.getFullYear(), a.getMonth(), a.getDate() + n);
  const tage = n => Array.from({ length: n }, (_, i) => tag(i + 1)).filter(arbeitstag).length;
  let n = 3; const grund = [];
  if (!arbeitstag(tag(n))) { const d = tag(n); while (!arbeitstag(tag(n))) n++; grund.push(`regulär ${WTAG[d.getDay()]}${feiertag(d) ? ` (${feiertag(d)})` : ""} → nächster Arbeitstag`); }
  if (tage(n) < 2) { do n++; while (!arbeitstag(tag(n)) || tage(n) < 2); grund.push("verlängert auf mindestens zwei Arbeitstage"); }
  const ende = tag(n); ende.setHours(23, 59);

}
const screeningFrist = a => screeningFristInfo(a).ende;

          if (F) { if (!F.werte.screening_fall || F.screeningAusPruefung || confirm(`Im gespeicherten Fall steht „${F.werte.screening_fall}“. Auf „Aufgriff ohne Screening“ ändern?`)) pruefungUebernehmen("nein"); }

        };
        const wEnde = $("wEnde"); if (wEnde) wEnde.onclick = () => {
          if (F && !confirm("Einsatz beenden? Der angelegte Fall wird gelöscht – vorher ggf. Unterlagen im Vorgang ablegen.")) return;
          vibrate(); fallUndEinsatzZuruecksetzen(); zeigeTab("start");
        };
        $("wn").onclick = neu;
      }
    };
  };
  function bind() {
    app.querySelectorAll("[data-w]").forEach(el => el.onclick = () => {
      vibrate();
      const i = +el.dataset.w;
      schritt("fwd", () => { verlauf.push({ id: aktuell, antwort: i }); aktuell = SP.knoten[aktuell].antworten[i].ziel; erledigt = new Set(); });
    });

// ================= Unterlagen-Assistent =================
const FELDER = Object.fromEntries(C.fall.schritte.flatMap(s => s.felder).map(f => [f.id, f]));
const TRENNER = "; ";
// Ausgeblendete Felder (Bedingung nicht erfüllt) zählen als leer – auch in Formularen, Fristen und Kettenbedingungen
const wert = id => { const v = (F && F.werte[id]) || ""; if (!v) return ""; const f = FELDER[id]; return f && f.bedingung && !erfuellt(f.bedingung) ? "" : v; };
const auswahl = id => wert(id).split(TRENNER).filter(Boolean);
function setze(id, v) { if (!F) return; if (v) F.werte[id] = v; else delete F.werte[id]; fallSpeichern(); }
function erfuellt(b) {
  if (!b) return true;
  const l = auswahl(b.feld);
  if (b.wert.startsWith("!")) return l.length > 0 && !l.includes(b.wert.slice(1));
  if (b.wert.startsWith("~")) return !l.includes(b.wert.slice(1));   // sichtbar, solange nicht dieser Wert gewählt ist
  return l.includes(b.wert);
}
const sichtbar = f => erfuellt(f.bedingung);
const leer = id => !wert(id).trim();
const offenIn = s => s.felder.filter(f => f.pflicht && sichtbar(f) && leer(f.id));
const offenDok = d => d.pflichtfelder.map(id => FELDER[id]).filter(f => f && sichtbar(f) && leer(f.id));
const relevant = d => erfuellt(d.bedingung);
const istUma = () => wert("uma") === "Ja" || auswahl("vulnerabilitaet").includes("Unbegleitete:r Minderjährige:r");
// Screening-Fall? Angabe im Fall, sonst Ergebnis der Prüfung im geführten Einsatz – ohne Angabe gilt: Screening
const istScreening = () => { const w = wert("screening_fall"); if (w) return !w.startsWith("Nein"); return !(S.einsatz && S.einsatz.pruefung === "nein"); };
// Ergebnis der Screening-Prüfung in den Fall übernehmen, damit „Screening-Fall?“ nicht noch einmal gefragt wird
const SF_JA = "Ja – Screening durch die Landespolizei", SF_NEIN = "Nein – Aufgriff ohne Screening";
function pruefungUebernehmen(antwort) {
  if (!F || !C.intern || !antwort) return;
  F.werte.screening_fall = antwort === "nein" ? SF_NEIN : SF_JA; F.screeningAusPruefung = true; fallSpeichern();
}
function bekannteAntwort() {
  if (S.einsatz && S.einsatz.pruefung) return S.einsatz.pruefung;
  const p = S.pruefErgebnis; return p && Date.now() - p.zeit < 12 * 3600e3 ? p.antwort : null;
}
function fallUndEinsatzZuruecksetzen() {
  F = null; fallSpeichern();
  if (C.vorlagen) { VORLAGEN_ERGEBNIS = []; VORLAGEN_DATEIEN = []; KORREKTUREN = {}; VORLAGEN_STAND = ""; }
  S.einsatz = null; delete S.pruefErgebnis;
  if (C.ablauf) C.ablauf.forEach(x => delete S.checklisten["ablauf-" + x.nr]);
  save();
}
function neuerFall() {
  F = { angelegt: Date.now(), werte: { aufgriff_zeit: lokalISO(new Date()), screening_zeit: lokalISO(new Date()) } };
  fallSpeichern(); pruefungUebernehmen(bekannteAntwort());
}
// Betreff der Aufgriffsmeldung an das BAMF (Checkliste Meldeverfahren)
const bamfBetreff = () => `${wert("haft") === "Ja" ? "HAFT – " : ""}${istUma() ? "Aufgriff uM" : wert("asyl") === "Ja" ? "Asyl" : "Aufgriff"} – ${wert("azr_nummer").trim() || "[AZR-Nummer]"}`;
const aufgriff = () => { const w = wert("aufgriff_zeit"); return w ? new Date(w) : null; };

      ${C.vorlagen ? `<h3 class="sec">Originalformulare <small>Word</small></h3>

// Felder eines Erfassungsschritts; „Screening-Fall?“ erscheint als Hinweis, wenn aus der Prüfung übernommen
function felderHTML(s) {
  const l = s.felder.filter(sichtbar);
  if (!l.length) return `<div class="note glass"><span>In diesem Fall gibt es hier nichts zu erfassen${s.id === "festhalten" ? " – Festhalten nach Art. 8 Screening-VO gibt es nur beim Screening. Ohne Screening: Festnahme nur bei Haftgrund (§ 62 Abs. 5 AufenthG) – dafür die „Festhalteanordnung“ unter „Mehr“." : "."}</span></div>`;
  return l.map(f => f.id === "screening_fall" && F.screeningAusPruefung && !leer(f.id) ? `<div class="note glass" style="border:2px solid ${wert(f.id).startsWith("Nein") ? "#008444" : "#c0392b"}"><span><b>${esc(f.label)}</b> ${esc(wert(f.id))}<br><span class="small">Aus der Screening-Prüfung übernommen.</span></span><button class="btn glassy" id="sfAendern" style="width:auto;margin:0;padding:8px 14px">Ändern</button></div>`  : feldHTML(f)).join("");
}
function feldHTML(f) {
  const v = wert(f.id);

  const hint = f.hinweis ? `<div class="hint">${svg("info").replace("<svg", '<svg style="width:15px;height:15px;flex:none"')}${esc(f.hinweis)}</div>` : "";

      : `<textarea id="i-${f.id}" data-f="${f.id}" rows="3" placeholder="${esc(f.platzhalter || "")}">${esc(v)}</textarea>`;

        <option value="">– bitte wählen –</option>${f.optionen.map(o => `<option ${v === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>${hint}</div>`;
  }

}

function Erfassung(start, nur) {
  let index = start;
  const sch = nur ? C.fall.schritte.filter(x => nur.includes(x.id)) : C.fall.schritte;
  const view = () => {
    bereich("screening");
    const s = sch[index], o = offenIn(s).length;
    return {

        <div class="stepper" id="stp">${sch.map((x, i) => `<button class="${i === index ? "cur" : offenIn(x).length ? "" : "done"}" data-g="${i}">${offenIn(x).length ? icon(x.icon) : svg("check", 2.6)}${esc(x.titel)}</button>`).join("")}</div>
        <div style="display:flex;gap:14px;align-items:center;margin:8px 0 6px">${ico(s.icon, index + 1, "lg")}
          <div><h2 class="rounded" style="margin:0;font-size:30px">${esc(s.titel)}</h2>
          <div class="small" id="offen" style="font-weight:700;color:${o ? "var(--coral)" : "var(--ok)"}">${o ? `${o} Pflichtangabe${o === 1 ? "" : "n"} offen` : "Alle Pflichtangaben erfasst"}</div></div></div>
        <p class="small" style="font-size:15px">${esc(s.beschreibung)}</p>
        <div id="felder">${felderHTML(s)}</div>

        <div class="bottombar fest">

          ${index < sch.length - 1 ? `<button class="btn" id="en">Weiter ${svg("chevr", 2.2)}</button>` : nur ? `<button class="btn" id="ez" style="${farbVars(2)}">${svg("check", 2.4)} Fertig – zurück zum Einsatz</button>` : `<button class="btn" id="ef" style="${farbVars(2)}">${svg("docs")} Fertig – zu den Unterlagen</button>`}
        </div>`,
      bind: () => {
        const cur = app.querySelector("#stp .cur"); cur && cur.scrollIntoView({ inline: "center", block: "nearest" });
        const gehe = z => { if (z === index) return; vibrate(); const r = z > index ? "fwd" : "back"; uebergang(r, anim => { index = z; render(anim ? (r === "fwd" ? "enter-fwd" : "enter-back") : ""); }); };
        app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => gehe(+b.dataset.g));
        const ep = $("ep"); if (ep) ep.onclick = () => gehe(index - 1);
        const en = $("en"); if (en) en.onclick = () => gehe(index + 1);
        const ez = $("ez"); if (ez) ez.onclick = () => { vibrate(); zurueck(); };
        const ef = $("ef"); if (ef) ef.onclick = () => { vibrate(); stack.pop(); if (stack[stack.length - 1] !== FallUebersicht) stack.push(FallUebersicht); uebergang("back", anim => render(anim ? "enter-back" : "")); };
        const sfA = $("sfAendern"); if (sfA) sfA.onclick = () => { vibrate(); delete F.screeningAusPruefung; fallSpeichern(); render(); };
        verdrahten();
      }
    };
    function aktualisieren(struktur) {
      // Pflicht-Anzeige und bedingte Felder aktualisieren, ohne den Fokus zu verlieren
      const o = offenIn(sch[index]).length, el = $("offen");
      el.textContent = o ? `${o} Pflichtangabe${o === 1 ? "" : "n"} offen` : "Alle Pflichtangaben erfasst";
      el.style.color = o ? "var(--coral)" : "var(--ok)";
      if (struktur) { $("felder").innerHTML = felderHTML(sch[index]); verdrahten(); const sfA = $("sfAendern"); if (sfA) sfA.onclick = () => { vibrate(); delete F.screeningAusPruefung; fallSpeichern(); render(); }; }
      app.querySelectorAll(".pflicht").forEach(p => { const f = p.closest(".field, .box")?.querySelector("[data-f],[data-dt],[data-chip],[data-now],[data-sel]"); const id = f && (f.dataset.f || f.dataset.dt || f.dataset.chip || f.dataset.now || f.dataset.sel); if (id) p.classList.toggle("ok", !leer(id)); });
      const stp = app.querySelectorAll("#stp button"); sch.forEach((x, i) => { if (i !== index) stp[i].className = offenIn(x).length ? "" : "done"; });
    }
    function verdrahten() {
      app.querySelectorAll("[data-f]").forEach(el => {
        el.oninput = () => { setze(el.dataset.f, el.value); if (el.tagName === "TEXTAREA") { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; } aktualisieren(false); };
        if (el.tagName === "TEXTAREA") { el.style.height = "auto"; el.style.height = Math.max(96, el.scrollHeight) + "px"; }
      });
      app.querySelectorAll("[data-dt]").forEach(el => el.oninput = () => { setze(el.dataset.dt, el.value); aktualisieren(false); });
      app.querySelectorAll("[data-sel]").forEach(el => el.onchange = () => { vibrate(); setze(el.dataset.sel, el.value); aktualisieren(true); });
      app.querySelectorAll("[data-now]").forEach(el => el.onclick = () => { vibrate(); setze(el.dataset.now, lokalISO(new Date())); aktualisieren(true); });
      app.querySelectorAll("[data-clr]").forEach(el => el.onclick = () => { vibrate(); setze(el.dataset.clr, ""); aktualisieren(true); });
      app.querySelectorAll("[data-chip]").forEach(el => el.onclick = () => {
        vibrate();
        const id = el.dataset.chip, o = el.dataset.o, f = FELDER[id];
        let l = auswahl(id);
        if (f.typ === "mehrfach") {
          if (l.includes(o)) l = l.filter(x => x !== o);
          else if (o.startsWith("Kein")) l = [o];
          else { l = l.filter(x => !x.startsWith("Kein")); l.push(o); }
        } else l = l.includes(o) ? [] : [o];
        setze(id, l.join(TRENNER));
        aktualisieren(true);
      });
    }
  };
  return view;
}

// Dokumente erzeugen
function platzhalter(id) {
  if (id === "heute") return fmtDatum(new Date());
  const a = aufgriff();
  if (id === "frist_richter") { if (wert("festgehalten") !== "Ja") return "entfällt – kein Festhalten"; return a ? fmtDatum(richterFrist(a)) : "—"; }
  if (id === "frist_screening") return a ? fmtDatum(screeningFrist(a)) : "—";
  if (id === "bamf_betreff") return bamfBetreff();
  if (id === "bamf_anlagen") return ((C.bamf_meldung || {}).anlagen || []).filter(x => istScreening() || !/nur bei Screening/i.test(x)).map((x, k) => `${k + 1}. ${x}`).join("\n");
  const v = wert(id).trim();
  if (!v) return "—";
  if (FELDER[id] && FELDER[id].typ === "datumzeit") { const d = new Date(v); if (!isNaN(d)) return fmtDatum(d); }
  return v;
}
const einsetzen = t => t.replace(/\{\{(\w+)\}\}/g, (_, id) => platzhalter(id));
function blockHTML(text) {
  let html = "", tab = [], liste = [], abs = [];
  const fertig = () => {
    if (tab.length) { html += `<table>${tab.join("")}</table>`; tab = []; }
    if (liste.length) { html += `<ul>${liste.join("")}</ul>`; liste = []; }
    if (abs.length) { html += `<p>${abs.join("\n")}</p>`; abs = []; }
  };
  for (const z of text.split("\n")) {
    if (z.startsWith("| ")) {
      if (liste.length || abs.length) fertig();
      const t = z.slice(2).split(" | ");
      tab.push(`<tr><td class="l">${inline(t[0])}</td><td>${inline(t.slice(1).join(" | "))}</td></tr>`);
    } else if (z.startsWith("• ")) {
      if (tab.length || abs.length) fertig();
      liste.push(`<li>${inline(z.slice(2))}</li>`);
    } else if (!z.trim()) {
      if (!abs.length) { fertig(); html += "<p>&nbsp;</p>"; } else fertig();
    } else {
      if (tab.length || liste.length) fertig();
      abs.push(inline(z));
    }
  }
  fertig();
  return html;
}
const dokHTML = docs => docs.map((d, i) => `<section class="dok${i ? " neu" : ""}">
  <header><div class="marke">${esc(C.meta.titel)} · Screening</div><span class="entwurf">ENTWURF</span></header>
  <h1>${esc(d.titel)}</h1><p class="unter">${esc(d.untertitel)}</p>
  ${d.abschnitte.map(a => (a.titel ? `<h2>${esc(a.titel)}</h2>` : "") + blockHTML(einsetzen(a.text))).join("")}
  <footer>Erstellt am ${esc(fmtDatum(new Date()))} mit ${esc(C.meta.titel)} (inoffizielle Arbeitshilfe). Entwurf – maßgeblich sind die amtlichen Vordrucke.</footer></section>`).join("");

function Dokument(docs, titel) {
  const seen = new Set();
  const offen = docs.flatMap(offenDok).filter(f => !seen.has(f.id) && seen.add(f.id));

// Quiz und Karten halten ihren Zustand in einer Closure und liefern die Ansichtsfunktion zurück.
function Quiz(fragenIn, titel, pruefung = false) {
  const fragen = shuffle(fragenIn);
  let i = 0, punkte = 0, gewaehlt = null;
  const view = () => {
    if (i >= fragen.length) {
      const q = punkte / fragen.length;
      return {
        title: titel,
        html: `<div style="text-align:center;padding:30px 0" class="enter-fade">${ring(q).replace('class="ring"', 'class="ring" style="width:160px;height:160px"')}
          <h2 class="rounded" style="font-size:30px">${punkte} von ${fragen.length} richtig</h2>
          <p class="small" style="font-size:16px">${q >= .8 ? "Sehr gut – bestanden." : q >= .6 ? "Bestanden – einzelne Themen wiederholen." : "Nicht bestanden – Kapitel noch einmal durcharbeiten."}</p></div>
          <button class="btn" id="again">${svg("rotate")} Noch einmal</button>`,
        bind: () => $("again").onclick = () => { stack[stack.length - 1] = Quiz(fragenIn, titel, pruefung); render("enter-fade"); }
      };
    }
    const f = fragen[i];
    const cls = j => gewaehlt === null ? "" : pruefung ? (j === gewaehlt ? "sel" : "") : j === f.richtig ? "ok" : j === gewaehlt ? "bad" : "";
    return {
      title: titel,
      html: `${bar(i / fragen.length)}<div class="small" style="margin-top:10px">Frage ${i + 1} von ${fragen.length}</div>
        <div class="qtitle rounded">${esc(f.frage)}</div>
        ${f.antworten.map((a, j) => `<button class="opt glass press ${cls(j)}" data-a="${j}" ${gewaehlt !== null ? "disabled" : ""}>${esc(a)}</button>`).join("")}
        ${gewaehlt !== null && !pruefung ? `<div class="expl glass enter-fade"><b style="color:${gewaehlt === f.richtig ? "var(--ok)" : "var(--coral)"}">${gewaehlt === f.richtig ? "Richtig" : "Leider falsch"}</b><div>${esc(f.erklaerung)}</div></div>` : ""}
        ${gewaehlt !== null ? `<button class="btn" id="next">${i + 1 < fragen.length ? "Weiter" : "Auswertung"} ${svg("chevr", 2.2)}</button>` : ""}`,
      bind: () => {
        app.querySelectorAll("[data-a]").forEach(el => el.onclick = () => {
          if (gewaehlt !== null) return;
          vibrate();
          gewaehlt = +el.dataset.a;
          const ok = gewaehlt === f.richtig;
          if (ok) punkte++;
          const st = S.quiz[f.frage] || { r: 0, f: 0 };
          ok ? st.r++ : st.f++; st.ok = ok; S.quiz[f.frage] = st; save();
          neuZeichnen();
        });
        const n = $("next");
        if (n) n.onclick = () => { vibrate(); uebergang("fwd", anim => { i++; gewaehlt = null; render(anim ? "enter-fwd" : ""); }); };
      }
    };
  };
  return view;
}
function Karten() {
  let nurNeu = true, stapel = [], i = 0, back = false;
  const alle = () => C.glossar.map(g => ({ id: "g:" + g.begriff, v: g.begriff, h: g.erklaerung }))
    .concat(C.normen.map(n => ({ id: "n:" + n.norm, v: n.norm + "\n" + n.titel, h: n.inhalt + "\n\nPraxis: " + n.praxis })));
  const bau = () => { stapel = shuffle(alle().filter(k => !nurNeu || !S.karten.includes(k.id))); i = 0; back = false; };
  bau();
  return () => {
    const k = stapel[i];
    return {
      title: "Karteikarten",
      html: `<label class="confirm glass" style="margin-bottom:14px"><input type="checkbox" id="nn" ${nurNeu ? "checked" : ""}> Nur noch nicht gewusste Karten</label>
        ${!k ? `<div class="glass" style="padding:40px 20px;text-align:center"><b class="rounded" style="font-size:22px">Alle Karten gewusst!</b><button class="btn glassy" id="all">Alle Karten erneut üben</button></div>` : `
        <div class="small" style="margin:0 4px 8px">Karte ${i + 1} von ${stapel.length}</div>
        <div class="flip ${back ? "umgedreht" : ""}" id="fc" role="button" tabindex="0" aria-label="Karte umdrehen">
          <div class="face">${back ? `<div>${esc(k.h)}</div>` : `<div class="front rounded">${esc(k.v)}</div>`}</div></div>
        <p class="small" style="text-align:center">Tippen zum Umdrehen</p>
        <div class="hstack"><button class="btn glassy" id="no" style="color:#e08600">${svg("rotate")} Nochmal</button><button class="btn" id="yes">${svg("check", 2.6)} Gewusst</button></div>`}`,
      bind: () => {
        $("nn").onchange = e => { nurNeu = e.target.checked; bau(); neuZeichnen(); };
        const all = $("all"); if (all) all.onclick = () => { nurNeu = false; bau(); neuZeichnen(); };
        const fc = $("fc"); if (!fc) return;
        // Umklappen: Karte auf null Breite, Inhalt tauschen, mit Feder wieder aufklappen
        fc.onclick = () => {
          vibrate();
          const face = fc.querySelector(".face");
          const tausch = () => {
            back = !back;
            fc.classList.toggle("umgedreht", back);
            face.innerHTML = back ? `<div>${esc(k.h)}</div>` : `<div class="front rounded">${esc(k.v)}</div>`;
            face.animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 380, easing: "cubic-bezier(0.34, 1.56, 0.64, 1)" });
          };
          if (!face.animate || matchMedia("(prefers-reduced-motion: reduce)").matches) { tausch(); return; }
          face.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: 160, easing: "ease-in" }).onfinish = tausch;
        };
        const next = known => {
          vibrate();
          S.karten = S.karten.filter(x => x !== k.id); if (known) S.karten.push(k.id); save();
          back = false; if (i + 1 < stapel.length) i++; else bau();
          uebergang("fwd", anim => render(anim ? "enter-fwd" : ""));
        };
        $("no").onclick = () => next(false);
        $("yes").onclick = () => next(true);
      }
    };
  };
}

function onboarding(erneut = false) {
  if (!erneut) { try { if (localStorage.getItem("geas.onboarding.v2") === "1") return; } catch (e) {} }
  const seiten = C.onboarding;
  let i = 0;
  const m = document.createElement("div");
  m.className = "modal";
  const icons = { "hand.wave": "wave", "checkmark.shield": "shieldcheck", "exclamationmark.triangle": "alert", "square.grid.2x2": "grid", "lock.shield": "lock" };
  const draw = () => {
    const last = i === seiten.length - 1, p = seiten[i];
    m.innerHTML = `<div class="sheet" role="dialog" aria-label="Einführung">
      <div class="small" style="display:flex;justify-content:space-between"><span>Einführung ${i + 1} von ${seiten.length}</span>${last ? "" : '<a href="#" id="oj">Zum letzten Schritt</a>'}</div>
      <div class="icon">${i === 0 ? `<span class="emb">${EMBLEM(70)}</span>` : `<span class="ico xl" style="background:linear-gradient(135deg,${pal(i)[0]},${pal(i)[1]})">${svg(icons[p.icon] || "info")}</span>`}</div>
      <h2 class="rounded">${esc(p.titel)}</h2><div class="prose" style="padding:0;font-size:18px">${rich(p.text)}</div>
      <div class="dots">${seiten.map((_, j) => `<span class="${j === i ? "on" : ""}"></span>`).join("")}</div>
      ${last ? `<label class="confirm glass"><input type="checkbox" id="oc"> Ich habe den Hinweis gelesen und verstanden.</label>
        <button class="btn" id="og" disabled>Los geht's</button>` :
        `<div class="hstack">${i > 0 ? `<button class="btn glassy" id="op">Zurück</button>` : ""}<button class="btn" id="on">Weiter</button></div>`}
    </div>`;
    const q = s => m.querySelector(s);
    if (q("#oj")) q("#oj").onclick = e => { e.preventDefault(); i = seiten.length - 1; draw(); };
    if (q("#op")) q("#op").onclick = () => { i--; draw(); };
    if (q("#on")) q("#on").onclick = () => { vibrate(); i++; draw(); };
    if (q("#oc")) q("#oc").onchange = e => { q("#og").disabled = !e.target.checked; };
    if (q("#og")) q("#og").onclick = () => { try { localStorage.setItem("geas.onboarding.v2", "1"); } catch (e) {} m.remove(); };
    const sh = m.querySelector(".sheet"); sh.style.animation = "none"; sh.scrollTop = 0;
  };
  draw();
  m.querySelector(".sheet").style.animation = "";
  document.body.appendChild(m);
}
