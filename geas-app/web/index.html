}
function weisungBearbeiten(i) {
  const liste = (C.weisungen || []).map(w => ({ ...w }));
  const w = i >= 0 ? liste[i] : { titel: "", text: "", ab: "" };
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="sheet" role="dialog" aria-label="Hinweis bearbeiten">
    <h2 class="rounded" style="font-size:24px">${i >= 0 ? "Hinweis bearbeiten" : "Neuer Hinweis"}</h2>
    <label class="f" for="wt">Überschrift</label><input type="text" id="wt" value="${esc(w.titel)}">
    <label class="f" for="wa">Gültig ab (optional)</label><input type="text" id="wa" value="${esc(w.ab || "")}" placeholder="TT.MM.JJJJ">
    <label class="f" for="wx">Text</label><textarea id="wx" rows="5" style="width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--text);font:inherit">${esc(w.text)}</textarea>
    <button class="btn" id="ws2" style="margin-top:18px">Sichern</button>
    ${i >= 0 ? '<button class="btn glassy danger" id="wd">Löschen</button>' : ""}
    <button class="btn glassy" id="wc">Abbrechen</button></div>`;
  document.body.appendChild(m);
  const zu = () => { m.remove(); neuZeichnen(); };
  const sichern = l => { C.weisungen = l; ANPASSUNG.weisungen = l; anpassungSpeichern(); zu(); };
  m.onclick = e => { if (e.target === m) zu(); };
  m.querySelector("#wc").onclick = zu;
  m.querySelector("#ws2").onclick = () => {
    const neu = { titel: m.querySelector("#wt").value.trim(), ab: m.querySelector("#wa").value.trim(), text: m.querySelector("#wx").value.trim() };
    if (!neu.titel) return;
    if (i >= 0) liste[i] = neu; else liste.push(neu);
    sichern(liste);
  };
  const d = m.querySelector("#wd"); if (d) d.onclick = () => { if (confirm("Hinweis löschen?")) { liste.splice(i, 1); sichern(liste); } };
}

// ================= Festhalteanordnung nach § 62 Abs. 5 AufenthG (nur interne Ausgabe) =================
// Eigenes Formular mit Kopfbogen der Dienststelle; übernimmt vorhandene Angaben aus dem Fall. Nur auf diesem Gerät, 7 Tage.
const FHKEY = "geas.intern.festhalten.v1";
let FH = (() => {
  try {
    const f = JSON.parse(localStorage.getItem(FHKEY) || "null");
    if (f && Date.now() - f.angelegt < AUFBEWAHRUNG) return f;
    localStorage.removeItem(FHKEY);
  } catch (e) {}
  return null;
})();
function fhSpeichern() { try { FH ? localStorage.setItem(FHKEY, JSON.stringify(FH)) : localStorage.removeItem(FHKEY); } catch (e) {} }
function fhWerte() {
  const K = C.festhalten;
  if (!FH) FH = { angelegt: Date.now(), werte: {} };
  const w = FH.werte;
  for (const [id, quelle] of Object.entries(K.vorbelegung || {})) if (!w[id] && F && F.werte[quelle]) w[id] = F.werte[quelle];
  for (const f of K.felder) if (w[f.id] === undefined && f.standard !== undefined) w[f.id] = f.standard;
  return w;
}
const fhDatum = v => { if (!v) return ""; const d = new Date(v); return isNaN(d) ? v : d.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) + " Uhr"; };
const fhListe = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " und " + a[a.length - 1];

function fhFeld(f, w) {
  const v = w[f.id] ?? "";
  const pf = f.pflicht ? `<span class="pflicht ${(Array.isArray(v) ? v.length : v) ? "ok" : ""}">Pflicht</span>` : "";
  const hint = f.hinweis ? `<div class="hint">${svg("info").replace("<svg", '<svg style="width:15px;height:15px;flex:none"')}${esc(f.hinweis)}</div>` : "";
  // Textbausteine: antippen fügt die Passage ein (Einzeiler: ersetzt), erneut antippen entfernt sie
  const bs = f.bausteine ? `<div class="fhb"><div class="small">Bausteine antippen – Angaben in [eckigen Klammern] ersetzen</div><div class="chips">${f.bausteine.map((b, i) => {
      const an = String(v).includes(b.text);
      return `<button class="chip ${an ? "on" : ""}" data-fhb="${f.id}" data-i="${i}" title="${esc(b.text)}">${svg(an ? "check" : "plus", 3)}${esc(b.kurz)}</button>`;
    }).join("")}</div></div>` : "";
  if (f.typ === "text") return `<div class="field"><input id="fh-${f.id}" data-fh="${f.id}" value="${esc(v)}" placeholder="${esc(f.platzhalter || " ")}" autocomplete="off"><label for="fh-${f.id}">${esc(f.label)} ${pf}</label>${bs}${hint}</div>`;
  if (f.typ === "mehrzeilig") return `<div class="field ml"><label for="fh-${f.id}">${esc(f.label)} ${pf}</label><textarea id="fh-${f.id}" data-fh="${f.id}" rows="${Math.min(10, Math.max(3, Math.ceil(String(v).length / 45)))}" placeholder="${esc(f.platzhalter || "")}">${esc(v)}</textarea>${bs}${hint}</div>`;
  if (f.typ === "datumzeit") return `<div class="box glass"><div class="lbl">${esc(f.label)} ${pf}</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><input type="datetime-local" data-fhdt="${f.id}" value="${esc(v)}"><button class="chip" data-fhnow="${f.id}" style="color:var(--green)">${svg("clock")} Jetzt</button></div>${hint}</div>`;
  const gew = Array.isArray(v) ? v : v ? [v] : [];
  return `<div class="box glass"><div class="lbl">${esc(f.label)} ${pf}${f.typ === "mehrfach" ? '<span class="small">Mehrfachauswahl</span>' : ""}</div>
    <div class="chips">${f.optionen.map(o => `<button class="chip ${gew.includes(o) ? "on" : ""}" data-fhc="${f.id}" data-o="${esc(o)}">${gew.includes(o) ? svg("check", 3) : ""}${esc(o)}</button>`).join("")}</div>${hint}</div>`;
}

// Der Text folgt dem Aufbau der Anordnungen der Landesdirektion Sachsen – ohne Strichcode, mit Kopfbogen der Polizeidirektion.
function fhBrief(w) {
  const K = C.festhalten, T = K.text;
  const zeile = (l, v) => `<tr><td>${esc(l)}</td><td>${esc(v || "")}</td></tr>`;
  const eu = w.rechtslage === K.rechtslage_eu;
  const nrn = (w.haftgruende || []).map(h => (h.match(/Nr\. (\d)/) || [])[1]).filter(Boolean);
  const frist = w.frist === "nicht gewährt" ? "nicht gewährt" : "abgelaufen" + (w.frist_datum ? " (" + w.frist_datum + ")" : "");
  const absatz = s => `<p>${esc(s)}</p>`;
  return `<div class="fhbrief">
    ${C.logo ? `<img class="fh-logo" src="${C.logo}" alt="">` : `<div class="fh-logo txt">${esc(K.behoerde)}</div>`}
    <i class="fh-falz" style="top:105mm"></i><i class="fh-falz loch" style="top:148.5mm"></i><i class="fh-falz" style="top:210mm"></i>
    <div class="fh-absender">${esc(K.absender)}</div>
    <div class="fh-anschrift">${esc(w.empfaenger || "")}</div>
    <div class="fh-info">
      <b>Ihr/-e Ansprechpartner/-in</b><br>${esc(w.sachbearbeiter || "")}<br>${esc(w.dienststelle || "")}<br><br>
      <b>Durchwahl</b><br>Telefon ${esc(w.telefon || "")}<br>${w.email ? esc(w.email).replace("@", "@<br>") + "<br>" : ""}<br>
      <b>Aktenzeichen</b><br>(bitte bei Antwort angeben)<br>${esc(w.aktenzeichen || "")}<br>${w.azr ? "AZR-Nr.: " + esc(w.azr) + "<br>" : ""}<br>
      ${esc(w.ort || "")}, ${esc(new Date().toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }))}
    </div>
    <div class="fh-text">
      <h1>${esc(T.titel)}</h1><div class="fh-unter">${esc(T.untertitel)}</div>
      <h2>${esc(T.zustaendigkeit)}</h2>
      <table class="fh-pers">${zeile("Name:", w.name)}${zeile("Vorname:", w.vorname)}${zeile("Geburtsdatum:", w.geburtsdatum)}${zeile("Staatsangehörigkeit:", w.staatsangehoerigkeit)}${zeile("Anschrift / Aufenthalt:", w.anschrift)}${zeile("AZR:", w.azr)}</table>
      ${absatz(eu
        ? T.eu.replace("{abh}", w.abh || "").replace("{bescheid}", w.bescheid || "").replace("{frist}", frist)
        : T.drittstaat.replace("{bescheid}", w.bescheid || "").replace("{frist}", frist))}
      ${w.eilantrag && w.eilantrag.startsWith("Kein") ? absatz(T.eilantrag) : ""}
      ${absatz(T.verdacht.replace(" {nr}", nrn.length ? " Nr. " + fhListe(nrn) : ""))}
      ${w.tatsachen ? absatz(w.tatsachen) : ""}
      ${absatz(T.richter.replace("{grund}", w.richter_nicht || ""))}
      ${absatz(T.entziehen.replace("{grund}", w.entziehen || ""))}
      ${absatz(T.anordnung.replace("{behoerde}", K.behoerde).replace("{zeit}", fhDatum(w.festhalten_zeit)))}
      ${absatz(T.vorfuehrung)}
      ${absatz(T.abh.replace("{abh_info}", w.abh_info || ""))}
      <p style="margin-top:6mm">${esc(T.gruss)}</p><p>Im Auftrag</p>
      <div class="fh-unterschrift"></div><p>${esc(w.sachbearbeiter || "")}</p>
    </div>
  </div>`;
}

function Festhalteanordnung() {
  const K = C.festhalten, w = fhWerte();
  fhSpeichern();
  const fehlend = () => K.felder.filter(f => f.pflicht && !(Array.isArray(w[f.id]) ? w[f.id].length : w[f.id])).map(f => f.label);
  const gruppen = [...new Set(K.felder.map(f => f.gruppe))];
  const view = () => {
    // Warnung greift nur, wenn auch die übrigen Bedingungen (z. B. Rechtslage) erfüllt sind; "sperre" verhindert den Druck
    const warn = K.warnungen.filter(x => [].concat(w[x.feld] || []).includes(x.wert) && Object.entries(x.wenn || {}).every(([k, v]) => [].concat(w[k] || []).includes(v)));
    const gesperrt = warn.find(x => x.sperre);
    return {
      title: "Festhalteanordnung",
      html: `<div class="glass" style="padding:18px;border:1.5px solid #002664">
          <h3 class="rounded" style="margin:0 0 6px;font-size:21px">${esc(K.titel)}</h3>
          ${K.hinweise.map(h => `<p style="margin:8px 0 0"><b>${esc(h.titel)}</b> ${esc(h.text)}${quelleChip(h.q)}</p>`).join("")}
        </div>
        ${warn.map(x => `<div class="note glass" style="margin-top:12px;border:1.5px solid var(--coral)">${svg("alert").replace("<svg", '<svg style="color:var(--coral)"')}<span><b style="color:var(--coral)">Achtung:</b> ${esc(x.text)}</span></div>`).join("")}
        ${gruppen.map(g => `<h3 class="sec">${esc(g)}</h3>${K.felder.filter(f => f.gruppe === g).map(f => fhFeld(f, w)).join("")}`).join("")}
        ${gesperrt ? `<div class="note glass" style="border:2px solid var(--coral)"><span><b style="color:var(--coral)">Druck gesperrt:</b> ${esc(gesperrt.sperre)}</span></div>` : `<button class="btn" id="fhD">${svg("print")} Drucken / als PDF speichern</button>`}
        <h3 class="sec">Vorschau</h3><div class="fh-vorschau glass"><div class="fh-zoom">${fhBrief(w)}</div></div>
        <button class="btn glassy danger" id="fhX">${svg("rotate")} Formular leeren</button>
        <p class="small">Die Angaben bleiben nur auf diesem Gerät und werden nach 7 Tagen automatisch gelöscht.</p>`,
      bind: () => {
        const neu = () => { fhSpeichern(); const z = app.querySelector(".fh-zoom"); if (z) z.innerHTML = fhBrief(w); };
        const skal = () => { const v = app.querySelector(".fh-vorschau"), z = app.querySelector(".fh-zoom"); if (v && z) z.style.zoom = Math.min(1, (v.clientWidth - 16) / 794); };
        skal(); window.__fhSkal = skal;
        if (!window.__fhR) { window.__fhR = 1; window.addEventListener("resize", () => document.querySelector(".fh-zoom") && window.__fhSkal()); }
        app.querySelectorAll("[data-fh]").forEach(el => el.oninput = () => { w[el.dataset.fh] = el.value; neu(); });
        app.querySelectorAll("[data-fhdt]").forEach(el => el.onchange = () => { w[el.dataset.fhdt] = el.value; neu(); });
        app.querySelectorAll("[data-fhnow]").forEach(el => el.onclick = () => { vibrate(); w[el.dataset.fhnow] = lokalISO(new Date()); fhSpeichern(); neuZeichnen(); });
        app.querySelectorAll("[data-fhb]").forEach(el => el.onclick = () => {
          vibrate(); const f = K.felder.find(x => x.id === el.dataset.fhb), t = f.bausteine[+el.dataset.i].text, alt = String(w[f.id] || "");
          if (f.typ === "text") w[f.id] = alt === t ? "" : t;
          else w[f.id] = alt.includes(t) ? alt.replace(t, "").replace(/ {2,}/g, " ").trim() : (alt.trim() ? alt.trim() + " " : "") + t;
          fhSpeichern(); neuZeichnen();
        });
        app.querySelectorAll("[data-fhc]").forEach(el => el.onclick = () => {
          vibrate(); const f = K.felder.find(x => x.id === el.dataset.fhc), o = el.dataset.o;
          if (f.typ === "mehrfach") { const a = [].concat(w[f.id] || []); w[f.id] = a.includes(o) ? a.filter(x => x !== o) : [...a, o]; }
          else w[f.id] = w[f.id] === o ? "" : o;
          fhSpeichern(); neuZeichnen();
        });
        if ($("fhD")) $("fhD").onclick = () => {
          vibrate();
          const f = fehlend();
          const offen = [...new Set(K.felder.flatMap(x => String(w[x.id] || "").match(/\[[^\]]{1,40}\]/g) || []))];
          if (offen.length) f.push("Platzhalter ersetzen: " + offen.join(", "));
          if (f.length && !confirm("Noch offen:\n– " + f.join("\n– ") + "\n\nTrotzdem drucken?")) return;
          const d = document.getElementById("druck");
          d.className = ""; d.innerHTML = `<div class="fhdruck">${fhBrief(w)}</div>`;
          const st = document.createElement("style"); st.textContent = "@page { size: A4; margin: 20mm 0 18mm; } @page :first { margin: 0 0 18mm; } html, body { background: #fff !important; }"; document.head.appendChild(st);
          const alt = document.title; document.title = ["Festhalteanordnung", w.name, w.vorname].filter(Boolean).join("_").replace(/\s+/g, "_");
          window.print();
          setTimeout(() => { document.title = alt; st.remove(); }, 1000);
        };
        $("fhX").onclick = () => { if (confirm("Alle Angaben im Formular löschen?")) { FH = null; fhSpeichern(); go(Festhalteanordnung); } };
      }
    };
  };
  return view();
}

// Prüfstand: alle Normen der Leitfäden mit Quelle – was belegt ist und was noch geprüft werden muss
function Pruefstand() {
  const Q = C.quellen_leitfaden || {};
  const alle = [];
  for (const L of Object.values(C.leitfaeden || {})) for (const [kid, k] of Object.entries(L.knoten)) {
    for (const nn of k.normen || []) alle.push({ ...nn, lf: L.titel, bei: k.titel });
    for (const mm of k.massnahmen || []) if (mm.q === "pruefen") alle.push({ norm: "Maßnahme", text: mm.text, q: "pruefen", lf: L.titel, bei: k.titel });
  }
  const offen = alle.filter(x => x.q === "pruefen"), belegt = alle.filter(x => x.q !== "pruefen");
  const zeile = x => `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><span class="normchip">${esc(x.norm)}</span>${quelleChip(x.q)}<div class="small" style="color:var(--text)">${esc(x.text)}</div><div class="small">${esc(x.lf)} → ${esc(x.bei)}</div></div>`;
  return {
    title: "Rechtsgrundlagen & Quellen",
    html: `<div class="note glass" style="border:2px solid #e08600">${svg("alert").replace("<svg", '<svg style="color:#e08600"')}<span><b>${offen.length} Angaben sind noch zu prüfen</b> – sie sind nicht durch ein vorliegendes Dokument belegt. Bitte gegen die aktuelle Gesetzesfassung prüfen, bevor die Leitfäden freigegeben werden.</span></div>
      <h3 class="sec">Noch zu prüfen <small>${offen.length}</small></h3><div class="glass" style="padding:6px 16px">${offen.map(zeile).join("")}</div>
      <h3 class="sec">Durch Dokumente belegt <small>${belegt.length}</small></h3><div class="glass" style="padding:6px 16px">${belegt.map(zeile).join("")}</div>
      <h3 class="sec">Quellen</h3><div class="glass" style="padding:6px 16px">${Object.entries(Q).map(([k, v]) => `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(QKURZ[k] || k)}</b> <span class="small">(${esc(v.art)})</span><div class="small" style="color:var(--text)">${esc(v.titel)}</div></div>`).join("")}</div>`
  };
}

// ================= Geführter Einsatz (interne Ausgabe) =================
// Ein Schritt pro Bildschirm: erst prüfen (Screening ja/nein), dann abarbeiten bis zur Übermittlung.
const ES = () => (S.einsatz ||= { i: 0, haken: {}, pruefung: null, ergebnis: "" });
const einsatzSchritte = () => (C.einsatz ? C.einsatz.schritte : []);

function einsatzErgebnis(antwort, titel, nurMerken) {
  const e = ES();
  if (e.pruefung === antwort && e.ergebnis === titel && nurMerken) return;
  e.pruefung = antwort; e.ergebnis = titel; save();
  pruefungUebernehmen(antwort);
  if (nurMerken) return;
  const i = einsatzSchritte().findIndex(x => x.id === "pruefung");
  e.i = i + 1; save();
  stack.pop();   // Prüfung verlassen
  uebergang("fwd", anim => { stack.pop(); stack.push(() => Einsatz(e.i)); render(anim ? "enter-fwd" : ""); });
}

function Einsatz(nr) {
  bereich("screening");
  const liste = einsatzSchritte(), e = ES();
  nr = Math.max(0, Math.min(nr, liste.length - 1));
  e.i = nr; save();
  const st = liste[nr], haken = new Set(e.haken[st.id] || []);
  const ohneScr = e.pruefung === "nein" || (F && !istScreening());
  const phaseName = ph => ohneScr && ph === "Screening durchführen" ? "Aufgriff ohne Screening" : ph;
  const entfaellt = ohneScr && st.nur === "screening";
  const a = aufgriff();
  const offenSchritt = (st.erfassen || []).reduce((n, id) => { const x = C.fall.schritte.find(y => y.id === id); return n + (x && F ? offenIn(x).length : 0); }, 0);
  const phasen = [...new Set(liste.map(x => x.phase))];
  const mailAblauf = st.mail_aus_ablauf ? (C.ablauf || []).find(x => x.nr === st.mail_aus_ablauf) : null;
  const nachPruefung = liste.findIndex(x => x.id === "pruefung") < nr;
  return {
    title: `Schritt ${nr + 1} von ${liste.length}`,
    html: `${bar((nr + 1) / liste.length)}
      <div class="stepper">${phasen.map(ph => `<button class="${ph === st.phase ? "cur" : ""}" data-ph="${esc(ph)}">${esc(phaseName(ph))}</button>`).join("")}</div>
      ${nachPruefung && e.pruefung === "nein" ? `<div class="note glass" style="border:2px solid #e08600">${svg("alert").replace("<svg", '<svg style="color:#e08600"')}<span>Die Prüfung ergab <b>kein Screening</b> („${esc(e.ergebnis)}“). Ohne Screening entfallen Überprüfungsformular, Information Art. 11, die Sicherheitskontrolle nach Art. 15 und der SiDaS-Upload. Die übrigen Unterlagen (Belehrung, Anlaufbescheinigung, Inverwahrung, Fragebogen, Abschlusserklärung) erstellt die App weiterhin; gemeldet wird per E-Mail an das BAMF.</span></div>` : ""}
      ${nachPruefung && !e.pruefung ? `<div class="note glass" style="border:2px solid #e08600">${svg("alert").replace("<svg", '<svg style="color:#e08600"')}<span>Die Prüfung „Screening ja oder nein?“ wurde noch nicht gemacht.</span></div>` : ""}
      <div class="small" style="margin:10px 2px 0;font-weight:700;color:var(--green)">${esc(phaseName(st.phase))}</div>
      <h2 class="rounded" style="font-size:30px;margin:2px 0 8px;line-height:1.15">${esc(st.titel)}</h2>
      <p style="margin:0 0 14px;font-size:17px">${esc(st.kurz)}</p>
      ${beispielBox(st.beispiel)}
      ${a && nachPruefung && istScreening() ? `<div class="fristen2" style="margin:0 0 14px"><div class="glass"><div class="small"><b>Screening endet spätestens</b></div><b style="color:#e08600">${fmtDatum(screeningFrist(a))}</b><div class="small" style="margin-top:4px">Formular unverzüglich an Referat 2 senden – die LDS braucht Zeit für ihre Maßnahmen.</div></div>
        <div class="glass"><div class="small"><b>Richter (nur bei Festhalten)</b></div><b style="color:var(--coral)">${wert("festgehalten") === "Ja" ? fmtDatum(richterFrist(a)) : "—"}</b></div></div>` : ""}
      ${(st.info || []).map(t => `<div class="note glass">${svg("info").replace("<svg", '<svg style="color:#0082c4"')}<span class="small" style="color:var(--text)">${esc(t)}</span></div>`).join("")}
      ${entfaellt ? `<div class="note glass" style="border:2px solid #008444"><span><b>Entfällt bei einem Aufgriff ohne Screening.</b> Weiter mit „Weiter“.</span></div>` : ""}
      ${st.punkte.length && !entfaellt ? `<h3 class="sec" style="margin-top:18px">Das machst du jetzt <small>${haken.size}/${st.punkte.length}</small></h3>
        ${st.punkte.map((p, i) => `<button class="step glass press check ${haken.has(i) ? "on" : ""}" data-eh="${i}" role="checkbox" aria-checked="${haken.has(i)}">
          <span class="cbox">${svg("check", 3)}</span><span class="txt"><span class="strikeme">${esc(p.text)}</span>${p.hinweis ? `<span class="s">ⓘ ${esc(p.hinweis)}</span>` : ""}${entfaelltText(p)}</span></button>${dokZeile(p)}`).join("")}` : ""}
      ${st.aktion === "pruefung" ? `<button class="btn" id="eP" style="font-size:19px;padding:20px">${svg("shieldcheck")} ${e.pruefung ? "Prüfung erneut durchführen" : "Prüfung starten"}</button>
        ${e.pruefung ? `<div class="note glass" style="border:2px solid ${e.pruefung === "ja" ? "#e75113" : "#008444"}"><span><b>Ergebnis:</b> ${esc(e.ergebnis)}</span></div>` : ""}` : ""}
      ${st.erfassen ? `<button class="btn" id="eF" style="font-size:18px;padding:18px">${svg("pencil")} ${F ? "Angaben erfassen" : "Fall anlegen und erfassen"}${F ? ` <span style="font-weight:600;opacity:.85">(${offenSchritt ? offenSchritt + " offen" : "vollständig ✓"})</span>` : ""}</button>` : ""}
      ${mailAblauf && mailAblauf.mail ? `<a class="btn glassy" href="${esc(mailLink(mailAblauf.mail))}" style="text-decoration:none">${svg("share")} ${esc(mailAblauf.mail.knopf)}</a>` : ""}
      ${st.aktion === "unterlagen" ? `<button class="btn" id="eU" style="font-size:19px;padding:20px">${svg("docs")} Alle Unterlagen erstellen</button>` : ""}
      ${st.aktion === "meldung" ? `${C.sidas && C.sidas.mail && istScreening() ? `<a class="btn" href="${esc(mailLink(C.sidas.mail))}" style="text-decoration:none">${svg("share")} ${esc(C.sidas.mail.knopf)} (PDF anhängen)</a>` : C.sidas ? `<div class="note glass" style="border:2px solid #008444"><span><b>Aufgriff ohne Screening:</b> ${esc(C.sidas.ohne_screening || "")}</span></div>` : ""}
        ${C.bamf_meldung ? `<a class="btn ${C.sidas && istScreening() ? "glassy" : ""}" href="${esc(mailLink(C.bamf_meldung.mail))}" style="text-decoration:none">${svg("share")} ${esc(C.bamf_meldung.mail.knopf)} (PDF anhängen)</a>` : ""}
        <button class="btn glassy" id="eU">${svg("docs")} Unterlagen / ZIP noch einmal öffnen</button>` : ""}
      ${st.aktion === "ende" ? `<button class="btn glassy danger" id="eL">${svg("trash")} Fall löschen und Einsatz beenden</button>` : ""}
      ${st.uma ? umaKarte(istUma()) : ""}
      <div class="platz-unten"></div>
      <div class="bottombar fest">
        ${nr > 0 ? `<button class="btn glassy" id="eZ" style="flex:.6">${svg("chevl", 2.2)} Zurück</button>` : ""}
        ${nr < liste.length - 1 ? `<button class="btn" id="eW">Weiter ${svg("chevr", 2.2)}</button>` : `<button class="btn" id="eS" style="${farbVars(2)}">${svg("home")} Zur Startseite</button>`}
      </div>`,
    bind: () => {
      const gehe = z => { vibrate(); const r = z > nr ? "fwd" : "back"; uebergang(r, anim => { stack[stack.length - 1] = () => Einsatz(z); render(anim ? (r === "fwd" ? "enter-fwd" : "enter-back") : ""); window.scrollTo(0, 0); }); };
      app.querySelectorAll("[data-eh]").forEach(el => el.onclick = () => {
        vibrate(); const i = +el.dataset.eh; haken.has(i) ? haken.delete(i) : haken.add(i);
        e.haken[st.id] = [...haken]; save();
        el.classList.toggle("on", haken.has(i)); el.setAttribute("aria-checked", haken.has(i));
        const h = app.querySelector("h3.sec small"); if (h) h.textContent = `${haken.size}/${st.punkte.length}`;
      });
      app.querySelectorAll("[data-ph]").forEach(b => b.onclick = () => gehe(liste.findIndex(x => x.phase === b.dataset.ph)));
      dokBinden();
      const eZ = $("eZ"); if (eZ) eZ.onclick = () => gehe(nr - 1);
      const eW = $("eW"); if (eW) eW.onclick = () => gehe(nr + 1);
      const eS = $("eS"); if (eS) eS.onclick = () => { vibrate(); zeigeTab("start"); };
      const eP = $("eP"); if (eP) eP.onclick = () => { vibrate(); go(ScreeningWizard(einsatzErgebnis)); };
      const eF = $("eF"); if (eF) eF.onclick = () => {
        vibrate();
        if (!F) { neuerFall(); fallSpeichern(); }
        go(Erfassung(0, st.erfassen));
      };
      app.querySelectorAll("#eU").forEach(b => b.onclick = () => { vibrate(); go(Originalformulare); });
      const eL = $("eL"); if (eL) eL.onclick = () => {
        if (!confirm("Fall und alle Daten endgültig löschen? Vorher die Unterlagen im Vorgang ablegen.")) return;
        fallUndEinsatzZuruecksetzen();
        zeigeTab("start");
      };
    }
  };
}

// Neue interne Startseite: ein großer Knopf für den Einsatz, daneben der direkte Weg für Geübte
function EinsatzStart() {
  const liste = einsatzSchritte(), e = S.einsatz, laeuft = e && (e.i > 0 || F);
  const a = aufgriff();
  return {
    title: C.meta.titel, hero: true,
    html: hero("", `<h2 class="rounded" style="font-size:30px">${esc(C.meta.titel)}</h2><p class="sub">Was liegt vor? Wähle den Bereich – die App führt dich Schritt für Schritt.</p>`) + `
      <div class="content overlap">
        ${(C.weisungen || []).length ? `<div class="weisungen reveal"><b class="h">${svg("alert", 2.2)} Aktuelle Hinweise</b>${C.weisungen.map(w => `<div class="weisung"><b>${esc(w.titel)}</b>${w.ab ? ` <span class="small">(ab ${esc(w.ab)})</span>` : ""}<div>${inline(w.text)}</div></div>`).join("")}</div>` : ""}
        <h3 class="sec" style="margin-top:6px;justify-content:flex-start;gap:4px"><span class="stufe">1</span> Bereich wählen</h3>
        <div class="bereiche">
          ${[["screening", "sE", laeuft ? `Einsatz läuft – weiter bei Schritt ${e.i + 1} von ${liste.length}: ${liste[e.i].titel}` : "Person hat keine Papiere, ist über die „grüne Grenze“ gekommen oder ist unbekannt.", laeuft ? "Einsatz fortsetzen" : "Einsatz starten", "Beispiel: Afghanischer Staatsangehöriger ohne Papiere in der Innenstadt, kein Treffer in INPOL/AZR."],
             ["os", "", "Person ist bekannt: Visum oder Titel abgelaufen, Duldung, Asylverfahren, Ausreisepflicht.", "Leitfaden öffnen", "Beispiel: Georgische Staatsangehörige, visumfrei eingereist, seit vier Monaten in Deutschland (Overstay)."],
             ["fz", "", "Staatsangehörige/r eines EU-/EWR-Staates oder der Schweiz bzw. Familienangehörige/r.", "Leitfaden öffnen", "Beispiel: Polnischer Staatsangehöriger, täglich Ladendiebstähle, ohne Wohnsitz in Leipzig."]].map(([id, knopf, text, cta, bsp], n) => {
            const B = BEREICHE[id], gewaehlt = S.bereich === id;
            return `<button class="bereich glass press reveal ${gewaehlt ? "gewaehlt" : ""}" style="--b:${B.farbe}" ${knopf ? `id="${knopf}"` : `data-lfs="${id}"`}>
              <span class="bnr">${String.fromCharCode(65 + n)}</span>${gewaehlt ? `<span class="bgew">${svg("check", 3)} zuletzt gewählt</span>` : ""}
              <span class="bico">${svg(B.icon, 2)}</span><h4>${esc(B.name)}</h4><p>${esc(text)}</p><p class="bbsp">${esc(bsp)}</p>
              <span class="cta">${esc(cta)} ${svg("arrowr", 2.4)}</span></button>`;
          }).join("")}
        </div>
        <button class="btn glassy" id="sP">${svg("search")} Nicht sicher, welcher Bereich? Kurz prüfen</button>
        ${laeuft ? `<button class="btn glassy" id="sN" style="margin-top:0">${svg("plus", 2.4)} Neuen Einsatz beginnen</button>` : ""}
        ${F ? `<div style="margin-top:14px">${fallKarte()}</div>` : ""}
        ${a && e && istScreening() ? `<div class="fristen2"><div class="glass"><div class="small"><b>Screening endet spätestens</b></div><b style="color:#e08600">${fmtDatum(screeningFrist(a))}</b><div class="small" style="margin-top:4px">Formular unverzüglich an Referat 2 senden – die LDS braucht Zeit für ihre Maßnahmen.</div></div>
          <div class="glass"><div class="small"><b>Richter (nur bei Festhalten)</b></div><b style="color:var(--coral)">${wert("festgehalten") === "Ja" ? fmtDatum(richterFrist(a)) : "—"}</b></div></div>` : ""}
        ${istUma() ? umaKarte(true) : ""}
        <h3 class="sec" style="justify-content:flex-start;gap:4px"><span class="stufe">2</span> Wie ausführlich?</h3>
        ${modusSchalter()}
        <h3 class="sec" style="justify-content:flex-start;gap:4px"><span class="stufe">3</span> Werkzeuge</h3>
        <div class="grid2">
          ${tile("sD", "Unterlagen erstellen", "Dokumenten-Assistent – alle Formulare ausgefüllt", "docs", 2)}
          ${C.festhalten ? tile("sF", "Festhalteanordnung", "§ 62 Abs. 5 AufenthG – zum Ausdrucken", "lock", 4) : ""}
          ${C.handreichungen ? tile("sH", "Handreichungen", "Zum Aushändigen – Druck oder PDF", "print", 3) : ""}
          ${tile("sC", "Gesamt-Checkliste", "Alle Schritte des Streifendienstes", "list", 5)}
        </div>
        ${istUma() ? "" : umaKarte(false)}
        <div class="note glass" style="margin-top:14px">${svg("lock").replace("<svg", '<svg style="color:var(--coral)"')}<span class="small"><b style="color:var(--coral)">Nur für den Dienstgebrauch.</b> ${esc(C.meta.hinweis_intern || "")}</span></div>
        ${C.meta.copyright ? `<p class="small" style="text-align:center;margin:18px 0 0">${esc(C.meta.copyright)}</p>` : ""}
      </div>`,
    bind: () => {
      modusBinden();
      $("sE").onclick = () => { vibrate(); go(() => Einsatz(laeuft ? e.i : 0)); };
      const sN = $("sN"); if (sN) sN.onclick = () => {
        if (!confirm("Neuen Einsatz beginnen? Die Haken werden zurückgesetzt." + (F ? " Der gespeicherte Fall wird gelöscht – vorher die Unterlagen im Vorgang ablegen." : ""))) return;
        fallUndEinsatzZuruecksetzen(); neuZeichnen();
      };
      $("sD").onclick = () => { vibrate(); go(FallUebersicht); };
      app.querySelectorAll("[data-lfs]").forEach(b => b.onclick = () => { vibrate(); go(() => LeitfadenStart(b.dataset.lfs)); });
      const sH = $("sH"); if (sH) sH.onclick = () => { vibrate(); go(Handreichungen); };
      const sF = $("sF"); if (sF) sF.onclick = () => { vibrate(); go(Festhalteanordnung); };
      $("sP").onclick = () => { vibrate(); go(ScreeningWizard()); };
      $("sC").onclick = () => { vibrate(); go(Ablauf); };
      const fk = $("fk"); if (fk) fk.onclick = () => { vibrate(); go(FallUebersicht); };
    }
  };
}

// umA-Hinweise (interne Ausgabe): aufgeklappt und hervorgehoben, sobald der Fall einen umA betrifft
function umaKarte(offen) {
  const u = C.uma_hilfe;
  if (!u) return "";
  const tel = t => `<a href="tel:${t.replace(/[^0-9+]/g, "")}" style="font-weight:700;white-space:nowrap">${esc(t)}</a>`;
  return `<details class="glass reveal" ${offen ? "open" : ""} style="padding:16px;margin-top:14px;${offen ? "border:2px solid #e75113" : ""}">
    <summary style="cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none">${ico("figure.child", 3, "sm")}<b style="font-size:18px;flex:1">${esc(u.titel)}</b>${offen ? `<span class="badge" style="background:#e75113;color:#fff">dieser Fall</span>` : ""}</summary>
    <ul style="margin:12px 0 0;padding-left:20px">${u.punkte.map(p => `<li style="margin-bottom:6px">${inline(p)}</li>`).join("")}</ul>
    <h4 style="margin:14px 0 6px">Welches Jugendamt?</h4>
    ${u.jugendaemter.map(j => `<div class="rowtile" style="cursor:default;background:var(--bg);margin-bottom:8px;align-items:flex-start"><span class="txt"><span class="t">${esc(j.name)}</span><br><span class="s" style="color:var(--text)">${esc(j.text)}</span>${j.tel ? `<br>${tel(j.tel)}` : ""}</span></div>`).join("")}
  </details>`;
}


// ================= Interne Startseite: Einsatz-Ablauf =================
function mailLink(m) {
  const fuell = t => t.replace(/\{\{(\w+)\}\}/g, (_, id) => platzhalter(id));
  return `mailto:${m.an}?subject=${encodeURIComponent(fuell(m.betreff))}&body=${encodeURIComponent(fuell(m.text))}`;
}

function Ablauf() {
  const a = aufgriff();
  return {
    title: "Einsatz-Ablauf", hero: true,
    html: hero("", `${POL ? "" : EMBLEM(52)}<h2 class="rounded" style="font-size:34px">${esc(C.meta.titel)}</h2><p class="sub">Screening Schritt für Schritt</p>`) + `
      <div class="content overlap">
        <div class="note glass" style="border:1.5px solid var(--coral)">${svg("lock").replace("<svg", '<svg style="color:var(--coral)"')}<span class="small"><b style="color:var(--coral)">Nur für den Dienstgebrauch.</b> ${esc(C.meta.hinweis_intern || "")}</span></div>
        ${fallKarte()}
        ${istUma() ? umaKarte(true) : ""}
        ${a && istScreening() ? `<div class="fristen2"><div class="glass"><div class="small"><b>Screening endet spätestens</b></div><b style="color:#e08600">${fmtDatum(screeningFrist(a))}</b><div class="small" style="margin-top:4px">Formular unverzüglich an Referat 2 senden – die LDS braucht Zeit für ihre Maßnahmen.</div></div>
          <div class="glass"><div class="small"><b>Richter (nur bei Festhalten)</b></div><b style="color:var(--coral)">${wert("festgehalten") === "Ja" ? fmtDatum(richterFrist(a)) : "—"}</b></div></div>` : ""}
        ${C.ablauf.map(s => {
          const set = new Set(S.checklisten["ablauf-" + s.nr] || []);
          const fertig = s.punkte.length && set.size === s.punkte.length;
          return `<div class="glass reveal" style="padding:16px;margin-top:14px">
            <div style="display:flex;gap:12px;align-items:center">
              <span class="num rounded" style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:${fertig ? (POL ? "#008444" : "linear-gradient(135deg,#0b8c78,#006b5c)") : (POL ? "#002664" : "linear-gradient(135deg,#3a8ff0,#1f66cf)")}">${fertig ? "✓" : esc(s.nr)}</span>
              <b style="font-size:19px;flex:1">${esc(s.titel)}</b>${s.punkte.length ? `<span class="small">${set.size}/${s.punkte.length}</span>` : ""}</div>
            ${(s.info || []).map(t => `<p class="small" style="margin:10px 0 0">ⓘ ${esc(t)}</p>`).join("")}
            ${s.punkte.map((p, i) => `<button class="step press check ${set.has(i) ? "on" : ""}" data-ab="${esc(s.nr)}" data-i="${i}" style="margin:10px 0 0;background:transparent;padding:6px 0">
              <span class="cbox">${svg("check", 3)}</span><span class="txt"><span class="strikeme">${esc(p.text)}</span>${p.hinweis ? `<span class="s">${esc(p.hinweis)}</span>` : ""}${entfaelltText(p)}</span></button>${dokZeile(p)}`).join("")}
            ${s.aktion === "pruefung" ? `<button class="btn" data-akt="pruefung" style="margin-bottom:0">${svg("shieldcheck")} Screening-Prüfung starten</button>` : ""}
            ${s.aktion === "fall" ? `<button class="btn" data-akt="fall" style="margin-bottom:0">${svg("pencil")} ${F ? "Angaben erfassen" : "Fall anlegen"}</button>` : ""}
            ${s.aktion === "vorlagen" ? `<button class="btn" data-akt="vorlagen" style="margin-bottom:0;${farbVars(2)}">${svg("docs")} Alle Unterlagen erstellen</button>` : ""}
            ${s.mail && (!s.mail_nur_screening || istScreening()) ? `<a class="btn glassy" href="${esc(mailLink(s.mail))}" style="text-decoration:none;margin-bottom:0">${svg("share")} ${esc(s.mail.knopf)}</a>` : ""}
            ${s.bamf && C.bamf_meldung ? `<a class="btn glassy" href="${esc(mailLink(C.bamf_meldung.mail))}" style="text-decoration:none;margin-bottom:0">${svg("share")} ${esc(C.bamf_meldung.mail.knopf)}</a>` : ""}
          </div>`;
        }).join("")}
        ${istUma() ? "" : umaKarte(false)}
        <button class="btn glassy" id="abReset" style="margin-top:18px">${svg("rotate")} Haken zurücksetzen (neuer Einsatz)</button>
      </div>`,
    bind: () => {
      dokBinden();
      app.querySelectorAll("[data-ab]").forEach(el => el.onclick = () => {
        vibrate();
        const k = "ablauf-" + el.dataset.ab, i = +el.dataset.i, set = new Set(S.checklisten[k] || []);
        set.has(i) ? set.delete(i) : set.add(i);
        S.checklisten[k] = [...set]; save(); neuZeichnen();
      });
      app.querySelectorAll("[data-akt]").forEach(b => b.onclick = () => {
        vibrate();
        const akt = b.dataset.akt;
        if (akt === "pruefung") go(ScreeningWizard());
        if (akt === "fall") { if (!F) { neuerFall(); fallSpeichern(); } go(FallUebersicht); }
        if (akt === "vorlagen") go(Originalformulare);
      });
      const fk = $("fk"); if (fk) fk.onclick = () => { vibrate(); go(FallUebersicht); };
      $("abReset").onclick = () => { if (confirm("Alle Haken im Ablauf entfernen?")) { C.ablauf.forEach(s => delete S.checklisten["ablauf-" + s.nr]); save(); neuZeichnen(); } };
    }
  };
}

renderTabs();
