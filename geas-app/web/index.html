<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEAS Hilfe</title>
<meta name="description" content="Einsatz-, Unterlagen- und Lernhilfe zu GEAS, Screening, Asyl und Rückführung für den Polizeivollzugsdienst">
<meta name="theme-color" content="#003d35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GEAS Hilfe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f2f3f5;
    --text: #15171a;
    --muted: #6b7078;
    --faint: #9aa0a8;
    --line: rgba(20, 24, 28, 0.09);
    --glass: rgba(255, 255, 255, 0.62);
    --glass-strong: rgba(255, 255, 255, 0.82);
    --glass-edge: rgba(255, 255, 255, 0.75);
    --shadow: 0 10px 30px rgba(15, 30, 35, 0.08), 0 2px 6px rgba(15, 30, 35, 0.05);
    --green: #006b5c;
    --deep: #003d35;
    --mint: #61c7b0;
    --amber: #ffbd47;
    --coral: #ff5c5e;
    --ok: #0f8a5f;
    --blob1: rgba(97, 199, 176, 0.38);
    --blob2: rgba(255, 189, 71, 0.22);
    --blob3: rgba(90, 87, 214, 0.16);
    --paper: #ffffff;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --smooth: cubic-bezier(0.22, 1, 0.36, 1);
    --tabbar-h: 74px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d0f;
      --text: #f2f4f5;
      --muted: #a0a6ae;
      --faint: #6d737b;
      --line: rgba(255, 255, 255, 0.09);
      --glass: rgba(34, 38, 42, 0.55);
      --glass-strong: rgba(34, 38, 42, 0.82);
      --glass-edge: rgba(255, 255, 255, 0.12);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --green: #3fbfa2;
      --ok: #3fcf8e;
      --blob1: rgba(63, 191, 162, 0.22);
      --blob2: rgba(255, 189, 71, 0.10);
      --blob3: rgba(110, 107, 234, 0.16);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px);
    overflow-x: hidden;
  }
  .rounded { font-family: ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; }
  button { font: inherit; color: inherit; }

  /* Hintergrund mit langsam wandernden Farbflächen */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg i { position: absolute; border-radius: 50%; filter: blur(90px); animation: drift 26s var(--smooth) infinite alternate; }
  .bg i:nth-child(1) { width: 440px; height: 440px; background: var(--blob1); left: -160px; top: -120px; }
  .bg i:nth-child(2) { width: 380px; height: 380px; background: var(--blob2); right: -150px; top: 38%; animation-delay: -8s; }
  .bg i:nth-child(3) { width: 340px; height: 340px; background: var(--blob3); left: -80px; bottom: -120px; animation-delay: -16s; }
  @keyframes drift { to { transform: translate(40px, 60px) scale(1.12); } }

  /* Glas */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--shadow);
    border-radius: 24px;
  }
  .press { transition: transform .35s var(--spring), box-shadow .3s; cursor: pointer; }
  .press:active { transform: scale(0.965); }

  /* Kopfleiste */
  header.top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; min-height: 52px;
    transition: background .3s, backdrop-filter .3s, border-color .3s;
    border-bottom: 1px solid transparent;
  }
  header.top.solid {
    background: var(--glass-strong);
    backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
    border-bottom-color: var(--line);
  }
  header.top h1 { font-size: 17px; margin: 0; flex: 1; text-align: center; opacity: 0; transition: opacity .25s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.top.solid h1, header.top.plain h1 { opacity: 1; }
  .back {
    display: inline-flex; align-items: center; gap: 2px; border: 0; cursor: pointer;
    padding: 8px 12px 8px 8px; border-radius: 999px; font-weight: 600; color: var(--green);
    background: var(--glass-strong); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .back svg { width: 20px; height: 20px; }
  .back[hidden] { display: none; }
  .spacer { width: 82px; flex: none; }

  main { max-width: 780px; margin: 0 auto; }
  .pad { padding: calc(env(safe-area-inset-top) + 64px) 20px 0; }
  .content { padding: 0 20px; }
  .overlap { margin-top: -30px; position: relative; z-index: 2; }

  /* Hero mit Parallax */
  .hero {
    position: relative; overflow: hidden; color: #fff;
    min-height: 330px; padding: calc(env(safe-area-inset-top) + 70px) 24px 50px;
    display: flex; flex-direction: column; justify-content: flex-end;
    background: linear-gradient(135deg, #075c50, #003d35 55%, #08242a);
  }
  .hero.indigo { background: linear-gradient(135deg, #5a57d6, #221e66); }
  .hero.coral { background: linear-gradient(135deg, #ff735a, #8c2a3d); }
  .hero .deco1, .hero .deco2 { position: absolute; border-radius: 50%; will-change: transform; }
  .hero .deco1 { width: 320px; height: 320px; border: 40px solid rgba(255,255,255,.09); right: -110px; top: -110px; }
  .hero .deco2 { width: 240px; height: 240px; background: rgba(97,199,176,.22); filter: blur(50px); left: -60px; bottom: -40px; }
  .hero .inner { position: relative; will-change: transform, opacity; }
  .hero h2 { font-size: 40px; line-height: 1.05; margin: 12px 0 8px; font-weight: 800; letter-spacing: -0.02em; }
  .hero p { margin: 0; opacity: .85; }
  .hero .sub { font-weight: 600; opacity: .95; }
  .emblem { width: 62px; height: 70px; display: block; }

  h3.sec { display: flex; justify-content: space-between; align-items: baseline; font-size: 23px; font-weight: 800; letter-spacing: -0.01em; margin: 28px 2px 12px; }
  h3.sec small { font-size: 14px; font-weight: 500; color: var(--muted); }

  /* Kacheln */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { display: flex; flex-direction: column; gap: 8px; padding: 16px; min-height: 136px; text-align: left; border: 0; width: 100%; }
  .tile .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .tile .t { font-weight: 700; font-size: 17px; margin-top: auto; line-height: 1.25; }
  .tile .s { font-size: 13px; color: var(--muted); line-height: 1.3; }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
  .ico {
    width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; flex: none; color: #fff;
    box-shadow: 0 4px 12px var(--c-shadow, rgba(0,0,0,.2));
  }
  .ico svg { width: 22px; height: 22px; }
  .ico.lg { width: 56px; height: 56px; border-radius: 17px; }
  .ico.lg svg { width: 28px; height: 28px; }
  .ico.sm { width: 38px; height: 38px; border-radius: 11px; }
  .ico.sm svg { width: 19px; height: 19px; }
  .rowtile { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 20px; width: 100%; border: 0; text-align: left; margin-bottom: 10px; }
  .rowtile .txt { flex: 1; min-width: 0; }
  .rowtile .t { font-weight: 700; }
  .rowtile .s { font-size: 13px; color: var(--muted); }
  .rowtile .end { font-size: 13px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chev { color: var(--faint); width: 16px; height: 16px; flex: none; }

  .herocard { padding: 20px; border-radius: 28px; display: flex; flex-direction: column; gap: 12px; width: 100%; border: 0; text-align: left; }
  .herocard h4 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
  .herocard p { margin: 0; color: var(--muted); }
  .cta {
    display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 700;
    padding: 14px 18px; border-radius: 16px; background: linear-gradient(90deg, var(--c1), var(--c2));
    box-shadow: 0 8px 22px var(--c-shadow);
  }
  .cta svg { width: 20px; height: 20px; }

  .carousel { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 6px 20px 14px; margin: 0 -20px; scrollbar-width: none; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel .card { flex: 0 0 230px; height: 178px; padding: 18px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 10px; }
  .carousel .n { font-size: 34px; font-weight: 800; }

  .note { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 20px; margin-bottom: 10px; font-size: 15px; }
  .note svg { width: 22px; height: 22px; flex: none; margin-top: 1px; }

  /* Knöpfe */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; border: 0; border-radius: 18px;
    font-weight: 700; font-size: 17px; cursor: pointer; margin: 10px 0; color: #fff;
    background: linear-gradient(135deg, var(--c1, #0a7a68), var(--c2, #004f44));
    box-shadow: 0 10px 24px var(--c-shadow, rgba(0, 90, 76, .3));
    transition: transform .35s var(--spring), box-shadow .3s, opacity .2s;
  }
  .btn:active { transform: scale(0.97); box-shadow: 0 3px 10px var(--c-shadow, rgba(0, 90, 76, .3)); }
  .btn svg { width: 20px; height: 20px; }
  .btn.glassy { color: var(--text); background: var(--glass); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: var(--shadow); }
  .btn.danger { color: var(--coral); }
  .btn:disabled { opacity: .4; pointer-events: none; }
  .hstack { display: flex; gap: 12px; }
  .hstack > * { flex: 1; }

  /* Fortschritt */
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--mint), var(--green)); transition: width .6s var(--smooth); min-width: 8px; }
  .ring { width: 76px; height: 76px; flex: none; }
  .small { font-size: 13px; color: var(--muted); }

  /* Prosa */
  .prose { padding: 18px; margin-bottom: 14px; }
  .prose h4 { margin: 0 0 10px; font-size: 19px; }
  .prose p { margin: 0 0 8px; }
  .prose ul, .prose ol { margin: 0 0 8px; padding-left: 22px; }
  .prose li { margin-bottom: 6px; }
  .prose li::marker { color: var(--green); font-weight: 700; }
  .merke { padding: 18px; border-radius: 24px; background: rgba(255, 189, 71, .14); border: 1px solid rgba(255, 189, 71, .38); margin-bottom: 14px; }
  .merke b.h { color: #c77a00; display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  @media (prefers-color-scheme: dark) { .merke b.h { color: var(--amber); } }
  .merke ul { margin: 0; padding-left: 20px; }

  /* Screening-Prüfung */
  .chipnum { display: inline-block; font-size: 12px; font-weight: 800; padding: 5px 11px; border-radius: 99px; background: rgba(0, 107, 92, .14); color: var(--green); }
  .qbig { font-size: 26px; font-weight: 800; line-height: 1.25; margin: 14px 0 16px; letter-spacing: -0.01em; }
  .answer { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 70px; padding: 18px; margin: 0 0 12px; border: 0; text-align: left; font-weight: 700; }
  .answer span { flex: 1; }
  .answer svg { width: 28px; height: 28px; color: var(--green); flex: none; }
  .examples { font-size: 15px; color: var(--muted); margin: 0 4px 18px; }
  .examples b { font-size: 12px; letter-spacing: .06em; }
  .examples ul { margin: 6px 0 0; padding-left: 18px; }
  .result { border-radius: 28px; padding: 22px; color: #fff; margin-bottom: 18px; box-shadow: 0 16px 34px var(--c-shadow); background: linear-gradient(135deg, var(--c1), var(--c2)); }
  .result svg { width: 48px; height: 48px; animation: pop .7s var(--spring) .1s both; }
  .result h2 { margin: 10px 0 8px; font-size: 32px; line-height: 1.1; letter-spacing: -0.01em; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .step { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-radius: 20px; width: 100%; border: 0; text-align: left; margin-bottom: 10px; }
  .step .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 800; font-size: 14px; color: var(--green); background: var(--line); transition: background .3s, color .3s, transform .4s var(--spring); }
  .step.on .dot { background: linear-gradient(135deg, #0a7a68, #004f44); color: #fff; transform: scale(1.08); }
  .step.on .txt > span:first-child { text-decoration: line-through; color: var(--muted); }
  .step .s { font-size: 13px; color: var(--muted); display: block; }
  .bottombar { position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px); display: flex; gap: 12px; margin-top: 18px; z-index: 5; }
  .bottombar .btn { margin: 0; }
  pre.proto { white-space: pre-wrap; font-size: 13px; margin: 0 0 12px; font-family: ui-monospace, Menlo, monospace; }
  .frist { padding: 18px; }
  .frist .row { display: flex; gap: 14px; align-items: flex-start; margin: 14px 0; }
  .frist .d { font-size: 19px; font-weight: 800; }

  /* Formularfelder */
  .field { position: relative; margin-bottom: 14px; }
  .field input, .field textarea {
    width: 100%; font: inherit; color: var(--text); border-radius: 18px; padding: 28px 16px 12px; min-height: 66px;
    border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    outline: none; transition: border-color .2s, box-shadow .25s; resize: none; -webkit-appearance: none;
  }
  .field textarea { min-height: 96px; line-height: 1.4; }
  .field label { position: absolute; left: 17px; top: 21px; color: var(--muted); pointer-events: none; transition: all .3s var(--spring); display: flex; gap: 6px; align-items: center; }
  .field input:focus, .field textarea:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(0, 107, 92, .14); }
  .field input:focus + label, .field textarea:focus + label,
  .field input:not(:placeholder-shown) + label, .field textarea:not(:placeholder-shown) + label { top: 9px; font-size: 12px; font-weight: 700; }
  .field input:focus + label, .field textarea:focus + label { color: var(--green); }
  .field input::placeholder, .field textarea::placeholder { color: transparent; }
  .field input:focus::placeholder, .field textarea:focus::placeholder { color: var(--faint); }
  .pflicht { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 99px; background: rgba(255, 92, 94, .15); color: var(--coral); }
  .pflicht.ok { background: rgba(15, 138, 95, .15); color: var(--ok); }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 4px 0; display: flex; gap: 6px; }
  .box { padding: 16px; border-radius: 20px; margin-bottom: 14px; }
  .box .lbl { font-weight: 700; font-size: 15px; display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--glass); border-radius: 16px; padding: 10px 14px; font-weight: 600; font-size: 15px; cursor: pointer;
    transition: transform .35s var(--spring), background .25s, color .25s, box-shadow .25s; display: inline-flex; gap: 6px; align-items: center; text-align: left;
  }
  .chip:active { transform: scale(.94); }
  .chip.on { background: linear-gradient(135deg, #0a7a68, #004f44); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(0, 90, 76, .3); }
  .chip svg { width: 14px; height: 14px; }
  .stepper { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 10px 20px; margin: 0 -20px; }
  .stepper::-webkit-scrollbar { display: none; }
  .stepper button { flex: none; border: 0; border-radius: 99px; padding: 8px 12px; font-size: 13px; font-weight: 700; background: var(--glass); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; transition: all .3s var(--smooth); }
  .stepper button svg { width: 14px; height: 14px; }
  .stepper button.done { color: var(--green); }
  .stepper button.cur { background: linear-gradient(135deg, #0a7a68, #004f44); color: #fff; }
  input[type=datetime-local] { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }

  /* Fallkarte */
  .casehead { border-radius: 28px; padding: 20px; color: #fff; background: linear-gradient(135deg, #075c50, #003d35 55%, #08242a); box-shadow: 0 16px 34px rgba(0, 61, 53, .35); }
  .casehead h4 { margin: 0; font-size: 28px; font-weight: 800; }
  .casehead .bar { background: rgba(255,255,255,.2); margin: 14px 0 8px; }
  .casehead .bar > div { background: #fff; }
  .casehead .btn { background: #fff; color: var(--deep); box-shadow: none; margin-bottom: 0; }
  .fristen2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .fristen2 > div { padding: 14px; border-radius: 20px; }

  /* Dokument (Papier) */
  .paper { background: var(--paper); color: #1c1c1e; border-radius: 16px; padding: 28px 24px; box-shadow: 0 20px 50px rgba(0,0,0,.18); font-size: 14px; margin-bottom: 18px; }
  .dok header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00584a; padding-bottom: 6px; margin-bottom: 14px; }
  .dok .marke { color: #00584a; font-weight: 700; letter-spacing: .04em; font-size: 11px; }
  .dok .entwurf { border: 1.5px solid #b26200; color: #b26200; font-weight: 700; font-size: 10px; padding: 2px 8px; border-radius: 10px; }
  .dok h1 { font-size: 22px; margin: 0; }
  .dok .unter { color: #6c6c70; margin: 2px 0 12px; }
  .dok h2 { font-size: 15px; color: #00584a; margin: 18px 0 6px; }
  .dok table { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
  .dok td { border: 0.5px solid #c7c7cc; padding: 5px 7px; vertical-align: top; }
  .dok td.l { width: 36%; background: #f2f2f7; font-weight: 600; }
  .dok p { margin: 0 0 6px; white-space: pre-wrap; }
  .dok footer { margin-top: 18px; border-top: 0.5px solid #c7c7cc; padding-top: 6px; color: #8e8e93; font-size: 11px; }
  .dok.neu { margin-top: 36px; padding-top: 24px; border-top: 1px dashed #c7c7cc; }
  #druck { display: none; }
  @media print {
    body { background: #fff; padding: 0; }
    body > *:not(#druck) { display: none !important; }
    #druck { display: block; color: #000; font: 10.5pt -apple-system, Helvetica, Arial, sans-serif; }
    #druck .dok.neu { page-break-before: always; margin-top: 0; padding-top: 0; border-top: 0; }
  }

  /* Quiz & Karten */
  .opt { display: block; width: 100%; text-align: left; padding: 16px; margin: 10px 0; border: 0; font-weight: 600; }
  .opt.ok { background: rgba(15, 138, 95, .16); box-shadow: inset 0 0 0 2px var(--ok); }
  .opt.bad { background: rgba(255, 92, 94, .14); box-shadow: inset 0 0 0 2px var(--coral); }
  .opt.sel { box-shadow: inset 0 0 0 2px var(--green); }
  .qtitle { font-size: 22px; font-weight: 800; margin: 10px 0 6px; line-height: 1.3; }
  .expl { padding: 16px; margin-top: 8px; }
  .flip { perspective: 1200px; margin-bottom: 8px; }
  .flip .inner { position: relative; min-height: 320px; transition: transform .7s var(--spring); transform-style: preserve-3d; cursor: pointer; }
  .flip.back .inner { transform: rotateY(180deg); }
  .flip .face { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; white-space: pre-line; border-radius: 28px; }
  .flip .face.b { transform: rotateY(180deg); background: rgba(0, 107, 92, .12); }
  .flip .front { font-size: 23px; font-weight: 800; }
  .stat { display: flex; gap: 16px; align-items: center; padding: 18px; }
  .fristrow { display: flex; justify-content: space-between; gap: 12px; }
  .normchip { display: inline-block; font-weight: 800; padding: 3px 10px; border-radius: 99px; background: rgba(0, 107, 92, .14); color: var(--green); margin-right: 6px; }
  input[type=search] {
    width: 100%; padding: 15px 18px; border-radius: 20px; font: inherit; color: var(--text); outline: none; -webkit-appearance: none;
    border: 1px solid var(--glass-edge); background: var(--glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: var(--shadow);
  }
  input[type=search]:focus { box-shadow: 0 0 0 4px rgba(0, 107, 92, .16); }
  .check { display: flex; gap: 14px; align-items: flex-start; }
  .cbox { width: 28px; height: 28px; border-radius: 9px; background: var(--line); display: grid; place-items: center; flex: none; color: #fff; transition: all .35s var(--spring); }
  .cbox svg { width: 16px; height: 16px; opacity: 0; transform: scale(.4); transition: all .35s var(--spring); }
  .on .cbox { background: linear-gradient(135deg, #0a7a68, #004f44); }
  .on .cbox svg { opacity: 1; transform: none; }
  .on .strikeme { text-decoration: line-through; color: var(--muted); }

  /* Schwebende Reiterleiste (Liquid-Glass-Stil) */
  nav.tabs {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 40;
    width: min(calc(100% - 24px), 520px); height: var(--tabbar-h);
    display: flex; justify-content: space-around; align-items: center; padding: 6px;
    background: var(--glass-strong); backdrop-filter: blur(26px) saturate(190%); -webkit-backdrop-filter: blur(26px) saturate(190%);
    border: 1px solid var(--glass-edge); border-radius: 999px; box-shadow: 0 14px 40px rgba(0, 0, 0, .18);
  }
  nav.tabs .pill { position: absolute; top: 6px; bottom: 6px; border-radius: 999px; background: rgba(0, 107, 92, .13); transition: left .5s var(--spring), width .5s var(--spring); }
  nav.tabs button {
    position: relative; background: none; border: 0; color: var(--muted); font-size: 11px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; cursor: pointer; padding: 6px 0; transition: color .3s, transform .35s var(--spring);
  }
  nav.tabs button:active { transform: scale(.9); }
  nav.tabs button svg { width: 25px; height: 25px; }
  nav.tabs button.on { color: var(--green); }

  /* Übergänge */
  .enter-fwd { animation: inR .5s var(--smooth) both; }
  .enter-back { animation: inL .5s var(--smooth) both; }
  .enter-fade { animation: fadeUp .45s var(--smooth) both; }
  @keyframes inR { from { opacity: 0; transform: translateX(40px); } }
  @keyframes inL { from { opacity: 0; transform: translateX(-40px); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .45s; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  html.vt-fwd::view-transition-old(root) { animation-name: outL; }
  html.vt-fwd::view-transition-new(root) { animation-name: inR; }
  html.vt-back::view-transition-old(root) { animation-name: outR; }
  html.vt-back::view-transition-new(root) { animation-name: inL; }
  @keyframes outL { to { opacity: 0; transform: translateX(-40px); } }
  @keyframes outR { to { opacity: 0; transform: translateX(40px); } }
  .reveal { opacity: 0; transform: translateY(18px) scale(.98); transition: opacity .6s var(--smooth), transform .6s var(--smooth); }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }

  /* Modale Einführung */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 60; display: grid; place-items: end center; animation: fadeIn .3s both; }
  @keyframes fadeIn { from { opacity: 0; } }
  .sheet { background: var(--bg); width: 100%; max-width: 640px; border-radius: 30px 30px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); max-height: 94vh; overflow: auto; animation: sheetUp .55s var(--spring) both; position: relative; }
  @keyframes sheetUp { from { transform: translateY(100%); } }
  .sheet h2 { font-size: 30px; margin: 14px 0 10px; letter-spacing: -0.01em; }
  .sheet .icon { display: grid; place-items: center; margin: 12px 0; }
  .sheet .emb { padding: 22px; border-radius: 30px; background: linear-gradient(135deg, #075c50, #003d35); box-shadow: 0 14px 30px rgba(0,61,53,.35); animation: pop .7s var(--spring) both; }
  .sheet .ico.xl { width: 92px; height: 92px; border-radius: 28px; animation: pop .7s var(--spring) both; }
  .sheet .ico.xl svg { width: 44px; height: 44px; }
  .dots { display: flex; justify-content: center; gap: 7px; margin: 16px 0 8px; }
  .dots span { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: all .4s var(--spring); }
  .dots span.on { width: 24px; background: var(--green); }
  .confirm { display: flex; gap: 12px; align-items: center; font-weight: 700; padding: 16px; border-radius: 20px; cursor: pointer; }
  .confirm input { width: 26px; height: 26px; accent-color: var(--green); flex: none; }
  .sheet label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 4px 4px; }
  .sheet input[type=text], .sheet input[type=tel] { width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); color: var(--text); font: inherit; }
  a { color: var(--green); }

<script id="content" type="application/json">{"meta":{"titel":"GEAS & Rückführung","untertitel":"Einsatz- und Lernhilfe für den Polizeivollzugsdienst – Zuschnitt Polizei Sachsen / PD Leipzig","version":"2.0.0","stand":"September 2026","hinweis":"Diese App ist eine inoffizielle Arbeits- und Lernhilfe. Sie ersetzt weder Gesetzestext, Erlasse, Dienstanweisungen der Polizei Sachsen noch die Weisung der zuständigen Ausländerbehörde oder der Führung im Einsatz. Rechtsstand: GEAS-Reform (EU) und GEAS-Anpassungsgesetz, in Kraft seit 12.06.2026. Paragraphenangaben zum neuen nationalen Recht vor dienstlicher Verwendung stets gegen die aktuelle Gesetzesfassung und die Erlasslage des SMI prüfen. Personenbezogene Daten nur im Unterlagen-Assistenten und nur auf dienstlich zugelassenen Geräten erfassen; erzeugte Unterlagen sind Entwürfe, maßgeblich sind die amtlichen Vordrucke."},"kapitel":[{"id":"grundlagen","titel":"GEAS – Überblick","icon":"globe.europe.africa","kurz":"Was ist die GEAS-Reform, welche Rechtsakte gibt es und seit wann gelten sie?","abschnitte":[{"titel":"Worum geht es?","text":"Das Gemeinsame Europäische Asylsystem (GEAS) ist der europäische Rechtsrahmen für Asyl, Zuständigkeit, Aufnahme und Rückkehr. Mit der **GEAS-Reform 2024** hat die EU das System grundlegend neu gefasst. Die meisten Rechtsakte sind **Verordnungen** – sie gelten in Deutschland **unmittelbar**, ohne dass es eines deutschen Gesetzes bedarf.\n\nDie neuen Regeln gelten seit dem **12. Juni 2026**. Deutschland hat sein nationales Recht mit dem **GEAS-Anpassungsgesetz** und dem **GEAS-Anpassungsfolgegesetz** angepasst (Bundestag 27.02.2026, Bundesrat 27.03.2026, verkündet Ende April 2026). Geändert wurden vor allem AsylG, AufenthG und AsylbLG."},{"titel":"Die Rechtsakte der Reform","text":"• **Screening-VO** – VO (EU) 2024/1356: Überprüfung von Drittstaatsangehörigen (Identität, Gesundheit, Vulnerabilität, Sicherheit)\n• **Eurodac-VO** – VO (EU) 2024/1358: biometrische Datenbank (Fingerabdrücke + Gesichtsbild)\n• **AMM-VO** – VO (EU) 2024/1351: Asyl- und Migrationsmanagement, Zuständigkeit (Nachfolger der Dublin-III-VO), Solidarität\n• **Asylverfahrens-VO (AVVO)** – VO (EU) 2024/1348: einheitliches Asylverfahren inkl. Grenzverfahren\n• **Rückkehr-Grenzverfahrens-VO** – VO (EU) 2024/1349\n• **Krisen-VO** – VO (EU) 2024/1359: Krisen und höhere Gewalt\n• **Anerkennungs-VO** – VO (EU) 2024/1347: Voraussetzungen für internationalen Schutz\n• **Aufnahme-RL** – RL (EU) 2024/1346: Aufnahmebedingungen (national umgesetzt)\n• **Neuansiedlungs-VO** – VO (EU) 2024/1350: Resettlement\n\nDie **Rückführungsrichtlinie 2008/115/EG** bleibt bis auf Weiteres Grundlage des nationalen Rückkehrrechts (AufenthG)."},{"titel":"Der Weg einer Person durch das neue System","text":"1. **Aufgriff / Ankunft** – an der Außengrenze oder im Inland (z. B. bei einer Kontrolle in Leipzig)\n2. **Screening** – Identität, Gesundheit, Vulnerabilität, Sicherheit, Eurodac\n3. **Weiterleitung** – ins Asylverfahren (regulär, beschleunigt oder Grenzverfahren) oder ins Rückkehrverfahren\n4. **Zuständigkeitsprüfung** nach AMM-VO – ggf. Überstellung in den zuständigen Mitgliedstaat\n5. **Asylentscheidung** durch das BAMF – bei Ablehnung zugleich **Rückkehrentscheidung**\n6. **Rückkehr** – freiwillig oder zwangsweise (Abschiebung) – hier liegt der Schwerpunkt der Landespolizei"},{"titel":"Was ändert sich für die Polizei vor Ort?","text":"• **Screening im Inland**: Wer unerlaubt aufhältig angetroffen wird und noch nicht an einer Außengrenze überprüft wurde, ist grundsätzlich zu überprüfen (max. 3 Tage). Nach § 71 Abs. 4a AufenthG sind hierfür u. a. die **Polizeien der Länder** zuständig; die konkrete Aufgabenverteilung regelt das Landesrecht.\n• **Eurodac** erfasst nun bereits ab **6 Jahren** Fingerabdrücke **und** Gesichtsbild.\n• **Neue Haftformen**: u. a. Überprüfungshaft (Screening), Asylverfahrenshaft (§§ 69 ff. AsylG), Überstellungshaft (Art. 44 AMM-VO).\n• **Sekundärmigrationszentren** für Personen, für die ein anderer Mitgliedstaat zuständig ist – in Sachsen seit 01.07.2026 in Dresden.\n• Klassische Rückführung (Abschiebung, Abschiebungshaft, Ausreisegewahrsam) bleibt im AufenthG geregelt."}],"merke":["Stichtag: 12.06.2026 – seitdem gelten GEAS-Verordnungen unmittelbar.","EU-Verordnungen gehen nationalem Recht vor; das AufenthG/AsylG ergänzt und konkretisiert.","Die Landespolizei ist vor allem bei Aufgriff, Screening im Inland, Festnahme und Vollzug von Rückführungen gefordert."]},{"id":"screening","titel":"Screening","icon":"person.text.rectangle","kurz":"Überprüfung nach der Screening-VO – an der Außengrenze und im Inland.","abschnitte":[{"titel":"Wer wird überprüft?","text":"• Personen, die die **EU-Außengrenze unerlaubt überschritten** haben (Aufgriff im Grenzzusammenhang)\n• Personen, die an der Außengrenze (auch Flughafen/Seehafen) **internationalen Schutz beantragen**, ohne die Einreisevoraussetzungen zu erfüllen\n• Nach **Seenotrettung** ausgeschiffte Personen\n• **Im Inland**: Drittstaatsangehörige, die sich **unerlaubt** im Hoheitsgebiet aufhalten, wenn es keine Anhaltspunkte gibt, dass sie bereits an der Außengrenze überprüft wurden (Art. 7 Screening-VO)"},{"titel":"Inhalt des Screenings","text":"• **Identifizierung/Identitätsprüfung** – Dokumente, Datenbankabgleich\n• **Vorläufige Gesundheitskontrolle** – durch die nach Landesrecht zuständigen Gesundheitsbehörden\n• **Vorläufige Vulnerabilitätsprüfung** – z. B. Minderjährige, Schwangere, Opfer von Menschenhandel, Folter, Behinderung\n• **Sicherheitsprüfung** – Abgleich u. a. SIS, Europol-, Interpol- und nationale Datenbanken\n• **Erfassung biometrischer Daten** in Eurodac\n• Ausfüllen des **Überprüfungsformulars** (Screening-Formular)"},{"titel":"Dauer und Rechtsgrundlagen (national)","text":"• Außengrenze: höchstens **7 Tage** – § 14a AufenthG (Zuständigkeit an Flug- und Seehäfen i. d. R. Bundespolizei)\n• Inland: höchstens **3 Tage** – § 15b AufenthG\n• Die Person ist zur Durchführung **festzuhalten** und an einen geeigneten Ort zu **verbringen**, wenn die Überprüfung sonst nicht oder nur unter erheblichen Schwierigkeiten möglich ist.\n• **Freilassen**, wenn nicht **bis zum Ende des Tages nach dem Ergreifen** eine **richterliche Entscheidung** über die Fortdauer vorliegt (Art. 104 GG).\n• Zuständigkeit: § 71 Abs. 4a AufenthG – Polizeien der Länder sowie weitere nach Landesrecht bestimmte Behörden (z. B. Ausländerbehörden, Aufnahmeeinrichtungen). **Die sächsische Aufgabenverteilung (Zuständigkeitsverordnung/Erlass SMI) beachten.**"},{"titel":"Ergebnis des Screenings","text":"Das Screening endet mit der **Weiterleitung**:\n• ins **Asylverfahren** (regulär oder Grenzverfahren), wenn ein Antrag auf internationalen Schutz gestellt wurde,\n• ins **Zuständigkeitsverfahren** (AMM-VO), wenn ein anderer Mitgliedstaat zuständig sein könnte,\n• ins **Rückkehrverfahren**, wenn kein Schutzantrag gestellt wurde und kein Aufenthaltsrecht besteht.\n\nWichtig: Während des Screenings **bleibt das Recht, Asyl zu beantragen**, unberührt. Ein Asylgesuch ist aufzunehmen und weiterzugeben."},{"titel":"Praxis PD Leipzig","text":"• Unerlaubt Aufhältige werden in Leipzig häufig bei Verkehrs-, Bahnhofs- oder Personenkontrollen angetroffen. Vor Einleitung eines Screenings **Eurodac-/INPOL-/AZR-Abfrage** – ist die Person bereits erfasst oder überprüft, entfällt das Screening regelmäßig.\n• **Minderjährige** und **Vulnerable** frühzeitig erkennen und dokumentieren (Jugendamt bei UMA).\n• **Sprachmittlung** sicherstellen; Belehrung in einer verständlichen Sprache.\n• Fristen strikt überwachen: **Richtervorbehalt** bei Festhalten über den Folgetag hinaus."}],"merke":["Inland: max. 3 Tage, Außengrenze: max. 7 Tage.","Festhalten über das Ende des Folgetages hinaus nur mit richterlicher Entscheidung.","Screening ist kein Asylverfahren – Asylgesuche bleiben jederzeit möglich."]},{"id":"eurodac","titel":"Eurodac & Identität","icon":"touchid","kurz":"Biometrische Erfassung, Speicherfristen, Identitätsfeststellung.","abschnitte":[{"titel":"Neues Eurodac","text":"• Erfassung von **Fingerabdrücken und Gesichtsbild**\n• Erfassung bereits **ab 6 Jahren** (bisher 14)\n• Zusätzliche Kategorien, u. a. unerlaubt Aufhältige, nach Seenotrettung Ausgeschiffte, Resettlement, vorübergehender Schutz\n• Speicherdauer u. a.: Antragstellende **10 Jahre**, irreguläre Einreise/unerlaubter Aufenthalt **5 Jahre**\n• **Sicherheitskennzeichnung**, wenn die Person eine Gefahr für die innere Sicherheit darstellen könnte\n• Eurodac wird mit anderen EU-Informationssystemen interoperabel"},{"titel":"Identitätsfeststellung im AufenthG/AsylG","text":"• **§ 49 AufenthG** – Überprüfung, Feststellung und Sicherung der Identität; erkennungsdienstliche Maßnahmen\n• **§ 16 AsylG** – Sicherung der Identität bei Asylsuchenden (ED-Behandlung)\n• **§ 48 AufenthG** – Ausweispflichten; bei fehlendem Pass Mitwirkungspflicht und **Durchsuchung nach Identitätsdokumenten** sowie Auswertung von **Datenträgern** unter den dort genannten Voraussetzungen\n• **§ 48a AufenthG** – Herausgabe von Zugangsdaten zu Datenträgern\n\nBei Kindern: altersgerecht, kindgerecht und in Anwesenheit einer Vertrauensperson/eines Vertreters vorgehen."},{"titel":"Praxistipps","text":"• Vor jeder Maßnahme prüfen: **AZR, INPOL, SIS, Eurodac** (über die vorhandenen Fahndungs-/ED-Systeme)\n• Widersprüchliche Personalien immer als **Aliaspersonalien** dokumentieren\n• Mobiltelefone nicht ohne Rechtsgrundlage auswerten – § 48 Abs. 3a AufenthG (Datenträgerauswertung) setzt u. a. voraus, dass der Zweck nicht durch mildere Mittel erreicht werden kann\n• Dokumente sicherstellen und der Ausländerbehörde zuleiten (§ 48 AufenthG)"}],"merke":["Eurodac ab 6 Jahren – Fingerabdrücke + Gesichtsbild.","Aliaspersonalien vollständig dokumentieren.","Datenträgerauswertung nur unter den engen Voraussetzungen des § 48 Abs. 3a AufenthG."]},{"id":"asylverfahren","titel":"Asylverfahren","icon":"doc.text.magnifyingglass","kurz":"Antrag stellen, registrieren, förmlich stellen – regulär, beschleunigt, Grenzverfahren.","abschnitte":[{"titel":"Asylgesuch bei der Polizei","text":"Wer gegenüber der Polizei um Schutz nachsucht (auch nur sinngemäß, z. B. „Asyl“, „Protection“, Angst vor Rückkehr), hat einen **Antrag auf internationalen Schutz gestellt** (Stufe „Stellen“ nach AVVO). Die Polizei zählt zu den Behörden, bei denen Anträge wahrscheinlich gestellt werden, und muss:\n• das Gesuch **aufnehmen und dokumentieren**,\n• die Person über das weitere Verfahren **informieren** (wo und wie förmlich stellen),\n• die Person an die **zuständige Aufnahmeeinrichtung** bzw. das BAMF **weiterleiten** (vgl. § 19 AsylG) und\n• ggf. **erkennungsdienstlich behandeln** (§ 16 AsylG).\n\nDie Polizei **prüft das Asylgesuch nicht inhaltlich**."},{"titel":"Drei Stufen nach der Asylverfahrens-VO","text":"1. **Stellen** (making) – Äußerung des Schutzwunsches gegenüber einer Behörde\n2. **Registrieren** – grundsätzlich innerhalb von **5 Tagen** (bei vielen Anträgen bis 15 Tage)\n3. **Förmlich stellen** (lodging) – grundsätzlich innerhalb von **21 Tagen** nach Registrierung beim BAMF\n\nMit der Antragstellung entsteht grundsätzlich ein **Recht auf Verbleib** bis zur Entscheidung (Ausnahmen u. a. bei bestimmten Folgeanträgen)."},{"titel":"Verfahrensarten","text":"• **Reguläres Verfahren** – Entscheidung grundsätzlich binnen **6 Monaten**\n• **Beschleunigtes Verfahren** – u. a. bei Täuschung über Identität, sicherem Herkunftsstaat, Gefahr für die Sicherheit, Herkunftsland mit **EU-weiter Anerkennungsquote ≤ 20 %**; Entscheidung binnen **3 Monaten**\n• **Grenzverfahren** – an der Außengrenze (in Deutschland v. a. Flughäfen), Dauer höchstens **12 Wochen** einschließlich Rechtsbehelf; verpflichtend u. a. bei Täuschung, Sicherheitsgefahr und Anerkennungsquote ≤ 20 %. Unbegleitete Minderjährige grundsätzlich nur bei Sicherheitsgefahr.\n• **Folgeantrag** – neuer Antrag nach bestandskräftiger Ablehnung; Recht auf Verbleib kann eingeschränkt sein"},{"titel":"Ablehnung = Rückkehrentscheidung","text":"Wird ein Antrag abgelehnt, ergeht nach der AVVO **zugleich eine Rückkehrentscheidung** (in Deutschland: Abschiebungsandrohung durch das BAMF). Damit verzahnen sich Asyl- und Rückkehrverfahren enger als bisher."},{"titel":"Aufenthaltsrechtliche Stellung während des Verfahrens","text":"• **Aufenthaltsgestattung** (§ 55 AsylG) – Nachweis: Ankunftsnachweis bzw. Bescheinigung über die Aufenthaltsgestattung\n• **Wohnverpflichtung** in der Aufnahmeeinrichtung (§ 47 AsylG)\n• **Räumliche Beschränkung** (§ 56 AsylG) – Verstöße: § 86 AsylG (OWi), wiederholt § 85 AsylG (Straftat)\n• **Asylverfahrenshaft** (§§ 69–70a AsylG) – nur durch **richterliche Anordnung**, nur wenn verhältnismäßig und kein milderes Mittel (z. B. Meldeauflage, Sicherheitsleistung) ausreicht"}],"merke":["Jedes erkennbare Schutzersuchen ist ein Asylgesuch – aufnehmen, dokumentieren, weiterleiten.","Die Polizei prüft keine Asylgründe.","Grenzverfahren: max. 12 Wochen. Beschleunigt: 3 Monate. Regulär: 6 Monate."]},{"id":"zustaendigkeit","titel":"Zuständigkeit & Überstellung (AMM-VO)","icon":"arrow.left.arrow.right.circle","kurz":"Nachfolger von Dublin III: Wer ist zuständig, wie wird überstellt, Sekundärmigrationszentrum.","abschnitte":[{"titel":"Grundprinzip","text":"Für jeden Antrag auf internationalen Schutz ist **genau ein Mitgliedstaat** zuständig. Die Kriterien stehen in einer festen Rangfolge in der AMM-VO (VO 2024/1351), u. a.:\n• Familienangehörige / unbegleitete Minderjährige\n• Aufenthaltstitel oder Visum\n• **Bildungsabschluss** eines Mitgliedstaates (neues Kriterium)\n• **Irreguläre Einreise** – der Ersteinreisestaat bleibt nun **20 Monate** zuständig (bisher 12); nach Seenotrettung 12 Monate\n\nNicht zuständige Staaten müssen – außer einem menschenwürdigen Existenzminimum – keine Aufnahmeleistungen gewähren."},{"titel":"Überstellungsfristen","text":"• Regelfrist: **6 Monate** ab Zustimmung/Bestätigung des zuständigen Mitgliedstaates\n• Verlängerung auf bis zu **1 Jahr**, wenn die Person inhaftiert ist\n• Verlängerung auf bis zu **3 Jahre**, wenn die Person **flüchtig** ist oder sich der Überstellung entzieht (bisher 18 Monate)\n\nFür Wiederaufnahmen gibt es statt eines Gesuchs eine **Wiederaufnahmemitteilung**, die der andere Staat nur noch bestätigt."},{"titel":"Überstellungshaft","text":"Rechtsgrundlage ist nun **Art. 44 Abs. 2 AMM-VO** (bisher Art. 28 Dublin III). Voraussetzung ist insbesondere **erhebliche Fluchtgefahr** bzw. eine Gefahr für die öffentliche Sicherheit; Haft nur so kurz wie möglich, nach Einzelfallprüfung und durch richterliche Anordnung. Das Verfahren (Antrag, Anhörung) richtet sich weiterhin nach dem FamFG; ergänzend gelten die nationalen Vorschriften des AufenthG."},{"titel":"Sekundärmigrationszentrum Sachsen","text":"Die **Landesdirektion Sachsen** betreibt seit dem **01.07.2026** ein **Sekundärmigrationszentrum** in **Dresden** (Standort des früheren Landesausreisezentrums).\n• Unterbringung von Personen, die in einen anderen EU-Staat **zu überstellen** sind, weil Deutschland nicht zuständig ist\n• bis zu **400 Plätze**, auch für Familien\n• Aufenthalt höchstens **24 Monate**, bei Familien mit minderjährigen Kindern höchstens **12 Monate**\n• Förderung der freiwilligen Ausreise\n\nFür die Polizei relevant: **Verlassen/Entziehen** kann Anlass für Fahndung/Aufenthaltsermittlung und Haftanträge sein – Maßnahmen immer in Abstimmung mit der LDS."}],"merke":["Überstellungsfrist 6 Monate – bei Flucht bis 3 Jahre, bei Haft bis 1 Jahr.","Ersteinreisestaat bleibt 20 Monate zuständig.","Sekundärmigrationszentrum Dresden seit 01.07.2026 (LDS)."]},{"id":"rueckfuehrung","titel":"Ausreisepflicht & Abschiebung","icon":"airplane.departure","kurz":"Vom vollziehbar Ausreisepflichtigen bis zur Übergabe am Flughafen.","abschnitte":[{"titel":"Voraussetzungen der Abschiebung (§ 58 AufenthG)","text":"Abgeschoben werden darf, wer\n• **ausreisepflichtig** ist (§ 50 AufenthG – kein erforderlicher Aufenthaltstitel),\n• dessen Ausreisepflicht **vollziehbar** ist,\n• dessen **Ausreisefrist abgelaufen** ist (bzw. keine gewährt wurde) und\n• dessen freiwillige Erfüllung **nicht gesichert** ist oder dessen Überwachung erforderlich ist.\n\nIn der Regel ist die Abschiebung zuvor **angedroht** (§ 59 AufenthG, Ausreisefrist grundsätzlich 7–30 Tage). Der **Termin der Abschiebung darf nicht angekündigt** werden (§ 59 Abs. 1 Satz 8 AufenthG)."},{"titel":"Hindernisse erkennen","text":"• **Abschiebungsverbote** (§ 60 AufenthG) – z. B. Flüchtlingseigenschaft, Gefahr nach Art. 3 EMRK, erhebliche konkrete Gefahr für Leib, Leben oder Freiheit\n• **Duldung** (§ 60a AufenthG) – vorübergehende Aussetzung; eine gültige Duldung schließt die Abschiebung aus, solange sie nicht widerrufen/erloschen ist\n• **Reisefähigkeit**: gesetzliche Vermutung, dass gesundheitliche Gründe nicht entgegenstehen (§ 60a Abs. 2c AufenthG); Ausnahme bei **qualifizierter ärztlicher Bescheinigung**. Neue akute Beschwerden im Einsatz dennoch **immer ärztlich klären lassen**.\n• **Asyl-/Folgeantrag** während der Maßnahme – aufnehmen, sofort an die zuständige Ausländerbehörde melden; **die Entscheidung über den Fortgang trifft die Ausländerbehörde**, nicht die Einsatzkraft.\n• **Eilantrag beim Verwaltungsgericht** – Rückmeldung der Ausländerbehörde abwarten"},{"titel":"Rolle der Landespolizei (§ 71 Abs. 5 AufenthG)","text":"Die Polizeien der Länder sind **auch zuständig** für\n• die **Zurückschiebung**,\n• die Durchsetzung der Verlassenspflicht,\n• die **Durchführung der Abschiebung** sowie\n• – soweit zur Vorbereitung und Sicherung erforderlich – die **Festnahme** und die **Beantragung der Haft**.\n\nIn Sachsen wird die Abschiebung von der **Zentralen Ausländerbehörde (ZAB) der Landesdirektion Sachsen** organisiert. Die Polizei leistet regelmäßig **Vollzugshilfe** (SächsPVDG): Die ersuchende Behörde verantwortet die **Rechtmäßigkeit der Maßnahme**, die Polizei die **Art und Weise der Durchführung**."},{"titel":"Betreten und Durchsuchen (§ 58 Abs. 5–10 AufenthG)","text":"• **Betreten** der Wohnung zur Ergreifung, wenn Tatsachen vorliegen, dass sich die Person dort befindet (Abs. 5). In Gemeinschaftsunterkünften dürfen dabei auch **andere Räumlichkeiten** betreten werden.\n• **Durchsuchung** der Wohnung zur Ergreifung (Abs. 6) – nur auf **richterliche Anordnung**, bei **Gefahr im Verzug** auch durch die die Abschiebung durchführende Behörde (Abs. 8).\n• **Nachtzeit**: Betreten/Durchsuchen nur, wenn Tatsachen die Annahme rechtfertigen, dass die Ergreifung sonst **vereitelt** würde (Abs. 7). Die Organisation der Abschiebung allein ist **kein** solcher Grund.\n• Die richterliche Durchsuchungsanordnung ist **mitzuführen** bzw. zu **eröffnen**; Protokoll über Durchsuchung anfertigen."},{"titel":"Ablauf einer Rückführung (vereinfacht, Sachsen)","text":"1. **Ersuchen** der ZAB/LDS an die Polizei (Vollzugshilfe) mit Personen-, Gefährdungs- und Fluginformationen\n2. **Einsatzplanung** – Lage, Kräfte (inkl. weiblicher Kräfte), Sprachmittlung, Arzt, Jugendamt bei Kindern, Transport\n3. **Zugriff** – i. d. R. frühmorgens; Belehrung, Eröffnung der Maßnahme, Zeit zum Packen\n4. **Durchsuchung** der Person (Eigensicherung) und des Gepäcks; Dokumente, Medikamente, Bargeld sichern\n5. **Transport** – zum Flughafen (häufig **Leipzig/Halle**), zur Abschiebungshafteinrichtung **Dresden** oder zur Übergabestelle\n6. **Übergabe** an die **Bundespolizei** (Flughafen, Luftweg) bzw. an die Grenzbehörde\n7. **Dokumentation** – Einsatzbericht, Zwangsanwendung, Verletzungen, Besonderheiten; Rückmeldung an die LDS"}],"merke":["Rechtmäßigkeit der Abschiebung verantwortet die Ausländerbehörde, die Art der Durchführung die Polizei.","Abschiebungstermin nie ankündigen.","Durchsuchung der Wohnung: Richtervorbehalt; Nachtzeit nur bei drohender Vereitelung.","Bei Asylgesuch, Krankheit, Suizidalität: sofort Rücksprache mit der ZAB/LDS."]},{"id":"haft","titel":"Festnahme & Haft","icon":"lock.shield","kurz":"Abschiebungshaft, Ausreisegewahrsam, vorläufige Ingewahrsamnahme, neue GEAS-Haftformen.","abschnitte":[{"titel":"Grundsätze","text":"• Freiheitsentziehung nur durch den **Richter** (Art. 104 GG) – bei Abschiebungshaft das **Amtsgericht** (FamFG)\n• Haft ist **unzulässig**, wenn der Zweck durch ein **milderes Mittel** erreicht werden kann (§ 62 Abs. 1 AufenthG)\n• **Minderjährige und Familien mit Minderjährigen** nur in besonderen Ausnahmefällen und nur so lange, wie es unter Berücksichtigung des Kindeswohls angemessen ist\n• Unverzügliche **Belehrung** und Benachrichtigung (Konsulat auf Wunsch, Angehörige, Rechtsbeistand)"},{"titel":"Haftarten im AufenthG","text":"• **Vorbereitungshaft** (§ 62 Abs. 2) – bis **6 Wochen**, wenn über eine Ausweisung/Abschiebungsanordnung nicht sofort entschieden werden kann\n• **Sicherungshaft** (§ 62 Abs. 3) – bei Fluchtgefahr u. a.; bis **6 Monate**, Verlängerung um bis zu **12 Monate** (max. 18)\n• **Ausreisegewahrsam** (§ 62b) – bis **28 Tage**, im Transitbereich eines Flughafens oder in einer Unterkunft mit Ausreisemöglichkeit\n• **Mitwirkungshaft** (§ 62 Abs. 6) – zur Vorführung bei Botschaft/Arzt, bis 14 Tage\n• **Ergänzende Vorbereitungshaft** (§ 62c)"},{"titel":"Vorläufige Ingewahrsamnahme (§ 62 Abs. 5 AufenthG)","text":"Die Polizei darf eine Person **ohne vorherige richterliche Anordnung** festhalten und vorläufig in Gewahrsam nehmen, wenn\n1. der **dringende Verdacht** für das Vorliegen der Voraussetzungen der Sicherungshaft besteht,\n2. die richterliche Entscheidung über die Anordnung der Sicherungshaft **nicht vorher eingeholt** werden kann und\n3. der **begründete Verdacht** vorliegt, dass sich die Person der Anordnung der Sicherungshaft **entziehen** will.\n\nDie Person ist **unverzüglich dem Richter** zur Entscheidung vorzuführen. Haftantrag in Abstimmung mit der zuständigen Ausländerbehörde."},{"titel":"Neue Haftformen seit GEAS","text":"• **Überprüfungshaft** – Screening an der Außengrenze (§ 14a AufenthG) und im Inland (§ 15b AufenthG); Festhalten ohne Richter nur bis zum Ende des Folgetages\n• **Asylverfahrenshaft** – §§ 69–70a AsylG, nur auf richterliche Anordnung, Verhältnismäßigkeit/mildere Mittel\n• **Überstellungshaft** – Art. 44 Abs. 2 AMM-VO\n• **Haft im Rückkehr-Grenzverfahren** – Art. 5 VO 2024/1349\n\nDie genaue Ausgestaltung (Haftgründe, Höchstdauern) jeweils im Gesetzestext bzw. in der Erlasslage nachlesen."},{"titel":"Einrichtung in Sachsen","text":"Abschiebungshaft und Ausreisegewahrsam werden in Sachsen in der **Einrichtung zum Vollzug der Abschiebungshaft und des Ausreisegewahrsams in Dresden** (Zuständigkeit: Landesdirektion Sachsen) vollzogen – getrennt von Strafgefangenen (§ 62a AufenthG). Kapazität: 58 Plätze (24 Abschiebungshaft, 34 Ausreisegewahrsam; Stand der letzten Veröffentlichung, ggf. geändert)."}],"merke":["Kein Festhalten ohne Richter über das gesetzlich zulässige Maß hinaus.","Ausreisegewahrsam: max. 28 Tage.","Sicherungshaft: 6 Monate, max. 18 Monate.","Mildere Mittel immer zuerst prüfen und dokumentieren."]},{"id":"vulnerable","titel":"Besondere Personengruppen","icon":"figure.and.child.holdinghands","kurz":"UMA, Familien, Kranke, Schwangere, Opfer von Menschenhandel, Kirchenasyl.","abschnitte":[{"titel":"Unbegleitete Minderjährige (UMA)","text":"• Bei Zweifeln an der Volljährigkeit: **bis zur Klärung als minderjährig behandeln**\n• **Jugendamt** informieren – vorläufige Inobhutnahme (§ 42a SGB VIII)\n• Abschiebung nur, wenn sich die Behörde vergewissert hat, dass das Kind im Rückkehrstaat einem **Familienangehörigen, Personensorgeberechtigten oder einer geeigneten Aufnahmeeinrichtung übergeben** wird (§ 58 Abs. 1a AufenthG)\n• Eurodac-Erfassung ab 6 Jahren – kindgerecht, in Anwesenheit eines Vertreters"},{"titel":"Familien mit Kindern","text":"• Familientrennung vermeiden; Kinder möglichst **nicht Zeugen von Zwangsmaßnahmen** werden lassen\n• Kinder nicht als Dolmetscher einsetzen\n• Schulpflichtige Kinder: Zugriff nicht in Schule/Kita (Erlasslage beachten)\n• Kinderbetreuung, Verpflegung, Windeln, Medikamente einplanen"},{"titel":"Krankheit, Suizidalität, Schwangerschaft","text":"• **Reisefähigkeit** ist gesetzlich vermutet, aber: akute Erkrankung, Verletzung oder Suizidankündigung → **ärztliche Abklärung**, Rücksprache ZAB/LDS\n• Suizidgefahr: Person nicht unbeaufsichtigt lassen, gefährliche Gegenstände entfernen, Arzt hinzuziehen, dokumentieren\n• **Schwangerschaft**: im Mutterschutzzeitraum (6 Wochen vor bis 8 Wochen nach der Entbindung) regelmäßig keine Flugreisetauglichkeit – ärztlich klären\n• Medikamente für die Reise mitgeben, Arztberichte übergeben"},{"titel":"Opfer von Menschenhandel / Traumatisierte","text":"• Anzeichen: fremdbestimmte Personen, einbehaltene Papiere, Angst, Schulden gegenüber Schleusern\n• Fachdienststelle (Menschenhandel) und Beratungsstellen einbinden; Bedenk- und Stabilisierungsfrist (§ 59 Abs. 7 AufenthG) beachten\n• Vulnerabilität im Screening-Formular dokumentieren"},{"titel":"Kirchenasyl","text":"Das Kirchenasyl ist **kein eigenständiges Rechtsinstitut**. In der Praxis wird es auf Grundlage einer Absprache zwischen BAMF und Kirchen (Härtefalldossier) in aller Regel **respektiert**. Maßnahmen in kirchlichen Räumen nur nach **ausdrücklicher Weisung** der Führung und in Abstimmung mit der LDS."}],"merke":["Zweifel am Alter → als minderjährig behandeln, Jugendamt informieren.","Neue gesundheitliche Beschwerden im Einsatz → Arzt + Rücksprache ZAB.","Kinder nie als Dolmetscher."]},{"id":"strafrecht","titel":"Straf- und Bußgeldrecht","icon":"scalemass","kurz":"§§ 95–97 AufenthG, §§ 84–86 AsylG – typische Delikte bei Kontrollen.","abschnitte":[{"titel":"§ 95 AufenthG – typische Tatbestände","text":"• **Abs. 1 Nr. 1** – Aufenthalt ohne erforderlichen Pass/Passersatz\n• **Abs. 1 Nr. 2** – Aufenthalt ohne erforderlichen Aufenthaltstitel, vollziehbar ausreisepflichtig, Ausreisefrist abgelaufen und Abschiebung nicht ausgesetzt (keine Duldung)\n• **Abs. 1 Nr. 3** – **unerlaubte Einreise**\n• **Abs. 2 Nr. 1** – Einreise/Aufenthalt entgegen einem **Einreise- und Aufenthaltsverbot** (§ 11 AufenthG)\n• **Abs. 1 Nr. 5** – falsche Angaben/Verweigerung von Angaben (§ 49 AufenthG)\n\n**§ 95 Abs. 5 AufenthG**: Art. 31 Abs. 1 Genfer Flüchtlingskonvention bleibt unberührt (Straffreiheit bei unmittelbarer Einreise aus Verfolgerstaat und unverzüglicher Meldung)."},{"titel":"Schleusung","text":"• **§ 96 AufenthG** – Einschleusen von Ausländern (Vorteil, wiederholt/zugunsten mehrerer)\n• **§ 97 AufenthG** – Einschleusen mit Todesfolge; gewerbs- und bandenmäßiges Einschleusen\n• Geschleuste Personen sind **Zeugen** – Vernehmung und Beweissicherung (Handys, Fahrzeug, Bargeld) frühzeitig abstimmen"},{"titel":"AsylG","text":"• **§ 85 AsylG** – u. a. **wiederholter** Verstoß gegen die räumliche Beschränkung (§ 56)\n• **§ 86 AsylG** – erstmaliger Verstoß: **Ordnungswidrigkeit**\n• **§ 84 AsylG** – Verleiten zur missbräuchlichen Asylantragstellung"},{"titel":"Praxis","text":"• Strafverfahren hindert die Abschiebung grundsätzlich nicht, aber: bei laufendem Ermittlungsverfahren ist das **Einvernehmen der Staatsanwaltschaft** erforderlich (§ 72 Abs. 4 AufenthG)\n• Beschuldigtenbelehrung **in verständlicher Sprache**, Dolmetscher (§ 187 GVG)\n• Aufenthaltsrechtlichen Status vor Einleitung eines Verfahrens nach § 95 prüfen (Duldung? Gestattung? Titel?)"}],"merke":["Geduldete machen sich nicht nach § 95 Abs. 1 Nr. 2 strafbar.","Laufendes Ermittlungsverfahren → Einvernehmen der StA vor Abschiebung (§ 72 Abs. 4).","Art. 31 GFK beachten (§ 95 Abs. 5)."]},{"id":"sachsen","titel":"Zuständigkeiten in Sachsen","icon":"building.columns","kurz":"Wer macht was? LDS, ZAB, Ausländerbehörden, BAMF, Bundespolizei, PD Leipzig.","abschnitte":[{"titel":"Behörden im Überblick","text":"• **Landesdirektion Sachsen (LDS)** – obere Ausländerbehörde; Abteilung Asyl und Ausländerrecht\n• **Zentrale Ausländerbehörde (ZAB)** der LDS (Chemnitz) – Erstaufnahme, Verteilung, **aufenthaltsbeendende Maßnahmen**/Organisation der Abschiebungen\n• **Untere Ausländerbehörden** – im Bereich der PD Leipzig: **Stadt Leipzig**, **Landkreis Leipzig**, **Landkreis Nordsachsen**\n• **BAMF** – Asylverfahren, Zuständigkeitsverfahren (AMM-VO), Abschiebungsandrohung\n• **Bundespolizei** – Grenzschutz, Flughäfen (u. a. **Leipzig/Halle**), Rückführungen auf dem Luftweg, Screening an der Außengrenze\n• **Polizei Sachsen / PD Leipzig** – Aufgriff, Screening im Inland (nach Landesrecht), Festnahme, Haftantrag, Vollzugshilfe bei Abschiebungen, Strafverfolgung\n• **Amtsgerichte** – Haftanordnungen (FamFG), Durchsuchungsanordnungen\n• **Verwaltungsgerichte** – Eilrechtsschutz gegen Abschiebung (für Leipzig: VG Leipzig)\n• **SMI** – Fach- und Rechtsaufsicht, Erlasse"},{"titel":"Einrichtungen","text":"• **Erstaufnahmeeinrichtungen** der LDS (u. a. in Leipzig, Dresden, Chemnitz)\n• **Sekundärmigrationszentrum Dresden** – seit 01.07.2026\n• **Abschiebungshaft/Ausreisegewahrsam Dresden**\n• **Flughafen Leipzig/Halle** – Sammel- und Einzelrückführungen, Übergabe an die Bundespolizei"},{"titel":"Rechtsgrundlagen Sachsen","text":"• **SächsPVDG** – Sächsisches Polizeivollzugsdienstgesetz (Befugnisse, Vollzugshilfe, unmittelbarer Zwang). Der Landtag hat am **24.06.2026** eine Novelle beschlossen (u. a. Quellen-TKÜ, Drohnen, Distanz-Elektroimpulsgeräte ab 2027).\n• **SächsAAZuVO** – Sächsische Aufenthalts- und Asylzuständigkeitsverordnung (Zuständigkeiten der Ausländerbehörden)\n• Erlasse und Verwaltungsvorschriften des SMI sowie Dienstanweisungen der PD Leipzig (im Intranet der Polizei Sachsen)"}],"merke":["ZAB der LDS organisiert Abschiebungen – Polizei leistet Vollzugshilfe.","Luftweg und Flughafen: Bundespolizei.","Eilrechtsschutz: VG – Rückmeldung immer über die Ausländerbehörde."]},{"id":"einsatzpraxis","titel":"Einsatzpraxis & Eigensicherung","icon":"shield.lefthalf.filled","kurz":"Kommunikation, Zwang, Dokumentation, Deeskalation.","abschnitte":[{"titel":"Kommunikation","text":"• Ruhig, respektvoll, klar – Maßnahme **eröffnen** und **begründen**\n• **Sprachmittler** (Präsenz oder Telefon-/Videodolmetschen) – keine Mitbewohner oder Kinder\n• Einfache Sprache, kurze Sätze; Verständnis rückfragen\n• Betreuende Personen (Anwalt, Beratungsstelle) höflich, aber bestimmt auf den Ablauf hinweisen"},{"titel":"Eigensicherung","text":"• Vorab Informationen der ZAB auswerten: Gewaltbereitschaft, Waffen, Vorstrafen, psychische Erkrankungen, ansteckende Krankheiten, Tiere\n• Durchsuchung der Person vor Transport; Gegenstände zur Selbstverletzung entfernen\n• Fesselung nur bei konkreter Gefahr (Flucht, Widerstand, Selbstverletzung) – **verhältnismäßig** und dokumentiert\n• Proteste vor Unterkünften einkalkulieren – Kräfte, Zufahrt, Abfahrt planen"},{"titel":"Unmittelbarer Zwang","text":"• Grundlage: SächsPVDG bzw. Vollzugsrecht der Ausländerbehörde – **Androhung**, **mildestes Mittel**, **Verhältnismäßigkeit**\n• Kein Zwang zur Verabreichung von Medikamenten (nur ärztlich, eigene Rechtsgrundlage)\n• Nach jeder Zwangsanwendung: Verletzungen prüfen, ärztliche Versorgung anbieten, dokumentieren"},{"titel":"Dokumentation","text":"• Uhrzeiten (Zugriff, Eröffnung, Transport, Übergabe)\n• Beteiligte Kräfte, Dolmetscher, Ärzte, Jugendamt\n• Äußerungen der Person (insbes. **Asylgesuch**, Krankheit, Suizidankündigung) **wörtlich**\n• Zwangsanwendung, Fesselung, Verletzungen\n• Sichergestellte Gegenstände, mitgegebenes Gepäck/Geld/Medikamente\n• Rücksprachen mit ZAB/LDS (wer, wann, Ergebnis)"}],"merke":["Wörtlich dokumentieren, was die Person sagt – vor allem Asylgesuche.","Fesselung: nur bei konkreter Gefahr und dokumentiert.","Keine Kinder/Mitbewohner als Dolmetscher."]}],"checklisten":[{"id":"screening-inland","titel":"Screening im Inland durchführen","icon":"checkmark.shield","kontext":"Die Screening-Prüfung hat ergeben: Screening durchführen","punkte":[{"text":"Aufgriffszeit notiert","hinweis":"Fristenrechner im Reiter Screening"},{"text":"Belehrung in verständlicher Sprache (Dolmetscher)"},{"text":"Minderjährigkeit/Vulnerabilität geprüft, ggf. Jugendamt informiert"},{"text":"Festhalten erforderlich? Wenn ja: richterliche Entscheidung beantragt","hinweis":"Bis Ende des Folgetages"},{"text":"Identität geprüft, Dokumente gesichert"},{"text":"Sicherheitsabfragen durchgeführt (SIS, INPOL, weitere)"},{"text":"ED-Behandlung / Eurodac (Fingerabdrücke + Gesichtsbild)"},{"text":"Gesundheitskontrolle durch die Gesundheitsbehörde veranlasst"},{"text":"Vulnerabilität dokumentiert"},{"text":"Screening-Formular vollständig ausgefüllt"},{"text":"Asylgesuch? Wörtlich dokumentiert"},{"text":"Übergabe an die zuständige Stelle erfolgt"},{"text":"Abschluss innerhalb von 3 Tagen, Vorgang dokumentiert"}]},{"id":"aufgriff","titel":"Aufgriff: unerlaubter Aufenthalt","icon":"person.crop.circle.badge.questionmark","kontext":"Kontrolle einer Person ohne Aufenthaltsnachweis im Bereich der PD Leipzig","punkte":[{"text":"Eigensicherung, Personalien erheben, Dokumente sichten","hinweis":"Ausweispflicht § 48 AufenthG"},{"text":"Abfragen: INPOL, AZR, SIS, Eurodac/ED-Bestand","hinweis":"Bereits erfasst/überprüft? Ausschreibungen? Duldung/Gestattung?"},{"text":"Aufenthaltsstatus klären (Titel, Duldung, Gestattung, Ankunftsnachweis)"},{"text":"Asylgesuch geäußert? → wörtlich dokumentieren, Weiterleitung einleiten","hinweis":"Polizei prüft keine Asylgründe"},{"text":"Minderjährigkeit/Vulnerabilität erkennbar? → Jugendamt/Fachstellen"},{"text":"Screening im Inland erforderlich? (§ 15b AufenthG, max. 3 Tage)","hinweis":"Nicht, wenn bereits an Außengrenze überprüft"},{"text":"Festhalten erforderlich? Richterliche Entscheidung bis Ende des Folgetages herbeiführen"},{"text":"Strafanzeige prüfen (§ 95 AufenthG / § 85 AsylG)","hinweis":"Art. 31 GFK, § 95 Abs. 5"},{"text":"Zuständige Ausländerbehörde / ZAB informieren"},{"text":"Dokumentation vollständig (Aliaspersonalien, Äußerungen, Maßnahmen)"}]},{"id":"asylgesuch","titel":"Asylgesuch bei der Polizei","icon":"hand.raised","kontext":"Eine Person äußert gegenüber Polizeibeamten einen Schutzwunsch","punkte":[{"text":"Schutzwunsch wörtlich dokumentieren (Zeit, Sprache, Dolmetscher)"},{"text":"Personalien und Dokumente sichern"},{"text":"ED-Behandlung (§ 16 AsylG) / Eurodac, falls nicht erfolgt"},{"text":"Information der Person über das weitere Verfahren (Merkblatt in Landessprache)"},{"text":"Weiterleitung an die zuständige Aufnahmeeinrichtung (vgl. § 19 AsylG)"},{"text":"Bei laufender Abschiebung: sofort ZAB/LDS informieren und Weisung abwarten"},{"text":"Vulnerabilität (Minderjährige, Kranke, Schwangere) vermerken"}]},{"id":"abschiebung-vorbereitung","titel":"Abschiebung: Einsatzvorbereitung","icon":"list.clipboard","kontext":"Vollzugshilfeersuchen der ZAB/LDS liegt vor","punkte":[{"text":"Ersuchen vollständig? (Personen, Adresse, Flug, Termin, Rechtsgrundlage)"},{"text":"Vollziehbarkeit bestätigt? Keine Duldung, kein Eilverfahren anhängig (Rückfrage ZAB)"},{"text":"Gefährdungslage: Waffen, Gewalt, psychische Erkrankung, Suizidgefahr, Tiere"},{"text":"Kinder beteiligt? Jugendamt, Kinderbetreuung, Kindersitze"},{"text":"Weibliche Einsatzkräfte für Durchsuchung eingeplant"},{"text":"Sprachmittler organisiert"},{"text":"Arzt/Rettungsdienst bei Bedarf in Bereitschaft"},{"text":"Durchsuchungsanordnung (Richter) für Wohnung vorhanden, falls erforderlich"},{"text":"Nachtzeit? Nur bei Tatsachen für Vereitelungsgefahr (§ 58 Abs. 7)"},{"text":"Transport, Zeitpuffer bis Übergabe Flughafen Leipzig/Halle / Bundespolizei"},{"text":"Erreichbarkeit Bereitschaft ZAB/LDS für Rückfragen während des Einsatzes"},{"text":"Mögliche Proteste/Unterstützerkreise berücksichtigt"}]},{"id":"abschiebung-durchfuehrung","titel":"Abschiebung: Durchführung","icon":"checklist","kontext":"Am Einsatzort","punkte":[{"text":"Identität der angetroffenen Person(en) feststellen"},{"text":"Maßnahme eröffnen und begründen (Dolmetscher)"},{"text":"Durchsuchung der Person zur Eigensicherung"},{"text":"Zeit zum Packen geben; Gepäck, Dokumente, Medikamente, Bargeld"},{"text":"Handy: Kontakt zu Angehörigen/Rechtsbeistand ermöglichen, sofern Sicherheit es zulässt"},{"text":"Gesundheitszustand erfragen; neue Beschwerden → Arzt + ZAB"},{"text":"Asylgesuch/Folgeantrag? → dokumentieren + ZAB, Weisung abwarten"},{"text":"Fesselung nur bei konkreter Gefahr, dokumentieren"},{"text":"Wohnung verschlossen hinterlassen, Tiere/Wertgegenstände geregelt"},{"text":"Transport und Übergabe (Uhrzeit, Übernehmender)"},{"text":"Einsatzbericht und Rückmeldung an die LDS"}]},{"id":"festnahme-haft","titel":"Festnahme & Haftantrag","icon":"lock.doc","kontext":"Vorläufige Ingewahrsamnahme zur Sicherung der Abschiebung","punkte":[{"text":"Vollziehbare Ausreisepflicht festgestellt (Rücksprache Ausländerbehörde)"},{"text":"Haftgrund: dringender Verdacht Sicherungshaft (§ 62 Abs. 3)"},{"text":"Richterliche Entscheidung vorher nicht einholbar"},{"text":"Begründeter Verdacht des Entziehens (§ 62 Abs. 5)"},{"text":"Mildere Mittel geprüft und dokumentiert"},{"text":"Belehrung (Gründe, Rechte, Konsulat, Rechtsbeistand) in verständlicher Sprache"},{"text":"Unverzügliche Vorführung beim Amtsgericht / Haftantrag über zuständige Behörde"},{"text":"Minderjährige/Familien: nur in besonderen Ausnahmefällen"},{"text":"Unterbringung: Einrichtung Dresden (nicht mit Strafgefangenen)"}]},{"id":"uma","titel":"Unbegleitete Minderjährige","icon":"figure.child","kontext":"Aufgriff einer mutmaßlich minderjährigen Person ohne Sorgeberechtigte","punkte":[{"text":"Im Zweifel als minderjährig behandeln"},{"text":"Jugendamt sofort informieren (vorläufige Inobhutnahme § 42a SGB VIII)"},{"text":"Kindgerechte Kommunikation, Dolmetscher"},{"text":"ED/Eurodac nur kindgerecht und mit Vertreter"},{"text":"Hinweise auf Menschenhandel/Ausbeutung prüfen"},{"text":"Keine Unterbringung im Polizeigewahrsam, soweit vermeidbar"}]}],"fristen":[{"was":"Screening an der Außengrenze","frist":"max. 7 Tage","grundlage":"Screening-VO, § 14a AufenthG"},{"was":"Screening im Inland","frist":"max. 3 Tage","grundlage":"Art. 7 Screening-VO, § 15b AufenthG"},{"was":"Festhalten ohne Richter (Screening)","frist":"bis Ende des Tages nach dem Ergreifen","grundlage":"§§ 14a, 15b AufenthG, Art. 104 GG"},{"was":"Registrierung eines Asylantrags","frist":"5 Tage (Ausnahme 15)","grundlage":"AVVO"},{"was":"Förmliche Antragstellung","frist":"21 Tage nach Registrierung","grundlage":"AVVO"},{"was":"Grenzverfahren (Asyl)","frist":"max. 12 Wochen","grundlage":"AVVO"},{"was":"Rückkehr-Grenzverfahren","frist":"max. 12 Wochen","grundlage":"VO 2024/1349"},{"was":"Beschleunigtes Verfahren","frist":"3 Monate","grundlage":"AVVO"},{"was":"Reguläres Asylverfahren","frist":"6 Monate","grundlage":"AVVO"},{"was":"Überstellungsfrist (Regel)","frist":"6 Monate","grundlage":"Art. 46 AMM-VO"},{"was":"Überstellungsfrist bei Haft","frist":"bis 1 Jahr","grundlage":"AMM-VO"},{"was":"Überstellungsfrist bei Flucht","frist":"bis 3 Jahre","grundlage":"AMM-VO"},{"was":"Zuständigkeit Ersteinreisestaat","frist":"20 Monate","grundlage":"AMM-VO"},{"was":"Eurodac: Mindestalter","frist":"6 Jahre","grundlage":"Eurodac-VO"},{"was":"Ausreisefrist (Regel)","frist":"7–30 Tage","grundlage":"§ 59 Abs. 1 AufenthG"},{"was":"Vorbereitungshaft","frist":"max. 6 Wochen","grundlage":"§ 62 Abs. 2 AufenthG"},{"was":"Sicherungshaft","frist":"6 Monate, max. 18 Monate","grundlage":"§ 62 Abs. 3, 4 AufenthG"},{"was":"Ausreisegewahrsam","frist":"max. 28 Tage","grundlage":"§ 62b AufenthG"},{"was":"Mitwirkungshaft","frist":"max. 14 Tage","grundlage":"§ 62 Abs. 6 AufenthG"},{"was":"Sekundärmigrationszentrum Sachsen","frist":"max. 24 Monate (Familien 12)","grundlage":"LDS"}],"normen":[{"norm":"§ 11 AufenthG","titel":"Einreise- und Aufenthaltsverbot","inhalt":"Nach Ausweisung, Zurückschiebung oder Abschiebung wird ein befristetes Einreise- und Aufenthaltsverbot erlassen.","praxis":"Verstoß: Straftat nach § 95 Abs. 2 Nr. 1 AufenthG."},{"norm":"§ 14a AufenthG","titel":"Screening an der Außengrenze","inhalt":"Überprüfung nach der Screening-VO an der Außengrenze; Verbringen und Überprüfungshaft.","praxis":"Flughäfen/Seehäfen – regelmäßig Bundespolizei."},{"norm":"§ 15b AufenthG","titel":"Überprüfung im Bundesgebiet","inhalt":"Festhalten und Verbringen zur Überprüfung nach Art. 7 Screening-VO; Freilassung, wenn nicht bis Ende des Folgetages richterlich angeordnet.","praxis":"Kernnorm für das Screening im Inland durch die Landespolizei."},{"norm":"§ 48 AufenthG","titel":"Ausweisrechtliche Pflichten","inhalt":"Pass vorlegen und überlassen; Mitwirkung bei Passbeschaffung; Durchsuchung nach Dokumenten; Datenträgerauswertung (Abs. 3a).","praxis":"Pässe sicherstellen und Ausländerbehörde zuleiten."},{"norm":"§ 49 AufenthG","titel":"Identitätsfeststellung","inhalt":"Überprüfung, Feststellung und Sicherung der Identität; ED-Maßnahmen.","praxis":"Falsche Angaben: § 95 Abs. 1 Nr. 5."},{"norm":"§ 50 AufenthG","titel":"Ausreisepflicht","inhalt":"Ausreisepflichtig ist, wer einen erforderlichen Aufenthaltstitel nicht oder nicht mehr besitzt.","praxis":"Ausreisepflicht ≠ vollziehbare Ausreisepflicht."},{"norm":"§ 58 AufenthG","titel":"Abschiebung","inhalt":"Voraussetzungen der Abschiebung; Abs. 1a UMA; Abs. 5–10 Betreten und Durchsuchen von Wohnungen, Nachtzeit, Richtervorbehalt.","praxis":"Durchsuchung: Richter, bei Gefahr im Verzug durchführende Behörde."},{"norm":"§ 59 AufenthG","titel":"Androhung der Abschiebung","inhalt":"Androhung mit Ausreisefrist (7–30 Tage); Termin der Abschiebung darf nicht angekündigt werden.","praxis":"Termine nicht an Betroffene oder Unterstützer weitergeben."},{"norm":"§ 60 AufenthG","titel":"Verbot der Abschiebung","inhalt":"Abschiebungsverbote u. a. bei Flüchtlingseigenschaft, EMRK-Verletzung, erheblicher konkreter Gefahr.","praxis":"Prüfung durch BAMF/Ausländerbehörde, nicht durch die Einsatzkraft."},{"norm":"§ 60a AufenthG","titel":"Duldung","inhalt":"Vorübergehende Aussetzung der Abschiebung; Abs. 2c Vermutung der Reisefähigkeit, qualifizierte ärztliche Bescheinigung.","praxis":"Gültige Duldung = keine Abschiebung ohne Widerruf."},{"norm":"§ 62 AufenthG","titel":"Abschiebungshaft","inhalt":"Vorbereitungs-, Sicherungs-, Mitwirkungshaft; Abs. 5 vorläufige Ingewahrsamnahme ohne vorherige richterliche Anordnung.","praxis":"Unverzüglich Richter; mildere Mittel prüfen."},{"norm":"§ 62a AufenthG","titel":"Vollzug der Abschiebungshaft","inhalt":"Vollzug grundsätzlich in speziellen Hafteinrichtungen, getrennt von Strafgefangenen.","praxis":"Sachsen: Einrichtung in Dresden."},{"norm":"§ 62b AufenthG","titel":"Ausreisegewahrsam","inhalt":"Bis zu 28 Tage zur Sicherung der Durchführbarkeit der Abschiebung.","praxis":"Vollzug im Transitbereich/Unterkunft mit Ausreisemöglichkeit."},{"norm":"§ 71 AufenthG","titel":"Zuständigkeit","inhalt":"Abs. 4a: Zuständigkeit für Screening-Fälle (u. a. Polizeien der Länder). Abs. 5: Landespolizei auch zuständig für Zurückschiebung, Abschiebung, Festnahme, Haftantrag.","praxis":"Rechtsgrundlage für das eigene Tätigwerden."},{"norm":"§ 72 Abs. 4 AufenthG","titel":"Beteiligung der StA","inhalt":"Abschiebung bei laufendem Ermittlungsverfahren nur im Einvernehmen mit der Staatsanwaltschaft.","praxis":"Vor Rückführung Verfahrensstand prüfen."},{"norm":"§ 95 AufenthG","titel":"Strafvorschriften","inhalt":"Unerlaubter Aufenthalt, unerlaubte Einreise, Verstoß gegen Einreiseverbot, falsche Angaben.","praxis":"Abs. 5: Art. 31 GFK."},{"norm":"§§ 96, 97 AufenthG","titel":"Einschleusen","inhalt":"Einschleusen von Ausländern; mit Todesfolge; gewerbs- und bandenmäßig.","praxis":"Geschleuste = Zeugen, Beweise sichern."},{"norm":"§ 16 AsylG","titel":"Sicherung der Identität","inhalt":"ED-Behandlung von Asylsuchenden.","praxis":"Auch durch die Polizei bei Asylgesuch."},{"norm":"§ 19 AsylG","titel":"Aufgaben der Ausländerbehörde und der Polizei","inhalt":"Weiterleitung von Asylsuchenden an die zuständige Aufnahmeeinrichtung; ED-Behandlung.","praxis":"Fassung nach GEAS-Anpassungsgesetz prüfen."},{"norm":"§ 55 AsylG","titel":"Aufenthaltsgestattung","inhalt":"Aufenthalt zur Durchführung des Asylverfahrens ist gestattet.","praxis":"Gestattete sind nicht vollziehbar ausreisepflichtig."},{"norm":"§ 56 AsylG","titel":"Räumliche Beschränkung","inhalt":"Aufenthaltsgestattung ist räumlich beschränkt.","praxis":"Erstverstoß § 86 (OWi), wiederholt § 85 (Straftat)."},{"norm":"§§ 69–70a AsylG","titel":"Asylverfahrenshaft","inhalt":"Neue Haftform seit GEAS; nur durch richterliche Anordnung; Verhältnismäßigkeit, mildere Mittel.","praxis":"Umsetzung von Art. 10 Aufnahme-RL."},{"norm":"Art. 7 Screening-VO","titel":"Screening im Hoheitsgebiet","inhalt":"Überprüfung unerlaubt aufhältiger Drittstaatsangehöriger, die nicht an der Außengrenze überprüft wurden.","praxis":"Max. 3 Tage."},{"norm":"Art. 44 AMM-VO","titel":"Haft zur Überstellung","inhalt":"Inhaftnahme zur Sicherung der Überstellung bei erheblicher Fluchtgefahr bzw. Sicherheitsgefahr.","praxis":"Ersetzt Art. 28 Dublin III."},{"norm":"Art. 46 AMM-VO","titel":"Überstellungsfristen","inhalt":"6 Monate; bis 1 Jahr bei Haft; bis 3 Jahre bei Flucht.","praxis":"Flucht/Untertauchen dokumentieren und melden."}],"glossar":[{"begriff":"AMM-VO","erklaerung":"Asyl- und Migrationsmanagement-Verordnung (EU) 2024/1351 – regelt u. a. die Zuständigkeit für Asylverfahren (Nachfolger Dublin III) und den Solidaritätsmechanismus."},{"begriff":"Ankunftsnachweis","erklaerung":"Bescheinigung über die Meldung als Asylsuchender; dokumentiert den Status vor förmlicher Antragstellung."},{"begriff":"Aufenthaltsgestattung","erklaerung":"Aufenthaltsrecht während des Asylverfahrens (§ 55 AsylG)."},{"begriff":"Ausreisegewahrsam","erklaerung":"Kurzfristige Freiheitsentziehung bis 28 Tage zur Sicherung der Abschiebung (§ 62b AufenthG)."},{"begriff":"AVVO","erklaerung":"Asylverfahrensverordnung (EU) 2024/1348 – einheitliches Verfahren für internationalen Schutz inkl. Grenzverfahren."},{"begriff":"AZR","erklaerung":"Ausländerzentralregister beim BVA."},{"begriff":"BAMF","erklaerung":"Bundesamt für Migration und Flüchtlinge – entscheidet über Asylanträge und Zuständigkeit nach AMM-VO."},{"begriff":"Duldung","erklaerung":"Vorübergehende Aussetzung der Abschiebung (§ 60a AufenthG). Kein Aufenthaltstitel, Ausreisepflicht bleibt bestehen."},{"begriff":"Eurodac","erklaerung":"EU-Datenbank für biometrische Daten (Fingerabdrücke, Gesichtsbild) von Schutzsuchenden und irregulär Einreisenden/Aufhältigen; ab 6 Jahren."},{"begriff":"Folgeantrag","erklaerung":"Erneuter Asylantrag nach bestandskräftiger Ablehnung; Recht auf Verbleib kann eingeschränkt sein."},{"begriff":"GEAS","erklaerung":"Gemeinsames Europäisches Asylsystem; reformiert 2024, anwendbar seit 12.06.2026."},{"begriff":"GEAS-Anpassungsgesetz","erklaerung":"Bundesgesetz zur Anpassung von AsylG, AufenthG u. a. an die GEAS-Reform; in Kraft seit 12.06.2026."},{"begriff":"Grenzverfahren","erklaerung":"Asylverfahren an der Außengrenze (in DE v. a. Flughäfen), max. 12 Wochen; Personen gelten als nicht eingereist."},{"begriff":"LDS","erklaerung":"Landesdirektion Sachsen – obere Ausländerbehörde, u. a. mit der Zentralen Ausländerbehörde (ZAB)."},{"begriff":"Rückkehrentscheidung","erklaerung":"Behördliche Entscheidung, die den Aufenthalt als illegal feststellt und eine Rückkehrverpflichtung auferlegt; in DE i. d. R. Abschiebungsandrohung."},{"begriff":"Screening","erklaerung":"Überprüfung nach der Screening-VO: Identität, Gesundheit, Vulnerabilität, Sicherheit, Eurodac – Außengrenze 7 Tage, Inland 3 Tage."},{"begriff":"Sekundärmigration","erklaerung":"Weiterwanderung von Schutzsuchenden aus dem zuständigen in einen anderen EU-Staat."},{"begriff":"Sekundärmigrationszentrum","erklaerung":"Einrichtung für Personen, für die ein anderer Mitgliedstaat zuständig ist; Sachsen: Dresden seit 01.07.2026."},{"begriff":"Sicherer Herkunftsstaat","erklaerung":"Staat, bei dem vermutet wird, dass keine Verfolgung stattfindet; führt zu beschleunigtem Verfahren. Listen auf EU- und nationaler Ebene."},{"begriff":"Solidaritätsmechanis ","telefon":""}],"quellen":["EU-Verordnungen 2024/1346–1359 (Amtsblatt der EU, Mai 2024)","GEAS-Anpassungsgesetz und GEAS-Anpassungsfolgegesetz (BGBl. 2026, in Kraft 12.06.2026)","Deutscher Bundestag, Beschluss vom 27.02.2026 (Drs. 21/1848)","Landesdirektion Sachsen – Sekundärmigrationszentrum (Medieninformation Juli 2026)","Landesdirektion Sachsen – Einrichtung Abschiebungshaft/Ausreisegewahrsam Dresden","Sächsisches Polizeivollzugsdienstgesetz (SächsPVDG), Novelle Landtagsbeschluss 24.06.2026","Aufenthaltsgesetz, Asylgesetz in der jeweils aktuellen Fassung (gesetze-im-internet.de)"],"onboarding":[{"icon":"hand.wave","titel":"Willkommen bei GEAS Hilfe","text":"Diese App hilft dir im Einsatz und beim Lernen rund um **GEAS**, **Asyl** und **Rückführung** – zugeschnitten auf die Polizei Sachsen und die PD Leipzig.\n\nIn 1 Minute zeigen wir dir, wie sie funktioniert."},{"icon":"checkmark.shield","titel":"Das Wichtigste: die Screening-Prüfung","text":"Du hast eine Person ohne Aufenthaltsnachweis angetroffen und weißt nicht, ob ein **Screening** nötig ist?\n\n1. Öffne den Reiter **Screening**.\n2. Tippe auf **Prüfung starten**.\n3. Beantworte **eine Frage nach der anderen**.\n4. Am Ende steht **eindeutig**, ob ein Screening durchzuführen ist – und **was du jetzt tun musst**, Schritt für Schritt.\n\nDu kannst jederzeit einen Schritt zurückgehen."},{"icon":"exclamationmark.triangle","titel":"Drei goldene Regeln","text":"1. **Erst abfragen, dann entscheiden.** INPOL, AZR, SIS, Eurodac – immer vor der Entscheidung.\n2. **Uhrzeit des Aufgriffs sofort notieren.** Festhalten ohne Richter nur bis zum **Ende des folgenden Tages**, Screening höchstens **3 Tage**.\n3. **Asyl sticht nichts aus.** Wer um Schutz bittet, wird trotzdem überprüft – das Gesuch wird **wörtlich** notiert und weitergeleitet.\n\nIm Zweifel: **Rücksprache** mit Dienstgruppenleitung bzw. Fachdienststelle."},{"icon":"square.grid.2x2","titel":"Was gibt es noch?","text":"• **Unterlagen** – Fall anlegen, Schritt für Schritt erfassen, alle Dokumente als PDF erzeugen\n• **Wissen** – 11 Kapitel zum Nachlesen, mit Suche und Glossar\n• **Einsatz** – Checklisten zum Abhaken, Fristen, Paragraphen\n• **Lernen** – Quiz, Fallbeispiele, Prüfung, Karteikarten\n• **Mehr** – eigene Telefonliste, Einführung erneut ansehen"},{"icon":"lock.shield","titel":"Wichtiger Hinweis","text":"Die App ist eine **inoffizielle Arbeitshilfe**. Sie ersetzt weder Gesetz, Erlass oder Dienstanweisung noch die Weisung der Führung oder der Ausländerbehörde. Erzeugte Unterlagen sind **Entwürfe** – maßgeblich sind die amtlichen Vordrucke.\n\n**Personendaten** nur im Unterlagen-Assistenten und nur auf dienstlich zugelassenen Geräten eingeben. Sie werden verschlüsselt gespeichert und nach 7 Tagen automatisch gelöscht."}],"screening":{"start":"q_eu","kurzanleitung":["Aufgriffszeit notieren – ab jetzt laufen die Fristen.","Eigensicherung und Personalien, Dokumente sichten.","Abfragen: INPOL, AZR, SIS, Eurodac/Fast-ID.","Screening-Prüfung in der App Schritt für Schritt beantworten.","Ergebnis befolgen. Bei „Screening durchführen“: Fall im Unterlagen-Assistenten anlegen – die App erstellt alle Unterlagen.","Festhalten? Richterliche Entscheidung bis Ende des Folgetages – Fristenrechner nutzen."],"grundsaetze":["Screening gilt nur für Drittstaatsangehörige – nie für EU-, EWR- oder Schweizer Staatsangehörige.","Screening im Inland nur, wenn es keinen Hinweis auf eine Kontrolle an einer EU-Außengrenze gibt und die Person noch nicht überprüft oder registriert wurde.","Ein Asylgesuch verhindert das Screening nicht.","Höchstdauer im Inland: 3 Tage. Festhalten ohne Richter: bis Ende des Tages nach dem Ergreifen.","Die Polizei prüft keine Asylgründe und stellt keine Gesundheit fest – das machen BAMF bzw. Gesundheitsbehörde."],"knoten":{"q_eu":{"typ":"frage","schritt":"Staatsangehörigkeit","frage":"Ist die Person Staatsangehörige/r eines EU-Staates, von Island, Liechtenstein, Norwegen oder der Schweiz?","hilfe":"Pass oder Personalausweis ansehen. Hat die Person keine Dokumente, gilt: „Nein / unklar“.","beispiele":["Ja: rumänischer Personalausweis, Schweizer Pass","Nein: syrischer Pass, afghanische Tazkira, keine Papiere"],"antworten":[{"text":"Ja – nachgewiesen","ziel":"e_eu"},{"text":"Nein / unklar / keine Papiere","ziel":"q_fam"}]},"q_fam":{"typ":"frage","schritt":"Freizügigkeit","frage":"Ist die Person nachweislich Familienangehörige/r einer Unionsbürgerin oder eines Unionsbürgers mit Freizügigkeitsrecht?","hilfe":"Nachweis ist z. B. eine „Aufenthaltskarte für Familienangehörige eines Unionsbürgers“. Eine bloße Behauptung reicht nicht.","beispiele":["Ja: Aufenthaltskarte nach § 5 FreizügG/EU","Nein: nur mündliche Angabe, kein Dokument"],"antworten":[{"text":"Ja – mit Dokument nachgewiesen","ziel":"e_eu"},{"text":"Nein / nicht nachgewiesen","ziel":"q_status"}]},"q_status":{"typ":"frage","schritt":"Aufenthaltsnachweis","frage":"Hat die Person ein GÜLTIGES Dokument, das ihren Aufenthalt oder ihr Verfahren in Deutschland belegt?","hilfe":"Gültigkeitsdatum und Echtheit prüfen. Abgelaufene Dokumente zählen NICHT als gültig – dafür gibt es eine eigene Antwort.","beispiele":["Aufenthaltstitel (eAT), nationales Visum, Schengen-Visum","Duldung, Aufenthaltsgestattung, Ankunftsnachweis","Fiktionsbescheinigung, Aufenthaltstitel eines anderen Schengen-Staates"],"antworten":[{"text":"Ja – gültiges Dokument","ziel":"e_status"},{"text":"Nur ein ABGELAUFENES Visum / abgelaufener Titel","ziel":"e_overstay"},{"text":"Nein – gar nichts / unklar","ziel":"q_abfrage"}]},"q_abfrage":{"typ":"frage","schritt":"Datenbankabfrage","frage":"Ergebnis der Abfrage (INPOL, AZR, SIS, Eurodac/Fast-ID): Ist die Person bereits erfasst?","hilfe":"Noch nicht abgefragt? Dann JETZT abfragen – erst danach weiter. Erfasst heißt: Asylantrag, bereits überprüft (Screening), Eurodac-Treffer eines EU-Staates oder bekannter Aufenthaltsstatus.","beispiele":["Eurodac-Treffer Italien (Asylantrag oder irreguläre Einreise registriert)","AZR:
