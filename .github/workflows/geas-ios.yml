name: GEAS Hilfe – iOS-Build

on:
  push:
    paths:
      - "geas-app/**"
      - ".github/workflows/geas-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Neueste Xcode-Version wählen (Liquid Glass benötigt Xcode 26)
        run: |
          ls -d /Applications/Xcode*.app || true
          NEUESTE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Verwende $NEUESTE"
          sudo xcode-select -s "$NEUESTE"
          xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Xcode-Projekt erzeugen
        working-directory: geas-app/ios
        run: xcodegen generate
      - name: Für den iOS-Simulator bauen (ohne Signatur)
        working-directory: geas-app/ios
        shell: bash {0}
        run: |
          xcodebuild -project GEASHilfe.xcodeproj -scheme GEASHilfe \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          STATUS=$?
          grep -E "error:|\*\* BUILD" build.log | sort -u | head -80 || true
          if [ $STATUS -ne 0 ]; then grep -B2 -A6 "error:" build.log | head -250; fi
          exit $STATUS
