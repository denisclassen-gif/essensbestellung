  const roh = regel.wert ? wert(regel.wert).trim() : "";
  if (regel.art === "liste") return listeAus(roh)[regel.index] || "";
  if (regel.art === "zeile") {
    const zeile = roh.split("\n").map(z => z.trim()).filter(Boolean)[regel.index];
    return zeile ? (zeile.split(/\s*[,;]\s*/)[regel.spalte] || "") : "";
  }
  if (regel.abbildung && regel.abbildung[roh]) return regel.abbildung[roh];
  return roh;
}

const bedingungErfuellt = w => !w || auswahl(w.feld).some(x => w.enthaelt.includes(x));

// Screening-Formular: Felder über Titel (+ Vorkommen) ansprechen
function screeningBefuellen(doc, cfg, korrekturen) {
  const sdts = Array.from(doc.getElementsByTagNameNS(W_NS, "sdt")).map(s => ({ s, ...sdtInfo(s) }));
  const bericht = { gesetzt: 0, offen: [], listen: {} };
  for (const regel of cfg.regeln) {
    const passend = sdts.filter(x => x.alias === regel.alias && (!regel.typ || x.typ === regel.typ));
    const ziel = passend[regel.n || 0];
    if (!ziel) continue;
    if (regel.art === "haken" || regel.art === "haken_immer") {
      if (regel.art === "haken_immer" || bedingungErfuellt(regel.wenn)) { hakenSetzen(ziel.s, true); bericht.gesetzt++; }
      continue;
    }
    if (regel.wenn && !bedingungErfuellt(regel.wenn)) continue;
    if (ziel.typ === "dropdown") {
      bericht.listen[regel.alias] = ziel.optionen;
      const gesucht = regel.art === "auswahl_fest" ? regel.suche : regelWert(regel);
      if (!gesucht) continue;
      const treffer = korrekturen[regel.alias] ? ziel.optionen.find(o => o.text === korrekturen[regel.alias]) : listeTreffer(ziel.optionen, gesucht);
      if (treffer) {
        laufText(ziel.s, treffer.text);
        const dd = ziel.pr.getElementsByTagNameNS(W_NS, "dropDownList")[0] || ziel.pr.getElementsByTagNameNS(W_NS, "comboBox")[0];
        if (dd) dd.setAttributeNS(W_NS, "w:lastValue", treffer.wert || treffer.text);
        bericht.gesetzt++;
      } else bericht.offen.push({ alias: regel.alias, wert: gesucht, optionen: ziel.optionen });
      continue;
    }
    const v = regelWert(regel);
    if (!v) continue;
    if (ziel.typ === "date") {
      const d = datumTeile(v);
      if (d) {
        const dt = ziel.pr.getElementsByTagNameNS(W_NS, "date")[0];
        dt.setAttributeNS(W_NS, "w:fullDate", `${d.j}-${d.m}-${d.t}T00:00:00Z`);
        laufText(ziel.s, `${d.t}.${d.m}.${d.j}`);
      } else laufText(ziel.s, v);
    } else laufText(ziel.s, v);
    bericht.gesetzt++;
  }
  return bericht;
}

// Andere Vorlagen: Kopfdaten über Tabellenbeschriftungen, Geschlecht über Kästchen, Absätze nach Überschrift
function zelleSetzen(tc, text, vorlageZelle) {
  const doc = tc.ownerDocument;
  const p = tc.getElementsByTagNameNS(W_NS, "p")[0];
  if (!p || !text) return false;
  const r = doc.createElementNS(W_NS, "w:r");
  const muster = vorlageZelle && vorlageZelle.getElementsByTagNameNS(W_NS, "r")[0];
  const rPr = (muster && wKinder(muster, "rPr")[0]) || wKinder(wKinder(p, "pPr")[0], "rPr")[0];
  if (rPr) { const k = rPr.cloneNode(true); wKinder(k, "b").forEach(n => k.removeChild(n)); r.appendChild(k); }
  String(text).split("\n").forEach((zeile, i) => {
    if (i) r.appendChild(doc.createElementNS(W_NS, "w:br"));
    const t = doc.createElementNS(W_NS, "w:t"); t.setAttributeNS(XML_NS, "xml:space", "preserve"); t.textContent = zeile; r.appendChild(t);
  });
  p.appendChild(r);
  return true;
}

function kopfWert(regel) {
  const teile = regel.wert.map(id => id === "@heute" ? new Date().toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" })
    : FELDER[id] && FELDER[id].typ === "datumzeit" && wert(id) ? new Date(wert(id)).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" })
    : wert(id).trim()).filter(Boolean);
  return teile.join(regel.trenner || " ");
}

// Geschlecht ankreuzen: Die Kästchen stehen in allen Vorlagen in der Reihenfolge männlich – weiblich – divers
function geschlechtAnkreuzen(sdts) {
  const i = { "männlich": 0, "weiblich": 1, "divers": 2 }[wert("geschlecht")];
  const kaestchen = sdts.filter(x => x.getElementsByTagNameNS(W14_NS, "checkbox").length);
  return i !== undefined && kaestchen.length >= 3 && hakenSetzen(kaestchen[i], true);
}

function kopfdatenBefuellen(doc, cfg, opt = {}) {
  const bericht = { gesetzt: 0, offen: [], listen: {} };
  for (const tbl of Array.from(doc.getElementsByTagNameNS(W_NS, "tbl"))) {
    const zeilen = wKinder(tbl, "tr");
    zeilen.forEach((tr, zi) => {
      const zellen = wKinder(tr, "tc");
      zellen.forEach((tc, ci) => {
        const beschriftung = wText(tc).replace(/\s+/g, " ").trim();
        const kurz = beschriftung.split("|")[0].trim();   // zweisprachig: „Name | Surname“
        const regel = cfg.kopfdaten.find(k => k.label === beschriftung || k.label === kurz);
        if (!regel) return;   // Kopfdaten stehen oft mehrfach (z. B. Empfangsbestätigung auf Seite 2) – jede Stelle ausfüllen
        if (regel.lage === "haken") {
          if (geschlechtAnkreuzen(zellen.slice(ci + 1).flatMap(z => Array.from(z.getElementsByTagNameNS(W_NS, "sdt"))))) bericht.gesetzt++;
          return;
        }
        const v = kopfWert(regel);
        if (!v) return;
        let ziel = null;
        if (regel.lage === "rechts") ziel = zellen.slice(ci + 1).find(z => !wText(z).trim());   // erste freie Zelle (Sprachfassungen haben dazwischen die Übersetzung)
        if (regel.lage === "oben" && zi > 0) {
          // Die Zeile direkt über der Beschriftung ist die Schreiblinie
          const oben = wKinder(zeilen[zi - 1], "tc")[ci];
          ziel = oben;
        }
        if (ziel && !wText(ziel).trim() && zelleSetzen(ziel, v, tc)) bericht.gesetzt++;
      });
    });
  }
  // Rein fremdsprachige Kopftabelle (z. B. Fragebogen auf Arabisch): Zeilen in fester Reihenfolge
  const pos = opt.fremd && (cfg.positionen || {})[opt.art];
  if (pos) {
    const tbl = doc.getElementsByTagNameNS(W_NS, "tbl")[0];
    const zeilen = tbl ? wKinder(tbl, "tr") : [];
    pos.forEach((id, zi) => {
      const zellen = zeilen[zi] ? wKinder(zeilen[zi], "tc") : [];
      if (id === "@geschlecht") { if (geschlechtAnkreuzen(Array.from(zeilen[zi] ? zeilen[zi].getElementsByTagNameNS(W_NS, "sdt") : []))) bericht.gesetzt++; return; }
      const ziel = zellen.slice(1).find(z => !wText(z).trim());
      const v = kopfWert({ wert: id.split("+"), trenner: ", " });
      if (ziel && v && zelleSetzen(ziel, v, zellen[0])) bericht.gesetzt++;
    });
  }
  // Ankreuzfelder in einer Tabellenzeile anhand ihres Textes (z. B. „Die Personalien beruhen auf eigenen Angaben“)
  for (const regel of cfg.haken_zeile || []) {
    if (!bedingungErfuellt(regel.wenn)) continue;
    for (const tr of Array.from(doc.getElementsByTagNameNS(W_NS, "tr"))) {
      if (!wText(tr).replace(/[☐☒]/g, "").trim().startsWith(regel.text)) continue;
      const s = tr.getElementsByTagNameNS(W_NS, "sdt")[0];
      if (s && hakenSetzen(s, true)) bericht.gesetzt++;
    }
  }
  // Anrede: Name an den Absatz anhängen („Sehr geehrte/r Herr/Frau …“)
  for (const regel of cfg.anrede || []) {
    const v = regel.wert.map(id => wert(id).trim()).filter(Boolean).join(" ");
    const p = Array.from(doc.getElementsByTagNameNS(W_NS, "p")).find(p => wText(p).trim().startsWith(regel.beginnt));
    if (!v || !p) continue;
    const r = doc.createElementNS(W_NS, "w:r");
    const rPr = Array.from(p.getElementsByTagNameNS(W_NS, "rPr")).pop();
    if (rPr) r.appendChild(rPr.cloneNode(true));
    const t = doc.createElementNS(W_NS, "w:t"); t.setAttributeNS(XML_NS, "xml:space", "preserve"); t.textContent = (wText(p).endsWith(" ") ? "" : " ") + v + ",";
    r.appendChild(t); p.appendChild(r); bericht.gesetzt++;
  }
  // Schreiblinien „Name des Minderjährigen: ______“: Unterstriche durch den Wert ersetzen.
  // Nur die eigenen Textstücke des Absatzes (Textfelder stecken sonst verschachtelt im Anker-Absatz).
  const eigeneT = p => Array.from(p.getElementsByTagNameNS(W_NS, "t")).filter(t => { let a = t.parentNode; while (a && a.localName !== "p") a = a.parentNode; return a === p; });
  for (const regel of cfg.unterstriche || []) {
    const v = regel.wert.map(id => wert(id).trim()).filter(Boolean).join(regel.trenner || " ");
    if (!v) continue;
    for (const p of Array.from(doc.getElementsByTagNameNS(W_NS, "p"))) {
      const ts = eigeneT(p);
      if (!ts.map(t => t.textContent).join("").trim().startsWith(regel.beginnt)) continue;
      let ersetzt = false;
      for (const t of ts) {
        if (!t.textContent.includes("_")) continue;
        t.textContent = ersetzt ? t.textContent.replace(/_+/g, "") : t.textContent.replace(/_+/, (m, pos, str) => (str[pos - 1] === " " ? "" : " ") + v).replace(/_+/g, "");
        t.setAttributeNS(XML_NS, "xml:space", "preserve");
        ersetzt = true;
      }
      if (ersetzt) bericht.gesetzt++;
    }
  }
  // Absätze: Wert in den ersten leeren Absatz nach der Überschrift
  const absaetze = Array.from(doc.getElementsByTagNameNS(W_NS, "p"));
  for (const regel of cfg.absaetze || []) {
    const v = regel.wert.map(id => wert(id).trim()).filter(Boolean).join("\n");
    if (!v) continue;
    const i = absaetze.findIndex(p => wText(p).trim().startsWith(regel.nach_text));
    if (i < 0) continue;
    const leer = absaetze.slice(i + 1, i + 6).find(p => !wText(p).trim());
    if (leer) {
      const r = doc.createElementNS(W_NS, "w:r");
      v.split("\n").forEach((zeile, k) => { if (k) r.appendChild(doc.createElementNS(W_NS, "w:br")); const t = doc.createElementNS(W_NS, "w:t"); t.setAttributeNS(XML_NS, "xml:space", "preserve"); t.textContent = zeile; r.appendChild(t); });
      leer.appendChild(r); bericht.gesetzt++;
    }
  }
  return bericht;
}

// Textfelder (Word-Textboxen, z. B. Namensfeld der Belehrung): Reihenfolge im Dokument, Choice- und Fallback-Variante gemeinsam
function textfelderBefuellen(doc, regeln, bericht) {
  const gruppen = [];
  for (const tb of Array.from(doc.getElementsByTagNameNS(W_NS, "txbxContent"))) {
    const p = tb.getElementsByTagNameNS(W_NS, "p")[0];
    const id = p ? p.getAttributeNS(W14_NS, "paraId") : "";
    let g = gruppen.find(x => id && x.id === id);
    if (!g) gruppen.push(g = { id, boxen: [] });
    g.boxen.push(tb);
  }
  for (const regel of regeln || []) {
    const g = gruppen[regel.index];
    const v = regel.wert.map(id => wert(id).trim()).filter(Boolean).join(regel.trenner || " ");
    if (!g || !v || g.boxen.some(tb => wText(tb).trim())) continue;
    g.boxen.forEach(tb => zelleSetzen(tb, v, tb));
    bericht.gesetzt++;
  }
}

// Textfeld auf eine eigene Zeile setzen (oben und unten umbrechen), damit es keinen Text überdeckt oder verschiebt
function textfeldAnker(doc, regeln) {
  for (const r of regeln || []) {
    const anker = Array.from(doc.getElementsByTagNameNS(WP_NS, "anchor")).filter(a => a.getElementsByTagNameNS(W_NS, "txbxContent").length)[r.index];
    if (!anker) continue;
    const quadrat = anker.getElementsByTagNameNS(WP_NS, "wrapSquare")[0];
    if (quadrat && r.umbruch === "oben_unten") quadrat.parentNode.replaceChild(doc.createElementNS(WP_NS, "wp:wrapTopAndBottom"), quadrat);
    const v = anker.getElementsByTagNameNS(WP_NS, "positionV")[0];
    const off = v && v.getElementsByTagNameNS(WP_NS, "posOffset")[0];
    if (off && r.abstand_v !== undefined) off.textContent = String(r.abstand_v);
  }
}

const NACH_STRIKE = ["dstrike", "outline", "shadow", "emboss", "imprint", "noProof", "snapToGrid", "vanish", "webHidden", "color", "spacing", "w", "kern", "position", "sz", "szCs", "highlight", "u", "effect", "bdr", "shd", "fitText", "vertAlign", "rtl", "cs", "em", "lang", "eastAsianLayout", "specVanish", "oMath"];
// Absätze durchstreichen, die die Streife nicht erledigt (z. B. Aushändigung des Überprüfungsformulars)
function durchstreichen(doc, regeln, bericht) {
  for (const r of regeln || []) {
    if (r.wenn) { dokumenteImFall(); if (!dokumenteImFall.passt(r.wenn)) continue; }
    for (const p of Array.from(doc.getElementsByTagNameNS(W_NS, "p")).filter(p => wText(p).includes(r.enthaelt))) {
      for (const run of Array.from(p.getElementsByTagNameNS(W_NS, "r"))) {
        let rPr = wKinder(run, "rPr")[0];
        if (!rPr) { rPr = doc.createElementNS(W_NS, "w:rPr"); run.insertBefore(rPr, run.firstChild); }
        if (wKinder(rPr, "strike").length) continue;
        // Reihenfolge nach Word-Schema: <w:strike> steht vor dstrike, color, sz, u, lang …
        const danach = Array.from(rPr.childNodes).find(n => NACH_STRIKE.includes(n.localName));
        rPr.insertBefore(doc.createElementNS(W_NS, "w:strike"), danach || null);
      }
      if (bericht) bericht.gesetzt++;
    }
  }
}

function vorlageErkennen(doc) {
  const aliase = Array.from(doc.getElementsByTagNameNS(W_NS, "alias")).map(a => wAttr(a));
  // Nur den Kopf des Dokuments auswerten – im Fließtext werden andere Formulare oft erwähnt.
  // Gewinnt der Titel, der im Kopf am weitesten vorne steht (z. B. „Anlaufbescheinigung“ vor „… Inverwahrungnahme“).
  const kopf = wText(doc.documentElement).slice(0, 400);
  let bester = null;
  for (const e of C.vorlagen.erkennung) {
    if (e.sdt_alias) { if (aliase.includes(e.sdt_alias)) return e.id; continue; }
    const pos = kopf.indexOf(e.text);
    if (pos < 0 || (e.text2 && !kopf.toLowerCase().includes(e.text2))) continue;
    if (!bester || pos < bester.pos) bester = { id: e.id, pos };
  }
  return bester ? bester.id : "unbekannt";
}

const ART_KURZ = { inverwahrung: "Bescheinigung_Inverwahrung_21AsylG", inverwahrung50: "Bescheinigung_Inverwahrung_50AufenthG", abschluss: "Abschlusserklaerung", abschluss_ohne: "Abschlusserklaerung_ohne_Asylgesuch", abschluss_uma: "Abschlusserklaerung_umA", belehrung48: "Belehrung_48_62_AufenthG", fragebogen: "Fragebogen", fragebogen_uma: "Fragebogen_umA", belehrung15: "Belehrung_15_20_AsylG", info11: "Information_Art11", anlauf: "Anlaufbescheinigung", unbekannt: "Formular" };
function dateiBasis() {
  const geb = datumTeile(wert("geburtsdatum"));
  const teile = { azr_nummer: wert("azr_nummer") || "AZR-offen", name: wert("name") || "Name", vorname: wert("vorname") || "Vorname", geburtsdatum: geb ? `${geb.t}.${geb.m}.${geb.j}` : (wert("geburtsdatum") || "Geburtsdatum") };
  return (C.vorlagen.dateiname_screening || ["azr_nummer", "name", "vorname", "geburtsdatum"]).map(k => dateiSicher(teile[k] ?? wert(k))).join("_");
}
const dateiSicher = s => String(s || "").trim().replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, "_");

async function vorlageBefuellen(datei, korrekturen = {}, vorgabe = null) {
  const dateien = await zipLesen(await datei.arrayBuffer());
  const eintrag = dateien.find(d => d.name === "word/document.xml");
  if (!eintrag) throw new Error("In der Datei fehlt word/document.xml – ist es wirklich eine Word-Vorlage?");
  const xml = new TextDecoder().decode(eintrag.daten);
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("Word-Datei konnte nicht gelesen werden.");
  const art = vorgabe ? vorgabe.art : vorlageErkennen(doc);
  const fremd = !!(vorgabe && vorgabe.sprache);
  const bericht = art === "screening" ? screeningBefuellen(doc, C.vorlagen.screening, korrekturen) : kopfdatenBefuellen(doc, C.vorlagen, { art, fremd });
  if (art !== "screening") textfelderBefuellen(doc, (C.vorlagen.textfelder || {})[art], bericht);
  if (art !== "screening") textfeldAnker(doc, (C.vorlagen.textfeld_anker || {})[art]);
  if (art !== "screening") durchstreichen(doc, (C.vorlagen.durchstreichen || {})[art], bericht);
  // Kopfdaten stehen bei manchen Vorlagen (z. B. Fragebögen) in der Word-Kopfzeile
  if (art !== "screening") for (const kz of dateien.filter(d => /^word\/header\d*\.xml$/.test(d.name))) {
    const hdoc = new DOMParser().parseFromString(new TextDecoder().decode(kz.daten), "application/xml");
    if (hdoc.getElementsByTagName("parsererror").length) continue;
    const b = kopfdatenBefuellen(hdoc, { kopfdaten: C.vorlagen.kopfdaten });
    if (!b.gesetzt) continue;
    bericht.gesetzt += b.gesetzt;
    let x = new XMLSerializer().serializeToString(hdoc);
    if (!x.startsWith("<?xml")) x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' + x;
    kz.daten = new TextEncoder().encode(x);
  }
  let neu = new XMLSerializer().serializeToString(doc);
  if (!neu.startsWith("<?xml")) neu = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' + neu;
  eintrag.daten = new TextEncoder().encode(neu);
  const DOCX = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
  const blob = await zipSchreiben(dateien, DOCX);
  // Nur für die Bildschirm-Vorschau: Inhaltssteuerelemente „auspacken“ (die Vorschau zeigt sie in Tabellenzellen sonst nicht an).
  // Die gespeicherte Word-Datei bleibt unverändert.
  const vdoc = doc.cloneNode(true);
  const koerper = vdoc.getElementsByTagNameNS(W_NS, "body")[0];
  for (const sdt of Array.from(vdoc.getElementsByTagNameNS(W_NS, "sdt")).reverse()) {
    const inhalt = wKinder(sdt, "sdtContent")[0];
    if (inhalt) while (inhalt.firstChild) sdt.parentNode.insertBefore(inhalt.firstChild, sdt);
    sdt.parentNode.removeChild(sdt);
  }
  // Die Vorschau teilt nummerierte Absätze am gespeicherten Seitenwechsel (w:lastRenderedPageBreak) – es entsteht ein leerer Listenpunkt („4.“).
  // Nur für die Vorschau: diese Marken in nummerierten Absätzen entfernen.
  for (const m of Array.from(vdoc.getElementsByTagNameNS(W_NS, "lastRenderedPageBreak"))) {
    let p = m.parentNode; while (p && p.localName !== "p") p = p.parentNode;
    const pPr = p && wKinder(p, "pPr")[0];
    if (pPr && wKinder(pPr, "numPr").length) m.parentNode.removeChild(m);
  }
  // Schwebende Textfelder, die die Vorschau über den Text legt (z. B. Name in der Belehrung § 15/20): in der Vorschau als eigene Zeile zeigen
  if ((C.vorlagen.textfeld_anker || {})[art]) for (const tb of Array.from(vdoc.getElementsByTagNameNS(W_NS, "txbxContent"))) {
    if (!wText(tb).trim()) continue;
    let r = tb.parentNode; while (r && r.localName !== "r") r = r.parentNode;
    let p = r && r.parentNode; while (p && p.localName !== "p") p = p.parentNode;
    if (!r || !p || !p.parentNode || !r.parentNode) continue;
    const neu = Array.from(wKinder(tb, "p")).map(x => x.cloneNode(true));
    r.parentNode.removeChild(r);
    let nach = p;
    for (const q of neu) { nach.parentNode.insertBefore(q, nach.nextSibling); nach = q; }
  }
  // Mehrspaltige Abschnitte (Kopfblock des Screeningformulars: zwei ungleich breite Spalten, Inhalt nur links) zeigt die Vorschau
  // als zwei gleich breite Spalten – nur für die Vorschau einspaltig setzen, die Positionen der linken Spalte bleiben gleich.
  for (const cols of Array.from(vdoc.getElementsByTagNameNS(W_NS, "cols"))) {
    if (+(cols.getAttributeNS(W_NS, "num") || cols.getAttribute("w:num") || 1) <= 1) continue;
    cols.removeAttributeNS(W_NS, "num"); cols.removeAttribute("w:num"); while (cols.firstChild) cols.removeChild(cols.firstChild);
    // Leere Absätze nach dem Spaltenumbruch stehen in Word in der rechten Spalte neben dem Inhalt – einspaltig würden sie darunter Platz einnehmen
    let ende = cols.parentNode; while (ende && ende.localName !== "p" && ende.localName !== "body") ende = ende.parentNode;
    const absaetze = []; for (let q = ende; q && q.localName === "p"; q = q.previousSibling) { absaetze.unshift(q); if (Array.from(q.getElementsByTagNameNS(W_NS, "br")).some(b => (b.getAttributeNS(W_NS, "type") || b.getAttribute("w:type")) === "column")) break; while (q.previousSibling && q.previousSibling.nodeType !== 1) q = q.previousSibling; }
    const erster = absaetze[0];
    if (!erster || !Array.from(erster.getElementsByTagNameNS(W_NS, "br")).some(b => (b.getAttributeNS(W_NS, "type") || b.getAttribute("w:type")) === "column")) continue;
    absaetze.forEach((q, k) => {
      for (const b of Array.from(q.getElementsByTagNameNS(W_NS, "br"))) if ((b.getAttributeNS(W_NS, "type") || b.getAttribute("w:type")) === "column") b.parentNode.removeChild(b);
      if (wText(q).trim()) return;

async function vorlagenVerarbeiten() {
  VORLAGEN_LAEUFT = true;
  const ergebnis = [];
  const quellen = [...eingebaut().map(d => ({ d, von: "eingebaut" })), ...VORLAGEN_DATEIEN.map(d => ({ d, von: "geladen" }))];
  for (const { d, von } of quellen) {
    try { ergebnis.push({ ...(await vorlageBefuellen(d, KORREKTUREN)), von }); }
    catch (err) { ergebnis.push({ fehler: err.message, original: d.name, von }); }
  }
  // Von Hand geladene (neuere) Vorlagen ersetzen die eingebauten gleicher Art
  const geladen = new Set(ergebnis.filter(e => e.von === "geladen" && e.art && e.art !== "unbekannt").map(e => e.art));
  VORLAGEN_ERGEBNIS = ergebnis.filter(e => !(e.von === "eingebaut" && geladen.has(e.art)));
  // Sprachfassungen zum Aushändigen – nur für die in diesem Fall benötigten Formulare
  const spr = formularSprache(), noetig = new Set(dokumenteImFall().map(d => d.erkennung));
  if (spr && spr !== "deutsch") for (const [art, sprachen] of Object.entries(C.sprachen_formulare || {})) {
    if (!noetig.has(art) || !sprachen.includes(spr)) continue;
    const b64 = eingebettet(`sp/${art}/${spr}`);
    if (!b64) continue;
    try { VORLAGEN_ERGEBNIS.push({ ...(await vorlageBefuellen(b64Datei(b64, `${art}_${spr}.docx`, "application/vnd.openxmlformats-officedocument.wordprocessingml.document"), KORREKTUREN, { art, sprache: spr })), von: "sprache" }); }
    catch (err) { VORLAGEN_ERGEBNIS.push({ fehler: err.message, original: `${art} (${spr})`, von: "sprache" }); }
  }
  const rang = art => { const i = (C.dokumentauswahl || []).findIndex(d => d.erkennung === art); return i < 0 ? 99 : i; };
  VORLAGEN_ERGEBNIS.sort((x, y) => rang(x.art) - rang(y.art) || (x.sprache ? 1 : 0) - (y.sprache ? 1 : 0));
  VORLAGEN_LAEUFT = false;
  neuZeichnen();
}

// Seitenzahl-Felder (PAGE, NUMPAGES) in Kopf-/Fußzeilen: gespeicherter Wert durch Marke ersetzen, die Vorschau setzt die echte Zahl je Seite
function seitenFelderMarkieren(xdoc) {
  let n = 0;
  for (const fs of Array.from(xdoc.getElementsByTagNameNS(W_NS, "fldSimple"))) {
    const instr = (fs.getAttributeNS(W_NS, "instr") || fs.getAttribute("w:instr") || "").trim().split(/\s+/)[0].toUpperCase();
    if (instr !== "PAGE" && instr !== "NUMPAGES") continue;
    const ts = fs.getElementsByTagNameNS(W_NS, "t"); if (!ts.length) continue;
    ts[0].textContent = instr === "PAGE" ? "⟦P⟧" : "⟦N⟧"; for (let k = ts.length - 1; k > 0; k--) ts[k].textContent = ""; n++;
  }
  for (const q of Array.from(xdoc.getElementsByTagNameNS(W_NS, "p"))) {
    let zustand = 0, art = "", ergebnis = [];
    for (const r of Array.from(q.getElementsByTagNameNS(W_NS, "r"))) {
      const fc = r.getElementsByTagNameNS(W_NS, "fldChar")[0], typ = fc ? (fc.getAttributeNS(W_NS, "fldCharType") || fc.getAttribute("w:fldCharType")) : "";
      if (typ === "begin") { zustand = 1; art = ""; ergebnis = []; continue; }
      if (typ === "separate") { zustand = 2; continue; }
      if (typ === "end") {
        if ((art === "PAGE" || art === "NUMPAGES") && ergebnis.length) { ergebnis[0].textContent = art === "PAGE" ? "⟦P⟧" : "⟦N⟧"; ergebnis.slice(1).forEach(t => t.textContent = ""); n++; }
        zustand = 0; continue;
      }
      if (zustand === 1) { const it = r.getElementsByTagNameNS(W_NS, "instrText")[0]; if (it) art += it.textContent; art = art.trim().split(/\s+/)[0].toUpperCase(); }
      else if (zustand === 2) ergebnis.push(...Array.from(r.getElementsByTagNameNS(W_NS, "t")));
    }
  }
  return n;
}
// Seitenumbruch: Word speichert in manchen Vordrucken (Fragebögen) keine Seitenumbrüche – die Vorschau zeigt dann eine überlange Seite.
// Inhalt, der über den Satzspiegel hinausgeht, auf neue Seiten mit derselben Kopf- und Fußzeile verschieben; Tabellen zeilenweise teilen.
function docxUmbruch(ziel) {
  for (const start of [...ziel.querySelectorAll("section.docx")]) {
    let sec = start;
    for (let schutz = 0; schutz < 40; schutz++) {
      const hoehe = (parseFloat(sec.style.minHeight) || 842) * 4 / 3;
      // Geringer Überstand kommt von abweichender Schriftmetrik – die Seite wird später eingepasst (docxEinpassen), nicht geteilt
      if (sec.scrollHeight <= hoehe * (sec === start ? 1.15 : 1) + 2) break;
      const sr = sec.getBoundingClientRect(), fuss = sec.querySelector(":scope > footer");
      const grenze = sr.top + hoehe - parseFloat(getComputedStyle(sec).paddingBottom || 0) - (fuss ? fuss.offsetHeight : 0);
      const bloecke = [...sec.querySelectorAll(":scope > article > *")];
      const k = bloecke.findIndex(b => b.getBoundingClientRect().bottom > grenze + 1);
      if (k < 0) break;
      const block = bloecke[k];
      let teilTabelle = null;
      if (block.tagName === "TABLE") {
        const zeilen = [...block.querySelectorAll(":scope > tbody > tr, :scope > tr")];
        let z = zeilen.findIndex(r => r.getBoundingClientRect().bottom > grenze + 1);
        // Hohe Zeile über die Seitengrenze: wie Word innerhalb der Zeile teilen (Zellinhalt unterhalb der Grenze in eine Folgezeile)
        const r0 = zeilen[z];
        if (r0 && r0.getBoundingClientRect().top < grenze - 40) {
          const folge = r0.cloneNode(false); let bewegt = false;
          for (const td of [...r0.children]) {
            const ntd = td.cloneNode(false); ntd.removeAttribute("rowspan"); folge.appendChild(ntd);
            const kinder = [...td.children];
            const ab = kinder.findIndex((c, n) => n > 0 && c.getBoundingClientRect().bottom > grenze + 1);
            if (ab > 0) { kinder.slice(ab).forEach(c => ntd.appendChild(c)); bewegt = true; }
          }
          if (bewegt) { r0.after(folge); zeilen.splice(z + 1, 0, folge); z = z + 1; }
        }
        if (z > 0) {
          teilTabelle = block.cloneNode(false);
          for (const c of block.children) if (c.tagName === "COLGROUP") teilTabelle.appendChild(c.cloneNode(true));
          const tb = zeilen[z].parentElement, ntb = tb === block ? teilTabelle : teilTabelle.appendChild(tb.cloneNode(false));
          zeilen.slice(z).forEach(r => ntb.appendChild(r));
        }
      }
      if (!teilTabelle && k === 0) break; // ein einzelner Block ist höher als die Seite
      const neu = sec.cloneNode(false);
      const kopf = sec.querySelector(":scope > header"); if (kopf) neu.appendChild(kopf.cloneNode(true));
      const arts = [...sec.querySelectorAll(":scope > article")], ab = arts.indexOf(block.parentElement);
      arts.slice(ab).forEach((a, n) => {
        const na = a.cloneNode(false); neu.appendChild(na);
        if (n === 0) { if (teilTabelle) na.appendChild(teilTabelle); let x = teilTabelle ? block.nextSibling : block; while (x) { const w = x.nextSibling; na.appendChild(x); x = w; } }
        else { while (a.firstChild) na.appendChild(a.firstChild); a.remove(); }
      });
      if (fuss) neu.appendChild(fuss.cloneNode(true));
      sec.after(neu);
      sec = neu;
    }
  }
}
// Seiten nachbearbeiten: Kopf-/Fußzeile je Word-Abschnitt vereinheitlichen, Seitenzahlen einsetzen
function docxSeiten(ziel) {
  const seiten = [...ziel.querySelectorAll("section.docx")];
  let aktuell = null, nr = 0;
  const info = seiten.map(sec => {
    const marken = [...sec.querySelectorAll("article span")].filter(x => x.childElementCount === 0 && x.textContent.includes("⟦S|"));
    const art = sec.querySelector("article");
    let abschnitt = aktuell, start = "";
    marken.forEach((m, k) => {
      const mm = m.textContent.match(/⟦S\|(\d+)\|(\d*)⟧/);
      m.textContent = m.textContent.replace(/⟦S\|[^⟧]*⟧/, "");
      if (!mm) return;
      // Beginnt der Abschnitt ganz oben auf der Seite, gilt er für diese Seite
      const oben = art && m.getBoundingClientRect().top - art.getBoundingClientRect().top < 40;
      if (k === 0 && (oben || abschnitt === null)) { abschnitt = +mm[1]; start = mm[2]; }
      aktuell = +mm[1];
      if (k === 0 && oben && mm[2]) start = mm[2];
    });
    return { sec, abschnitt, start };
  });
  const erste = {};
  for (const s of info) {
    if (!(s.abschnitt in erste)) { erste[s.abschnitt] = s; continue; }
    const vorbild = erste[s.abschnitt].sec;
    for (const tag of ["footer", "header"]) {
      const soll = vorbild.querySelector(":scope > " + tag), ist = s.sec.querySelector(":scope > " + tag);
      if (soll && ist && soll.innerHTML !== ist.innerHTML) ist.replaceWith(soll.cloneNode(true));
      else if (soll && !ist) s.sec.appendChild(soll.cloneNode(true));
    }
  }
  for (const s of info) {
    nr = s.start ? +s.start : nr + 1;
    for (const el of s.sec.querySelectorAll(":scope > header span, :scope > footer span")) {
      if (el.childElementCount) continue;
      if (el.textContent.includes("⟦P⟧")) el.textContent = el.textContent.replace(/⟦P⟧/g, String(nr));
      if (el.textContent.includes("⟦N⟧")) el.textContent = el.textContent.replace(/⟦N⟧/g, String(seiten.length));
    }
  }
}
// Word-Dokument im Browser darstellen. Jedes Dokument bekommt einen eigenen Stil-Präfix – sonst überschreiben sich
// gleichnamige Formatvorlagen mehrerer Dokumente gegenseitig (z. B. „Überschrift 1“ der Belehrung im Screeningformular).
let DOCX_NR = 0;
async function docxRendern(blob, ziel, zusatz) {
  const schwebend = Array.isArray(zusatz) ? zusatz : zusatz && zusatz.schwebend, kaesten = zusatz && !Array.isArray(zusatz) ? zusatz.kaesten : null;
  const p = "docx" + (++DOCX_NR);
  await docx.renderAsync(blob, ziel, null, { className: p, inWrapper: true, breakPages: true, ignoreLastRenderedPageBreak: false, renderHeaders: true, renderFooters: true, experimental: true, useBase64URL: true });
  ziel.querySelectorAll(`.${p}-wrapper`).forEach(w => w.classList.add("docx-wrapper"));
  ziel.querySelectorAll(`section.${p}`).forEach(sec => sec.classList.add("docx"));
  docxSchriften(ziel);
  docxTabs(ziel);
  docxUmbruch(ziel);
  docxSeiten(ziel);
  docxKaestchen(ziel);
  docxLinien(ziel);
  docxWasserzeichen(ziel);
  docxFussnoten(ziel);
  if (schwebend && schwebend.length) docxSchwebend(ziel, schwebend);
  docxKaesten(ziel, kaesten || []);
  docxEinpassen(ziel);
}
// Seiten, die wegen abweichender Schriftmetrik etwas länger als A4 sind, gleichmäßig verkleinert einpassen (sonst Zusatzblatt beim Drucken)
function docxEinpassen(ziel) {
  for (const sec of ziel.querySelectorAll("section.docx")) {
    const soll = (parseFloat(sec.style.minHeight) || 842) * 4 / 3, ist = sec.scrollHeight;
    if (ist <= soll + 1) continue;
    const f = soll / ist, cs = getComputedStyle(sec);
    const innen = document.createElement("div");
    innen.style.cssText = `position:absolute;left:0;top:0;box-sizing:border-box;width:${sec.offsetWidth}px;min-height:${ist}px;padding:${cs.padding};display:flex;flex-flow:column nowrap;transform-origin:0 0;transform:scale(${f})`;
    while (sec.firstChild) innen.appendChild(sec.firstChild);
    sec.appendChild(innen);
    Object.assign(sec.style, { position: "relative", padding: "0", height: soll + "px", overflow: "hidden" });
  }
}
// Tabulatoren selbst setzen: Marke ⟦T|pos:art,…⟧ am Absatzanfang (Positionen in Twips ab Textrand der Spalte/Zelle),
// danach jeden Tabulator als feste Breite bis zum nächsten Stopp. Ohne passenden Stopp: Standardabstand 1,25 cm.
function docxTabs(ziel) {
  for (const sp of [...ziel.querySelectorAll("section.docx span")].filter(x => x.childElementCount === 0 && x.textContent.startsWith("⟦T|"))) {
    const m = sp.textContent.match(/^⟦T\|([^⟧]*)⟧/); sp.textContent = sp.textContent.replace(/^⟦T\|[^⟧]*⟧/, "");
    const p = sp.closest("p"); if (!p || !m) continue;
    const stopps = m[1].split(",").filter(Boolean).map(x => { const [pos, art] = x.split(":"); return { pt: +pos / 20, art }; });
    const basis = p.getBoundingClientRect().left - parseFloat(getComputedStyle(p).marginLeft || 0) - parseFloat(getComputedStyle(p.parentElement).paddingLeft || 0) * 0;
    const tabs = [...p.querySelectorAll("span[class$='-tab-stop']")];
    // Tabstopps jenseits des rechten Textrands (z. B. BAMF-Fußzeile „Stand: …“): Word schreibt in den Seitenrand hinein, kein Umbruch
    if (stopps.some(x => x.pt > p.getBoundingClientRect().width * 0.75 - 1)) p.style.whiteSpace = "nowrap";
    tabs.forEach((t, k) => {
      Object.assign(t.style, { wordSpacing: "normal", display: "inline-block", width: "0pt" });
      const jetzt = (t.getBoundingClientRect().left - basis) * 0.75;
      let stop = stopps.find(x => x.pt > jetzt + 0.5);
      let breite;
      if (stop && (stop.art === "right" || stop.art === "center")) {
        // Rechtsbündiger Stopp: folgender Text bis zum nächsten Tabulator endet am Stopp
        let folgend = 0; for (let n = t.nextSibling || t.parentElement.nextSibling; n && !(n.querySelector && (n.matches?.("span[class$='-tab-stop']") || n.querySelector("span[class$='-tab-stop']"))); n = n.nextSibling) folgend += (n.getBoundingClientRect ? n.getBoundingClientRect().width : 0) * 0.75;
        breite = Math.max(2, stop.pt - jetzt - (stop.art === "center" ? folgend / 2 : folgend));
      } else breite = stop ? stop.pt - jetzt : 35.4 - (jetzt % 35.4);
      t.style.width = Math.max(1, breite) + "pt";
    });
  }
}
// Kästchen (☐/☒ in „MS Gothic“) stehen oft in eigenen Absätzen neben den Beschriftungen; Word gibt diesen Zeilen das 1,25-fache der Schriftgröße.
function docxKaestchen(ziel) {
  for (const sp of ziel.querySelectorAll("section.docx span")) {
    if (!/MS Gothic|Segoe UI Symbol|MS Mincho/i.test(sp.style.fontFamily || getComputedStyle(sp).fontFamily) || !/^[☐☒☑\s]+$/.test(sp.textContent)) continue;
    const p = sp.closest("p"), lh = p ? p.style.lineHeight : "";
    if (lh) { if (/pt$/.test(lh)) sp.style.lineHeight = lh; continue; } // feste Zeilenhöhe aus Word beibehalten
    sp.style.lineHeight = "1.25";
    if (p && p.textContent.trim() === sp.textContent.trim()) p.style.lineHeight = "1.25";
  }
}
// Marken ⟦K|n⟧: verankerte Formen/Gruppen an der Word-Position zeichnen (Rahmen, Füllung, Linien, Text, Drehung)
function docxKaesten(ziel, kaesten) {
  const zeichnen = (f, eltern) => {
    const d = document.createElement("div");
    d.style.cssText = `position:absolute;left:${f.x}pt;top:${f.y}pt;width:${f.w}pt;height:${f.h}pt;box-sizing:border-box;${f.rot ? `transform:rotate(${f.rot}deg);` : ""}`;

// Originalgetreue Vorschau des ausgefüllten Word-Dokuments (docx-preview, im Browser)
function Vorschau(i) {
  bereich("screening");
  const e = VORLAGEN_ERGEBNIS[i];
  if (!e) return Originalformulare();
  return {
    title: ART_NAMEN[e.art] || "Vorschau",
    html: `<p class="small" style="margin:0 0 10px">${esc(e.name)} – so sieht das ausgefüllte Original aus. Die Word-Datei ist in der <b>ZIP-Datei</b> enthalten (auf der Seite „Alle Unterlagen“ → „Alle speichern (ZIP)“).</p>
      <button class="btn glassy" id="vDr" style="margin:0 0 12px">${svg("print")} Dieses Formular drucken</button>
      <div id="vBlatt" style="overflow:hidden;border-radius:10px;background:#8a8f98;padding:8px 0"><p class="small" style="color:#fff;text-align:center">Vorschau wird erstellt …</p></div>`,
    bind: async () => {
      const ziel = $("vBlatt");
      if (typeof docx === "undefined" || !docx.renderAsync) { ziel.innerHTML = `<p class="small" style="color:#fff;padding:12px">Vorschau in dieser Ausgabe nicht verfügbar – bitte speichern und in Word öffnen.</p>`; return; }
      try {
        ziel.innerHTML = "";
        const innen = document.createElement("div"); ziel.appendChild(innen);
        await docxRendern(e.vorschauBlob || e.blob, innen, e);
        const passen = () => { const seite = innen.querySelector("section.docx"); if (!seite) return; innen.style.zoom = ""; const z = Math.min(1, (ziel.clientWidth - 4) / (seite.offsetWidth + 20)); innen.style.zoom = z; };
        passen(); window.addEventListener("resize", passen, { passive: true });
      } catch (err) { ziel.innerHTML = `<p class="small" style="color:#fff;padding:12px">Vorschau nicht möglich (${esc(err.message)}) – bitte speichern und in Word öffnen.</p>`; }
      $("vDr").onclick = () => {
        vibrate();
        const d = document.getElementById("druck");
        d.innerHTML = ""; const k = ziel.firstElementChild.cloneNode(true); k.style.zoom = ""; d.appendChild(k); d.classList.add("docxdruck");
        window.print();
        setTimeout(() => d.classList.remove("docxdruck"), 1000);
      };
    }
  };
}

const quelleChip = q => {
  if (!q || !C.quellen_leitfaden || !C.quellen_leitfaden[q]) return "";
  const pr = q === "pruefen";
  return ` <span class="qchip${pr ? " pr" : ""}" title="${esc(C.quellen_leitfaden[q].titel)}">${pr ? "⚠ " : ""}${esc(QKURZ[q] || q)}</span>`;
};
const leitfaden = id => (C.leitfaeden || {})[id];

function weiterKnopf(w, i) {
  return `<button class="btn ${i ? "glassy" : ""}" data-wlf="${i}" style="margin:8px 0 0">${svg(w.handreichung || w.vorlage ? "print" : w.checkliste ? "list" : w.screening ? "shieldcheck" : "arrowr", 2.2)} ${esc(w.text)}</button>`;

function weiterBinden(liste) {

  };

function Leitfaden(id, startKnoten) {
  const L = leitfaden(id);
  let verlauf = [], aktuell = startKnoten || L.start;
  const haken = new Set();
  const schritt = (richtung, fn) => uebergang(richtung, anim => { fn(); render(anim ? (richtung === "back" ? "enter-back" : "enter-fwd") : ""); });
  const leiste = () => verlauf.length ? `<div class="bottombar static"><button class="btn glassy" id="lfZ">${svg("chevl", 2.2)} Zurück</button><button class="btn glassy danger" id="lfN">${svg("rotate")} Neu</button></div>` : "";
  const view = () => {
    bereich(id);
    const k = L.knoten[aktuell];
    if (k.typ === "frage") return {
      title: L.titel,
      html: `<div data-lf="${id}"><div style="margin-top:4px"><span class="chipnum">Frage ${verlauf.length + 1}</span> <span class="small"><b>${esc(L.titel)}</b></span></div>
        <div class="qbig rounded">${esc(k.frage)}</div>
        ${k.hilfe ? `<div class="note glass">${svg("info").replace("<svg", '<svg style="color:#0082c4"')}<span>${esc(k.hilfe)}</span></div>` : ""}
        ${k.antworten.map((a, i) => `<button class="answer glass press" data-lw="${i}"><span>${esc(a.text)}</span>${svg("arrowcircle")}</button>`).join("")}
        ${leiste()}</div>`,
      bind
    };
    const farbe = { handeln: 2, info: 0, wechsel: 4 }[k.art] ?? 0;
    const weiter = k.weiter || [];
    return {
      title: "Ergebnis",
      html: `<div data-lf="${id}"><div class="result" style="${farbVars(farbe)}">${svg(k.art === "handeln" ? "shieldalert" : k.art === "wechsel" ? "swap" : "info", 2)}
          <h2 class="rounded">${esc(k.titel)}</h2><div>${esc(k.kurz)}</div></div>
        ${weiter.length && k.art === "wechsel" ? weiter.map(weiterKnopf).join("") : ""}
        ${k.massnahmen && k.massnahmen.length ? `<h3 class="sec">Das machst du jetzt <small>${haken.size}/${k.massnahmen.length}</small></h3>
          ${k.massnahmen.map((mm, i) => `<button class="step glass press check ${haken.has(i) ? "on" : ""} ${mm.wichtig ? "wichtig" : ""}" data-lh="${i}">
            <span class="cbox">${svg("check", 3)}</span><span class="txt">${mm.wichtig ? `<span class="wbadge">${svg("alert", 2.4)} Besonders wichtig</span>` : ""}<span class="strikeme">${esc(mm.text)}</span>${quelleChip(mm.q)}${mm.hinweis ? `<span class="s">ⓘ ${esc(mm.hinweis)}</span>` : ""}</span></button>`).join("")}` : ""}
        ${beispielBox(k.beispiel)}
        ${vertiefung("Hintergrund und Rechtsgrundlagen", `${k.wissen && k.wissen.length ? `<div class="merke" style="margin-top:4px"><b class="h">${svg("bulb")} Gut zu wissen</b><ul>${k.wissen.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
        ${k.normen && k.normen.length ? `<h3 class="sec">Rechtsgrundlagen</h3><div class="glass" style="padding:6px 16px">${k.normen.map(nn => `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><span class="normchip">${esc(nn.norm)}</span>${quelleChip(nn.q)}<div class="small" style="margin-top:4px;color:var(--text)">${esc(nn.text)}</div></div>`).join("")}</div>` : ""}`)}
        ${weiter.length && k.art !== "wechsel" ? `<h3 class="sec">Weiter</h3>${weiter.map(weiterKnopf).join("")}` : ""}
        ${C.handreichungen && C.handreichungen[id] && !weiter.some(w => w.handreichung) ? `<button class="btn glassy" id="lfH" style="margin-top:10px">${svg("print")} Handreichung zum Ausdrucken</button>` : ""}
        ${leiste()}</div>`,
      bind: () => {
        bind();
        app.querySelectorAll("[data-lh]").forEach(el => el.onclick = () => {
          vibrate(); const i = +el.dataset.lh; haken.has(i) ? haken.delete(i) : haken.add(i);
          el.classList.toggle("on", haken.has(i));
          const h = app.querySelector("h3.sec small"); if (h) h.textContent = `${haken.size}/${k.massnahmen.length}`;
        });
        weiterBinden(weiter);
        const h = $("lfH"); if (h) h.onclick = () => { vibrate(); go(() => Handreichung(id)); };
      }
    };
  };
  function bind() {
    app.querySelectorAll("[data-lw]").forEach(el => el.onclick = () => {
      vibrate(); const i = +el.dataset.lw;
      schritt("fwd", () => { verlauf.push(aktuell); aktuell = L.knoten[aktuell].antworten[i].ziel; haken.clear(); });
    });
    const z = $("lfZ"); if (z) z.onclick = () => { vibrate(); schritt("back", () => { aktuell = verlauf.pop(); haken.clear(); }); };
    const nn = $("lfN"); if (nn) nn.onclick = () => { vibrate(); schritt("back", () => { verlauf = []; aktuell = L.start; haken.clear(); }); };
  }
  return view;
}

// Grafiken der Handreichung: Ablauf (Schritte mit Pfeilen), Vergleich (zwei Spalten), Karten (Status-Übersicht)
function hrGrafik(g) {
  if (!g) return "";
  const kopf = g.titel ? `<div class="hrg-titel">${esc(g.titel)}</div>` : "";
  if (g.typ === "ablauf") return `<div class="hrg">${kopf}<div class="hrg-ablauf">${g.schritte.map((x, i) => `${i ? '<span class="hrg-pfeil">➜</span>' : ""}<div class="hrg-schritt"><span class="hrg-ico">${svg(x.icon, 2)}</span><span class="hrg-nr">${i + 1}</span><div>${esc(x.text)}</div></div>`).join("")}</div></div>`;
  if (g.typ === "vergleich") return `<div class="hrg">${kopf}<div class="hrg-vergleich">${g.spalten.map(sp => `<div class="hrg-spalte" style="--f:${sp.farbe}"><div class="hrg-kopf">${svg(sp.icon, 2)}<b>${esc(sp.kopf)}</b></div>${sp.zeilen.map((z, i) => `${i ? '<div class="hrg-runter">▼</div>' : ""}<div class="hrg-zeile">${esc(z)}</div>`).join("")}<div class="hrg-fazit">${esc(sp.fazit)}</div></div>`).join("")}</div></div>`;
  if (g.typ === "karten") return `<div class="hrg">${kopf}<div class="hrg-karten">${g.karten.map(k => `<div class="hrg-karte" style="--f:${k.farbe}"><span class="hrg-ico">${svg(k.icon, 2)}</span><b>${esc(k.kopf)}</b><div>${esc(k.text)}</div></div>`).join("")}</div></div>`;
  return "";
}

// Punkte, die mit einer Frage beginnen („Ausländerbehörde informieren? Immer …“): Frage hervorgehoben und fett
const hrFrage = t => { const m = String(t).match(/^([^?]{3,100}\?)(\s[\s\S]*)$/); return m ? `<b class="hr-frage">${esc(m[1])}</b>${esc(m[2])}` : esc(t); };

// **fett** im Text erlauben (nach dem Maskieren)
const hrText = t => hrFrage(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
// Unterpunkte; „Für die Streife: …“ wird als Handlungsanweisung für die Polizei hervorgehoben
const hrUnter = liste => liste && liste.length ? `<ul class="hr-unterliste">${liste.map(u => /^Für die Streife:/.test(u)
  ? `<li class="hr-polizei-u"><span class="hr-wico">${svg("shieldcheck", 2)}</span><span><b>Für die Streife:</b>${hrText(u.replace(/^Für die Streife:/, ""))}</span></li>`
  : `<li>${hrText(u)}</li>`).join("")}</ul>` : "";
// Ein Punkt: [Text, Quelle, Art, Unterpunkte] – Art: „wichtig[:Symbol]“, „polizei“ oder „variante:Farbe“
function hrPunkt([t, , w, unter]) {
  const art = String(w || "").split(":")[0], zusatz = String(w || "").split(":")[1];
  if (art === "polizei") return `<li class="hr-polizei"><span class="hr-wico">${svg("shieldcheck", 2)}</span><span><b>Für die Streife:</b> ${hrText(t)}${hrUnter(unter)}</span></li>`;
  if (art === "variante") return `<li class="hr-variante" style="--f:${zusatz || "#002664"}">${hrText(t)}${hrUnter(unter)}</li>`;
  if (w) return `<li class="hr-wichtig"><span class="hr-wico">${svg(zusatz || "alert", 2)}</span><span><b>Besonders wichtig:</b> ${hrText(t)}${hrUnter(unter)}</span></li>`;
  return `<li>${hrText(t)}${hrUnter(unter)}</li>`;
}

// ================= Verwaltung: Inhalte anpassen und als neue Fassung speichern (nur interne Ausgabe) =================
// Änderungen gelten sofort auf diesem Rechner. Dauerhaft für alle werden sie erst mit „Neue Fassung speichern“ –
// die App schreibt dann eine neue HTML-Datei mit den geänderten Inhalten, die verteilt wird.
const VORLAGEN_NEU = {};   // ersetzte Word-Vorlagen (nur bis zum Speichern, im Arbeitsspeicher)
function anpassungSpeichern() { try { localStorage.setItem(ANPASSUNG_KEY, JSON.stringify(ANPASSUNG)); } catch (e) {} }
const dateiB64 = datei => new Promise((ok, fehler) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = fehler; r.readAsDataURL(datei); });

function neueFassungSpeichern() {
  const roh = JSON.parse(document.getElementById("content").textContent);
  (roh.einstellungen || []).forEach(e => { e.wert = EINST[e.id] ?? e.wert; });
  roh.weisungen = (C.weisungen || []).map(w => ({ titel: w.titel, text: w.text, ab: w.ab || "" }));
  roh.kontakte = kontakte().map(k => ({ name: k.name, rolle: k.rolle, telefon: k.telefon }));
  for (const v of roh.vorlagen_eingebaut || []) if (VORLAGEN_NEU[v.name]) v.daten = VORLAGEN_NEU[v.name];
  const heute = new Date().toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
  roh.meta.anpassung = heute;
  const json = JSON.stringify(roh).replace(/<\//g, "<\\/");
  const marke = '<script id="content" type="application/json">';
  const a = QUELLTEXT.indexOf(marke), b = QUELLTEXT.indexOf("<\/script>", a);
  if (a < 0 || b < 0) { alert("Die neue Fassung konnte nicht erstellt werden."); return; }
  const html = QUELLTEXT.slice(0, a) + marke + json + QUELLTEXT.slice(b);
  speichern(new Blob([html], { type: "text/html" }), `Streifenhelfer-Auslaenderbereich-PDL_angepasst_${heute.split(".").reverse().join("-")}.html`);
}

      <h3 class="sec">Aktuelle Hinweise auf der Startseite</h3>
      ${W.map((w, i) => `<div class="rowtile glass"><span class="txt"><span class="t">${esc(w.titel)}</span><br><span class="s">${esc(w.ab ? "ab " + w.ab + " · " : "")}${esc(w.text)}</span></span><button class="chip" data-we="${i}">Bearbeiten</button></div>`).join("") || '<p class="small">Keine Hinweise.</p>'}

      <h3 class="sec">Kontakte</h3>

      <h3 class="sec">Word-Vorlagen ersetzen</h3>
      <p class="small">Neue Fassung eines Formulars (z. B. vom LDS) auswählen – sie ersetzt die eingebaute Vorlage. Wichtig: gleicher Aufbau wie bisher (gleiche Felder), sonst füllt die App sie nicht richtig aus.</p>
      ${(C.vorlagen_eingebaut || []).map((v, i) => `<div class="rowtile glass"><span class="txt"><span class="t">${esc(v.name.replace(/\.docx$/i, "").replace(/_/g, " "))}</span><br><span class="s">${VORLAGEN_NEU[v.name] ? `<b style="color:#1e7e4a">ersetzt – wird mit der neuen Fassung gespeichert</b>` : "eingebaut"}</span></span><label class="chip" style="cursor:pointer">Ersetzen<input type="file" accept=".docx" data-vn="${i}" hidden></label></div>`).join("")}
      <h3 class="sec">Speichern</h3>

    bind: () => {

      $("wNeu").onclick = () => weisungBearbeiten(-1);
      const eSp = $("eSp"); if (eSp) eSp.onclick = () => {

        anpassungSpeichern(); alert("Übernommen. Die App wird neu geladen, damit die Angaben überall erscheinen."); location.reload();
      };
      $("vK").onclick = () => { vibrate(); go(Kontakte); };
      app.querySelectorAll("[data-vn]").forEach(inp => inp.onchange = async () => {

        neuZeichnen();
      });
      $("vSp").onclick = () => { vibrate(); neueFassungSpeichern(); };
