    padding: calc(env(safe-area-inset-top) + 10px) 16px 8px;

<script id="content" type="application/json">{"meta":{"titel":"GEAS & Rückführung","untertitel":"Einsatz- und Lernhilfe für den Polizeivollzugsdienst – Zuschnitt Polizei Sachsen / PD Leipzig","version":"1.0.0","stand":"September 2026","hinweis":"Diese App ist eine inoffizielle Arbeits- und Lernhilfe. Sie ersetzt weder Gesetzestext, Erlasse, Dienstanweisungen der Polizei Sachsen noch die Weisung der zuständigen Ausländerbehörde oder der Führung im Einsatz. Rechtsstand: GEAS-Reform (EU) und GEAS-Anpassungsgesetz, in Kraft seit 12.06.2026. Paragraphenangaben zum neuen nationalen Recht vor dienstlicher Verwendung stets gegen die aktuelle Gesetzesfassung und die Erlasslage des SMI prüfen. Keine personenbezogenen Daten in dieser App speichern."},"kapitel":[{"id":"grundlagen","titel":"GEAS – Überblick","icon":"globe.europe.africa","kurz":"Was ist die GEAS-Reform, welche Rechtsakte gibt es und seit wann gelten sie?","abschnitte":[{"titel":"Worum geht es?","text":"Das Gemeinsame Europäische Asylsystem (GEAS) ist der europäische Rechtsrahmen für Asyl, Zuständigkeit, Aufnahme und Rückkehr. Mit der **GEAS-Reform 2024** hat die EU das System grundlegend neu gefasst. Die meisten Rechtsakte sind **Verordnungen** – sie gelten in Deutschland **unmittelbar**, ohne dass es eines deutschen Gesetzes bedarf.\n\nDie neuen Regeln gelten seit dem **12. Juni 2026**. Deutschland hat sein nationales Recht mit dem **GEAS-Anpassungsgesetz** und dem **GEAS-Anpassungsfolgegesetz** angepasst (Bundestag 27.02.2026, Bundesrat 27.03.2026, verkündet Ende April 2026). Geändert wurden vor allem AsylG, AufenthG und AsylbLG."},{"titel":"Die Rechtsakte der Reform","text":"• **Screening-VO** – VO (EU) 2024/1356: Überprüfung von Drittstaatsangehörigen (Identität, Gesundheit, Vulnerabilität, Sicherheit)\n• **Eurodac-VO** – VO (EU) 2024/1358: biometrische Datenbank (Fingerabdrücke + Gesichtsbild)\n• **AMM-VO** – VO (EU) 2024/1351: Asyl- und Migrationsmanagement, Zuständigkeit (Nachfolger der Dublin-III-VO), Solidarität\n• **Asylverfahrens-VO (AVVO)** – VO (EU) 2024/1348: einheitliches Asylverfahren inkl. Grenzverfahren\n• **Rückkehr-Grenzverfahrens-VO** – VO (EU) 2024/1349\n• **Krisen-VO** – VO (EU) 2024/1359: Krisen und höhere Gewalt\n• **Anerkennungs-VO** – VO (EU) 2024/1347: Voraussetzungen für internationalen Schutz\n• **Aufnahme-RL** – RL (EU) 2024/1346: Aufnahmebedingungen (national umgesetzt)\n• **Neuansiedlungs-VO** – VO (EU) 2024/1350: Resettlement\n\nDie **Rückführungsrichtlinie 2008/115/EG** bleibt bis auf Weiteres Grundlage des nationalen Rückkehrrechts (AufenthG)."},{"titel":"Der Weg einer Person durch das neue System","text":"1. **Aufgriff / Ankunft** – an der Außengrenze oder im Inland (z. B. bei einer Kontrolle in Leipzig)\n2. **Screening** – Identität, Gesundheit, Vulnerabilität, Sicherheit, Eurodac\n3. **Weiterleitung** – ins Asylverfahren (regulär, beschleunigt oder Grenzverfahren) oder ins Rückkehrverfahren\n4. **Zuständigkeitsprüfung** nach AMM-VO – ggf. Überstellung in den zuständigen Mitgliedstaat\n5. **Asylentscheidung** durch das BAMF – bei Ablehnung zugleich **Rückkehrentscheidung**\n6. **Rückkehr** – freiwillig oder zwangsweise (Abschiebung) – hier liegt der Schwerpunkt der Landespolizei"},{"titel":"Was ändert sich für die Polizei vor Ort?","text":"• **Screening im Inland**: Wer unerlaubt aufhältig angetroffen wird und noch nicht an einer Außengrenze überprüft wurde, ist grundsätzlich zu überprüfen (max. 3 Tage). Nach § 71 Abs. 4a AufenthG sind hierfür u. a. die **Polizeien der Länder** zuständig; die konkrete Aufgabenverteilung regelt das Landesrecht.\n• **Eurodac** erfasst nun bereits ab **6 Jahren** Fingerabdrücke **und** Gesichtsbild.\n• **Neue Haftformen**: u. a. Überprüfungshaft (Screening), Asylverfahrenshaft (§§ 69 ff. AsylG), Überstellungshaft (Art. 44 AMM-VO).\n• **Sekundärmigrationszentren** für Personen, für die ein anderer Mitgliedstaat zuständig ist – in Sachsen seit 01.07.2026 in Dresden.\n• Klassische Rückführung (Abschiebung, Abschiebungshaft, Ausreisegewahrsam) bleibt im AufenthG geregelt."}],"merke":["Stichtag: 12.06.2026 – seitdem gelten GEAS-Verordnungen unmittelbar.","EU-Verordnungen gehen nationalem Recht vor; das AufenthG/AsylG ergänzt und konkretisiert.","Die Landespolizei ist vor allem bei Aufgriff, Screening im Inland, Festnahme und Vollzug von Rückführungen gefordert."]},{"id":"screening","titel":"Screening","icon":"person.text.rectangle","kurz":"Überprüfung nach der Screening-VO – an der Außengrenze und im Inland.","abschnitte":[{"titel":"Wer wird überprüft?","text":"• Personen, die die **EU-Außengrenze unerlaubt überschritten** haben (Aufgriff im Grenzzusammenhang)\n• Personen, die an der Außengrenze (auch Flughafen/Seehafen) **internationalen Schutz beantragen**, ohne die Einreisevoraussetzungen zu erfüllen\n• Nach **Seenotrettung** ausgeschiffte Personen\n• **Im Inland**: Drittstaatsangehörige, die sich **unerlaubt** im Hoheitsgebiet aufhalten, wenn es keine Anhaltspunkte gibt, dass sie bereits an der Außengrenze überprüft wurden (Art. 7 Screening-VO)"},{"titel":"Inhalt des Screenings","text":"• **Identifizierung/Identitätsprüfung** – Dokumente, Datenbankabgleich\n• **Vorläufige Gesundheitskontrolle** – durch die nach Landesrecht zuständigen Gesundheitsbehörden\n• **Vorläufige Vulnerabilitätsprüfung** – z. B. Minderjährige, Schwangere, Opfer von Menschenhandel, Folter, Behinderung\n• **Sicherheitsprüfung** – Abgleich u. a. SIS, Europol-, Interpol- und nationale Datenbanken\n• **Erfassung biometrischer Daten** in Eurodac\n• Ausfüllen des **Überprüfungsformulars** (Screening-Formular)"},{"titel":"Dauer und Rechtsgrundlagen (national)","text":"• Außengrenze: höchstens **7 Tage** – § 14a AufenthG (Zuständigkeit an Flug- und Seehäfen i. d. R. Bundespolizei)\n• Inland: höchstens **3 Tage** – § 15b AufenthG\n• Die Person ist zur Durchführung **festzuhalten** und an einen geeigneten Ort zu **verbringen**, wenn die Überprüfung sonst nicht oder nur unter erheblichen Schwierigkeiten möglich ist.\n• **Freilassen**, wenn nicht **bis zum Ende des Tages nach dem Ergreifen** eine **richterliche Entscheidung** über die Fortdauer vorliegt (Art. 104 GG).\n• Zuständigkeit: § 71 Abs. 4a AufenthG – Polizeien der Länder sowie weitere nach Landesrecht bestimmte Behörden (z. B. Ausländerbehörden, Aufnahmeeinrichtungen). **Die sächsische Aufgabenverteilung (Zuständigkeitsverordnung/Erlass SMI) beachten.**"},{"titel":"Ergebnis des Screenings","text":"Das Screening endet mit der **Weiterleitung**:\n• ins **Asylverfahren** (regulär oder Grenzverfahren), wenn ein Antrag auf internationalen Schutz gestellt wurde,\n• ins **Zuständigkeitsverfahren** (AMM-VO), wenn ein anderer Mitgliedstaat zuständig sein könnte,\n• ins **Rückkehrverfahren**, wenn kein Schutzantrag gestellt wurde und kein Aufenthaltsrecht besteht.\n\nWichtig: Während des Screenings **bleibt das Recht, Asyl zu beantragen**, unberührt. Ein Asylgesuch ist aufzunehmen und weiterzugeben."},{"titel":"Praxis PD Leipzig","text":"• Unerlaubt Aufhältige werden in Leipzig häufig bei Verkehrs-, Bahnhofs- oder Personenkontrollen angetroffen. Vor Einleitung eines Screenings **Eurodac-/INPOL-/AZR-Abfrage** – ist die Person bereits erfasst oder überprüft, entfällt das Screening regelmäßig.\n• **Minderjährige** und **Vulnerable** frühzeitig erkennen und dokumentieren (Jugendamt bei UMA).\n• **Sprachmittlung** sicherstellen; Belehrung in einer verständlichen Sprache.\n• Fristen strikt überwachen: **Richtervorbehalt** bei Festhalten über den Folgetag hinaus."}],"merke":["Inland: max. 3 Tage, Außengrenze: max. 7 Tage.","Festhalten über das Ende des Folgetages hinaus nur mit richterlicher Entscheidung.","Screening ist kein Asylverfahren – Asylgesuche bleiben jederzeit möglich."]},{"id":"eurodac","titel":"Eurodac & Identität","icon":"touchid","kurz":"Biometrische Erfassung, Speicherfristen, Identitätsfeststellung.","abschnitte":[{"titel":"Neues Eurodac","text":"• Erfassung von **Fingerabdrücken und Gesichtsbild**\n• Erfassung bereits **ab 6 Jahren** (bisher 14)\n• Zusätzliche Kategorien, u. a. unerlaubt Aufhältige, nach Seenotrettung Ausgeschiffte, Resettlement, vorübergehender Schutz\n• Speicherdauer u. a.: Antragstellende **10 Jahre**, irreguläre Einreise/unerlaubter Aufenthalt **5 Jahre**\n• **Sicherheitskennzeichnung**, wenn die Person eine Gefahr für die innere Sicherheit darstellen könnte\n• Eurodac wird mit anderen EU-Informationssystemen interoperabel"},{"titel":"Identitätsfeststellung im AufenthG/AsylG","text":"• **§ 49 AufenthG** – Überprüfung, Feststellung und Sicherung der Identität; erkennungsdienstliche Maßnahmen\n• **§ 16 AsylG** – Sicherung der Identität bei Asylsuchenden (ED-Behandlung)\n• **§ 48 AufenthG** – Ausweispflichten; bei fehlendem Pass Mitwirkungspflicht und **Durchsuchung nach Identitätsdokumenten** sowie Auswertung von **Datenträgern** unter den dort genannten Voraussetzungen\n• **§ 48a AufenthG** – Herausgabe von Zugangsdaten zu Datenträgern\n\nBei Kindern: altersgerecht, kindgerecht und in Anwesenheit einer Vertrauensperson/eines Vertreters vorgehen."},{"titel":"Praxistipps","text":"• Vor jeder Maßnahme prüfen: **AZR, INPOL, SIS, Eurodac** (über die vorhandenen Fahndungs-/ED-Systeme)\n• Widersprüchliche Personalien immer als **Aliaspersonalien** dokumentieren\n• Mobiltelefone nicht ohne Rechtsgrundlage auswerten – § 48 Abs. 3a AufenthG (Datenträgerauswertung) setzt u. a. voraus, dass der Zweck nicht durch mildere Mittel erreicht werden kann\n• Dokumente sicherstellen und der Ausländerbehörde zuleiten (§ 48 AufenthG)"}],"merke":["Eurodac ab 6 Jahren – Fingerabdrücke + Gesichtsbild.","Aliaspersonalien vollständig dokumentieren.","Datenträgerauswertung nur unter den engen Voraussetzungen des § 48 Abs. 3a AufenthG."]},{"id":"asylverfahren","titel":"Asylverfahren","icon":"doc.text.magnifyingglass","kurz":"Antrag stellen, registrieren, förmlich stellen – regulär, beschleunigt, Grenzverfahren.","abschnitte":[{"titel":"Asylgesuch bei der Polizei","text":"Wer gegenüber der Polizei um Schutz nachsucht (auch nur sinngemäß, z. B. „Asyl“, „Protection“, Angst vor Rückkehr), hat einen **Antrag auf internationalen Schutz gestellt** (Stufe „Stellen“ nach AVVO). Die Polizei zählt zu den Behörden, bei denen Anträge wahrscheinlich gestellt werden, und muss:\n• das Gesuch **aufnehmen und dokumentieren**,\n• die Person über das weitere Verfahren **informieren** (wo und wie förmlich stellen),\n• die Person an die **zuständige Aufnahmeeinrichtung** bzw. das BAMF **weiterleiten** (vgl. § 19 AsylG) und\n• ggf. **erkennungsdienstlich behandeln** (§ 16 AsylG).\n\nDie Polizei **prüft das Asylgesuch nicht inhaltlich**."},{"titel":"Drei Stufen nach der Asylverfahrens-VO","text":"1. **Stellen** (making) – Äußerung des Schutzwunsches gegenüber einer Behörde\n2. **Registrieren** – grundsätzlich innerhalb von **5 Tagen** (bei vielen Anträgen bis 15 Tage)\n3. **Förmlich stellen** (lodging) – grundsätzlich innerhalb von **21 Tagen** nach Registrierung beim BAMF\n\nMit der Antragstellung entsteht grundsätzlich ein **Recht auf Verbleib** bis zur Entscheidung (Ausnahmen u. a. bei bestimmten Folgeanträgen)."},{"titel":"Verfahrensarten","text":"• **Reguläres Verfahren** – Entscheidung grundsätzlich binnen **6 Monaten**\n• **Beschleunigtes Verfahren** – u. a. bei Täuschung über Identität, sicherem Herkunftsstaat, Gefahr für die Sicherheit, Herkunftsland mit **EU-weiter Anerkennungsquote ≤ 20 %**; Entscheidung binnen **3 Monaten**\n• **Grenzverfahren** – an der Außengrenze (in Deutschland v. a. Flughäfen), Dauer höchstens **12 Wochen** einschließlich Rechtsbehelf; verpflichtend u. a. bei Täuschung, Sicherheitsgefahr und Anerkennungsquote ≤ 20 %. Unbegleitete Minderjährige grundsätzlich nur bei Sicherheitsgefahr.\n• **Folgeantrag** – neuer Antrag nach bestandskräftiger Ablehnung; Recht auf Verbleib kann eingeschränkt sein"},{"titel":"Ablehnung = Rückkehrentscheidung","text":"Wird ein Antrag abgelehnt, ergeht nach der AVVO **zugleich eine Rückkehrentscheidung** (in Deutschland: Abschiebungsandrohung durch das BAMF). Damit verzahnen sich Asyl- und Rückkehrverfahren enger als bisher."},{"titel":"Aufenthaltsrechtliche Stellung während des Verfahrens","text":"• **Aufenthaltsgestattung** (§ 55 AsylG) – Nachweis: Ankunftsnachweis bzw. Bescheinigung über die Aufenthaltsgestattung\n• **Wohnverpflichtung** in der Aufnahmeeinrichtung (§ 47 AsylG)\n• **Räumliche Beschränkung** (§ 56 AsylG) – Verstöße: § 86 AsylG (OWi), wiederholt § 85 AsylG (Straftat)\n• **Asylverfahrenshaft** (§§ 69–70a AsylG) – nur durch **richterliche Anordnung**, nur wenn verhältnismäßig und kein milderes Mittel (z. B. Meldeauflage, Sicherheitsleistung) ausreicht"}],"merke":["Jedes erkennbare Schutzersuchen ist ein Asylgesuch – aufnehmen, dokumentieren, weiterleiten.","Die Polizei prüft keine Asylgründe.","Grenzverfahren: max. 12 Wochen. Beschleunigt: 3 Monate. Regulär: 6 Monate."]},{"id":"zustaendigkeit","titel":"Zuständigkeit & Überstellung (AMM-VO)","icon":"arrow.left.arrow.right.circle","kurz":"Nachfolger von Dublin III: Wer ist zuständig, wie wird überstellt, Sekundärmigrationszentrum.","abschnitte":[{"titel":"Grundprinzip","text":"Für jeden Antrag auf internationalen Schutz ist **genau ein Mitgliedstaat** zuständig. Die Kriterien stehen in einer festen Rangfolge in der AMM-VO (VO 2024/1351), u. a.:\n• Familienangehörige / unbegleitete Minderjährige\n• Aufenthaltstitel oder Visum\n• **Bildungsabschluss** eines Mitgliedstaates (neues Kriterium)\n• **Irreguläre Einreise** – der Ersteinreisestaat bleibt nun **20 Monate** zuständig (bisher 12); nach Seenotrettung 12 Monate\n\nNicht zuständige Staaten müssen – außer einem menschenwürdigen Existenzminimum – keine Aufnahmeleistungen gewähren."},{"titel":"Überstellungsfristen","text":"• Regelfrist: **6 Monate** ab Zustimmung/Bestätigung des zuständigen Mitgliedstaates\n• Verlängerung auf bis zu **1 Jahr**, wenn die Person inhaftiert ist\n• Verlängerung auf bis zu **3 Jahre**, wenn die Person **flüchtig** ist oder sich der Überstellung entzieht (bisher 18 Monate)\n\nFür Wiederaufnahmen gibt es statt eines Gesuchs eine **Wiederaufnahmemitteilung**, die der andere Staat nur noch bestätigt."},{"titel":"Überstellungshaft","text":"Rechtsgrundlage ist nun **Art. 44 Abs. 2 AMM-VO** (bisher Art. 28 Dublin III). Voraussetzung ist insbesondere **erhebliche Fluchtgefahr** bzw. eine Gefahr für die öffentliche Sicherheit; Haft nur so kurz wie möglich, nach Einzelfallprüfung und durch richterliche Anordnung. Das Verfahren (Antrag, Anhörung) richtet sich weiterhin nach dem FamFG; ergänzend gelten die nationalen Vorschriften des AufenthG."},{"titel":"Sekundärmigrationszentrum Sachsen","text":"Die **Landesdirektion Sachsen** betreibt seit dem **01.07.2026** ein **Sekundärmigrationszentrum** in **Dresden** (Standort des früheren Landesausreisezentrums).\n• Unterbringung von Personen, die in einen anderen EU-Staat **zu überstellen** sind, weil Deutschland nicht zuständig ist\n• bis zu **400 Plätze**, auch für Familien\n• Aufenthalt höchstens **24 Monate**, bei Familien mit minderjährigen Kindern höchstens **12 Monate**\n• Förderung der freiwilligen Ausreise\n\nFür die Polizei relevant: **Verlassen/Entziehen** kann Anlass für Fahndung/Aufenthaltsermittlung und Haftanträge sein – Maßnahmen immer in Abstimmung mit der LDS."}],"merke":["Überstellungsfrist 6 Monate – bei Flucht bis 3 Jahre, bei Haft bis 1 Jahr.","Ersteinreisestaat bleibt 20 Monate zuständig.","Sekundärmigrationszentrum Dresden seit 01.07.2026 (LDS)."]},{"id":"rueckfuehrung","titel":"Ausreisepflicht & Abschiebung","icon":"airplane.departure","kurz":"Vom vollziehbar Ausreisepflichtigen bis zur Übergabe am Flughafen.","abschnitte":[{"titel":"Voraussetzungen der Abschiebung (§ 58 AufenthG)","text":"Abgeschoben werden darf, wer\n• **ausreisepflichtig** ist (§ 50 AufenthG – kein erforderlicher Aufenthaltstitel),\n• dessen Ausreisepflicht **vollziehbar** ist,\n• dessen **Ausreisefrist abgelaufen** ist (bzw. keine gewährt wurde) und\n• dessen freiwillige Erfüllung **nicht gesichert** ist oder dessen Überwachung erforderlich ist.\n\nIn der Regel ist die Abschiebung zuvor **angedroht** (§ 59 AufenthG, Ausreisefrist grundsätzlich 7–30 Tage). Der **Termin der Abschiebung darf nicht angekündigt** werden (§ 59 Abs. 1 Satz 8 AufenthG)."},{"titel":"Hindernisse erkennen","text":"• **Abschiebungsverbote** (§ 60 AufenthG) – z. B. Flüchtlingseigenschaft, Gefahr nach Art. 3 EMRK, erhebliche konkrete Gefahr für Leib, Leben oder Freiheit\n• **Duldung** (§ 60a AufenthG) – vorübergehende Aussetzung; eine gültige Duldung schließt die Abschiebung aus, solange sie nicht widerrufen/erloschen ist\n• **Reisefähigkeit**: gesetzliche Vermutung, dass gesundheitliche Gründe nicht entgegenstehen (§ 60a Abs. 2c AufenthG); Ausnahme bei **qualifizierter ärztlicher Bescheinigung**. Neue akute Beschwerden im Einsatz dennoch **immer ärztlich klären lassen**.\n• **Asyl-/Folgeantrag** während der Maßnahme – aufnehmen, sofort an die zuständige Ausländerbehörde melden; **die Entscheidung über den Fortgang trifft die Ausländerbehörde**, nicht die Einsatzkraft.\n• **Eilantrag beim Verwaltungsgericht** – Rückmeldung der Ausländerbehörde abwarten"},{"titel":"Rolle der Landespolizei (§ 71 Abs. 5 AufenthG)","text":"Die Polizeien der Länder sind **auch zuständig** für\n• die **Zurückschiebung**,\n• die Durchsetzung der Verlassenspflicht,\n• die **Durchführung der Abschiebung** sowie\n• – soweit zur Vorbereitung und Sicherung erforderlich – die **Festnahme** und die **Beantragung der Haft**.\n\nIn Sachsen wird die Abschiebung von der **Zentralen Ausländerbehörde (ZAB) der Landesdirektion Sachsen** organisiert. Die Polizei leistet regelmäßig **Vollzugshilfe** (SächsPVDG): Die ersuchende Behörde verantwortet die **Rechtmäßigkeit der Maßnahme**, die Polizei die **Art und Weise der Durchführung**."},{"titel":"Betreten und Durchsuchen (§ 58 Abs. 5–10 AufenthG)","text":"• **Betreten** der Wohnung zur Ergreifung, wenn Tatsachen vorliegen, dass sich die Person dort befindet (Abs. 5). In Gemeinschaftsunterkünften dürfen dabei auch **andere Räumlichkeiten** betreten werden.\n• **Durchsuchung** der Wohnung zur Ergreifung (Abs. 6) – nur auf **richterliche Anordnung**, bei **Gefahr im Verzug** auch durch die die Abschiebung durchführende Behörde (Abs. 8).\n• **Nachtzeit**: Betreten/Durchsuchen nur, wenn Tatsachen die Annahme rechtfertigen, dass die Ergreifung sonst **vereitelt** würde (Abs. 7). Die Organisation der Abschiebung allein ist **kein** solcher Grund.\n• Die richterliche Durchsuchungsanordnung ist **mitzuführen** bzw. zu **eröffnen**; Protokoll über Durchsuchung anfertigen."},{"titel":"Ablauf einer Rückführung (vereinfacht, Sachsen)","text":"1. **Ersuchen** der ZAB/LDS an die Polizei (Vollzugshilfe) mit Personen-, Gefährdungs- und Fluginformationen\n2. **Einsatzplanung** – Lage, Kräfte (inkl. weiblicher Kräfte), Sprachmittlung, Arzt, Jugendamt bei Kindern, Transport\n3. **Zugriff** – i. d. R. frühmorgens; Belehrung, Eröffnung der Maßnahme, Zeit zum Packen\n4. **Durchsuchung** der Person (Eigensicherung) und des Gepäcks; Dokumente, Medikamente, Bargeld sichern\n5. **Transport** – zum Flughafen (häufig **Leipzig/Halle**), zur Abschiebungshafteinrichtung **Dresden** oder zur Übergabestelle\n6. **Übergabe** an die **Bundespolizei** (Flughafen, Luftweg) bzw. an die Grenzbehörde\n7. **Dokumentation** – Einsatzbericht, Zwangsanwendung, Verletzungen, Besonderheiten; Rückmeldung an die LDS"}],"merke":["Rechtmäßigkeit der Abschiebung verantwortet die Ausländerbehörde, die Art der Durchführung die Polizei.","Abschiebungstermin nie ankündigen.","Durchsuchung der Wohnung: Richtervorbehalt; Nachtzeit nur bei drohender Vereitelung.","Bei Asylgesuch, Krankheit, Suizidalität: sofort Rücksprache mit der ZAB/LDS."]},{"id":"haft","titel":"Festnahme & Haft","icon":"lock.shield","kurz":"Abschiebungshaft, Ausreisegewahrsam, vorläufige Ingewahrsamnahme, neue GEAS-Haftformen.","abschnitte":[{"titel":"Grundsätze","text":"• Freiheitsentziehung nur durch den **Richter** (Art. 104 GG) – bei Abschiebungshaft das **Amtsgericht** (FamFG)\n• Haft ist **unzulässig**, wenn der Zweck durch ein **milderes Mittel** erreicht werden kann (§ 62 Abs. 1 AufenthG)\n• **Minderjährige und Familien mit Minderjährigen** nur in besonderen Ausnahmefällen und nur so lange, wie es unter Berücksichtigung des Kindeswohls angemessen ist\n• Unverzügliche **Belehrung** und Benachrichtigung (Konsulat auf Wunsch, Angehörige, Rechtsbeistand)"},{"titel":"Haftarten im AufenthG","text":"• **Vorbereitungshaft** (§ 62 Abs. 2) – bis **6 Wochen**, wenn über eine Ausweisung/Abschiebungsanordnung nicht sofort entschieden werden kann\n• **Sicherungshaft** (§ 62 Abs. 3) – bei Fluchtgefahr u. a.; bis **6 Monate**, Verlängerung um bis zu **12 Monate** (max. 18)\n• **Ausreisegewahrsam** (§ 62b) – bis **28 Tage**, im Transitbereich eines Flughafens oder in einer Unterkunft mit Ausreisemöglichkeit\n• **Mitwirkungshaft** (§ 62 Abs. 6) – zur Vorführung bei Botschaft/Arzt, bis 14 Tage\n• **Ergänzende Vorbereitungshaft** (§ 62c)"},{"titel":"Vorläufige Ingewahrsamnahme (§ 62 Abs. 5 AufenthG)","text":"Die Polizei darf eine Person **ohne vorherige richterliche Anordnung** festhalten und vorläufig in Gewahrsam nehmen, wenn\n1. der **dringende Verdacht** für das Vorliegen der Voraussetzungen der Sicherungshaft besteht,\n2. die richterliche Entscheidung über die Anordnung der Sicherungshaft **nicht vorher eingeholt** werden kann und\n3. der **begründete Verdacht** vorliegt, dass sich die Person der Anordnung der Sicherungshaft **entziehen** will.\n\nDie Person ist **unverzüglich dem Richter** zur Entscheidung vorzuführen. Haftantrag in Abstimmung mit der zuständigen Ausländerbehörde."},{"titel":"Neue Haftformen seit GEAS","text":"• **Überprüfungshaft** – Screening an der Außengrenze (§ 14a AufenthG) und im Inland (§ 15b AufenthG); Festhalten ohne Richter nur bis zum Ende des Folgetages\n• **Asylverfahrenshaft** – §§ 69–70a AsylG, nur auf richterliche Anordnung, Verhältnismäßigkeit/mildere Mittel\n• **Überstellungshaft** – Art. 44 Abs. 2 AMM-VO\n• **Haft im Rückkehr-Grenzverfahren** – Art. 5 VO 2024/1349\n\nDie genaue Ausgestaltung (Haftgründe, Höchstdauern) jeweils im Gesetzestext bzw. in der Erlasslage nachlesen."},{"titel":"Einrichtung in Sachsen","text":"Abschiebungshaft und Ausreisegewahrsam werden in Sachsen in der **Einrichtung zum Vollzug der Abschiebungshaft und des Ausreisegewahrsams in Dresden** (Zuständigkeit: Landesdirektion Sachsen) vollzogen – getrennt von Strafgefangenen (§ 62a AufenthG). Kapazität: 58 Plätze (24 Abschiebungshaft, 34 Ausreisegewahrsam; Stand der letzten Veröffentlichung, ggf. geändert)."}],"merke":["Kein Festhalten ohne Richter über das gesetzlich zulässige Maß hinaus.","Ausreisegewahrsam: max. 28 Tage.","Sicherungshaft: 6 Monate, max. 18 Monate.","Mildere Mittel immer zuerst prüfen und dokumentieren."]},{"id":"vulnerable","titel":"Besondere Personengruppen","icon":"figure.and.child.holdinghands","kurz":"UMA, Familien, Kranke, Schwangere, Opfer von Menschenhandel, Kirchenasyl.","abschnitte":[{"titel":"Unbegleitete Minderjährige (UMA)","text":"• Bei Zweifeln an der Volljährigkeit: **bis zur Klärung als minderjährig behandeln**\n• **Jugendamt** informieren – vorläufige Inobhutnahme (§ 42a SGB VIII)\n• Abschiebung nur, wenn sich die Behörde vergewissert hat, dass das Kind im Rückkehrstaat einem **Familienangehörigen, Personensorgeberechtigten oder einer geeigneten Aufnahmeeinrichtung übergeben** wird (§ 58 Abs. 1a AufenthG)\n• Eurodac-Erfassung ab 6 Jahren – kindgerecht, in Anwesenheit eines Vertreters"},{"titel":"Familien mit Kindern","text":"• Familientrennung vermeiden; Kinder möglichst **nicht Zeugen von Zwangsmaßnahmen** werden lassen\n• Kinder nicht als Dolmetscher einsetzen\n• Schulpflichtige Kinder: Zugriff nicht in Schule/Kita (Erlasslage beachten)\n• Kinderbetreuung, Verpflegung, Windeln, Medikamente einplanen"},{"titel":"Krankheit, Suizidalität, Schwangerschaft","text":"• **Reisefähigkeit** ist gesetzlich vermutet, aber: akute Erkrankung, Verletzung oder Suizidankündigung → **ärztliche Abklärung**, Rücksprache ZAB/LDS\n• Suizidgefahr: Person nicht unbeaufsichtigt lassen, gefährliche Gegenstände entfernen, Arzt hinzuziehen, dokumentieren\n• **Schwangerschaft**: im Mutterschutzzeitraum (6 Wochen vor bis 8 Wochen nach der Entbindung) regelmäßig keine Flugreisetauglichkeit – ärztlich klären\n• Medikamente für die Reise mitgeben, Arztberichte übergeben"},{"titel":"Opfer von Menschenhandel / Traumatisierte","text":"• Anzeichen: fremdbestimmte Personen, einbehaltene Papiere, Angst, Schulden gegenüber Schleusern\n• Fachdienststelle (Menschenhandel) und Beratungsstellen einbinden; Bedenk- und Stabilisierungsfrist (§ 59 Abs. 7 AufenthG) beachten\n• Vulnerabilität im Screening-Formular dokumentieren"},{"titel":"Kirchenasyl","text":"Das Kirchenasyl ist **kein eigenständiges Rechtsinstitut**. In der Praxis wird es auf Grundlage einer Absprache zwischen BAMF und Kirchen (Härtefalldossier) in aller Regel **respektiert**. Maßnahmen in kirchlichen Räumen nur nach **ausdrücklicher Weisung** der Führung und in Abstimmung mit der LDS."}],"merke":["Zweifel am Alter → als minderjährig behandeln, Jugendamt informieren.","Neue gesundheitliche Beschwerden im Einsatz → Arzt + Rücksprache ZAB.","Kinder nie als Dolmetscher."]},{"id":"strafrecht","titel":"Straf- und Bußgeldrecht","icon":"scalemass","kurz":"§§ 95–97 AufenthG, §§ 84–86 AsylG – typische Delikte bei Kontrollen.","abschnitte":[{"titel":"§ 95 AufenthG – typische Tatbestände","text":"• **Abs. 1 Nr. 1** – Aufenthalt ohne erforderlichen Pass/Passersatz\n• **Abs. 1 Nr. 2** – Aufenthalt ohne erforderlichen Aufenthaltstitel, vollziehbar ausreisepflichtig, Ausreisefrist abgelaufen und Abschiebung nicht ausgesetzt (keine Duldung)\n• **Abs. 1 Nr. 3** – **unerlaubte Einreise**\n• **Abs. 2 Nr. 1** – Einreise/Aufenthalt entgegen einem **Einreise- und Aufenthaltsverbot** (§ 11 AufenthG)\n• **Abs. 1 Nr. 5** – falsche Angaben/Verweigerung von Angaben (§ 49 AufenthG)\n\n**§ 95 Abs. 5 AufenthG**: Art. 31 Abs. 1 Genfer Flüchtlingskonvention bleibt unberührt (Straffreiheit bei unmittelbarer Einreise aus Verfolgerstaat und unverzüglicher Meldung)."},{"titel":"Schleusung","text":"• **§ 96 AufenthG** – Einschleusen von Ausländern (Vorteil, wiederholt/zugunsten mehrerer)\n• **§ 97 AufenthG** – Einschleusen mit Todesfolge; gewerbs- und bandenmäßiges Einschleusen\n• Geschleuste Personen sind **Zeugen** – Vernehmung und Beweissicherung (Handys, Fahrzeug, Bargeld) frühzeitig abstimmen"},{"titel":"AsylG","text":"• **§ 85 AsylG** – u. a. **wiederholter** Verstoß gegen die räumliche Beschränkung (§ 56)\n• **§ 86 AsylG** – erstmaliger Verstoß: **Ordnungswidrigkeit**\n• **§ 84 AsylG** – Verleiten zur missbräuchlichen Asylantragstellung"},{"titel":"Praxis","text":"• Strafverfahren hindert die Abschiebung grundsätzlich nicht, aber: bei laufendem Ermittlungsverfahren ist das **Einvernehmen der Staatsanwaltschaft** erforderlich (§ 72 Abs. 4 AufenthG)\n• Beschuldigtenbelehrung **in verständlicher Sprache**, Dolmetscher (§ 187 GVG)\n• Aufenthaltsrechtlichen Status vor Einleitung eines Verfahrens nach § 95 prüfen (Duldung? Gestattung? Titel?)"}],"merke":["Geduldete machen sich nicht nach § 95 Abs. 1 Nr. 2 strafbar.","Laufendes Ermittlungsverfahren → Einvernehmen der StA vor Abschiebung (§ 72 Abs. 4).","Art. 31 GFK beachten (§ 95 Abs. 5)."]},{"id":"sachsen","titel":"Zuständigkeiten in Sachsen","icon":"building.columns","kurz":"Wer macht was? LDS, ZAB, Ausländerbehörden, BAMF, Bundespolizei, PD Leipzig.","abschnitte":[{"titel":"Behörden im Überblick","text":"• **Landesdirektion Sachsen (LDS)** – obere Ausländerbehörde; Abteilung Asyl und Ausländerrecht\n• **Zentrale Ausländerbehörde (ZAB)** der LDS (Chemnitz) – Erstaufnahme, Verteilung, **aufenthaltsbeendende Maßnahmen**/Organisation der Abschiebungen\n• **Untere Ausländerbehörden** – im Bereich der PD Leipzig: **Stadt Leipzig**, **Landkreis Leipzig**, **Landkreis Nordsachsen**\n• **BAMF** – Asylverfahren, Zuständigkeitsverfahren (AMM-VO), Abschiebungsandrohung\n• **Bundespolizei** – Grenzschutz, Flughäfen (u. a. **Leipzig/Halle**), Rückführungen auf dem Luftweg, Screening an der Außengrenze\n• **Polizei Sachsen / PD Leipzig** – Aufgriff, Screening im Inland (nach Landesrecht), Festnahme, Haftantrag, Vollzugshilfe bei Abschiebungen, Strafverfolgung\n• **Amtsgerichte** – Haftanordnungen (FamFG), Durchsuchungsanordnungen\n• **Verwaltungsgerichte** – Eilrechtsschutz gegen Abschiebung (für Leipzig: VG Leipzig)\n• **SMI** – Fach- und Rechtsaufsicht, Erlasse"},{"titel":"Einrichtungen","text":"• **Erstaufnahmeeinrichtungen** der LDS (u. a. in Leipzig, Dresden, Chemnitz)\n• **Sekundärmigrationszentrum Dresden** – seit 01.07.2026\n• **Abschiebungshaft/Ausreisegewahrsam Dresden**\n• **Flughafen Leipzig/Halle** – Sammel- und Einzelrückführungen, Übergabe an die Bundespolizei"},{"titel":"Rechtsgrundlagen Sachsen","text":"• **SächsPVDG** – Sächsisches Polizeivollzugsdienstgesetz (Befugnisse, Vollzugshilfe, unmittelbarer Zwang). Der Landtag hat am **24.06.2026** eine Novelle beschlossen (u. a. Quellen-TKÜ, Drohnen, Distanz-Elektroimpulsgeräte ab 2027).\n• **SächsAAZuVO** – Sächsische Aufenthalts- und Asylzuständigkeitsverordnung (Zuständigkeiten der Ausländerbehörden)\n• Erlasse und Verwaltungsvorschriften des SMI sowie Dienstanweisungen der PD Leipzig (im Intranet der Polizei Sachsen)"}],"merke":["ZAB der LDS organisiert Abschiebungen – Polizei leistet Vollzugshilfe.","Luftweg und Flughafen: Bundespolizei.","Eilrechtsschutz: VG – Rückmeldung immer über die Ausländerbehörde."]},{"id":"einsatzpraxis","titel":"Einsatzpraxis & Eigensicherung","icon":"shield.lefthalf.filled","kurz":"Kommunikation, Zwang, Dokumentation, Deeskalation.","abschnitte":[{"titel":"Kommunikation","text":"• Ruhig, respektvoll, klar – Maßnahme **eröffnen** und **begründen**\n• **Sprachmittler** (Präsenz oder Telefon-/Videodolmetschen) – keine Mitbewohner oder Kinder\n• Einfache Sprache, kurze Sätze; Verständnis rückfragen\n• Betreuende Personen (Anwalt, Beratungsstelle) höflich, aber bestimmt auf den Ablauf hinweisen"},{"titel":"Eigensicherung","text":"• Vorab Informationen der ZAB auswerten: Gewaltbereitschaft, Waffen, Vorstrafen, psychische Erkrankungen, ansteckende Krankheiten, Tiere\n• Durchsuchung der Person vor Transport; Gegenstände zur Selbstverletzung entfernen\n• Fesselung nur bei konkreter Gefahr (Flucht, Widerstand, Selbstverletzung) – **verhältnismäßig** und dokumentiert\n• Proteste vor Unterkünften einkalkulieren – Kräfte, Zufahrt, Abfahrt planen"},{"titel":"Unmittelbarer Zwang","text":"• Grundlage: SächsPVDG bzw. Vollzugsrecht der Ausländerbehörde – **Androhung**, **mildestes Mittel**, **Verhältnismäßigkeit**\n• Kein Zwang zur Verabreichung von Medikamenten (nur ärztlich, eigene Rechtsgrundlage)\n• Nach jeder Zwangsanwendung: Verletzungen prüfen, ärztliche Versorgung anbieten, dokumentieren"},{"titel":"Dokumentation","text":"• Uhrzeiten (Zugriff, Eröffnung, Transport, Übergabe)\n• Beteiligte Kräfte, Dolmetscher, Ärzte, Jugendamt\n• Äußerungen der Person (insbes. **Asylgesuch**, Krankheit, Suizidankündigung) **wörtlich**\n• Zwangsanwendung, Fesselung, Verletzungen\n• Sichergestellte Gegenstände, mitgegebenes Gepäck/Geld/Medikamente\n• Rücksprachen mit ZAB/LDS (wer, wann, Ergebnis)"}],"merke":["Wörtlich dokumentieren, was die Person sagt – vor allem Asylgesuche.","Fesselung: nur bei konkreter Gefahr und dokumentiert.","Keine Kinder/Mitbewohner als Dolmetscher."]}],"checklisten":[{"id":"aufgriff","titel":"Aufgriff: unerlaubter Aufenthalt","icon":"person.crop.circle.badge.questionmark","kontext":"Kontrolle einer Person ohne Aufenthaltsnachweis im Bereich der PD Leipzig","punkte":[{"text":"Eigensicherung, Personalien erheben, Dokumente sichten","hinweis":"Ausweispflicht § 48 AufenthG"},{"text":"Abfragen: INPOL, AZR, SIS, Eurodac/ED-Bestand","hinweis":"Bereits erfasst/überprüft? Ausschreibungen? Duldung/Gestattung?"},{"text":"Aufenthaltsstatus klären (Titel, Duldung, Gestattung, Ankunftsnachweis)"},{"text":"Asylgesuch geäußert? → wörtlich dokumentieren, Weiterleitung einleiten","hinweis":"Polizei prüft keine Asylgründe"},{"text":"Minderjährigkeit/Vulnerabilität erkennbar? → Jugendamt/Fachstellen"},{"text":"Screening im Inland erforderlich? (§ 15b AufenthG, max. 3 Tage)","hinweis":"Nicht, wenn bereits an Außengrenze überprüft"},{"text":"Festhalten erforderlich? Richterliche Entscheidung bis Ende des Folgetages herbeiführen"},{"text":"Strafanzeige prüfen (§ 95 AufenthG / § 85 AsylG)","hinweis":"Art. 31 GFK, § 95 Abs. 5"},{"text":"Zuständige Ausländerbehörde / ZAB informieren"},{"text":"Dokumentation vollständig (Aliaspersonalien, Äußerungen, Maßnahmen)"}]},{"id":"asylgesuch","titel":"Asylgesuch bei der Polizei","icon":"hand.raised","kontext":"Eine Person äußert gegenüber Polizeibeamten einen Schutzwunsch","punkte":[{"text":"Schutzwunsch wörtlich dokumentieren (Zeit, Sprache, Dolmetscher)"},{"text":"Personalien und Dokumente sichern"},{"text":"ED-Behandlung (§ 16 AsylG) / Eurodac, falls nicht erfolgt"},{"text":"Information der Person über das weitere Verfahren (Merkblatt in Landessprache)"},{"text":"Weiterleitung an die zuständige Aufnahmeeinrichtung (vgl. § 19 AsylG)"},{"text":"Bei laufender Abschiebung: sofort ZAB/LDS informieren und Weisung abwarten"},{"text":"Vulnerabilität (Minderjährige, Kranke, Schwangere) vermerken"}]},{"id":"abschiebung-vorbereitung","titel":"Abschiebung: Einsatzvorbereitung","icon":"list.clipboard","kontext":"Vollzugshilfeersuchen der ZAB/LDS liegt vor","punkte":[{"text":"Ersuchen vollständig? (Personen, Adresse, Flug, Termin, Rechtsgrundlage)"},{"text":"Vollziehbarkeit bestätigt? Keine Duldung, kein Eilverfahren anhängig (Rückfrage ZAB)"},{"text":"Gefährdungslage: Waffen, Gewalt, psychische Erkrankung, Suizidgefahr, Tiere"},{"text":"Kinder beteiligt? Jugendamt, Kinderbetreuung, Kindersitze"},{"text":"Weibliche Einsatzkräfte für Durchsuchung eingeplant"},{"text":"Sprachmittler organisiert"},{"text":"Arzt/Rettungsdienst bei Bedarf in Bereitschaft"},{"text":"Durchsuchungsanordnung (Richter) für Wohnung vorhanden, falls erforderlich"},{"text":"Nachtzeit? Nur bei Tatsachen für Vereitelungsgefahr (§ 58 Abs. 7)"},{"text":"Transport, Zeitpuffer bis Übergabe Flughafen Leipzig/Halle / Bundespolizei"},{"text":"Erreichbarkeit Bereitschaft ZAB/LDS für Rückfragen während des Einsatzes"},{"text":"Mögliche Proteste/Unterstützerkreise berücksichtigt"}]},{"id":"abschiebung-durchfuehrung","titel":"Abschiebung: Durchführung","icon":"checklist","kontext":"Am Einsatzort","punkte":[{"text":"Identität der angetroffenen Person(en) feststellen"},{"text":"Maßnahme eröffnen und begründen (Dolmetscher)"},{"text":"Durchsuchung der Person zur Eigensicherung"},{"text":"Zeit zum Packen geben; Gepäck, Dokumente, Medikamente, Bargeld"},{"text":"Handy: Kontakt zu Angehörigen/Rechtsbeistand ermöglichen, sofern Sicherheit es zulässt"},{"text":"Gesundheitszustand erfragen; neue Beschwerden → Arzt + ZAB"},{"text":"Asylgesuch/Folgeantrag? → dokumentieren + ZAB, Weisung abwarten"},{"text":"Fesselung nur bei konkreter Gefahr, dokumentieren"},{"text":"Wohnung verschlossen hinterlassen, Tiere/Wertgegenstände geregelt"},{"text":"Transport und Übergabe (Uhrzeit, Übernehmender)"},{"text":"Einsatzbericht und Rückmeldung an die LDS"}]},{"id":"festnahme-haft","titel":"Festnahme & Haftantrag","icon":"lock.doc","kontext":"Vorläufige Ingewahrsamnahme zur Sicherung der Abschiebung","punkte":[{"text":"Vollziehbare Ausreisepflicht festgestellt (Rücksprache Ausländerbehörde)"},{"text":"Haftgrund: dringender Verdacht Sicherungshaft (§ 62 Abs. 3)"},{"text":"Richterliche Entscheidung vorher nicht einholbar"},{"text":"Begründeter Verdacht des Entziehens (§ 62 Abs. 5)"},{"text":"Mildere Mittel geprüft und dokumentiert"},{"text":"Belehrung (Gründe, Rechte, Konsulat, Rechtsbeistand) in verständlicher Sprache"},{"text":"Unverzügliche Vorführung beim Amtsgericht / Haftantrag über zuständige Behörde"},{"text":"Minderjährige/Familien: nur in besonderen Ausnahmefällen"},{"text":"Unterbringung: Einrichtung Dresden (nicht mit Strafgefangenen)"}]},{"id":"uma","titel":"Unbegleitete Minderjährige","icon":"figure.child","kontext":"Aufgriff einer mutmaßlich minderjährigen Person ohne Sorgeberechtigte","punkte":[{"text":"Im Zweifel als minderjährig behandeln"},{"text":"Jugendamt sofort informieren (vorläufige Inobhutnahme § 42a SGB VIII)"},{"text":"Kindgerechte Kommunikation, Dolmetscher"},{"text":"ED/Eurodac nur kindgerecht und mit Vertreter"},{"text":"Hinweise auf Menschenhandel/Ausbeutung prüfen"},{"text":"Keine Unterbringung im Polizeigewahrsam, soweit vermeidbar"}]}],"fristen":[{"was":"Screening an der Außengrenze","frist":"max. 7 Tage","grundlage":"Screening-VO, § 14a AufenthG"},{"was":"Screening im Inland","frist":"max. 3 Tage","grundlage":"Art. 7 Screening-VO, § 15b AufenthG"},{"was":"Festhalten ohne Richter (Screening)","frist":"bis Ende des Tages nach dem Ergreifen","grundlage":"§§ 14a, 15b AufenthG, Art. 104 GG"},{"was":"Registrierung eines Asylantrags","frist":"5 Tage (Ausnahme 15)","grundlage":"AVVO"},{"was":"Förmliche Antragstellung","frist":"21 Tage nach Registrierung","grundlage":"AVVO"},{"was":"Grenzverfahren (Asyl)","frist":"max. 12 Wochen","grundlage":"AVVO"},{"was":"Rückkehr-Grenzverfahren","frist":"max. 12 Wochen","grundlage":"VO 2024/1349"},{"was":"Beschleunigtes Verfahren","frist":"3 Monate","grundlage":"AVVO"},{"was":"Reguläres Asylverfahren","frist":"6 Monate","grundlage":"AVVO"},{"was":"Überstellungsfrist (Regel)","frist":"6 Monate","grundlage":"Art. 46 AMM-VO"},{"was":"Überstellungsfrist bei Haft","frist":"bis 1 Jahr","grundlage":"AMM-VO"},{"was":"Überstellungsfrist bei Flucht","frist":"bis 3 Jahre","grundlage":"AMM-VO"},{"was":"Zuständigkeit Ersteinreisestaat","frist":"20 Monate","grundlage":"AMM-VO"},{"was":"Eurodac: Mindestalter","frist":"6 Jahre","grundlage":"Eurodac-VO"},{"was":"Ausreisefrist (Regel)","frist":"7–30 Tage","grundlage":"§ 59 Abs. 1 AufenthG"},{"was":"Vorbereitungshaft","frist":"max. 6 Wochen","grundlage":"§ 62 Abs. 2 AufenthG"},{"was":"Sicherungshaft","frist":"6 Monate, max. 18 Monate","grundlage":"§ 62 Abs. 3, 4 AufenthG"},{"was":"Ausreisegewahrsam","frist":"max. 28 Tage","grundlage":"§ 62b AufenthG"},{"was":"Mitwirkungshaft","frist":"max. 14 Tage","grundlage":"§ 62 Abs. 6 AufenthG"},{"was":"Sekundärmigrationszentrum Sachsen","frist":"max. 24 Monate (Familien 12)","grundlage":"LDS"}],"normen":[{"norm":"§ 11 AufenthG","titel":"Einreise- und Aufenthaltsverbot","inhalt":"Nach Ausweisung, Zurückschiebung oder Abschiebung wird ein befristetes Einreise- und Aufenthaltsverbot erlassen.","praxis":"Verstoß: Straftat nach § 95 Abs. 2 Nr. 1 AufenthG."},{"norm":"§ 14a AufenthG","titel":"Screening an der Außengrenze","inhalt":"Überprüfung nach der Screening-VO an der Außengrenze; Verbringen und Überprüfungshaft.","praxis":"Flughäfen/Seehäfen – regelmäßig Bundespolizei."},{"norm":"§ 15b AufenthG","titel":"Überprüfung im Bundesgebiet","inhalt":"Festhalten und Verbringen zur Überprüfung nach Art. 7 Screening-VO; Freilassung, wenn nicht bis Ende des Folgetages richterlich angeordnet.","praxis":"Kernnorm für das Screening im Inland durch die Landespolizei."},{"norm":"§ 48 AufenthG","titel":"Ausweisrechtliche Pflichten","inhalt":"Pass vorlegen und überlassen; Mitwirkung bei Passbeschaffung; Durchsuchung nach Dokumenten; Datenträgerauswertung (Abs. 3a).","praxis":"Pässe sicherstellen und Ausländerbehörde zuleiten."},{"norm":"§ 49 AufenthG","titel":"Identitätsfeststellung","inhalt":"Überprüfung, Feststellung und Sicherung der Identität; ED-Maßnahmen.","praxis":"Falsche Angaben: § 95 Abs. 1 Nr. 5."},{"norm":"§ 50 AufenthG","titel":"Ausreisepflicht","inhalt":"Ausreisepflichtig ist, wer einen erforderlichen Aufenthaltstitel nicht oder nicht mehr besitzt.","praxis":"Ausreisepflicht ≠ vollziehbare Ausreisepflicht."},{"norm":"§ 58 AufenthG","titel":"Abschiebung","inhalt":"Voraussetzungen der Abschiebung; Abs. 1a UMA; Abs. 5–10 Betreten und Durchsuchen von Wohnungen, Nachtzeit, Richtervorbehalt.","praxis":"Durchsuchung: Richter, bei Gefahr im Verzug durchführende Behörde."},{"norm":"§ 59 AufenthG","titel":"Androhung der Abschiebung","inhalt":"Androhung mit Ausreisefrist (7–30 Tage); Termin der Abschiebung darf nicht angekündigt werden.","praxis":"Termine nicht an Betroffene oder Unterstützer weitergeben."},{"norm":"§ 60 AufenthG","titel":"Verbot der Abschiebung","inhalt":"Abschiebungsverbote u. a. bei Flüchtlingseigenschaft, EMRK-Verletzung, erheblicher konkreter Gefahr.","praxis":"Prüfung durch BAMF/Ausländerbehörde, nicht durch die Einsatzkraft."},{"norm":"§ 60a AufenthG","titel":"Duldung","inhalt":"Vorübergehende Aussetzung der Abschiebung; Abs. 2c Vermutung der Reisefähigkeit, qualifizierte ärztliche Bescheinigung.","praxis":"Gültige Duldung = keine Abschiebung ohne Widerruf."},{"norm":"§ 62 AufenthG","titel":"Abschiebungshaft","inhalt":"Vorbereitungs-, Sicherungs-, Mitwirkungshaft; Abs. 5 vorläufige Ingewahrsamnahme ohne vorherige richterliche Anordnung.","praxis":"Unverzüglich Richter; mildere Mittel prüfen."},{"norm":"§ 62a AufenthG","titel":"Vollzug der Abschiebungshaft","inhalt":"Vollzug grundsätzlich in speziellen Hafteinrichtungen, getrennt von Strafgefangenen.","praxis":"Sachsen: Einrichtung in Dresden."},{"norm":"§ 62b AufenthG","titel":"Ausreisegewahrsam","inhalt":"Bis zu 28 Tage zur Sicherung der Durchführbarkeit der Abschiebung.","praxis":"Vollzug im Transitbereich/Unterkunft mit Ausreisemöglichkeit."},{"norm":"§ 71 AufenthG","titel":"Zuständigkeit","inhalt":"Abs. 4a: Zuständigkeit für Screening-Fälle (u. a. Polizeien der Länder). Abs. 5: Landespolizei auch zuständig für Zurückschiebung, Abschiebung, Festnahme, Haftantrag.","praxis":"Rechtsgrundlage für das eigene Tätigwerden."},{"norm":"§ 72 Abs. 4 AufenthG","titel":"Beteiligung der StA","inhalt":"Abschiebung bei laufendem Ermittlungsverfahren nur im Einvernehmen mit der Staatsanwaltschaft.","praxis":"Vor Rückführung Verfahrensstand prüfen."},{"norm":"§ 95 AufenthG","titel":"Strafvorschriften","inhalt":"Unerlaubter Aufenthalt, unerlaubte Einreise, Verstoß gegen Einreiseverbot, falsche Angaben.","praxis":"Abs. 5: Art. 31 GFK."},{"norm":"§§ 96, 97 AufenthG","titel":"Einschleusen","inhalt":"Einschleusen von Ausländern; mit Todesfolge; gewerbs- und bandenmäßig.","praxis":"Geschleuste = Zeugen, Beweise sichern."},{"norm":"§ 16 AsylG","titel":"Sicherung der Identität","inhalt":"ED-Behandlung von Asylsuchenden.","praxis":"Auch durch die Polizei bei Asylgesuch."},{"norm":"§ 19 AsylG","titel":"Aufgaben der Ausländerbehörde und der Polizei","inhalt":"Weiterleitung von Asylsuchenden an die zuständige Aufnahmeeinrichtung; ED-Behandlung.","praxis":"Fassung nach GEAS-Anpassungsgesetz prüfen."},{"norm":"§ 55 AsylG","titel":"Aufenthaltsgestattung","inhalt":"Aufenthalt zur Durchführung des Asylverfahrens ist gestattet.","praxis":"Gestattete sind nicht vollziehbar ausreisepflichtig."},{"norm":"§ 56 AsylG","titel":"Räumliche Beschränkung","inhalt":"Aufenthaltsgestattung ist räumlich beschränkt.","praxis":"Erstverstoß § 86 (OWi), wiederholt § 85 (Straftat)."},{"norm":"§§ 69–70a AsylG","titel":"Asylverfahrenshaft","inhalt":"Neue Haftform seit GEAS; nur durch richterliche Anordnung; Verhältnismäßigkeit, mildere Mittel.","praxis":"Umsetzung von Art. 10 Aufnahme-RL."},{"norm":"Art. 7 Screening-VO","titel":"Screening im Hoheitsgebiet","inhalt":"Überprüfung unerlaubt aufhältiger Drittstaatsangehöriger, die nicht an der Außengrenze überprüft wurden.","praxis":"Max. 3 Tage."},{"norm":"Art. 44 AMM-VO","titel":"Haft zur Überstellung","inhalt":"Inhaftnahme zur Sicherung der Überstellung bei erheblicher Fluchtgefahr bzw. Sicherheitsgefahr.","praxis":"Ersetzt Art. 28 Dublin III."},{"norm":"Art. 46 AMM-VO","titel":"Überstellungsfristen","inhalt":"6 Monate; bis 1 Jahr bei Haft; bis 3 Jahre bei Flucht.","praxis":"Flucht/Untertauchen dokumentieren und melden."}],"glossar":[{"begriff":"AMM-VO","erklaerung":"Asyl- und Migrationsmanagement-Verordnung (EU) 2024/1351 – regelt u. a. die Zuständigkeit für Asylverfahren (Nachfolger Dublin III) und den Solidaritätsmechanismus."},{"begriff":"Ankunftsnachweis","erklaerung":"Bescheinigung über die Meldung als Asylsuchender; dokumentiert den Status vor förmlicher Antragstellung."},{"begriff":"Aufenthaltsgestattung","erklaerung":"Aufenthaltsrecht während des Asylverfahrens (§ 55 AsylG)."},{"begriff":"Ausreisegewahrsam","erklaerung":"Kurzfristige Freiheitsentziehung bis 28 Tage zur Sicherung der Abschiebung (§ 62b AufenthG)."},{"begriff":"AVVO","erklaerung":"Asylverfahrensverordnung (EU) 2024/1348 – einheitliches Verfahren für internationalen Schutz inkl. Grenzverfahren."},{"begriff":"AZR","erklaerung":"Ausländerzentralregister beim BVA."},{"begriff":"BAMF","erklaerung":"Bundesamt für Migration und Flüchtlinge – entscheidet über Asylanträge und Zuständigkeit nach AMM-VO."},{"begriff":"Duldung","erklaerung":"Vorübergehende Aussetzung der Abschiebung (§ 60a AufenthG). Kein Aufenthaltstitel, Ausreisepflicht bleibt bestehen."},{"begriff":"Eurodac","erklaerung":"EU-Datenbank für biometrische Daten (Fingerabdrücke, Gesichtsbild) von Schutzsuchenden und irregulär Einreisenden/Aufhältigen; ab 6 Jahren."},{"begriff":"Folgeantrag","erklaerung":"Erneuter Asylantrag nach bestandskräftiger Ablehnung; Recht auf Verbleib kann eingeschränkt sein."},{"begriff":"GEAS","erklaerung":"Gemeinsames Europäisches Asylsystem; reformiert 2024, anwendbar seit 12.06.2026."},{"begriff":"GEAS-Anpassungsgesetz","erklaerung":"Bundesgesetz zur Anpassung von AsylG, AufenthG u. a. an die GEAS-Reform; in Kraft seit 12.06.2026."},{"begriff":"Grenzverfahren","erklaerung":"Asylverfahren an der Außengrenze (in DE v. a. Flughäfen), max. 12 Wochen; Personen gelten als nicht eingereist."},{"begriff":"LDS","erklaerung":"Landesdirektion Sachsen – obere Ausländerbehörde, u. a. mit der Zentralen Ausländerbehörde (ZAB)."},{"begriff":"Rückkehrentscheidung const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
function rich(text) {
  let html = "", list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (!line) { close(); continue; }
    let m;
    if (line.startsWith("• ")) {
      if (list !== "ul") { close(); html += "<ul>"; list = "ul"; }
      html += `<li>${inline(line.slice(2))}</li>`;
    } else if ((m = line.match(/^(\d+)\.\s(.*)$/))) {
      if (list !== "ol") { close(); html += `<ol start="${m[1]}">`; list = "ol"; }
      html += `<li>${inline(m[2])}</li>`;
    } else { close(); html += `<p>${inline(line)}</p>`; }
  }
  close();
  return html;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ring = v => {
  const r = 32, c = 2 * Math.PI * r, p = Math.round(v * 100);
  return `<svg class="ring" viewBox="0 0 76 76" role="img" aria-label="Fortschritt ${p} Prozent">
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
    ${v > 0 ? `<circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c * v} ${c}" transform="rotate(-90 38 38)"/>` : ""}
    <text x="38" y="43" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">${p} %</text></svg>`;
};
const ICON = {
  wissen: '<path d="M4 5h5v14H4zM10 5h5v14h-5zM16 6l4 1-3 13-4-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  einsatz: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  lernen: '<path d="M2 9l10-5 10 5-10 5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5M22 9v6" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  suche: '<circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',

};

// ---------- Router ----------
const app = document.getElementById("app");
const titleEl = document.getElementById("title");
const backBtn = document.getElementById("back");
const TABS = [["wissen", "Wissen"], ["einsatz", "Einsatz"], ["lernen", "Lernen"], ["suche", "Suche"], ["mehr", "Mehr"]];
let stack = [];
let tab = "wissen";

function go(view, push = true) {
  if (push) stack.push(view); else stack = [view];
  render();
}
backBtn.onclick = () => { if (stack.length > 1) { stack.pop(); render(); } };
function render() {
  const v = stack[stack.length - 1];
  backBtn.hidden = stack.length <= 1;
  const out = v();
  titleEl.textContent = out.title;
  app.innerHTML = out.html;
  out.bind && out.bind();
  window.scrollTo(0, 0);
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
}
function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = TABS.map(([id, label]) =>
    `<button data-t="${id}" aria-label="${label}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[id]}</svg>${label}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.t; go(ROOT[tab], false); });
}
const on = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener("click", () => fn(el)));

      <h2 class="sec">Trainieren</h2><div class="card">

      }).join("")}</div>

      document.getElementById("lr").onclick = () => { if (confirm("Gesamten Lernfortschritt löschen?")) { S.gelesen = []; S.quiz = {}; S.checklisten = {}; S.karten = []; save(); render(); } };
    }

}
// Quiz und Karten halten ihren Zustand in einer Closure und liefern die Ansichtsfunktion zurück.
function Quiz(fragenIn, titel, pruefung = false) {
  const fragen = shuffle(fragenIn);
  let i = 0, punkte = 0, gewaehlt = null;
  const view = () => {
    if (i >= fragen.length) {
      const q = punkte / fragen.length;
      return {
        title: titel,
        html: `<div style="text-align:center;padding:30px 0">${ring(q).replace('class="ring"', 'class="ring" style="width:150px;height:150px"')}
          <h2>${punkte} von ${fragen.length} richtig</h2>
          <p class="small">${q >= .8 ? "Sehr gut – bestanden." : q >= .6 ? "Bestanden – einzelne Themen wiederholen." : "Nicht bestanden – Kapitel noch einmal durcharbeiten."}</p></div>
          <button class="btn" id="again">Noch einmal</button>`,
        bind: () => document.getElementById("again").onclick = () => { stack[stack.length - 1] = Quiz(fragenIn, titel, pruefung); render(); }
      };
    }
    const f = fragen[i];
    const cls = j => {
      if (gewaehlt === null) return "";
      if (pruefung) return j === gewaehlt ? "sel" : "";
      return j === f.richtig ? "ok" : j === gewaehlt ? "bad" : "";
    };
    return {
      title: titel,
      html: `<div class="progress"><div style="width:${(i / fragen.length) * 100}%"></div></div>
        <div class="small">Frage ${i + 1} von ${fragen.length}</div>
        <div class="qtitle">${esc(f.frage)}</div>
        ${f.antworten.map((a, j) => `<button class="opt ${cls(j)}" data-a="${j}" ${gewaehlt !== null ? "disabled" : ""}>${esc(a)}</button>`).join("")}
        ${gewaehlt !== null && !pruefung ? `<div class="expl"><b style="color:var(${gewaehlt === f.richtig ? "--ok" : "--bad"})">${gewaehlt === f.richtig ? "✔ Richtig" : "✘ Leider falsch"}</b><div>${esc(f.erklaerung)}</div></div>` : ""}
        ${gewaehlt !== null ? `<button class="btn" id="next">${i + 1 < fragen.length ? "Weiter" : "Auswertung"}</button>` : ""}`,
      bind: () => {
        on("[data-a]", el => {
          if (gewaehlt !== null) return;
          gewaehlt = +el.dataset.a;
          const ok = gewaehlt === f.richtig;
          if (ok) punkte++;
          const st = S.quiz[f.frage] || { r: 0, f: 0 };
          ok ? st.r++ : st.f++; st.ok = ok; S.quiz[f.frage] = st; save();
          render();
        });
        const n = document.getElementById("next");
        if (n) n.onclick = () => { i++; gewaehlt = null; render(); };
      }
    };
  };
  return view;
}

function Karten() {
  let nurNeu = true, stapel = [], i = 0, back = false;
  const alle = () => C.glossar.map(g => ({ id: "g:" + g.begriff, v: g.begriff, h: g.erklaerung }))
    .concat(C.normen.map(n => ({ id: "n:" + n.norm, v: n.norm + "\n" + n.titel, h: n.inhalt + "\n\nPraxis: " + n.praxis })));
  const bau = () => { stapel = shuffle(alle().filter(k => !nurNeu || !S.karten.includes(k.id))); i = 0; back = false; };
  bau();
  const self = () => {
    const k = stapel[i];
    return {
      title: "Karteikarten",
      html: `<label class="check" style="margin:4px 4px 14px;cursor:pointer"><input type="checkbox" id="nn" ${nurNeu ? "checked" : ""}> Nur noch nicht gewusste Karten</label>
        ${!k ? `<div class="flash"><div><div class="front">⭐ Alle Karten gewusst!</div><button class="btn sec" id="all">Alle Karten erneut üben</button></div></div>` : `
        <div class="small" style="margin:0 4px 8px">Karte ${i + 1} von ${stapel.length}</div>
        <div class="flash ${back ? "back" : ""}" id="fc" role="button" tabindex="0" aria-label="Karte umdrehen">
          ${back ? `<div>${esc(k.h)}</div>` : `<div class="front">${esc(k.v)}</div>`}</div>
        <p class="small" style="text-align:center">${back ? "" : "Tippen zum Umdrehen"}</p>
        <div class="hstack"><button class="btn warn" id="no">↺ Nochmal</button><button class="btn" id="yes">✔ Gewusst</button></div>`}`,
      bind: () => {
        document.getElementById("nn").onchange = e => { nurNeu = e.target.checked; bau(); render(); };
        const all = document.getElementById("all"); if (all) all.onclick = () => { nurNeu = false; bau(); render(); };
        const fc = document.getElementById("fc"); if (!fc) return;
        fc.onclick = () => { back = !back; render(); };
        const next = known => {
          S.karten = S.karten.filter(x => x !== k.id); if (known) S.karten.push(k.id); save();
          back = false; if (i + 1 < stapel.length) i++; else bau(); render();
        };
        document.getElementById("no").onclick = () => next(false);
        document.getElementById("yes").onclick = () => next(true);
      }
    };
  };
  return self;
}

// ---------- Suche ----------
function Suche() {
  return {
    title: "Suche & Glossar",
    html: `<input type="search" id="sq" placeholder="Begriff, Paragraph, Thema …" aria-label="Suchen"><div id="sr"></div>`,
    bind: () => {
      const inp = document.getElementById("sq"), out = document.getElementById("sr");
      const upd = () => {
        const s = inp.value.trim().toLowerCase();
        const has = t => t.toLowerCase().includes(s);
        let html = "";
        if (s) {
          const k = C.kapitel.filter(k => has(k.titel) || has(k.kurz) || k.abschnitte.some(a => has(a.titel) || has(a.text)) || k.merke.some(has));
          const n = C.normen.filter(n => has(n.norm) || has(n.titel) || has(n.inhalt) || has(n.praxis));
          if (k.length) html += `<h2 class="sec">Kapitel</h2><div class="card">${k.map(kapitelRow).join("")}</div>`;
          if (n.length) html += `<h2 class="sec">Paragraphen</h2><div class="card">${n.map(normHTML).join("")}</div>`;
        }
        const g = C.glossar.filter(g => !s || has(g.begriff) || has(g.erklaerung));
        if (g.length) html += `<h2 class="sec">${s ? "Glossar" : "Glossar A–Z"}</h2><div class="card">${g.map(g => `<div class="row" style="display:block;cursor:default"><b>${esc(g.begriff)}</b><div class="s">${esc(g.erklaerung)}</div></div>`).join("")}</div>`;
        out.innerHTML = html || `<p class="small" style="margin:16px 4px">Keine Treffer für „${esc(inp.value)}“.</p>`;
        out.querySelectorAll("[data-k]").forEach(el => el.onclick = () => go(() => KapitelDetail(el.dataset.k)));
      };
      inp.oninput = upd; upd();
    }
  };
}

        const tel = (k.telefon || "").replace(/[^\d+]/g, "");
        return `<div class="row"><span class="txt" data-e="${i}" style="cursor:pointer"><span class="t">${esc(k.name)}</span><br><span class="s">${esc(k.rolle)}</span><br>
          <span class="kbd" style="color:${k.telefon ? "inherit" : "var(--warn)"}">${k.telefon ? esc(k.telefon) : "Nummer noch nicht hinterlegt – tippen zum Eintragen"}</span></span>
          ${tel ? `<a class="ico" href="tel:${tel}" aria-label="${esc(k.name)} anrufen" style="text-decoration:none">📞</a>` : ""}</div>`;
      }).join("")}</div>
      <p class="small" style="margin:8px 4px">Bitte die dienstlich gültigen Nummern selbst eintragen. Die Daten bleiben ausschließlich auf diesem Gerät.</p>
      <button class="btn sec" id="add">+ Kontakt hinzufügen</button>`,
    bind: () => {
      on("[data-e]", el => editKontakt(+el.dataset.e));
      document.getElementById("add").onclick = () => editKontakt(-1);
    }
  };
}
function editKontakt(i) {
  const ks = kontakte();
  const k = i >= 0 ? ks[i] : { name: "", rolle: "", telefon: "" };
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="sheet" role="dialog" aria-label="Kontakt bearbeiten">
    <h3 style="margin:0 0 4px">${i >= 0 ? "Kontakt bearbeiten" : "Neuer Kontakt"}</h3>
    <label for="kn">Name / Stelle</label><input type="text" id="kn" value="${esc(k.name)}">
    <label for="kr2">Zuständigkeit</label><input type="text" id="kr2" value="${esc(k.rolle)}">
    <label for="kp">Telefon</label><input type="tel" id="kp" value="${esc(k.telefon)}">
    <button class="btn" id="ks">Sichern</button>
    ${i >= 0 ? '<button class="btn danger" id="kd">Löschen</button>' : ""}
    <button class="btn sec" id="kc">Abbrechen</button></div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); render(); };
  m.onclick = e => { if (e.target === m) close(); };
  m.querySelector("#kc").onclick = close;
  m.querySelector("#ks").onclick = () => {
    const neu = { name: m.querySelector("#kn").value.trim(), rolle: m.querySelector("#kr2").value.trim(), telefon: m.querySelector("#kp").value.trim() };
    if (!neu.name) return;
    if (i >= 0) ks[i] = neu; else ks.push(neu);
    save(); close();
  };
  const d = m.querySelector("#kd");
  if (d) d.onclick = () => { if (confirm("Kontakt löschen?")) { ks.splice(i, 1); save(); close(); } };
}

// ---------- Start ----------
const ROOT = { wissen: Wissen, einsatz: Einsatz, lernen: Lernen, suche: Suche, mehr: Mehr };
function hinweis() {
  try { if (localStorage.getItem("geas.hinweis") === "1") return; } catch (e) {}
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="sheet" role="dialog" aria-label="Hinweis"><div style="font-size:40px">🛡</div>
    <h2 style="margin:6px 0">${esc(C.meta.titel)}</h2><p class="small"><b>${esc(C.meta.untertitel)}</b></p>
    <p>${esc(C.meta.hinweis)}</p><p class="small">Stand: ${esc(C.meta.stand)}</p><button class="btn" id="ok">Verstanden</button></div>`;
  document.body.appendChild(m);
  m.querySelector("#ok").onclick = () => { try { localStorage.setItem("geas.hinweis", "1"); } catch (e) {} m.remove(); };
}
renderTabs();
go(ROOT.wissen, false);
hinweis();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
