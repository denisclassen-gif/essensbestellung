async function vorlagenVerarbeiten() {
  VORLAGEN_LAEUFT = true;
  const ergebnis = [];
  const quellen = [...eingebaut().map(d => ({ d, von: "eingebaut" })), ...VORLAGEN_DATEIEN.map(d => ({ d, von: "geladen" }))];
  for (const { d, von } of quellen) {
    try { ergebnis.push({ ...(await vorlageBefuellen(d, KORREKTUREN)), von }); }
    catch (err) { ergebnis.push({ fehler: err.message, original: d.name, von }); }
  }
  // Von Hand geladene (neuere) Vorlagen ersetzen die eingebauten gleicher Art
  const geladen = new Set(ergebnis.filter(e => e.von === "geladen" && e.art && e.art !== "unbekannt").map(e => e.art));
  VORLAGEN_ERGEBNIS = ergebnis.filter(e => !(e.von === "eingebaut" && geladen.has(e.art)));
  // Sprachfassungen zum Aushändigen – nur für die in diesem Fall benötigten Formulare
  const spr = formularSprache(), noetig = new Set(dokumenteImFall().map(d => d.erkennung));
  if (spr && spr !== "deutsch") for (const [art, sprachen] of Object.entries(C.sprachen_formulare || {})) {
    if (!noetig.has(art) || !sprachen.includes(spr)) continue;
    const b64 = eingebettet(`sp/${art}/${spr}`);
    if (!b64) continue;
    try { VORLAGEN_ERGEBNIS.push({ ...(await vorlageBefuellen(b64Datei(b64, `${art}_${spr}.docx`, "application/vnd.openxmlformats-officedocument.wordprocessingml.document"), KORREKTUREN, { art, sprache: spr })), von: "sprache" }); }
    catch (err) { VORLAGEN_ERGEBNIS.push({ fehler: err.message, original: `${art} (${spr})`, von: "sprache" }); }
  }
  const rang = art => { const i = (C.dokumentauswahl || []).findIndex(d => d.erkennung === art); return i < 0 ? 99 : i; };
  VORLAGEN_ERGEBNIS.sort((x, y) => rang(x.art) - rang(y.art) || (x.sprache ? 1 : 0) - (y.sprache ? 1 : 0));
  VORLAGEN_LAEUFT = false;
  neuZeichnen();
}

// Seitenzahl-Felder (PAGE, NUMPAGES) in Kopf-/Fußzeilen: gespeicherter Wert durch Marke ersetzen, die Vorschau setzt die echte Zahl je Seite
function seitenFelderMarkieren(xdoc) {
  let n = 0;
  for (const fs of Array.from(xdoc.getElementsByTagNameNS(W_NS, "fldSimple"))) {
    const instr = (fs.getAttributeNS(W_NS, "instr") || fs.getAttribute("w:instr") || "").trim().split(/\s+/)[0].toUpperCase();
    if (instr !== "PAGE" && instr !== "NUMPAGES") continue;
    const ts = fs.getElementsByTagNameNS(W_NS, "t"); if (!ts.length) continue;
    ts[0].textContent = instr === "PAGE" ? "⟦P⟧" : "⟦N⟧"; for (let k = ts.length - 1; k > 0; k--) ts[k].textContent = ""; n++;
  }
  for (const q of Array.from(xdoc.getElementsByTagNameNS(W_NS, "p"))) {
    let zustand = 0, art = "", ergebnis = [];
    for (const r of Array.from(q.getElementsByTagNameNS(W_NS, "r"))) {
      const fc = r.getElementsByTagNameNS(W_NS, "fldChar")[0], typ = fc ? (fc.getAttributeNS(W_NS, "fldCharType") || fc.getAttribute("w:fldCharType")) : "";
      if (typ === "begin") { zustand = 1; art = ""; ergebnis = []; continue; }
      if (typ === "separate") { zustand = 2; continue; }
      if (typ === "end") {
        if ((art === "PAGE" || art === "NUMPAGES") && ergebnis.length) { ergebnis[0].textContent = art === "PAGE" ? "⟦P⟧" : "⟦N⟧"; ergebnis.slice(1).forEach(t => t.textContent = ""); n++; }
        zustand = 0; continue;
      }
      if (zustand === 1) { const it = r.getElementsByTagNameNS(W_NS, "instrText")[0]; if (it) art += it.textContent; art = art.trim().split(/\s+/)[0].toUpperCase(); }
      else if (zustand === 2) ergebnis.push(...Array.from(r.getElementsByTagNameNS(W_NS, "t")));
    }
  }
  return n;
}
// Seitenumbruch: Word speichert in manchen Vordrucken (Fragebögen) keine Seitenumbrüche – die Vorschau zeigt dann eine überlange Seite.
// Inhalt, der über den Satzspiegel hinausgeht, auf neue Seiten mit derselben Kopf- und Fußzeile verschieben; Tabellen zeilenweise teilen.
function docxUmbruch(ziel) {
  for (const start of [...ziel.querySelectorAll("section.docx")]) {
    let sec = start;
    for (let schutz = 0; schutz < 40; schutz++) {
      const hoehe = (parseFloat(sec.style.minHeight) || 842) * 4 / 3;
      // Geringer Überstand kommt von abweichender Schriftmetrik – die Seite wird später eingepasst (docxEinpassen), nicht geteilt
      if (sec.scrollHeight <= hoehe * (sec === start ? 1.15 : 1) + 2) break;
      const sr = sec.getBoundingClientRect(), fuss = sec.querySelector(":scope > footer");
      const grenze = sr.top + hoehe - parseFloat(getComputedStyle(sec).paddingBottom || 0) - (fuss ? fuss.offsetHeight : 0);
      const bloecke = [...sec.querySelectorAll(":scope > article > *")];
      const k = bloecke.findIndex(b => b.getBoundingClientRect().bottom > grenze + 1);
      if (k < 0) break;
      const block = bloecke[k];
      let teilTabelle = null;
      if (block.tagName === "TABLE") {
        const zeilen = [...block.querySelectorAll(":scope > tbody > tr, :scope > tr")];
        let z = zeilen.findIndex(r => r.getBoundingClientRect().bottom > grenze + 1);
        // Hohe Zeile über die Seitengrenze: wie Word innerhalb der Zeile teilen (Zellinhalt unterhalb der Grenze in eine Folgezeile)
        const r0 = zeilen[z];
        if (r0 && r0.getBoundingClientRect().top < grenze - 40) {
          const folge = r0.cloneNode(false); let bewegt = false;
          for (const td of [...r0.children]) {
            const ntd = td.cloneNode(false); ntd.removeAttribute("rowspan"); folge.appendChild(ntd);
            const kinder = [...td.children];
            const ab = kinder.findIndex((c, n) => n > 0 && c.getBoundingClientRect().bottom > grenze + 1);
            if (ab > 0) { kinder.slice(ab).forEach(c => ntd.appendChild(c)); bewegt = true; }
          }
          if (bewegt) { r0.after(folge); zeilen.splice(z + 1, 0, folge); z = z + 1; }
        }
        if (z > 0) {
          teilTabelle = block.cloneNode(false);
          for (const c of block.children) if (c.tagName === "COLGROUP") teilTabelle.appendChild(c.cloneNode(true));
          const tb = zeilen[z].parentElement, ntb = tb === block ? teilTabelle : teilTabelle.appendChild(tb.cloneNode(false));
          zeilen.slice(z).forEach(r => ntb.appendChild(r));
        }
      }
      if (!teilTabelle && k === 0) break; // ein einzelner Block ist höher als die Seite
      const neu = sec.cloneNode(false);
      const kopf = sec.querySelector(":scope > header"); if (kopf) neu.appendChild(kopf.cloneNode(true));
      const arts = [...sec.querySelectorAll(":scope > article")], ab = arts.indexOf(block.parentElement);
      arts.slice(ab).forEach((a, n) => {
        const na = a.cloneNode(false); neu.appendChild(na);
        if (n === 0) { if (teilTabelle) na.appendChild(teilTabelle); let x = teilTabelle ? block.nextSibling : block; while (x) { const w = x.nextSibling; na.appendChild(x); x = w; } }
        else { while (a.firstChild) na.appendChild(a.firstChild); a.remove(); }
      });
      if (fuss) neu.appendChild(fuss.cloneNode(true));
      sec.after(neu);
      sec = neu;
    }
  }
}
// Seiten nachbearbeiten: Kopf-/Fußzeile je Word-Abschnitt vereinheitlichen, Seitenzahlen einsetzen
function docxSeiten(ziel) {
  const seiten = [...ziel.querySelectorAll("section.docx")];
  let aktuell = null, nr = 0;
  const info = seiten.map(sec => {
    const marken = [...sec.querySelectorAll("article span")].filter(x => x.childElementCount === 0 && x.textContent.includes("⟦S|"));
    const art = sec.querySelector("article");
    let abschnitt = aktuell, start = "";
    marken.forEach((m, k) => {
      const mm = m.textContent.match(/⟦S\|(\d+)\|(\d*)⟧/);
      m.textContent = m.textContent.replace(/⟦S\|[^⟧]*⟧/, "");
      if (!mm) return;
      // Beginnt der Abschnitt ganz oben auf der Seite, gilt er für diese Seite
      const oben = art && m.getBoundingClientRect().top - art.getBoundingClientRect().top < 40;
      if (k === 0 && (oben || abschnitt === null)) { abschnitt = +mm[1]; start = mm[2]; }
      aktuell = +mm[1];
      if (k === 0 && oben && mm[2]) start = mm[2];
    });
    return { sec, abschnitt, start };
  });
  const erste = {};
  for (const s of info) {
    if (!(s.abschnitt in erste)) { erste[s.abschnitt] = s; continue; }
    const vorbild = erste[s.abschnitt].sec;
    for (const tag of ["footer", "header"]) {
      const soll = vorbild.querySelector(":scope > " + tag), ist = s.sec.querySelector(":scope > " + tag);
      if (soll && ist && soll.innerHTML !== ist.innerHTML) ist.replaceWith(soll.cloneNode(true));
      else if (soll && !ist) s.sec.appendChild(soll.cloneNode(true));
    }
  }
  for (const s of info) {
    nr = s.start ? +s.start : nr + 1;
    for (const el of s.sec.querySelectorAll(":scope > header span, :scope > footer span")) {
      if (el.childElementCount) continue;
      if (el.textContent.includes("⟦P⟧")) el.textContent = el.textContent.replace(/⟦P⟧/g, String(nr));
      if (el.textContent.includes("⟦N⟧")) el.textContent = el.textContent.replace(/⟦N⟧/g, String(seiten.length));
    }
  }
}
// Word-Dokument im Browser darstellen. Jedes Dokument bekommt einen eigenen Stil-Präfix – sonst überschreiben sich
// gleichnamige Formatvorlagen mehrerer Dokumente gegenseitig (z. B. „Überschrift 1“ der Belehrung im Screeningformular).
let DOCX_NR = 0;
async function docxRendern(blob, ziel, zusatz) {
  const schwebend = Array.isArray(zusatz) ? zusatz : zusatz && zusatz.schwebend, kaesten = zusatz && !Array.isArray(zusatz) ? zusatz.kaesten : null;
  const p = "docx" + (++DOCX_NR);
  await docx.renderAsync(blob, ziel, null, { className: p, inWrapper: true, breakPages: true, ignoreLastRenderedPageBreak: false, renderHeaders: true, renderFooters: true, experimental: true, useBase64URL: true });
  ziel.querySelectorAll(`.${p}-wrapper`).forEach(w => w.classList.add("docx-wrapper"));
  ziel.querySelectorAll(`section.${p}`).forEach(sec => sec.classList.add("docx"));
  docxSchriften(ziel);
  docxTabs(ziel);
  docxUmbruch(ziel);
  docxSeiten(ziel);
  docxKaestchen(ziel);
  docxLinien(ziel);
  docxWasserzeichen(ziel);
  docxFussnoten(ziel);
  if (schwebend && schwebend.length) docxSchwebend(ziel, schwebend);
  docxKaesten(ziel, kaesten || []);
  docxEinpassen(ziel);
}
// Seiten, die wegen abweichender Schriftmetrik etwas länger als A4 sind, gleichmäßig verkleinert einpassen (sonst Zusatzblatt beim Drucken)
function docxEinpassen(ziel) {
  for (const sec of ziel.querySelectorAll("section.docx")) {
    const soll = (parseFloat(sec.style.minHeight) || 842) * 4 / 3, ist = sec.scrollHeight;
    if (ist <= soll + 1) continue;

// ================= SIDAS-PDF: alle nötigen Unterlagen in einer PDF-Datei =================
// Die ausgefüllten Word-Dateien werden unsichtbar gerendert, Seite für Seite als Bild erfasst und zu einer PDF zusammengesetzt.
async function seitenBilder(liste, fortschritt) {
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:-30000px;top:0;width:1000px;background:#fff";
  document.body.appendChild(box);
  const seiten = [];
  try {
    for (const [k, e] of liste.entries()) {
      fortschritt && fortschritt(`Seite wird erstellt … (${k + 1}/${liste.length})`);
      const div = document.createElement("div"); box.appendChild(div);
      await docxRendern(e.vorschauBlob || e.blob, div, e);
      for (const sec of div.querySelectorAll("section.docx")) {
        sec.style.margin = "0"; sec.style.boxShadow = "none";
        const cv = await html2canvas(sec, { scale: 1.5, backgroundColor: "#ffffff", logging: false, useCORS: true });
        // Nicht umbrochene, überlange Abschnitte in A4-Seiten zerlegen
        const a4 = Math.round(cv.width * 297 / 210);
        const stuecke = cv.height > a4 * 1.08 ? Math.ceil(cv.height / a4) : 1;
        for (let k = 0; k < stuecke; k++) {
          let teil = cv;
          if (stuecke > 1) {
            teil = document.createElement("canvas"); teil.width = cv.width; teil.height = a4;

          seiten.push({ jpeg: Uint8Array.from(atob(b64), c => c.charCodeAt(0)), w: teil.width, h: teil.height });
        }
      }
      div.remove();
    }
  } finally { box.remove(); }
  return seiten;
}

async function bamfPdf(ergebnisse, fortschritt) {
  if (typeof html2canvas === "undefined" || typeof docx === "undefined" || !C.bamf_meldung) return null;
  const arten = C.bamf_meldung.arten.filter(a => a !== "screening" || istScreening());

}
async function sidasPdf(ergebnisse, fortschritt) {
  // Über SiDaS erhält die LDS ausschließlich Unterlagen zu Screening-Fällen der Landespolizei

// Originalgetreue Vorschau des ausgefüllten Word-Dokuments (docx-preview, im Browser)
function Vorschau(i) {
  bereich("screening");
  const e = VORLAGEN_ERGEBNIS[i];
  if (!e) return Originalformulare();
  return {
    title: ART_NAMEN[e.art] || "Vorschau",
    html: `<p class="small" style="margin:0 0 10px">${esc(e.name)} – so sieht das ausgefüllte Original aus. Die Word-Datei ist in der <b>ZIP-Datei</b> enthalten (auf der Seite „Alle Unterlagen“ → „Alle speichern (ZIP)“).</p>
      <button class="btn glassy" id="vDr" style="margin:0 0 12px">${svg("print")} Dieses Formular drucken</button>
      <div id="vBlatt" style="overflow:hidden;border-radius:10px;background:#8a8f98;padding:8px 0"><p class="small" style="color:#fff;text-align:center">Vorschau wird erstellt …</p></div>`,
    bind: async () => {
      const ziel = $("vBlatt");
      if (typeof docx === "undefined" || !docx.renderAsync) { ziel.innerHTML = `<p class="small" style="color:#fff;padding:12px">Vorschau in dieser Ausgabe nicht verfügbar – bitte speichern und in Word öffnen.</p>`; return; }
      try {
        ziel.innerHTML = "";
        const innen = document.createElement("div"); ziel.appendChild(innen);
        await docxRendern(e.vorschauBlob || e.blob, innen, e);
        const passen = () => { const seite = innen.querySelector("section.docx"); if (!seite) return; innen.style.zoom = ""; const z = Math.min(1, (ziel.clientWidth - 4) / (seite.offsetWidth + 20)); innen.style.zoom = z; };
        passen(); window.addEventListener("resize", passen, { passive: true });
      } catch (err) { ziel.innerHTML = `<p class="small" style="color:#fff;padding:12px">Vorschau nicht möglich (${esc(err.message)}) – bitte speichern und in Word öffnen.</p>`; }
      $("vDr").onclick = () => {
        vibrate();
        const d = document.getElementById("druck");
        d.innerHTML = ""; const k = ziel.firstElementChild.cloneNode(true); k.style.zoom = ""; d.appendChild(k); d.classList.add("docxdruck");
        window.print();
        setTimeout(() => d.classList.remove("docxdruck"), 1000);
      };
    }
  };
}

// Jede Rechtsaussage trägt eine Quelle; „pruefen“ = Wortlaut vor Freigabe gegen die aktuelle Fassung prüfen.
const QKURZ = { pddd_ahe: "PD Dresden", pddd_sta: "PD Dresden / StA", pddd_he: "PD Dresden 2023", bgh: "BGH", gensta: "GenStA Dresden", bespr: "Abstimmung 2026", bpol_uep: "Hinweis BPOL", lds: "LDS-Vordruck", pruefen: "Wortlaut prüfen", gesetz: "Gesetz ✓", sta_2026: "StA 09/2026", bpol_bras: "BPOL BRAS 120", bpol_afz: "BPOL Fortbildung", lms_ivo: "LMS Auskunft 2.0", recht: "Recht PD L ✓" };
const quelleChip = q => {
  if (!q || !C.quellen_leitfaden || !C.quellen_leitfaden[q]) return "";
  const pr = q === "pruefen";
  return ` <span class="qchip${pr ? " pr" : ""}" title="${esc(C.quellen_leitfaden[q].titel)}">${pr ? "⚠ " : ""}${esc(QKURZ[q] || q)}</span>`;
};
const leitfaden = id => (C.leitfaeden || {})[id];

function weiterKnopf(w, i) {
  return `<button class="btn ${i ? "glassy" : ""}" data-wlf="${i}" style="margin:8px 0 0">${svg(w.handreichung || w.vorlage ? "print" : w.checkliste ? "list" : w.screening ? "shieldcheck" : "arrowr", 2.2)} ${esc(w.text)}</button>`;

function weiterBinden(liste) {

  };

function Leitfaden(id, startKnoten) {
  const L = leitfaden(id);
  let verlauf = [], aktuell = startKnoten || L.start;
  const haken = new Set();
  const schritt = (richtung, fn) => uebergang(richtung, anim => { fn(); render(anim ? (richtung === "back" ? "enter-back" : "enter-fwd") : ""); });
  const leiste = () => verlauf.length ? `<div class="bottombar static"><button class="btn glassy" id="lfZ">${svg("chevl", 2.2)} Zurück</button><button class="btn glassy danger" id="lfN">${svg("rotate")} Neu</button></div>` : "";
  const view = () => {
    bereich(id);
    const k = L.knoten[aktuell];
    if (k.typ === "frage") return {
      title: L.titel,
      html: `<div data-lf="${id}"><div style="margin-top:4px"><span class="chipnum">Frage ${verlauf.length + 1}</span> <span class="small"><b>${esc(L.titel)}</b></span></div>
        <div class="qbig rounded">${esc(k.frage)}</div>
        ${k.hilfe ? `<div class="note glass">${svg("info").replace("<svg", '<svg style="color:#0082c4"')}<span>${esc(k.hilfe)}</span></div>` : ""}
        ${k.antworten.map((a, i) => `<button class="answer glass press" data-lw="${i}"><span>${esc(a.text)}</span>${svg("arrowcircle")}</button>`).join("")}
        ${leiste()}</div>`,
      bind
    };
    const farbe = { handeln: 2, info: 0, wechsel: 4 }[k.art] ?? 0;
    const weiter = k.weiter || [];
    return {
      title: "Ergebnis",
      html: `<div data-lf="${id}"><div class="result" style="${farbVars(farbe)}">${svg(k.art === "handeln" ? "shieldalert" : k.art === "wechsel" ? "swap" : "info", 2)}
          <h2 class="rounded">${esc(k.titel)}</h2><div>${esc(k.kurz)}</div></div>
        ${weiter.length && k.art === "wechsel" ? weiter.map(weiterKnopf).join("") : ""}
        ${k.massnahmen && k.massnahmen.length ? `<h3 class="sec">Das machst du jetzt <small>${haken.size}/${k.massnahmen.length}</small></h3>
          ${k.massnahmen.map((mm, i) => `<button class="step glass press check ${haken.has(i) ? "on" : ""} ${mm.wichtig ? "wichtig" : ""}" data-lh="${i}">
            <span class="cbox">${svg("check", 3)}</span><span class="txt">${mm.wichtig ? `<span class="wbadge">${svg("alert", 2.4)} Besonders wichtig</span>` : ""}<span class="strikeme">${esc(mm.text)}</span>${quelleChip(mm.q)}${mm.hinweis ? `<span class="s">ⓘ ${esc(mm.hinweis)}</span>` : ""}</span></button>`).join("")}` : ""}
        ${beispielBox(k.beispiel)}
        ${vertiefung("Hintergrund und Rechtsgrundlagen", `${k.wissen && k.wissen.length ? `<div class="merke" style="margin-top:4px"><b class="h">${svg("bulb")} Gut zu wissen</b><ul>${k.wissen.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
        ${k.normen && k.normen.length ? `<h3 class="sec">Rechtsgrundlagen</h3><div class="glass" style="padding:6px 16px">${k.normen.map(nn => `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><span class="normchip">${esc(nn.norm)}</span>${quelleChip(nn.q)}<div class="small" style="margin-top:4px;color:var(--text)">${esc(nn.text)}</div></div>`).join("")}</div>` : ""}`)}
        ${weiter.length && k.art !== "wechsel" ? `<h3 class="sec">Weiter</h3>${weiter.map(weiterKnopf).join("")}` : ""}
        ${C.handreichungen && C.handreichungen[id] && !weiter.some(w => w.handreichung) ? `<button class="btn glassy" id="lfH" style="margin-top:10px">${svg("print")} Handreichung zum Ausdrucken</button>` : ""}
        ${leiste()}</div>`,
      bind: () => {
        bind();
        app.querySelectorAll("[data-lh]").forEach(el => el.onclick = () => {
          vibrate(); const i = +el.dataset.lh; haken.has(i) ? haken.delete(i) : haken.add(i);
          el.classList.toggle("on", haken.has(i));
          const h = app.querySelector("h3.sec small"); if (h) h.textContent = `${haken.size}/${k.massnahmen.length}`;
        });
        weiterBinden(weiter);
        const h = $("lfH"); if (h) h.onclick = () => { vibrate(); go(() => Handreichung(id)); };
      }
    };
  };
  function bind() {
    app.querySelectorAll("[data-lw]").forEach(el => el.onclick = () => {
      vibrate(); const i = +el.dataset.lw;
      schritt("fwd", () => { verlauf.push(aktuell); aktuell = L.knoten[aktuell].antworten[i].ziel; haken.clear(); });
    });
    const z = $("lfZ"); if (z) z.onclick = () => { vibrate(); schritt("back", () => { aktuell = verlauf.pop(); haken.clear(); }); };
    const nn = $("lfN"); if (nn) nn.onclick = () => { vibrate(); schritt("back", () => { verlauf = []; aktuell = L.start; haken.clear(); }); };
  }
  return view;
}

// Grafiken der Handreichung: Ablauf (Schritte mit Pfeilen), Vergleich (zwei Spalten), Karten (Status-Übersicht)
function hrGrafik(g) {
  if (!g) return "";
  const kopf = g.titel ? `<div class="hrg-titel">${esc(g.titel)}</div>` : "";
  if (g.typ === "ablauf") return `<div class="hrg">${kopf}<div class="hrg-ablauf">${g.schritte.map((x, i) => `${i ? '<span class="hrg-pfeil">➜</span>' : ""}<div class="hrg-schritt"><span class="hrg-ico">${svg(x.icon, 2)}</span><span class="hrg-nr">${i + 1}</span><div>${esc(x.text)}</div></div>`).join("")}</div></div>`;
  if (g.typ === "vergleich") return `<div class="hrg">${kopf}<div class="hrg-vergleich">${g.spalten.map(sp => `<div class="hrg-spalte" style="--f:${sp.farbe}"><div class="hrg-kopf">${svg(sp.icon, 2)}<b>${esc(sp.kopf)}</b></div>${sp.zeilen.map((z, i) => `${i ? '<div class="hrg-runter">▼</div>' : ""}<div class="hrg-zeile">${esc(z)}</div>`).join("")}<div class="hrg-fazit">${esc(sp.fazit)}</div></div>`).join("")}</div></div>`;
  if (g.typ === "karten") return `<div class="hrg">${kopf}<div class="hrg-karten">${g.karten.map(k => `<div class="hrg-karte" style="--f:${k.farbe}"><span class="hrg-ico">${svg(k.icon, 2)}</span><b>${esc(k.kopf)}</b><div>${esc(k.text)}</div></div>`).join("")}</div></div>`;
  return "";
}

// Punkte, die mit einer Frage beginnen („Ausländerbehörde informieren? Immer …“): Frage hervorgehoben und fett
const hrFrage = t => { const m = String(t).match(/^([^?]{3,100}\?)(\s[\s\S]*)$/); return m ? `<b class="hr-frage">${esc(m[1])}</b>${esc(m[2])}` : esc(t); };

// **fett** im Text erlauben (nach dem Maskieren)
const hrText = t => hrFrage(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
// Unterpunkte; „Für die Streife: …“ wird als Handlungsanweisung für die Polizei hervorgehoben
const hrUnter = liste => liste && liste.length ? `<ul class="hr-unterliste">${liste.map(u => /^Für die Streife:/.test(u)
  ? `<li class="hr-polizei-u"><span class="hr-wico">${svg("shieldcheck", 2)}</span><span><b>Für die Streife:</b>${hrText(u.replace(/^Für die Streife:/, ""))}</span></li>`
  : `<li>${hrText(u)}</li>`).join("")}</ul>` : "";
// Ein Punkt: [Text, Quelle, Art, Unterpunkte] – Art: „wichtig[:Symbol]“, „polizei“ oder „variante:Farbe“
function hrPunkt([t, , w, unter]) {
  const art = String(w || "").split(":")[0], zusatz = String(w || "").split(":")[1];
  if (art === "polizei") return `<li class="hr-polizei"><span class="hr-wico">${svg("shieldcheck", 2)}</span><span><b>Für die Streife:</b> ${hrText(t)}${hrUnter(unter)}</span></li>`;
  if (art === "variante") return `<li class="hr-variante" style="--f:${zusatz || "#002664"}">${hrText(t)}${hrUnter(unter)}</li>`;
  if (w) return `<li class="hr-wichtig"><span class="hr-wico">${svg(zusatz || "alert", 2)}</span><span><b>Besonders wichtig:</b> ${hrText(t)}${hrUnter(unter)}</span></li>`;
  return `<li>${hrText(t)}${hrUnter(unter)}</li>`;
}

// ================= Verwaltung: Inhalte anpassen und als neue Fassung speichern (nur interne Ausgabe) =================
// Änderungen gelten sofort auf diesem Rechner. Dauerhaft für alle werden sie erst mit „Neue Fassung speichern“ –
// die App schreibt dann eine neue HTML-Datei mit den geänderten Inhalten, die verteilt wird.
const VORLAGEN_NEU = {};   // ersetzte Word-Vorlagen (nur bis zum Speichern, im Arbeitsspeicher)
function anpassungSpeichern() { try { localStorage.setItem(ANPASSUNG_KEY, JSON.stringify(ANPASSUNG)); } catch (e) {} }
const dateiB64 = datei => new Promise((ok, fehler) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = fehler; r.readAsDataURL(datei); });

function neueFassungSpeichern() {
  const roh = JSON.parse(document.getElementById("content").textContent);
  (roh.einstellungen || []).forEach(e => { e.wert = EINST[e.id] ?? e.wert; });
  roh.weisungen = (C.weisungen || []).map(w => ({ titel: w.titel, text: w.text, ab: w.ab || "" }));
  roh.kontakte = kontakte().map(k => ({ name: k.name, rolle: k.rolle, telefon: k.telefon }));
  for (const v of roh.vorlagen_eingebaut || []) if (VORLAGEN_NEU[v.name]) v.daten = VORLAGEN_NEU[v.name];
  const heute = new Date().toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
  roh.meta.anpassung = heute;
  const json = JSON.stringify(roh).replace(/<\//g, "<\\/");
  const marke = '<script id="content" type="application/json">';
  const a = QUELLTEXT.indexOf(marke), b = QUELLTEXT.indexOf("<\/script>", a);
  if (a < 0 || b < 0) { alert("Die neue Fassung konnte nicht erstellt werden."); return; }
  const html = QUELLTEXT.slice(0, a) + marke + json + QUELLTEXT.slice(b);
  speichern(new Blob([html], { type: "text/html" }), `Streifenhelfer-Auslaenderbereich-PDL_angepasst_${heute.split(".").reverse().join("-")}.html`);
}

function weisungBearbeiten(i) {
  const liste = (C.weisungen || []).map(w => ({ ...w }));
  const w = i >= 0 ? liste[i] : { titel: "", text: "", ab: "" };
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="sheet" role="dialog" aria-label="Hinweis bearbeiten">
    <h2 class="rounded" style="font-size:24px">${i >= 0 ? "Hinweis bearbeiten" : "Neuer Hinweis"}</h2>
    <label class="f" for="wt">Überschrift</label><input type="text" id="wt" value="${esc(w.titel)}">
    <label class="f" for="wa">Gültig ab (optional)</label><input type="text" id="wa" value="${esc(w.ab || "")}" placeholder="TT.MM.JJJJ">
    <label class="f" for="wx">Text</label><textarea id="wx" rows="5" style="width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--text);font:inherit">${esc(w.text)}</textarea>
    <button class="btn" id="ws2" style="margin-top:18px">Sichern</button>
    ${i >= 0 ? '<button class="btn glassy danger" id="wd">Löschen</button>' : ""}
    <button class="btn glassy" id="wc">Abbrechen</button></div>`;
  document.body.appendChild(m);
  const zu = () => { m.remove(); neuZeichnen(); };
  const sichern = l => { C.weisungen = l; ANPASSUNG.weisungen = l; anpassungSpeichern(); zu(); };
  m.onclick = e => { if (e.target === m) zu(); };
  m.querySelector("#wc").onclick = zu;
  m.querySelector("#ws2").onclick = () => {
    const neu = { titel: m.querySelector("#wt").value.trim(), ab: m.querySelector("#wa").value.trim(), text: m.querySelector("#wx").value.trim() };

    if (i >= 0) liste[i] = neu; else liste.push(neu);
    sichern(liste);
  };
  const d = m.querySelector("#wd"); if (d) d.onclick = () => { if (confirm("Hinweis löschen?")) { liste.splice(i, 1); sichern(liste); } };
}

// ================= Festhalteanordnung nach § 62 Abs. 5 AufenthG (nur interne Ausgabe) =================
// Eigenes Formular mit Kopfbogen der Dienststelle; übernimmt vorhandene Angaben aus dem Fall. Nur auf diesem Gerät, 7 Tage.
const FHKEY = "geas.intern.festhalten.v1";
let FH = (() => {
  try {
    const f = JSON.parse(localStorage.getItem(FHKEY) || "null");
    if (f && Date.now() - f.angelegt < AUFBEWAHRUNG) return f;
    localStorage.removeItem(FHKEY);
  } catch (e) {}
  return null;
})();
function fhSpeichern() { try { FH ? localStorage.setItem(FHKEY, JSON.stringify(FH)) : localStorage.removeItem(FHKEY); } catch (e) {} }
function fhWerte() {
  const K = C.festhalten;
  if (!FH) FH = { angelegt: Date.now(), werte: {} };
  const w = FH.werte;
  for (const [id, quelle] of Object.entries(K.vorbelegung || {})) if (!w[id] && F && F.werte[quelle]) w[id] = F.werte[quelle];
  for (const f of K.felder) if (w[f.id] === undefined && f.standard !== undefined) w[f.id] = f.standard;
  return w;
}
const fhDatum = v => { if (!v) return ""; const d = new Date(v); return isNaN(d) ? v : d.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) + " Uhr"; };
const fhListe = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " und " + a[a.length - 1];

function fhFeld(f, w) {
  const v = w[f.id] ?? "";
  const pf = f.pflicht ? `<span class="pflicht ${(Array.isArray(v) ? v.length : v) ? "ok" : ""}">Pflicht</span>` : "";
  const hint = f.hinweis ? `<div class="hint">${svg("info").replace("<svg", '<svg style="width:15px;height:15px;flex:none"')}${esc(f.hinweis)}</div>` : "";
  // Textbausteine: antippen fügt die Passage ein (Einzeiler: ersetzt), erneut antippen entfernt sie
  const bs = f.bausteine ? `<div class="fhb"><div class="small">Bausteine antippen – Angaben in [eckigen Klammern] ersetzen</div><div class="chips">${f.bausteine.map((b, i) => {
      const an = String(v).includes(b.text);
      return `<button class="chip ${an ? "on" : ""}" data-fhb="${f.id}" data-i="${i}" title="${esc(b.text)}">${svg(an ? "check" : "plus", 3)}${esc(b.kurz)}</button>`;
    }).join("")}</div></div>` : "";
  if (f.typ === "text") return `<div class="field"><input id="fh-${f.id}" data-fh="${f.id}" value="${esc(v)}" placeholder="${esc(f.platzhalter || " ")}" autocomplete="off"><label for="fh-${f.id}">${esc(f.label)} ${pf}</label>${bs}${hint}</div>`;
  if (f.typ === "mehrzeilig") return `<div class="field ml"><label for="fh-${f.id}">${esc(f.label)} ${pf}</label><textarea id="fh-${f.id}" data-fh="${f.id}" rows="${Math.min(10, Math.max(3, Math.ceil(String(v).length / 45)))}" placeholder="${esc(f.platzhalter || "")}">${esc(v)}</textarea>${bs}${hint}</div>`;
  if (f.typ === "datumzeit") return `<div class="box glass"><div class="lbl">${esc(f.label)} ${pf}</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><input type="datetime-local" data-fhdt="${f.id}" value="${esc(v)}"><button class="chip" data-fhnow="${f.id}" style="color:var(--green)">${svg("clock")} Jetzt</button></div>${hint}</div>`;
  const gew = Array.isArray(v) ? v : v ? [v] : [];
  return `<div class="box glass"><div class="lbl">${esc(f.label)} ${pf}${f.typ === "mehrfach" ? '<span class="small">Mehrfachauswahl</span>' : ""}</div>
    <div class="chips">${f.optionen.map(o => `<button class="chip ${gew.includes(o) ? "on" : ""}" data-fhc="${f.id}" data-o="${esc(o)}">${gew.includes(o) ? svg("check", 3) : ""}${esc(o)}</button>`).join("")}</div>${hint}</div>`;
}

function Festhalteanordnung() {
  const K = C.festhalten, w = fhWerte();
  fhSpeichern();
  const fehlend = () => K.felder.filter(f => f.pflicht && !(Array.isArray(w[f.id]) ? w[f.id].length : w[f.id])).map(f => f.label);
  const gruppen = [...new Set(K.felder.map(f => f.gruppe))];
  const view = () => {
    const warn = K.warnungen.filter(x => [].concat(w[x.feld] || []).includes(x.wert));
    return {
      title: "Festhalteanordnung",
      html: `<div class="glass" style="padding:18px;border:1.5px solid #002664">
          <h3 class="rounded" style="margin:0 0 6px;font-size:21px">${esc(K.titel)}</h3>

        ${warn.map(x => `<div class="note glass" style="margin-top:12px;border:1.5px solid var(--coral)">${svg("alert").replace("<svg", '<svg style="color:var(--coral)"')}<span><b style="color:var(--coral)">Achtung:</b> ${esc(x.text)}</span></div>`).join("")}
        ${gruppen.map(g => `<h3 class="sec">${esc(g)}</h3>${K.felder.filter(f => f.gruppe === g).map(f => fhFeld(f, w)).join("")}`).join("")}
        <button class="btn" id="fhD">${svg("print")} Drucken / als PDF speichern</button>
        <h3 class="sec">Vorschau</h3><div class="fh-vorschau glass"><div class="fh-zoom">${fhBrief(w)}</div></div>
        <button class="btn glassy danger" id="fhX">${svg("rotate")} Formular leeren</button>
        <p class="small">Die Angaben bleiben nur auf diesem Gerät und werden nach 7 Tagen automatisch gelöscht.</p>`,
      bind: () => {
        const neu = () => { fhSpeichern(); const z = app.querySelector(".fh-zoom"); if (z) z.innerHTML = fhBrief(w); };
        const skal = () => { const v = app.querySelector(".fh-vorschau"), z = app.querySelector(".fh-zoom"); if (v && z) z.style.zoom = Math.min(1, (v.clientWidth - 16) / 794); };
        skal(); window.__fhSkal = skal;
        if (!window.__fhR) { window.__fhR = 1; window.addEventListener("resize", () => document.querySelector(".fh-zoom") && window.__fhSkal()); }
        app.querySelectorAll("[data-fh]").forEach(el => el.oninput = () => { w[el.dataset.fh] = el.value; neu(); });
        app.querySelectorAll("[data-fhdt]").forEach(el => el.onchange = () => { w[el.dataset.fhdt] = el.value; neu(); });
        app.querySelectorAll("[data-fhnow]").forEach(el => el.onclick = () => { vibrate(); w[el.dataset.fhnow] = lokalISO(new Date()); fhSpeichern(); neuZeichnen(); });
        app.querySelectorAll("[data-fhb]").forEach(el => el.onclick = () => {
          vibrate(); const f = K.felder.find(x => x.id === el.dataset.fhb), t = f.bausteine[+el.dataset.i].text, alt = String(w[f.id] || "");
          if (f.typ === "text") w[f.id] = alt === t ? "" : t;
          else w[f.id] = alt.includes(t) ? alt.replace(t, "").replace(/ {2,}/g, " ").trim() : (alt.trim() ? alt.trim() + " " : "") + t;
          fhSpeichern(); neuZeichnen();
        });

          fhSpeichern(); neuZeichnen();

          vibrate();
          const f = fehlend();
          const offen = [...new Set(K.felder.flatMap(x => String(w[x.id] || "").match(/\[[^\]]{1,40}\]/g) || []))];
          if (offen.length) f.push("Platzhalter ersetzen: " + offen.join(", "));

          const alt = document.title; document.title = ["Festhalteanordnung", w.name, w.vorname].filter(Boolean).join("_").replace(/\s+/g, "_");

      }
    };
  };
  return view();
}

// Prüfstand: alle Normen der Leitfäden mit Quelle – was belegt ist und was noch geprüft werden muss
function Pruefstand() {
  const Q = C.quellen_leitfaden || {};
  const alle = [];
  for (const L of Object.values(C.leitfaeden || {})) for (const [kid, k] of Object.entries(L.knoten)) {
    for (const nn of k.normen || []) alle.push({ ...nn, lf: L.titel, bei: k.titel });
    for (const mm of k.massnahmen || []) if (mm.q === "pruefen") alle.push({ norm: "Maßnahme", text: mm.text, q: "pruefen", lf: L.titel, bei: k.titel });
  }
  const offen = alle.filter(x => x.q === "pruefen"), belegt = alle.filter(x => x.q !== "pruefen");
  const zeile = x => `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><span class="normchip">${esc(x.norm)}</span>${quelleChip(x.q)}<div class="small" style="color:var(--text)">${esc(x.text)}</div><div class="small">${esc(x.lf)} → ${esc(x.bei)}</div></div>`;
  return {
    title: "Rechtsgrundlagen & Quellen",
    html: `<div class="note glass" style="border:2px solid #e08600">${svg("alert").replace("<svg", '<svg style="color:#e08600"')}<span><b>${offen.length} Angaben sind noch zu prüfen</b> – sie sind nicht durch ein vorliegendes Dokument belegt. Bitte gegen die aktuelle Gesetzesfassung prüfen, bevor die Leitfäden freigegeben werden.</span></div>
      <h3 class="sec">Noch zu prüfen <small>${offen.length}</small></h3><div class="glass" style="padding:6px 16px">${offen.map(zeile).join("")}</div>
      <h3 class="sec">Durch Dokumente belegt <small>${belegt.length}</small></h3><div class="glass" style="padding:6px 16px">${belegt.map(zeile).join("")}</div>
      <h3 class="sec">Quellen</h3><div class="glass" style="padding:6px 16px">${Object.entries(Q).map(([k, v]) => `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(QKURZ[k] || k)}</b> <span class="small">(${esc(v.art)})</span><div class="small" style="color:var(--text)">${esc(v.titel)}</div></div>`).join("")}</div>`
  };
}

// ================= Geführter Einsatz (interne Ausgabe) =================
// Ein Schritt pro Bildschirm: erst prüfen (Screening ja/nein), dann abarbeiten bis zur Übermittlung.
const ES = () => (S.einsatz ||= { i: 0, haken: {}, pruefung: null, ergebnis: "" });
const einsatzSchritte = () => (C.einsatz ? C.einsatz.schritte : []);

function einsatzErgebnis(antwort, titel, nurMerken) {
  const e = ES();
  if (e.pruefung === antwort && e.ergebnis === titel && nurMerken) return;
  e.pruefung = antwort; e.ergebnis = titel; save();
  if (F && C.intern) { F.werte.screening_fall = antwort === "nein" ? "Nein – Aufgriff ohne Screening" : "Ja – Screening durch die Landespolizei"; fallSpeichern(); }
  if (nurMerken) return;
  const i = einsatzSchritte().findIndex(x => x.id === "pruefung");
  e.i = i + 1; save();
  stack.pop();   // Prüfung verlassen
  uebergang("fwd", anim => { stack.pop(); stack.push(() => Einsatz(e.i)); render(anim ? "enter-fwd" : ""); });
}

function Einsatz(nr) {
  bereich("screening");
  const liste = einsatzSchritte(), e = ES();
  nr = Math.max(0, Math.min(nr, liste.length - 1));
  e.i = nr; save();
  const st = liste[nr], haken = new Set(e.haken[st.id] || []);
  const a = aufgriff();
  const offenSchritt = (st.erfassen || []).reduce((n, id) => { const x = C.fall.schritte.find(y => y.id === id); return n + (x && F ? offenIn(x).length : 0); }, 0);
  const phasen = [...new Set(liste.map(x => x.phase))];
  const mailAblauf = st.mail_aus_ablauf ? (C.ablauf || []).find(x => x.nr === st.mail_aus_ablauf) : null;
  const nachPruefung = liste.findIndex(x => x.id === "pruefung") < nr;
  return {
    title: `Schritt ${nr + 1} von ${liste.length}`,
    html: `${bar((nr + 1) / liste.length)}
      <div class="stepper">${phasen.map(ph => `<button class="${ph === st.phase ? "cur" : ""}" data-ph="${esc(ph)}">${esc(ph)}</button>`).join("")}</div>
      ${nachPruefung && e.pruefung === "nein" ? `<div class="note glass" style="border:2px solid #e08600">${svg("alert").replace("<svg", '<svg style="color:#e08600"')}<span>Die Prüfung ergab <b>kein Screening</b> („${esc(e.ergebnis)}“). Ohne Screening entfallen Überprüfungsformular, Information Art. 11, die Sicherheitskontrolle nach Art. 15 und der SiDaS-Upload. Die übrigen Unterlagen (Belehrung, Anlaufbescheinigung, Inverwahrung, Fragebogen, Abschlusserklärung) erstellt die App weiterhin; gemeldet wird per E-Mail an das BAMF.</span></div>` : ""}
      ${nachPruefung && !e.pruefung ? `<div class="note glass" style="border:2px solid #e08600">${svg("alert").replace("<svg", '<svg style="color:#e08600"')}<span>Die Prüfung „Screening ja oder nein?“ wurde noch nicht gemacht.</span></div>` : ""}
      <div class="small" style="margin:10px 2px 0;font-weight:700;color:var(--green)">${esc(st.phase)}</div>
      <h2 class="rounded" style="font-size:30px;margin:2px 0 8px;line-height:1.15">${esc(st.titel)}</h2>
      <p style="margin:0 0 14px;font-size:17px">${esc(st.kurz)}</p>
      ${beispielBox(st.beispiel)}
      ${a && nachPruefung && e.pruefung !== "nein" ? `<div class="fristen2" style="margin:0 0 14px"><div class="glass"><div class="small"><b>Screening endet spätestens</b></div><b style="color:#e08600">${fmtDatum(screeningFrist(a))}</b><div class="small" style="margin-top:4px">Formular unverzüglich an Referat 2 senden – die LDS braucht Zeit für ihre Maßnahmen.</div></div>
        <div class="glass"><div class="small"><b>Richter (nur bei Festhalten)</b></div><b style="color:var(--coral)">${wert("festgehalten") === "Ja" ? fmtDatum(richterFrist(a)) : "—"}</b></div></div>` : ""}
      ${(st.info || []).map(t => `<div class="note glass">${svg("info").replace("<svg", '<svg style="color:#0082c4"')}<span class="small" style="color:var(--text)">${esc(t)}</span></div>`).join("")}
      ${st.punkte.length ? `<h3 class="sec" style="margin-top:18px">Das machst du jetzt <small>${haken.size}/${st.punkte.length}</small></h3>
        ${st.punkte.map((p, i) => `<button class="step glass press check ${haken.has(i) ? "on" : ""}" data-eh="${i}" role="checkbox" aria-checked="${haken.has(i)}">
          <span class="cbox">${svg("check", 3)}</span><span class="txt"><span class="strikeme">${esc(p.text)}</span>${p.hinweis ? `<span class="s">ⓘ ${esc(p.hinweis)}</span>` : ""}</span></button>`).join("")}` : ""}
      ${st.aktion === "pruefung" ? `<button class="btn" id="eP" style="font-size:19px;padding:20px">${svg("shieldcheck")} ${e.pruefung ? "Prüfung erneut durchführen" : "Prüfung starten"}</button>
        ${e.pruefung ? `<div class="note glass" style="border:2px solid ${e.pruefung === "ja" ? "#e75113" : "#008444"}"><span><b>Ergebnis:</b> ${esc(e.ergebnis)}</span></div>` : ""}` : ""}
      ${st.erfassen ? `<button class="btn" id="eF" style="font-size:18px;padding:18px">${svg("pencil")} ${F ? "Angaben erfassen" : "Fall anlegen und erfassen"}${F ? ` <span style="font-weight:600;opacity:.85">(${offenSchritt ? offenSchritt + " offen" : "vollständig ✓"})</span>` : ""}</button>` : ""}
      ${mailAblauf && mailAblauf.mail ? `<a class="btn glassy" href="${esc(mailLink(mailAblauf.mail))}" style="text-decoration:none">${svg("share")} ${esc(mailAblauf.mail.knopf)}</a>` : ""}
      ${st.aktion === "unterlagen" ? `<button class="btn" id="eU" style="font-size:19px;padding:20px">${svg("docs")} Alle Unterlagen erstellen</button>` : ""}
      ${st.aktion === "meldung" ? `${C.sidas && C.sidas.mail && istScreening() ? `<a class="btn" href="${esc(mailLink(C.sidas.mail))}" style="text-decoration:none">${svg("share")} ${esc(C.sidas.mail.knopf)} (PDF anhängen)</a>` : C.sidas ? `<div class="note glass" style="border:2px solid #008444"><span><b>Aufgriff ohne Screening:</b> ${esc(C.sidas.ohne_screening || "")}</span></div>` : ""}
        ${C.bamf_meldung ? `<a class="btn ${C.sidas && istScreening() ? "glassy" : ""}" href="${esc(mailLink(C.bamf_meldung.mail))}" style="text-decoration:none">${svg("share")} ${esc(C.bamf_meldung.mail.knopf)} (PDF anhängen)</a>` : ""}
        <button class="btn glassy" id="eU">${svg("docs")} Unterlagen / ZIP noch einmal öffnen</button>` : ""}
      ${st.aktion === "ende" ? `<button class="btn glassy danger" id="eL">${svg("trash")} Fall löschen und Einsatz beenden</button>` : ""}
      ${st.uma ? umaKarte(istUma()) : ""}
      <div class="platz-unten"></div>
      <div class="bottombar fest">
        ${nr > 0 ? `<button class="btn glassy" id="eZ" style="flex:.6">${svg("chevl", 2.2)} Zurück</button>` : ""}
        ${nr < liste.length - 1 ? `<button class="btn" id="eW">Weiter ${svg("chevr", 2.2)}</button>` : `<button class="btn" id="eS" style="${farbVars(2)}">${svg("home")} Zur Startseite</button>`}
      </div>`,
    bind: () => {
      const gehe = z => { vibrate(); const r = z > nr ? "fwd" : "back"; uebergang(r, anim => { stack[stack.length - 1] = () => Einsatz(z); render(anim ? (r === "fwd" ? "enter-fwd" : "enter-back") : ""); window.scrollTo(0, 0); }); };
      app.querySelectorAll("[data-eh]").forEach(el => el.onclick = () => {
        vibrate(); const i = +el.dataset.eh; haken.has(i) ? haken.delete(i) : haken.add(i);
        e.haken[st.id] = [...haken]; save();
        el.classList.toggle("on", haken.has(i)); el.setAttribute("aria-checked", haken.has(i));
        const h = app.querySelector("h3.sec small"); if (h) h.textContent = `${haken.size}/${st.punkte.length}`;
      });
      app.querySelectorAll("[data-ph]").forEach(b => b.onclick = () => gehe(liste.findIndex(x => x.phase === b.dataset.ph)));
      const eZ = $("eZ"); if (eZ) eZ.onclick = () => gehe(nr - 1);
      const eW = $("eW"); if (eW) eW.onclick = () => gehe(nr + 1);
      const eS = $("eS"); if (eS) eS.onclick = () => { vibrate(); zeigeTab("start"); };
      const eP = $("eP"); if (eP) eP.onclick = () => { vibrate(); go(ScreeningWizard(einsatzErgebnis)); };
      const eF = $("eF"); if (eF) eF.onclick = () => {
        vibrate();
        if (!F) { F = { angelegt: Date.now(), werte: { aufgriff_zeit: lokalISO(new Date()), screening_zeit: lokalISO(new Date()) } }; fallSpeichern(); }
        go(Erfassung(0, st.erfassen));
      };
      app.querySelectorAll("#eU").forEach(b => b.onclick = () => { vibrate(); go(Originalformulare); });
      const eL = $("eL"); if (eL) eL.onclick = () => {
        if (!confirm("Fall und alle Daten endgültig löschen? Vorher die Unterlagen im Vorgang ablegen.")) return;
        F = null; fallSpeichern(); VORLAGEN_ERGEBNIS = []; VORLAGEN_DATEIEN = []; KORREKTUREN = {}; VORLAGEN_STAND = "";
        S.einsatz = null; if (C.ablauf) C.ablauf.forEach(x => delete S.checklisten["ablauf-" + x.nr]); save();
        zeigeTab("start");
      };
    }
  };
}

// Neue interne Startseite: ein großer Knopf für den Einsatz, daneben der direkte Weg für Geübte
function EinsatzStart() {
  const liste = einsatzSchritte(), e = S.einsatz, laeuft = e && (e.i > 0 || F);
  const a = aufgriff();
  return {
    title: C.meta.titel, hero: true,
    html: hero("", `<h2 class="rounded" style="font-size:30px">${esc(C.meta.titel)}</h2><p class="sub">Was liegt vor? Wähle den Bereich – die App führt dich Schritt für Schritt.</p>`) + `
      <div class="content overlap">
        ${(C.weisungen || []).length ? `<div class="weisungen reveal"><b class="h">${svg("alert", 2.2)} Aktuelle Hinweise</b>${C.weisungen.map(w => `<div class="weisung"><b>${esc(w.titel)}</b>${w.ab ? ` <span class="small">(ab ${esc(w.ab)})</span>` : ""}<div>${inline(w.text)}</div></div>`).join("")}</div>` : ""}
        <h3 class="sec" style="margin-top:6px;justify-content:flex-start;gap:4px"><span class="stufe">1</span> Bereich wählen</h3>
        <div class="bereiche">
          ${[["screening", "sE", laeuft ? `Einsatz läuft – weiter bei Schritt ${e.i + 1} von ${liste.length}: ${liste[e.i].titel}` : "Person hat keine Papiere, ist über die „grüne Grenze“ gekommen oder ist unbekannt.", laeuft ? "Einsatz fortsetzen" : "Einsatz starten", "Beispiel: Afghanischer Staatsangehöriger ohne Papiere in der Innenstadt, kein Treffer in INPOL/AZR."],
             ["os", "", "Person ist bekannt: Visum oder Titel abgelaufen, Duldung, Asylverfahren, Ausreisepflicht.", "Leitfaden öffnen", "Beispiel: Georgische Staatsangehörige, visumfrei eingereist, seit vier Monaten in Deutschland (Overstay)."],
             ["fz", "", "Staatsangehörige/r eines EU-/EWR-Staates oder der Schweiz bzw. Familienangehörige/r.", "Leitfaden öffnen", "Beispiel: Polnischer Staatsangehöriger, täglich Ladendiebstähle, ohne Wohnsitz in Leipzig."]].map(([id, knopf, text, cta, bsp], n) => {
            const B = BEREICHE[id], gewaehlt = S.bereich === id;
            return `<button class="bereich glass press reveal ${gewaehlt ? "gewaehlt" : ""}" style="--b:${B.farbe}" ${knopf ? `id="${knopf}"` : `data-lfs="${id}"`}>
              <span class="bnr">${String.fromCharCode(65 + n)}</span>${gewaehlt ? `<span class="bgew">${svg("check", 3)} zuletzt gewählt</span>` : ""}
              <span class="bico">${svg(B.icon, 2)}</span><h4>${esc(B.name)}</h4><p>${esc(text)}</p><p class="bbsp">${esc(bsp)}</p>
              <span class="cta">${esc(cta)} ${svg("arrowr", 2.4)}</span></button>`;
          }).join("")}
        </div>
        <button class="btn glassy" id="sP">${svg("search")} Nicht sicher, welcher Bereich? Kurz prüfen</button>
        ${laeuft ? `<button class="btn glassy" id="sN" style="margin-top:0">${svg("plus", 2.4)} Neuen Einsatz beginnen</button>` : ""}
        ${F ? `<div style="margin-top:14px">${fallKarte()}</div>` : ""}
        ${a && e && e.pruefung !== "nein" ? `<div class="fristen2"><div class="glass"><div class="small"><b>Screening endet spätestens</b></div><b style="color:#e08600">${fmtDatum(screeningFrist(a))}</b><div class="small" style="margin-top:4px">Formular unverzüglich an Referat 2 senden – die LDS braucht Zeit für ihre Maßnahmen.</div></div>
          <div class="glass"><div class="small"><b>Richter (nur bei Festhalten)</b></div><b style="color:var(--coral)">${wert("festgehalten") === "Ja" ? fmtDatum(richterFrist(a)) : "—"}</b></div></div>` : ""}
        ${istUma() ? umaKarte(true) : ""}
        <h3 class="sec" style="justify-content:flex-start;gap:4px"><span class="stufe">2</span> Wie ausführlich?</h3>
        ${modusSchalter()}
        <h3 class="sec" style="justify-content:flex-start;gap:4px"><span class="stufe">3</span> Werkzeuge</h3>
        <div class="grid2">
          ${tile("sD", "Unterlagen erstellen", "Dokumenten-Assistent – alle Formulare ausgefüllt", "docs", 2)}
          ${C.festhalten ? tile("sF", "Festhalteanordnung", "§ 62 Abs. 5 AufenthG – zum Ausdrucken", "lock", 4) : ""}
          ${C.handreichungen ? tile("sH", "Handreichungen", "Zum Aushändigen – Druck oder PDF", "print", 3) : ""}
          ${tile("sC", "Gesamt-Checkliste", "Alle Schritte des Streifendienstes", "list", 5)}
        </div>
        ${istUma() ? "" : umaKarte(false)}
        <div class="note glass" style="margin-top:14px">${svg("lock").replace("<svg", '<svg style="color:var(--coral)"')}<span class="small"><b style="color:var(--coral)">Nur für den Dienstgebrauch.</b> ${esc(C.meta.hinweis_intern || "")}</span></div>
        ${C.meta.copyright ? `<p class="small" style="text-align:center;margin:18px 0 0">${esc(C.meta.copyright)}</p>` : ""}
      </div>`,
    bind: () => {
      modusBinden();
      $("sE").onclick = () => { vibrate(); go(() => Einsatz(laeuft ? e.i : 0)); };
      const sN = $("sN"); if (sN) sN.onclick = () => {
        if (!confirm("Neuen Einsatz beginnen? Die Haken werden zurückgesetzt." + (F ? " Der gespeicherte Fall wird gelöscht – vorher die Unterlagen im Vorgang ablegen." : ""))) return;
        F = null; fallSpeichern(); VORLAGEN_ERGEBNIS = []; VORLAGEN_DATEIEN = []; KORREKTUREN = {}; VORLAGEN_STAND = "";
        S.einsatz = null; save(); neuZeichnen();
      };
      $("sD").onclick = () => { vibrate(); go(FallUebersicht); };
      app.querySelectorAll("[data-lfs]").forEach(b => b.onclick = () => { vibrate(); go(() => LeitfadenStart(b.dataset.lfs)); });
      const sH = $("sH"); if (sH) sH.onclick = () => { vibrate(); go(Handreichungen); };
      const sF = $("sF"); if (sF) sF.onclick = () => { vibrate(); go(Festhalteanordnung); };
      $("sP").onclick = () => { vibrate(); go(ScreeningWizard()); };
      $("sC").onclick = () => { vibrate(); go(Ablauf); };
      const fk = $("fk"); if (fk) fk.onclick = () => { vibrate(); go(FallUebersicht); };
    }
  };
}

// umA-Hinweise (interne Ausgabe): aufgeklappt und hervorgehoben, sobald der Fall einen umA betrifft
function umaKarte(offen) {
  const u = C.uma_hilfe;
  if (!u) return "";
  const tel = t => `<a href="tel:${t.replace(/[^0-9+]/g, "")}" style="font-weight:700;white-space:nowrap">${esc(t)}</a>`;
  return `<details class="glass reveal" ${offen ? "open" : ""} style="padding:16px;margin-top:14px;${offen ? "border:2px solid #e75113" : ""}">
    <summary style="cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none">${ico("figure.child", 3, "sm")}<b style="font-size:18px;flex:1">${esc(u.titel)}</b>${offen ? `<span class="badge" style="background:#e75113;color:#fff">dieser Fall</span>` : ""}</summary>
    <ul style="margin:12px 0 0;padding-left:20px">${u.punkte.map(p => `<li style="margin-bottom:6px">${inline(p)}</li>`).join("")}</ul>
    <h4 style="margin:14px 0 6px">Welches Jugendamt?</h4>
    ${u.jugendaemter.map(j => `<div class="rowtile" style="cursor:default;background:var(--bg);margin-bottom:8px;align-items:flex-start"><span class="txt"><span class="t">${esc(j.name)}</span><br><span class="s" style="color:var(--text)">${esc(j.text)}</span>${j.tel ? `<br>${tel(j.tel)}` : ""}</span></div>`).join("")}
  </details>`;
}


// ================= Interne Startseite: Einsatz-Ablauf =================
function mailLink(m) {
  const fuell = t => t.replace(/\{\{(\w+)\}\}/g, (_, id) => platzhalter(id));
  return `mailto:${m.an}?subject=${encodeURIComponent(fuell(m.betreff))}&body=${encodeURIComponent(fuell(m.text))}`;
}

function Ablauf() {
  const a = aufgriff();
  return {
    title: "Einsatz-Ablauf", hero: true,
    html: hero("", `${POL ? "" : EMBLEM(52)}<h2 class="rounded" style="font-size:34px">${esc(C.meta.titel)}</h2><p class="sub">Screening Schritt für Schritt</p>`) + `
      <div class="content overlap">
        <div class="note glass" style="border:1.5px solid var(--coral)">${svg("lock").replace("<svg", '<svg style="color:var(--coral)"')}<span class="small"><b style="color:var(--coral)">Nur für den Dienstgebrauch.</b> ${esc(C.meta.hinweis_intern || "")}</span></div>
        ${fallKarte()}
        ${istUma() ? umaKarte(true) : ""}
        ${a ? `<div class="fristen2"><div class="glass"><div class="small"><b>Screening endet spätestens</b></div><b style="color:#e08600">${fmtDatum(screeningFrist(a))}</b><div class="small" style="margin-top:4px">Formular unverzüglich an Referat 2 senden – die LDS braucht Zeit für ihre Maßnahmen.</div></div>
          <div class="glass"><div class="small"><b>Richter (nur bei Festhalten)</b></div><b style="color:var(--coral)">${wert("festgehalten") === "Ja" ? fmtDatum(richterFrist(a)) : "—"}</b></div></div>` : ""}
        ${C.ablauf.map(s => {
          const set = new Set(S.checklisten["ablauf-" + s.nr] || []);
          const fertig = s.punkte.length && set.size === s.punkte.length;
          return `<div class="glass reveal" style="padding:16px;margin-top:14px">
            <div style="display:flex;gap:12px;align-items:center">
              <span class="num rounded" style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:${fertig ? (POL ? "#008444" : "linear-gradient(135deg,#0b8c78,#006b5c)") : (POL ? "#002664" : "linear-gradient(135deg,#3a8ff0,#1f66cf)")}">${fertig ? "✓" : esc(s.nr)}</span>
              <b style="font-size:19px;flex:1">${esc(s.titel)}</b>${s.punkte.length ? `<span class="small">${set.size}/${s.punkte.length}</span>` : ""}</div>
            ${(s.info || []).map(t => `<p class="small" style="margin:10px 0 0">ⓘ ${esc(t)}</p>`).join("")}
            ${s.punkte.map((p, i) => `<button class="step press check ${set.has(i) ? "on" : ""}" data-ab="${esc(s.nr)}" data-i="${i}" style="margin:10px 0 0;background:transparent;padding:6px 0">
              <span class="cbox">${svg("check", 3)}</span><span class="txt"><span class="strikeme">${esc(p.text)}</span>${p.hinweis ? `<span class="s">${esc(p.hinweis)}</span>` : ""}</span></button>`).join("")}
            ${s.aktion === "pruefung" ? `<button class="btn" data-akt="pruefung" style="margin-bottom:0">${svg("shieldcheck")} Screening-Prüfung starten</button>` : ""}
            ${s.aktion === "fall" ? `<button class="btn" data-akt="fall" style="margin-bottom:0">${svg("pencil")} ${F ? "Angaben erfassen" : "Fall anlegen"}</button>` : ""}
            ${s.aktion === "vorlagen" ? `<button class="btn" data-akt="vorlagen" style="margin-bottom:0;${farbVars(2)}">${svg("docs")} Alle Unterlagen erstellen</button>` : ""}
            ${s.mail ? `<a class="btn glassy" href="${esc(mailLink(s.mail))}" style="text-decoration:none;margin-bottom:0">${svg("share")} ${esc(s.mail.knopf)}</a>` : ""}
          </div>`;
        }).join("")}
        ${istUma() ? "" : umaKarte(false)}
        <button class="btn glassy" id="abReset" style="margin-top:18px">${svg("rotate")} Haken zurücksetzen (neuer Einsatz)</button>
      </div>`,
    bind: () => {
      app.querySelectorAll("[data-ab]").forEach(el => el.onclick = () => {
        vibrate();
        const k = "ablauf-" + el.dataset.ab, i = +el.dataset.i, set = new Set(S.checklisten[k] || []);
        set.has(i) ? set.delete(i) : set.add(i);
        S.checklisten[k] = [...set]; save(); neuZeichnen();
      });
      app.querySelectorAll("[data-akt]").forEach(b => b.onclick = () => {
        vibrate();
        const akt = b.dataset.akt;
        if (akt === "pruefung") go(ScreeningWizard());
        if (akt === "fall") { if (!F) { F = { angelegt: Date.now(), werte: { aufgriff_zeit: lokalISO(new Date()), screening_zeit: lokalISO(new Date()) } }; fallSpeichern(); } go(FallUebersicht); }
        if (akt === "vorlagen") go(Originalformulare);
      });
      const fk = $("fk"); if (fk) fk.onclick = () => { vibrate(); go(FallUebersicht); };
      $("abReset").onclick = () => { if (confirm("Alle Haken im Ablauf entfernen?")) { C.ablauf.forEach(s => delete S.checklisten["ablauf-" + s.nr]); save(); neuZeichnen(); } };
    }
  };
}


// ================= Start =================
const ROOT = { start: C.intern ? (C.einsatz ? EinsatzStart : Ablauf) : Start, fall: FallUebersicht, kontakte: Kontakte, wissen: Wissen, lernen: Lernen, mehr: Mehr };
renderTabs();
stack = [ROOT.start];
render("enter-fade");
onboarding();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
