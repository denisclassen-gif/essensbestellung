<script id="content" type="application/json">{"meta":{"titel":"GEAS & Rückführung","untertitel":"Einsatz- und Lernhilfe für den Polizeivollzugsdienst – Zuschnitt Polizei Sachsen / PD Leipzig","version":"3.0.0","stand":"September 2026","hinweis":"Diese App ist eine inoffizielle Arbeits- und Lernhilfe. Sie ersetzt weder Gesetzestext, Erlasse, Dienstanweisungen der Polizei Sachsen noch die Weisung der zuständigen Ausländerbehörde oder der Führung im Einsatz. Rechtsstand: GEAS-Reform (EU) und GEAS-Anpassungsgesetz, in Kraft seit 12.06.2026. Paragraphenangaben zum neuen nationalen Recht vor dienstlicher Verwendung stets gegen die aktuelle Gesetzesfassung und die Erlasslage des SMI prüfen. Personenbezogene Daten nur im Unterlagen-Assistenten und nur auf dienstlich zugelassenen Geräten erfassen; erzeugte Unterlagen sind Entwürfe, maßgeblich sind die amtlichen Vordrucke."},"kapitel":[{"id":"grundlagen","titel":"GEAS – Überblick","icon":"globe.europe.africa","kurz":"Was ist die GEAS-Reform, welche Rechtsakte gibt es und seit wann gelten sie?","abschnitte":[{"titel":"Worum geht es?","text":"Das Gemeinsame Europäische Asylsystem (GEAS) ist der europäische Rechtsrahmen für Asyl, Zuständigkeit, Aufnahme und Rückkehr. Mit der **GEAS-Reform 2024** hat die EU das System grundlegend neu gefasst. Die meisten Rechtsakte sind **Verordnungen** – sie gelten in Deutschland **unmittelbar**, ohne dass es eines deutschen Gesetzes bedarf.\n\nDie neuen Regeln gelten seit dem **12. Juni 2026**. Deutschland hat sein nationales Recht mit dem **GEAS-Anpassungsgesetz** und dem **GEAS-Anpassungsfolgegesetz** angepasst (Bundestag 27.02.2026, Bundesrat 27.03.2026, verkündet Ende April 2026). Geändert wurden vor allem AsylG, AufenthG und AsylbLG."},{"titel":"Die Rechtsakte der Reform","text":"• **Screening-VO** – VO (EU) 2024/1356: Überprüfung von Drittstaatsangehörigen (Identität, Gesundheit, Vulnerabilität, Sicherheit)\n• **Eurodac-VO** – VO (EU) 2024/1358: biometrische Datenbank (Fingerabdrücke + Gesichtsbild)\n• **AMM-VO** – VO (EU) 2024/1351: Asyl- und Migrationsmanagement, Zuständigkeit (Nachfolger der Dublin-III-VO), Solidarität\n• **Asylverfahrens-VO (AVVO)** – VO (EU) 2024/1348: einheitliches Asylverfahren inkl. Grenzverfahren\n• **Rückkehr-Grenzverfahrens-VO** – VO (EU) 2024/1349\n• **Krisen-VO** – VO (EU) 2024/1359: Krisen und höhere Gewalt\n• **Anerkennungs-VO** – VO (EU) 2024/1347: Voraussetzungen für internationalen Schutz\n• **Aufnahme-RL** – RL (EU) 2024/1346: Aufnahmebedingungen (national umgesetzt)\n• **Neuansiedlungs-VO** – VO (EU) 2024/1350: Resettlement\n\nDie **Rückführungsrichtlinie 2008/115/EG** bleibt bis auf Weiteres Grundlage des nationalen Rückkehrrechts (AufenthG)."},{"titel":"Der Weg einer Person durch das neue System","text":"1. **Aufgriff / Ankunft** – an der Außengrenze oder im Inland (z. B. bei einer Kontrolle in Leipzig)\n2. **Screening** – Identität, Gesundheit, Vulnerabilität, Sicherheit, Eurodac\n3. **Weiterleitung** – ins Asylverfahren (regulär, beschleunigt oder Grenzverfahren) oder ins Rückkehrverfahren\n4. **Zuständigkeitsprüfung** nach AMM-VO – ggf. Überstellung in den zuständigen Mitgliedstaat\n5. **Asylentscheidung** durch das BAMF – bei Ablehnung zugleich **Rückkehrentscheidung**\n6. **Rückkehr** – freiwillig oder zwangsweise (Abschiebung) – hier liegt der Schwerpunkt der Landespolizei"},{"titel":"Was ändert sich für die Polizei vor Ort?","text":"• **Screening im Inland**: Wer unerlaubt aufhältig angetroffen wird und noch nicht an einer Außengrenze überprüft wurde, ist grundsätzlich zu überprüfen (max. 3 Tage). Nach § 71 Abs. 4a AufenthG sind hierfür u. a. die **Polizeien der Länder** zuständig; die konkrete Aufgabenverteilung regelt das Landesrecht.\n• **Eurodac** erfasst nun bereits ab **6 Jahren** Fingerabdrücke **und** Gesichtsbild.\n• **Neue Haftformen**: u. a. Überprüfungshaft (Screening), Asylverfahrenshaft (§§ 69 ff. AsylG), Überstellungshaft (Art. 44 AMM-VO).\n• **Sekundärmigrationszentren** für Personen, für die ein anderer Mitgliedstaat zuständig ist – in Sachsen seit 01.07.2026 in Dresden.\n• Klassische Rückführung (Abschiebung, Abschiebungshaft, Ausreisegewahrsam) bleibt im AufenthG geregelt."}],"merke":["Stichtag: 12.06.2026 – seitdem gelten GEAS-Verordnungen unmittelbar.","EU-Verordnungen gehen nationalem Recht vor; das AufenthG/AsylG ergänzt und konkretisiert.","Die Landespolizei ist vor allem bei Aufgriff, Screening im Inland, Festnahme und Vollzug von Rückführungen gefordert."],"beispiele":[{"text":"Am 20.07.2026 trifft eine Streife einen syrischen Staatsangehörigen an, der am Vortag ohne Kontrolle über die tschechische Grenze gekommen ist. Für ihn gelten die GEAS-Verordnungen unmittelbar – vor allem die Screening-VO (Überprüfung) und die Eurodac-VO (Fingerabdrücke)."}]},{"id":"screening","titel":"Screening","icon":"person.text.rectangle","kurz":"Überprüfung nach der Screening-VO – an der Außengrenze und im Inland.","abschnitte":[{"titel":"Wer wird überprüft?","text":"• Personen, die die **EU-Außengrenze unerlaubt überschritten** haben (Aufgriff im Grenzzusammenhang)\n• Personen, die an der Außengrenze (auch Flughafen/Seehafen) **internationalen Schutz beantragen**, ohne die Einreisevoraussetzungen zu erfüllen\n• Nach **Seenotrettung** ausgeschiffte Personen\n• **Im Inland**: Drittstaatsangehörige, die sich **unerlaubt** im Hoheitsgebiet aufhalten, wenn es keine Anhaltspunkte gibt, dass sie bereits an der Außengrenze überprüft wurden (Art. 7 Screening-VO)"},{"titel":"Inhalt des Screenings","text":"• **Identifizierung/Identitätsprüfung** – Dokumente, Datenbankabgleich\n• **Vorläufige Gesundheitskontrolle** – durch die nach Landesrecht zuständigen Gesundheitsbehörden\n• **Vorläufige Vulnerabilitätsprüfung** – z. B. Minderjährige, Schwangere, Opfer von Menschenhandel, Folter, Behinderung\n• **Sicherheitsprüfung** – Abgleich u. a. SIS, Europol- und nationale Datenbanken (Interpol derzeit keine Abfrage)\n• **Erfassung biometrischer Daten** in Eurodac\n• Ausfüllen des **Überprüfungsformulars** (Screening-Formular)"},{"titel":"Dauer und Rechtsgrundlagen (national)","text":"• Außengrenze: höchstens **7 Tage** (Art. 8 Screening-VO; national § 14a AufenthG – Zuständigkeit an Flug- und Seehäfen i. d. R. Bundespolizei)\n• Inland: höchstens **3 Tage** (Art. 8 Abs. 4 Screening-VO; national § 15b AufenthG)\n• Die Person ist zur Durchführung **festzuhalten** und an einen geeigneten Ort zu **verbringen**, wenn die Überprüfung sonst nicht oder nur unter erheblichen Schwierigkeiten möglich ist.\n• **Freilassen**, wenn nicht **bis zum Ende des Tages nach dem Ergreifen** eine **richterliche Entscheidung** über die Fortdauer vorliegt (Art. 104 GG).\n• Zuständigkeit: § 71 Abs. 4a AufenthG – Polizeien der Länder sowie weitere nach Landesrecht bestimmte Behörden (z. B. Ausländerbehörden, Aufnahmeeinrichtungen). **Die sächsische Aufgabenverteilung (Zuständigkeitsverordnung/Erlass SMI) beachten.**"},{"titel":"Information, Mitwirkung, Minderjährige","text":"• **Information (Art. 11):** Die Person ist in einer Sprache, die sie versteht, zu informieren über Zweck, Dauer und Ablauf des Screenings, ihre Rechte und Pflichten, das Recht, Asyl zu beantragen, Einreise- und Rückkehrregeln sowie den Datenschutz.\n• **Mitwirkung (Art. 9):** Die Person muss erreichbar bleiben, mitwirken, wahrheitsgemäße Angaben machen und die Aufnahme biometrischer Daten dulden. Fehlende Mitwirkung wird im Formular mit Begründung vermerkt.\n• **Minderjährige (Art. 13):** Kindeswohl vorrangig; kindgerechte Durchführung; bei unbegleiteten Minderjährigen ist unverzüglich eine Vertretung zu bestellen (Jugendamt).\n• **Überprüfungsformular (Art. 17):** Personalien, Sprachen, Wohnsitzstaaten, Gründe der Einreise, Reiseweg mit Ausgangs- und Transitstaaten, Hinweise auf Schleusung, Dokumente, Familienangehörige in der EU, Asylantrag und Mitwirkung. Ergebnisse der Sicherheitskontrolle gehören nicht in die Unterlagen für die Person."},{"titel":"Ergebnis des Screenings","text":"Das Screening endet mit der **Weiterleitung**:\n• ins **Asylverfahren** (regulär oder Grenzverfahren), wenn ein Antrag auf internationalen Schutz gestellt wurde,\n• ins **Zuständigkeitsverfahren** (AMM-VO), wenn ein anderer Mitgliedstaat zuständig sein könnte,\n• ins **Rückkehrverfahren**, wenn kein Schutzantrag gestellt wurde und kein Aufenthaltsrecht besteht.\n\nWichtig: Während des Screenings **bleibt das Recht, Asyl zu beantragen**, unberührt. Ein Asylgesuch ist aufzunehmen und weiterzugeben."},{"titel":"Sonderfälle","text":"• **Visum abgelaufen / 90 Tage überschritten** (z. B. vietnamesische Person mit Besuchsvisum): kontrollierte Einreise → **kein Screening**; unerlaubter Aufenthalt, Rückkehrverfahren über die Ausländerbehörde. Nachweis auch ohne Pass über **VIS/EES** möglich.\n• **Wiedereinreise nach Abschiebung oder Ausreise** (z. B. Syrer, 2025 abgeschoben, jetzt ohne Kontrolle zurück): neuer unerlaubter Grenzübertritt → **Screening**; zusätzlich Einreise- und Aufenthaltsverbot (§ 11 AufenthG), Straftat nach § 95 Abs. 2 Nr. 1 AufenthG, ggf. Folgeantrag.\n• **Überstellung in einen anderen EU-Staat und Rückkehr** (z. B. nach Italien überstellt, wieder in Leipzig): Schengen-Raum nie verlassen → **kein erneutes Screening**; AMM-Verfahren, Überstellungsfrist beachten.\n• **Titel eines anderen Schengen-Staates**, länger als 90 Tage in Deutschland: **kein Screening**; Rückkehr in den Ausstellerstaat.\n• **In Deutschland geborene Kinder** unerlaubt aufhältiger Eltern: nie eingereist → **kein Screening**.\n• **Ausreise unklar**: sofort mit der Ausländerbehörde klären; bis dahin als bekannte Person behandeln."},{"titel":"Praxis PD Leipzig","text":"• Unerlaubt Aufhältige werden in Leipzig häufig bei Verkehrs-, Bahnhofs- oder Personenkontrollen angetroffen. Vor Einleitung eines Screenings **Eurodac-/INPOL-/AZR-Abfrage** – entbehrlich ist das Screening i. d. R. bei AZR mit Screening-Vermerk, INPOL mit ED-Behandlung und Asylantrag oder bekanntem unerlaubtem Aufenthalt in Deutschland, nicht schon bei jeder früheren Registrierung.\n• **Minderjährige** und **Vulnerable** frühzeitig erkennen und dokumentieren (Jugendamt bei UMA).\n• **Sprachmittlung** sicherstellen; Belehrung in einer verständlichen Sprache.\n• Fristen strikt überwachen: Bei Festhalten **unverzüglich** die richterliche Entscheidung herbeiführen; ohne Anordnung Freilassung spätestens mit Ende des Folgetages."}],"merke":["Inland: max. 3 Tage, Außengrenze: max. 7 Tage.","Festhalten: richterliche Entscheidung unverzüglich herbeiführen – ohne Anordnung spätestens mit Ende des Folgetages freilassen.","Screening ist kein Asylverfahren – Asylgesuche bleiben jederzeit möglich."],"beispiele":[{"titel":"Screening","text":"Ein Mann ohne Papiere wird in der Innenstadt kontrolliert. INPOL, AZR und Fast-ID ohne Treffer, er sei vor zwei Tagen über Serbien und Ungarn gekommen. Unerlaubter Grenzübertritt ohne Kontrolle an der Außengrenze → Screening im Inland, höchstens 3 Tage ab Aufgriff."},{"titel":"Kein Screening","text":"Eine Frau ist mit einem Schengen-Visum eingereist, das gestern abgelaufen ist. Sie wurde an der Außengrenze kontrolliert → kein Screening, sondern Rückkehrverfahren über die Ausländerbehörde."}]},{"id":"eurodac","titel":"Eurodac & Identität","icon":"touchid","kurz":"Biometrische Erfassung, Speicherfristen, Identitätsfeststellung.","abschnitte":[{"titel":"Neues Eurodac","text":"• Erfassung von **Fingerabdrücken und Gesichtsbild**\n• Erfassung bereits **ab 6 Jahren** (bisher 14)\n• Zusätzliche Kategorien, u. a. unerlaubt Aufhältige, nach Seenotrettung Ausgeschiffte, Resettlement, vorübergehender Schutz\n• Speicherdauer u. a.: Antragstellende **10 Jahre**, irreguläre Einreise/unerlaubter Aufenthalt **5 Jahre**\n• **Sicherheitskennzeichnung**, wenn die Person eine Gefahr für die innere Sicherheit darstellen könnte\n• Eurodac wird mit anderen EU-Informationssystemen interoperabel"},{"titel":"Identitätsfeststellung im AufenthG/AsylG","text":"• **§ 49 AufenthG** – Überprüfung, Feststellung und Sicherung der Identität; erkennungsdienstliche Maßnahmen\n• **§ 16 AsylG** – Sicherung der Identität bei Asylsuchenden (ED-Behandlung)\n• **§ 48 AufenthG** – Ausweispflichten; bei fehlendem Pass Mitwirkungspflicht und **Durchsuchung nach Identitätsdokumenten** sowie Auswertung von **Datenträgern** unter den dort genannten Voraussetzungen\n• **§ 48 Abs. 3a Satz 2 AufenthG** – Pflicht, Zugangsdaten zur Verfügung zu stellen; **§ 48a AufenthG** – Auskunft über Zugangsdaten beim Telekommunikationsanbieter, wenn die Person sie nicht herausgibt\n\nBei Kindern: altersgerecht, kindgerecht und in Anwesenheit einer Vertrauensperson/eines Vertreters vorgehen."},{"titel":"Praxistipps","text":"• Vor jeder Maßnahme prüfen: **AZR, INPOL, SIS, Eurodac** (über die vorhandenen Fahndungs-/ED-Systeme)\n• Widersprüchliche Personalien immer als **Aliaspersonalien** dokumentieren\n• Mobiltelefone nicht ohne Rechtsgrundlage auslesen oder auswerten: Auslesen nur ohne gültigen Pass/Identitätsnachweis (§ 48 Abs. 3a AufenthG); Auswerten nur, wenn kein milderes Mittel reicht, und nur durch Bedienstete mit Befähigung zum Richteramt (§ 48 Abs. 3b AufenthG)\n• Dokumente in Verwahrung nehmen und Bescheinigung aushändigen – ohne Asylgesuch bei Ausreisepflichtigen § 50 Abs. 5 AufenthG (→ Ausländerbehörde), mit Asylgesuch § 21 Abs. 1 AsylG"}],"merke":["Eurodac ab 6 Jahren – Fingerabdrücke + Gesichtsbild.","Aliaspersonalien vollständig dokumentieren.","Datenträger: Auslesen nur nach § 48 Abs. 3a, Auswerten nur nach § 48 Abs. 3b AufenthG (Bedienstete mit Befähigung zum Richteramt)."],"beispiele":[{"text":"Die Fast-ID ergibt einen Eurodac-Treffer aus Österreich in der Kategorie Asyl: Die Person hat dort schon Asyl beantragt. Den Treffer dokumentieren – er ist für die Zuständigkeitsprüfung nach der AMM-VO wichtig. Fingerabdrücke werden ab 6 Jahren genommen: ein 7-jähriges Kind ja, bei einem 5-jährigen nur ein Lichtbild."}]},{"id":"asylverfahren","titel":"Asylverfahren","icon":"doc.text.magnifyingglass","kurz":"Antrag stellen, registrieren, förmlich stellen – regulär, beschleunigt, Grenzverfahren.","abschnitte":[{"titel":"Asylgesuch bei der Polizei","text":"Wer gegenüber der Polizei um Schutz nachsucht (auch nur sinngemäß, z. B. „Asyl“, „Protection“, Angst vor Rückkehr), hat einen **Antrag auf internationalen Schutz gestellt** (Stufe „Stellen“ nach AVVO). Die Polizei zählt zu den Behörden, bei denen Anträge wahrscheinlich gestellt werden, und muss:\n• das Gesuch **aufnehmen und dokumentieren**,\n• die Person über das weitere Verfahren **informieren** (wo und wie förmlich stellen),\n• die Person an die **zuständige Aufnahmeeinrichtung** bzw. das BAMF **weiterleiten** (vgl. § 19 AsylG) und\n• ggf. **erkennungsdienstlich behandeln** (§ 16 AsylG).\n\nDie Polizei **prüft das Asylgesuch nicht inhaltlich**."},{"titel":"Drei Stufen nach der Asylverfahrens-VO","text":"1. **Stellen** (making) – Äußerung des Schutzwunsches gegenüber einer Behörde\n2. **Registrieren** – grundsätzlich innerhalb von **5 Tagen** (bei vielen Anträgen bis 15 Tage)\n3. **Förmlich stellen** (lodging) – grundsätzlich innerhalb von **21 Tagen** nach Registrierung beim BAMF\n\nMit der Antragstellung entsteht grundsätzlich ein **Recht auf Verbleib** bis zur Entscheidung (Ausnahmen u. a. bei bestimmten Folgeanträgen)."},{"titel":"Verfahrensarten","text":"• **Reguläres Verfahren** – Entscheidung grundsätzlich binnen **6 Monaten**\n• **Beschleunigtes Verfahren** – u. a. bei Täuschung über Identität, sicherem Herkunftsstaat, Gefahr für die Sicherheit, Herkunftsland mit **EU-weiter Anerkennungsquote ≤ 20 %**; Entscheidung binnen **3 Monaten**\n• **Grenzverfahren** – an der Außengrenze (in Deutschland v. a. Flughäfen), Dauer höchstens **12 Wochen** einschließlich Rechtsbehelf; verpflichtend u. a. bei Täuschung, Sicherheitsgefahr und Anerkennungsquote ≤ 20 %. Unbegleitete Minderjährige grundsätzlich nur bei Sicherheitsgefahr.\n• **Folgeantrag** – neuer Antrag nach bestandskräftiger Ablehnung; Recht auf Verbleib kann eingeschränkt sein"},{"titel":"Ablehnung = Rückkehrentscheidung","text":"Wird ein Antrag abgelehnt, ergeht nach der AVVO **zugleich eine Rückkehrentscheidung** (in Deutschland: Abschiebungsandrohung durch das BAMF). Damit verzahnen sich Asyl- und Rückkehrverfahren enger als bisher."},{"titel":"Aufenthaltsrechtliche Stellung während des Verfahrens","text":"• **Aufenthaltsgestattung** (§ 55 AsylG) – Nachweis: Ankunftsnachweis bzw. Bescheinigung über die Aufenthaltsgestattung\n• **Wohnverpflichtung** in der Aufnahmeeinrichtung (§ 47 AsylG)\n• **Räumliche Beschränkung** (§ 56 AsylG) – Verstöße: § 86 AsylG (OWi), wiederholt § 85 AsylG (Straftat)\n• **Asylverfahrenshaft** (§§ 69–70a AsylG) – nur durch **richterliche Anordnung**, nur wenn verhältnismäßig und kein milderes Mittel (z. B. Meldeauflage, Sicherheitsleistung) ausreicht"}],"merke":["Jedes erkennbare Schutzersuchen ist ein Asylgesuch – aufnehmen, dokumentieren, weiterleiten.","Die Polizei prüft keine Asylgründe.","Grenzverfahren: max. 12 Wochen. Beschleunigt: 3 Monate. Regulär: 6 Monate."],"beispiele":[{"text":"Während der Kontrolle sagt eine Person auf Arabisch, sie habe Angst, nach Syrien zurückzumüssen. Das ist ein Asylgesuch – auch ohne das Wort „Asyl“. Wortlaut notieren, Belehrung nach §§ 15, 20 AsylG, Weiterleitung an die Aufnahmeeinrichtung."}]},{"id":"zustaendigkeit","titel":"Zuständigkeit & Überstellung (AMM-VO)","icon":"arrow.left.arrow.right.circle","kurz":"Nachfolger von Dublin III: Wer ist zuständig, wie wird überstellt, Sekundärmigrationszentrum.","abschnitte":[{"titel":"Grundprinzip","text":"Für jeden Antrag auf internationalen Schutz ist **genau ein Mitgliedstaat** zuständig. Die Kriterien stehen in einer festen Rangfolge in der AMM-VO (VO 2024/1351), u. a.:\n• Familienangehörige / unbegleitete Minderjährige\n• Aufenthaltstitel oder Visum\n• **Bildungsabschluss** eines Mitgliedstaates (neues Kriterium)\n• **Irreguläre Einreise** – der Ersteinreisestaat bleibt nun **20 Monate** zuständig (bisher 12); nach Seenotrettung 12 Monate\n\nNicht zuständige Staaten müssen – außer einem menschenwürdigen Existenzminimum – keine Aufnahmeleistungen gewähren."},{"titel":"Überstellungsfristen","text":"• Regelfrist: **6 Monate** ab Zustimmung/Bestätigung des zuständigen Mitgliedstaates\n• Verlängerung auf bis zu **1 Jahr**, wenn die Person inhaftiert ist\n• Verlängerung auf bis zu **3 Jahre**, wenn die Person **flüchtig** ist oder sich der Überstellung entzieht (bisher 18 Monate)\n\nFür Wiederaufnahmen gibt es statt eines Gesuchs eine **Wiederaufnahmemitteilung**, die der andere Staat nur noch bestätigt."},{"titel":"Überstellungshaft","text":"Rechtsgrundlage ist nun **Art. 44 Abs. 2 AMM-VO** (bisher Art. 28 Dublin III). Voraussetzung ist insbesondere **Fluchtgefahr** im Sinne von Art. 2 Nr. 18 AMM-VO (Vermutungen und Anhaltspunkte: § 2 Abs. 14 AufenthG i. V. m. § 62 Abs. 3a, 3b) bzw. eine Gefahr für die öffentliche Sicherheit; Haft nur so kurz wie möglich, nach Einzelfallprüfung und durch richterliche Anordnung. Das Verfahren (Antrag, Anhörung) richtet sich weiterhin nach dem FamFG; ergänzend gelten die nationalen Vorschriften des AufenthG."},{"titel":"Sekundärmigrationszentrum Sachsen","text":"Die **Landesdirektion Sachsen** betreibt seit dem **01.07.2026** ein **Sekundärmigrationszentrum** in **Dresden** (Standort des früheren Landesausreisezentrums).\n• Unterbringung von Personen, die in einen anderen EU-Staat **zu überstellen** sind, weil Deutschland nicht zuständig ist\n• bis zu **400 Plätze**, auch für Familien\n• Aufenthalt höchstens **24 Monate**, bei Familien mit minderjährigen Kindern höchstens **12 Monate**\n• Förderung der freiwilligen Ausreise\n\nFür die Polizei relevant: **Verlassen/Entziehen** kann Anlass für Fahndung/Aufenthaltsermittlung und Haftanträge sein – Maßnahmen immer in Abstimmung mit der LDS."}],"merke":["Überstellungsfrist 6 Monate – bei Flucht bis 3 Jahre, bei Haft bis 1 Jahr.","Ersteinreisestaat bleibt 20 Monate zuständig.","Sekundärmigrationszentrum Dresden seit 01.07.2026 (LDS)."],"beispiele":[{"text":"Eurodac zeigt: Die Person wurde vor drei Monaten bei der unerlaubten Einreise in Kroatien erfasst und stellt nun in Leipzig ein Asylgesuch. Ob Kroatien zuständig ist, prüft das BAMF nach der AMM-VO – die Streife dokumentiert den Treffer und leitet weiter."}]},{"id":"rueckfuehrung","titel":"Ausreisepflicht & Abschiebung","icon":"airplane.departure","kurz":"Vom vollziehbar Ausreisepflichtigen bis zur Übergabe am Flughafen.","abschnitte":[{"titel":"Voraussetzungen der Abschiebung (§ 58 AufenthG)","text":"Abgeschoben werden darf, wer\n• **ausreisepflichtig** ist (§ 50 AufenthG – kein erforderlicher Aufenthaltstitel),\n• dessen Ausreisepflicht **vollziehbar** ist,\n• dessen **Ausreisefrist abgelaufen** ist (bzw. keine gewährt wurde) und\n• dessen freiwillige Erfüllung **nicht gesichert** ist oder dessen Überwachung erforderlich ist.\n\nIn der Regel ist die Abschiebung zuvor **angedroht** (§ 59 AufenthG, Ausreisefrist grundsätzlich 7–30 Tage). Der **Termin der Abschiebung darf nicht angekündigt** werden (§ 59 Abs. 1 Satz 8 AufenthG)."},{"titel":"Hindernisse erkennen","text":"• **Abschiebungsverbote** (§ 60 AufenthG) – z. B. Flüchtlingseigenschaft, Gefahr nach Art. 3 EMRK, erhebliche konkrete Gefahr für Leib, Leben oder Freiheit\n• **Duldung** (§ 60a AufenthG) – vorübergehende Aussetzung; eine gültige Duldung schließt die Abschiebung aus, solange sie nicht widerrufen/erloschen ist\n• **Reisefähigkeit**: gesetzliche Vermutung, dass gesundheitliche Gründe nicht entgegenstehen (§ 60a Abs. 2c AufenthG); Ausnahme bei **qualifizierter ärztlicher Bescheinigung**. Neue akute Beschwerden im Einsatz dennoch **immer ärztlich klären lassen**.\n• **Asyl-/Folgeantrag** während der Maßnahme – aufnehmen, sofort an die zuständige Ausländerbehörde melden; **die Entscheidung über den Fortgang trifft die Ausländerbehörde**, nicht die Einsatzkraft.\n• **Eilantrag beim Verwaltungsgericht** – Rückmeldung der Ausländerbehörde abwarten"},{"titel":"Rolle der Landespolizei (§ 71 Abs. 5 AufenthG)","text":"Die Polizeien der Länder sind **auch zuständig** für\n• die **Zurückschiebung**,\n• die Durchsetzung der Verlassenspflicht,\n• die **Durchführung der Abschiebung** sowie\n• – soweit zur Vorbereitung und Sicherung erforderlich – die **Festnahme** und die **Beantragung der Haft**.\n\nIn Sachsen wird die Abschiebung von der **Zentralen Ausländerbehörde (ZAB) der Landesdirektion Sachsen** organisiert. Die Polizei leistet regelmäßig **Vollzugshilfe** (SächsPVDG): Die ersuchende Behörde verantwortet die **Rechtmäßigkeit der Maßnahme**, die Polizei die **Art und Weise der Durchführung**."},{"titel":"Betreten und Durchsuchen (§ 58 Abs. 5–10 AufenthG)","text":"• **Betreten** der Wohnung zur Ergreifung, wenn Tatsachen vorliegen, dass sich die Person dort befindet (Abs. 5). In Gemeinschaftsunterkünften dürfen dabei auch **andere Räumlichkeiten** betreten werden.\n• **Durchsuchung** der Wohnung zur Ergreifung (Abs. 6) – nur auf **richterliche Anordnung**, bei **Gefahr im Verzug** auch durch die die Abschiebung durchführende Behörde (Abs. 8).\n• **Nachtzeit**: Betreten/Durchsuchen nur, wenn Tatsachen die Annahme rechtfertigen, dass die Ergreifung sonst **vereitelt** würde (Abs. 7). Die Organisation der Abschiebung allein ist **kein** solcher Grund – es sei denn, es handelt sich um Bedingungen, die die durchführende Behörde nicht beeinflussen kann (§ 58 Abs. 7 Satz 2 AufenthG).\n• Die richterliche Durchsuchungsanordnung ist **mitzuführen** bzw. zu **eröffnen**; Protokoll über Durchsuchung anfertigen."},{"titel":"Ablauf einer Rückführung (vereinfacht, Sachsen)","text":"1. **Ersuchen** der ZAB/LDS an die Polizei (Vollzugshilfe) mit Personen-, Gefährdungs- und Fluginformationen\n2. **Einsatzplanung** – Lage, Kräfte (inkl. weiblicher Kräfte), Sprachmittlung, Arzt, Jugendamt bei Kindern, Transport\n3. **Zugriff** – i. d. R. frühmorgens; Belehrung, Eröffnung der Maßnahme, Zeit zum Packen\n4. **Durchsuchung** der Person (Eigensicherung) und des Gepäcks; Dokumente, Medikamente, Bargeld sichern\n5. **Transport** – zum Flughafen (häufig **Leipzig/Halle**), zur Abschiebungshafteinrichtung **Dresden** oder zur Übergabestelle\n6. **Übergabe** an die **Bundespolizei** (Flughafen, Luftweg) bzw. an die Grenzbehörde\n7. **Dokumentation** – Einsatzbericht, Zwangsanwendung, Verletzungen, Besonderheiten; Rückmeldung an die LDS"}],"merke":["Rechtmäßigkeit der Abschiebung verantwortet die Ausländerbehörde, die Art der Durchführung die Polizei.","Abschiebungstermin nie ankündigen.","Durchsuchung der Wohnung: Richtervorbehalt; Nachtzeit nur bei drohender Vereitelung.","Bei Asylgesuch, Krankheit, Suizidalität: sofort Rücksprache mit der ZAB/LDS."],"beispiele":[{"text":"Ein Albaner bleibt nach den 90 visumfreien Tagen weiter in Leipzig, eine Ausreisefrist hat er nicht. Er ist vollziehbar ausreisepflichtig. Die Streife sichert Pass und Identität und unterrichtet die Ausländerbehörde; die Abschiebung organisiert die zuständige Behörde."}]},{"id":"haft","titel":"Festnahme & Haft","icon":"lock.shield","kurz":"Abschiebungshaft, Ausreisegewahrsam, vorläufige Ingewahrsamnahme, neue GEAS-Haftformen.","abschnitte":[{"titel":"Grundsätze","text":"• Freiheitsentziehung nur durch den **Richter** (Art. 104 GG) – bei Abschiebungshaft das **Amtsgericht** (FamFG)\n• Haft ist **unzulässig**, wenn der Zweck durch ein **milderes Mittel** erreicht werden kann (§ 62 Abs. 1 AufenthG)\n• **Minderjährige und Familien mit Minderjährigen** werden grundsätzlich nicht in Abschiebungshaft genommen (§ 62 Abs. 1 Satz 3 AufenthG)\n• Unverzügliche **Belehrung** und Benachrichtigung (Konsulat auf Wunsch, Angehörige, Rechtsbeistand)"},{"titel":"Haftarten im AufenthG","text":"• **Vorbereitungshaft** (§ 62 Abs. 2) – bis **6 Wochen**, wenn über eine Ausweisung/Abschiebungsanordnung nicht sofort entschieden werden kann\n• **Sicherungshaft** (§ 62 Abs. 3) – bei Fluchtgefahr u. a.; bis **6 Monate**, Verlängerung um bis zu **12 Monate** (max. 18)\n• **Ausreisegewahrsam** (§ 62b) – bis **28 Tage**, im Transitbereich eines Flughafens oder in einer Unterkunft mit Ausreisemöglichkeit\n• **Mitwirkungshaft** (§ 62 Abs. 6) – zur Vorführung bei Botschaft/Arzt, bis 14 Tage\n• **Ergänzende Vorbereitungshaft** (§ 62c)"},{"titel":"Vorläufige Ingewahrsamnahme (§ 62 Abs. 5 AufenthG)","text":"Die für den Haftantrag zuständige Behörde – auch die Polizei (§ 71 Abs. 5 AufenthG) – darf eine Person **ohne vorherige richterliche Anordnung** festhalten und vorläufig in Gewahrsam nehmen, wenn\n1. der **dringende Verdacht** für das Vorliegen der Voraussetzungen der Sicherungshaft besteht,\n2. die richterliche Entscheidung über die Anordnung der Sicherungshaft **nicht vorher eingeholt** werden kann und\n3. der **begründete Verdacht** vorliegt, dass sich die Person der Anordnung der Sicherungshaft **entziehen** will.\n\nDie Person ist **unverzüglich dem Richter** zur Entscheidung vorzuführen. Haftantrag in Abstimmung mit der zuständigen Ausländerbehörde."},{"titel":"Neue Haftformen seit GEAS","text":"• **Überprüfungshaft** – Screening an der Außengrenze (§ 14a AufenthG) und im Inland (§ 15b AufenthG); beim Festhalten unverzüglich die richterliche Entscheidung herbeiführen, ohne Anordnung Freilassung spätestens mit Ende des Folgetages\n• **Asylverfahrenshaft** – §§ 69–70a AsylG, nur auf richterliche Anordnung, Verhältnismäßigkeit/mildere Mittel\n• **Überstellungshaft** – Art. 44 Abs. 2 AMM-VO\n• **Haft im Rückkehr-Grenzverfahren** – Art. 5 VO 2024/1349\n\nDie genaue Ausgestaltung (Haftgründe, Höchstdauern) jeweils im Gesetzestext bzw. in der Erlasslage nachlesen."},{"titel":"Einrichtung in Sachsen","text":"Abschiebungshaft und Ausreisegewahrsam werden in Sachsen in der **Einrichtung zum Vollzug der Abschiebungshaft und des Ausreisegewahrsams in Dresden** (Zuständigkeit: Landesdirektion Sachsen) vollzogen – getrennt von Strafgefangenen (§ 62a AufenthG). Kapazität: 58 Plätze (24 Abschiebungshaft, 34 Ausreisegewahrsam; Stand der letzten Veröffentlichung, ggf. geändert)."}],"merke":["Kein Festhalten ohne Richter über das gesetzlich zulässige Maß hinaus.","Ausreisegewahrsam: max. 28 Tage.","Sicherungshaft: 6 Monate, max. 18 Monate.","Mildere Mittel immer zuerst prüfen und dokumentieren."],"beispiele":[{"text":"Eine vollziehbar ausreisepflichtige Person erklärt bei der Kontrolle, sie werde untertauchen. Ein Haftbeschluss liegt nicht vor, ein Richter ist vorher nicht zu erreichen. Festhalten nur, wenn alle drei Voraussetzungen des § 62 Abs. 5 AufenthG vorliegen – dann unverzüglich dem Richter vorführen."}]},{"id":"vulnerable","titel":"Besondere Personengruppen","icon":"figure.and.child.holdinghands","kurz":"UMA, Familien, Kranke, Schwangere, Opfer von Menschenhandel, Kirchenasyl.","abschnitte":[{"titel":"Unbegleitete Minderjährige (UMA)","text":"• Bei Zweifeln an der Volljährigkeit: **bis zur Klärung als minderjährig behandeln**\n• **Jugendamt** informieren – vorläufige Inobhutnahme (§ 42a SGB VIII)\n• Abschiebung nur, wenn sich die Behörde vergewissert hat, dass das Kind im Rückkehrstaat einem **Familienangehörigen, Personensorgeberechtigten oder einer geeigneten Aufnahmeeinrichtung übergeben** wird (§ 58 Abs. 1a AufenthG)\n• Eurodac-Erfassung ab 6 Jahren – kindgerecht, in Anwesenheit eines Vertreters"},{"titel":"Familien mit Kindern","text":"• Familientrennung vermeiden; Kinder möglichst **nicht Zeugen von Zwangsmaßnahmen** werden lassen\n• Kinder nicht als Dolmetscher einsetzen\n• Schulpflichtige Kinder: Zugriff nicht in Schule/Kita (Erlasslage beachten)\n• Kinderbetreuung, Verpflegung, Windeln, Medikamente einplanen"},{"titel":"Krankheit, Suizidalität, Schwangerschaft","text":"• **Reisefähigkeit** ist gesetzlich vermutet, aber: akute Erkrankung, Verletzung oder Suizidankündigung → **ärztliche Abklärung**, Rücksprache ZAB/LDS\n• Suizidgefahr: Person nicht unbeaufsichtigt lassen, gefährliche Gegenstände entfernen, Arzt hinzuziehen, dokumentieren\n• **Schwangerschaft**: im Mutterschutzzeitraum (6 Wochen vor bis 8 Wochen nach der Entbindung) regelmäßig keine Flugreisetauglichkeit – ärztlich klären\n• Medikamente für die Reise mitgeben, Arztberichte übergeben"},{"titel":"Opfer von Menschenhandel / Traumatisierte","text":"• Anzeichen: fremdbestimmte Personen, einbehaltene Papiere, Angst, Schulden gegenüber Schleusern\n• Fachdienststelle (Menschenhandel) und Beratungsstellen einbinden; Bedenk- und Stabilisierungsfrist (§ 59 Abs. 7 AufenthG) beachten\n• Auffälligkeiten (z. B. Verletzung, Hinweise auf Menschenhandel) im Vorgang notieren und bei der Übergabe mitteilen – die Vulnerabilitätsprüfung macht die zuständige Behörde"},{"titel":"Kirchenasyl","text":"Das Kirchenasyl ist **kein eigenständiges Rechtsinstitut**. In der Praxis wird es auf Grundlage einer Absprache zwischen BAMF und Kirchen (Härtefalldossier) in aller Regel **respektiert**. Maßnahmen in kirchlichen Räumen nur nach **ausdrücklicher Weisung** der Führung und in Abstimmung mit der LDS."}],"merke":["Zweifel am Alter → als minderjährig behandeln, Jugendamt informieren.","Neue gesundheitliche Beschwerden im Einsatz → Arzt + Rücksprache ZAB.","Kinder nie als Dolmetscher."],"beispiele":[{"text":"Ein 15-jähriger Afghane reist allein. Unbegleiteter Minderjähriger: Jugendamt sofort verständigen. Das Screening findet trotzdem statt – kindgerecht und im Beisein der Vertretung."}]},{"id":"strafrecht","titel":"Straf- und Bußgeldrecht","icon":"scalemass","kurz":"§§ 95–97 AufenthG, §§ 84–86 AsylG – typische Delikte bei Kontrollen.","abschnitte":[{"titel":"§ 95 AufenthG – typische Tatbestände","text":"• **Abs. 1 Nr. 1** – Aufenthalt ohne erforderlichen Pass/Passersatz\n• **Abs. 1 Nr. 2** – Aufenthalt ohne erforderlichen Aufenthaltstitel, vollziehbar ausreisepflichtig, Ausreisefrist abgelaufen und Abschiebung nicht ausgesetzt (keine Duldung)\n• **Abs. 1 Nr. 3** – **unerlaubte Einreise**\n• **Abs. 2 Nr. 1** – Einreise/Aufenthalt entgegen einem **Einreise- und Aufenthaltsverbot** (§ 11 AufenthG)\n• **Abs. 1 Nr. 5** – falsche Angaben/Verweigerung von Angaben (§ 49 AufenthG)\n\n**§ 95 Abs. 5 AufenthG**: Art. 31 Abs. 1 Genfer Flüchtlingskonvention bleibt unberührt (Straffreiheit bei unmittelbarer Einreise aus Verfolgerstaat und unverzüglicher Meldung)."},{"titel":"Schleusung","text":"• **§ 96 AufenthG** – Einschleusen von Ausländern (Vorteil, wiederholt/zugunsten mehrerer)\n• **§ 97 AufenthG** – Einschleusen mit Todesfolge; gewerbs- und bandenmäßiges Einschleusen\n• Geschleuste Personen sind **Zeugen** – Vernehmung und Beweissicherung (Handys, Fahrzeug, Bargeld) frühzeitig abstimmen"},{"titel":"AsylG","text":"• **§ 85 AsylG** – u. a. **wiederholter** Verstoß gegen die räumliche Beschränkung (§ 56)\n• **§ 86 AsylG** – erstmaliger Verstoß: **Ordnungswidrigkeit**\n• **§ 84 AsylG** – Verleiten zur missbräuchlichen Asylantragstellung"},{"titel":"Praxis","text":"• Strafverfahren hindert die Abschiebung grundsätzlich nicht, aber: bei erhobener Klage oder laufendem Ermittlungsverfahren ist das **Einvernehmen der Staatsanwaltschaft** erforderlich (§ 72 Abs. 4 Satz 1 AufenthG) – nicht bei geringem Strafverfolgungsinteresse, u. a. bei Verfahren nur nach § 95 AufenthG oder § 9 FreizügG/EU (Satz 3–5)\n• Beschuldigtenbelehrung **in verständlicher Sprache**, Dolmetscher (§ 187 GVG)\n• Aufenthaltsrechtlichen Status vor Einleitung eines Verfahrens nach § 95 prüfen (Duldung? Gestattung? Titel?)"}],"merke":["Geduldete machen sich nicht nach § 95 Abs. 1 Nr. 2 strafbar.","Laufendes Ermittlungsverfahren → Einvernehmen der StA vor Abschiebung (§ 72 Abs. 4) – entbehrlich bei geringem Strafverfolgungsinteresse, z. B. nur § 95 AufenthG.","Art. 31 GFK beachten (§ 95 Abs. 5)."],"beispiele":[{"titel":"Mit Visum eingereist","text":"Ein Tunesier reist mit gültigem Schengen-Visum ein und stellt eine Woche später ein Asylgesuch. Keine Anzeige wegen unerlaubter Einreise: Er hatte einen gültigen Titel. Erschlichen ist das Visum nur, wenn dafür Tatsachen feststehen (§ 95 Abs. 6 AufenthG)."},{"titel":"Ohne Visum eingereist","text":"Ein Marokkaner ohne Papiere und ohne Visum wird kurz nach dem Grenzübertritt angetroffen → Anzeige wegen unerlaubter Einreise und unerlaubten Aufenthalts (§ 95 AufenthG). Ob die Strafe wegen Art. 31 der Genfer Flüchtlingskonvention entfällt, entscheidet die Staatsanwaltschaft."}]},{"id":"sachsen","titel":"Zuständigkeiten in Sachsen","icon":"building.columns","kurz":"Wer macht was? LDS, ZAB, Ausländerbehörden, BAMF, Bundespolizei, PD Leipzig.","abschnitte":[{"titel":"Behörden im Überblick","text":"• **Landesdirektion Sachsen (LDS)** – obere Ausländerbehörde; Abteilung Asyl und Ausländerrecht\n• **Zentrale Ausländerbehörde (ZAB)** der LDS (Chemnitz) – Erstaufnahme, Verteilung, **aufenthaltsbeendende Maßnahmen**/Organisation der Abschiebungen\n• **Untere Ausländerbehörden** – im Bereich der PD Leipzig: **Stadt Leipzig**, **Landkreis Leipzig**, **Landkreis Nordsachsen**\n• **BAMF** – Asylverfahren, Zuständigkeitsverfahren (AMM-VO), Abschiebungsandrohung\n• **Bundespolizei** – Grenzschutz, Flughäfen (u. a. **Leipzig/Halle**), Rückführungen auf dem Luftweg, Screening an der Außengrenze\n• **Polizei Sachsen / PD Leipzig** – Aufgriff, Screening im Inland (nach Landesrecht), Festnahme, Haftantrag, Vollzugshilfe bei Abschiebungen, Strafverfolgung\n• **Amtsgerichte** – Haftanordnungen (FamFG), Durchsuchungsanordnungen\n• **Verwaltungsgerichte** – Eilrechtsschutz gegen Abschiebung (für Leipzig: VG Leipzig)\n• **SMI** – Fach- und Rechtsaufsicht, Erlasse"},{"titel":"Einrichtungen","text":"• **Erstaufnahmeeinrichtungen** der LDS (aktuelle Standorte und Zuweisung laut Erlasslage)\n• **Sekundärmigrationszentrum Dresden** – seit 01.07.2026\n• **Abschiebungshaft/Ausreisegewahrsam Dresden**\n• **Flughafen Leipzig/Halle** – Sammel- und Einzelrückführungen, Übergabe an die Bundespolizei"},{"titel":"Rechtsgrundlagen Sachsen","text":"• **SächsPVDG** – Sächsisches Polizeivollzugsdienstgesetz (Befugnisse, Vollzugshilfe, unmittelbarer Zwang). Der Landtag hat am **24.06.2026** eine Novelle beschlossen (u. a. Quellen-TKÜ, Drohnen, Distanz-Elektroimpulsgeräte ab 2027).\n• **SächsAAZuVO** – Sächsische Aufenthalts- und Asylzuständigkeitsverordnung (Zuständigkeiten der Ausländerbehörden)\n• Erlasse und Verwaltungsvorschriften des SMI sowie Dienstanweisungen der PD Leipzig (im Intranet der Polizei Sachsen)"}],"merke":["ZAB der LDS organisiert Abschiebungen – Polizei leistet Vollzugshilfe.","Luftweg und Flughafen: Bundespolizei.","Eilrechtsschutz: VG – Rückmeldung immer über die Ausländerbehörde."],"beispiele":[{"text":"Die Streife weiß nicht, welche Ausländerbehörde zuständig ist. Im AZR steht die zuständige Behörde – z. B. die Zentrale Ausländerbehörde der Landesdirektion Sachsen oder die Ausländerbehörde einer Stadt. Außerhalb der Geschäftszeiten über die eigene Führung abstimmen."}]},{"id":"einsatzpraxis","titel":"Einsatzpraxis & Eigensicherung","icon":"shield.lefthalf.filled","kurz":"Kommunikation, Zwang, Dokumentation, Deeskalation.","abschnitte":[{"titel":"Kommunikation","text":"• Ruhig, respektvoll, klar – Maßnahme **eröffnen** und **begründen**\n• **Sprachmittler** (Präsenz oder Telefon-/Videodolmetschen) – keine Mitbewohner oder Kinder\n• Einfache Sprache, kurze Sätze; Verständnis rückfragen\n• Betreuende Personen (Anwalt, Beratungsstelle) höflich, aber bestimmt auf den Ablauf hinweisen"},{"titel":"Eigensicherung","text":"• Vorab Informationen der ZAB auswerten: Gewaltbereitschaft, Waffen, Vorstrafen, psychische Erkrankungen, ansteckende Krankheiten, Tiere\n• Durchsuchung der Person vor Transport; Gegenstände zur Selbstverletzung entfernen\n• Fesselung nur bei konkreter Gefahr (Flucht, Widerstand, Selbstverletzung) – **verhältnismäßig** und dokumentiert\n• Proteste vor Unterkünften einkalkulieren – Kräfte, Zufahrt, Abfahrt planen"},{"titel":"Unmittelbarer Zwang","text":"• Grundlage: SächsPVDG bzw. Vollzugsrecht der Ausländerbehörde – **Androhung**, **mildestes Mittel**, **Verhältnismäßigkeit**\n• Kein Zwang zur Verabreichung von Medikamenten (nur ärztlich, eigene Rechtsgrundlage)\n• Nach jeder Zwangsanwendung: Verletzungen prüfen, ärztliche Versorgung anbieten, dokumentieren"},{"titel":"Dokumentation","text":"• Uhrzeiten (Zugriff, Eröffnung, Transport, Übergabe)\n• Beteiligte Kräfte, Dolmetscher, Ärzte, Jugendamt\n• Äußerungen der Person (insbes. **Asylgesuch**, Krankheit, Suizidankündigung) **wörtlich**\n• Zwangsanwendung, Fesselung, Verletzungen\n• Sichergestellte Gegenstände, mitgegebenes Gepäck/Geld/Medikamente\n• Rücksprachen mit ZAB/LDS (wer, wann, Ergebnis)"}],"merke":["Wörtlich dokumentieren, was die Person sagt – vor allem Asylgesuche.","Fesselung: nur bei konkreter Gefahr und dokumentiert.","Keine Kinder/Mitbewohner als Dolmetscher."],"beispiele":[{"text":"Kontrolle um 02:10 Uhr: Aufgriffszeit notieren. Wird die Person festgehalten, ist unverzüglich eine richterliche Entscheidung herbeizuführen. Liegt bis zum Ende des folgenden Tages (23:59 Uhr) keine richterliche Anordnung vor, ist sie freizulassen. Das Screening muss spätestens drei Tage nach dem Aufgriff abgeschlossen sein."}]}],"checklisten":[{"id":"screening-inland","titel":"Screening im Inland durchführen","icon":"checkmark.shield","kontext":"Die Screening-Prüfung hat ergeben: Screening durchführen","punkte":[{"text":"Aufgriffszeit notiert","hinweis":"Fristenrechner im Reiter Screening"},{"text":"Information nach Art. 11 Screening-VO in verständlicher Sprache erteilt","hinweis":"Zweck, Dauer, Rechte, Pflichten, Asylrecht, Datenschutz","dokumente":["info11"]},{"text":"Minderjährigkeit/Vulnerabilität geprüft, ggf. Jugendamt informiert"},{"text":"Festhalten erforderlich? Wenn ja: richterliche Entscheidung beantragt","hinweis":"Unverzüglich – ohne Anordnung Freilassung spätestens mit Ende des Folgetages (§ 15b Abs. 1 AufenthG)"},{"text":"Identität geprüft, Dokumente gesichert"},{"text":"Sicherheitsabfragen durchgeführt (SIS, INPOL, weitere)"},{"text":"ED-Behandlung / Eurodac (Fingerabdrücke + Gesichtsbild)"},{"text":"Gesundheitskontrolle durch die Gesundheitsbehörde veranlasst"},{"text":"Vulnerabilität dokumentiert"},{"text":"Mitwirkung (Art. 9) bewertet; bei Verweigerung Begründung notiert"},{"text":"Sicherheitsergebnisse nur in der internen Anlage – nicht an die Person aushändigen"},{"text":"Screening-Formular vollständig ausgefüllt"},{"text":"Asylgesuch? Wörtlich dokumentiert"},{"text":"Übergabe an die zuständige Stelle erfolgt"},{"text":"Abschluss innerhalb von 3 Tagen, Vorgang dokumentiert"}]},{"id":"aufgriff","titel":"Aufgriff: unerlaubter Aufenthalt","icon":"person.crop.circle.badge.questionmark","kontext":"Kontrolle einer Person ohne Aufenthaltsnachweis im Bereich der PD Leipzig","punkte":[{"text":"Eigensicherung, Personalien erheben, Dokumente sichten","hinweis":"Ausweispflicht § 48 AufenthG"},{"text":"Abfragen: INPOL, AZR, SIS, Eurodac/ED-Bestand","hinweis":"Bereits erfasst/überprüft? Ausschreibungen? Duldung/Gestattung?"},{"text":"Aufenthaltsstatus klären (Titel, Duldung, Gestattung, Ankunftsnachweis)"},{"text":"Asylgesuch geäußert? → wörtlich dokumentieren, Weiterleitung einleiten","hinweis":"Polizei prüft keine Asylgründe"},{"text":"Minderjährigkeit/Vulnerabilität erkennbar? → Jugendamt/Fachstellen"},{"text":"Screening im Inland erforderlich? (§ 15b AufenthG, max. 3 Tage)","hinweis":"Nicht, wenn bereits an Außengrenze überprüft"},{"text":"Festhalten erforderlich? Richterliche Entscheidung unverzüglich herbeiführen (ohne Anordnung Freilassung spätestens mit Ende des Folgetages)"},{"text":"Strafanzeige prüfen (§ 95 AufenthG / § 85 AsylG)","hinweis":"Art. 31 GFK, § 95 Abs. 5"},{"text":"Zuständige Ausländerbehörde / ZAB informieren"},{"text":"Dokumentation vollständig (Aliaspersonalien, Äußerungen, Maßnahmen)"}]},{"id":"asylgesuch","titel":"Asylgesuch bei der Polizei","icon":"hand.raised","kontext":"Eine Person äußert gegenüber Polizeibeamten einen Schutzwunsch","punkte":[{"text":"Schutzwunsch wörtlich dokumentieren (Zeit, Sprache, Dolmetscher)"},{"text":"Personalien und Dokumente sichern"},{"text":"ED-Behandlung (§ 16 AsylG) / Eurodac, falls nicht erfolgt"},{"text":"Information der Person über das weitere Verfahren (Merkblatt in Landessprache)","dokumente":["belehrung15","merkblatt"]},{"text":"Weiterleitung an die zuständige Aufnahmeeinrichtung (vgl. § 19 AsylG)"},{"text":"Bei laufender Abschiebung: sofort ZAB/LDS informieren und Weisung abwarten"},{"text":"Auffälligkeiten (Minderjährige, Kranke, Schwangere) im Vorgang notieren und bei der Übergabe mitteilen"}]},{"id":"abschiebung-vorbereitung","titel":"Abschiebung: Einsatzvorbereitung","icon":"list.clipboard","kontext":"Vollzugshilfeersuchen der ZAB/LDS liegt vor","punkte":[{"text":"Ersuchen vollständig? (Personen, Adresse, Flug, Termin, Rechtsgrundlage)"},{"text":"Vollziehbarkeit bestätigt? Keine Duldung, kein Eilverfahren anhängig (Rückfrage ZAB)"},{"text":"Gefährdungslage: Waffen, Gewalt, psychische Erkrankung, Suizidgefahr, Tiere"},{"text":"Kinder beteiligt? Jugendamt, Kinderbetreuung, Kindersitze"},{"text":"Weibliche Einsatzkräfte für Durchsuchung eingeplant"},{"text":"Sprachmittler organisiert"},{"text":"Arzt/Rettungsdienst bei Bedarf in Bereitschaft"},{"text":"Durchsuchungsanordnung (Richter) für Wohnung vorhanden, falls erforderlich"},{"text":"Nachtzeit? Nur bei Tatsachen für Vereitelungsgefahr (§ 58 Abs. 7)"},{"text":"Transport, Zeitpuffer bis Übergabe Flughafen Leipzig/Halle / Bundespolizei"},{"text":"Erreichbarkeit Bereitschaft ZAB/LDS für Rückfragen während des Einsatzes"},{"text":"Mögliche Proteste/Unterstützerkreise berücksichtigt"}]},{"id":"abschiebung-durchfuehrung","titel":"Abschiebung: Durchführung","icon":"checklist","kontext":"Am Einsatzort","punkte":[{"text":"Identität der angetroffenen Person(en) feststellen"},{"text":"Maßnahme eröffnen und begründen (Dolmetscher)"},{"text":"Durchsuchung der Person zur Eigensicherung"},{"text":"Zeit zum Packen geben; Gepäck, Dokumente, Medikamente, Bargeld"},{"text":"Handy: Kontakt zu Angehörigen/Rechtsbeistand ermöglichen, sofern Sicherheit es zulässt"},{"text":"Gesundheitszustand erfragen; neue Beschwerden → Arzt + ZAB"},{"text":"Asylgesuch/Folgeantrag? → dokumentieren + ZAB, Weisung abwarten"},{"text":"Fesselung nur bei konkreter Gefahr, dokumentieren"},{"text":"Wohnung verschlossen hinterlassen, Tiere/Wertgegenstände geregelt"},{"text":"Transport und Übergabe (Uhrzeit, Übernehmender)"},{"text":"Einsatzbericht und Rückmeldung an die LDS"}]},{"id":"festnahme-haft","titel":"Festnahme & Haftantrag","icon":"lock.doc","kontext":"Vorläufige Ingewahrsamnahme zur Sicherung der Abschiebung","punkte":[{"text":"Vollziehbare Ausreisepflicht festgestellt (Rücksprache Ausländerbehörde)"},{"text":"Haftgrund: dringender Verdacht Sicherungshaft (§ 62 Abs. 3)"},{"text":"Richterliche Entscheidung vorher nicht einholbar"},{"text":"Begründeter Verdacht des Entziehens (§ 62 Abs. 5)"},{"text":"Mildere Mittel geprüft und dokumentiert"},{"text":"Belehrung (Gründe, Rechte, Konsulat, Rechtsbeistand) in verständlicher Sprache"},{"text":"Unverzüglich dem Amtsgericht vorführen und Haftantrag stellen – die Polizei ist dafür selbst zuständig (§ 71 Abs. 5 AufenthG); mit der Ausländerbehörde/LDS abstimmen"},{"text":"Minderjährige/Familien mit Minderjährigen: grundsätzlich keine Abschiebungshaft (§ 62 Abs. 1 Satz 3 AufenthG)"},{"text":"Unterbringung: Einrichtung Dresden (nicht mit Strafgefangenen)"}]},{"id":"uma","titel":"Unbegleitete Minderjährige","icon":"figure.child","kontext":"Aufgriff einer mutmaßlich minderjährigen Person ohne Sorgeberechtigte","punkte":[{"text":"Im Zweifel als minderjährig behandeln"},{"text":"Jugendamt sofort informieren (vorläufige Inobhutnahme § 42a SGB VIII)"},{"text":"Kindgerechte Kommunikation, Dolmetscher"},{"text":"ED/Eurodac nur kindgerecht und mit Vertreter"},{"text":"Hinweise auf Menschenhandel/Ausbeutung prüfen"},{"text":"Keine Unterbringung im Polizeigewahrsam, soweit vermeidbar"}]}],"fristen":[{"was":"Screening an der Außengrenze","frist":"max. 7 Tage","grundlage":"Art. 8 Screening-VO (national § 14a AufenthG)"},{"was":"Screening im Inland","frist":"max. 3 Tage – Tag des Aufgriffs zählt nicht, mind. 2 Arbeitstage","grundlage":"Art. 8 Abs. 4 Screening-VO, § 15b AufenthG; Art. 3 VO (EWG, Euratom) Nr. 1182/71"},{"was":"Festhalten zur Überprüfung – richterliche Entscheidung","frist":"unverzüglich; ohne richterliche Anordnung Freilassung spätestens mit Ende des Tages nach dem Ergreifen","grundlage":"§ 15b Abs. 1 Satz 2–4 AufenthG, Art. 104 Abs. 2 GG"},{"was":"Registrierung eines Asylantrags","frist":"5 Tage (Ausnahme 15)","grundlage":"AVVO"},{"was":"Förmliche Antragstellung","frist":"21 Tage nach Registrierung","grundlage":"AVVO"},{"was":"Grenzverfahren (Asyl)","frist":"max. 12 Wochen","grundlage":"AVVO"},{"was":"Rückkehr-Grenzverfahren","frist":"max. 12 Wochen","grundlage":"VO 2024/1349"},{"was":"Beschleunigtes Verfahren","frist":"3 Monate","grundlage":"AVVO"},{"was":"Reguläres Asylverfahren","frist":"6 Monate","grundlage":"AVVO"},{"was":"Überstellungsfrist (Regel)","frist":"6 Monate","grundlage":"Art. 46 AMM-VO"},{"was":"Überstellungsfrist bei Haft","frist":"bis 1 Jahr","grundlage":"AMM-VO"},{"was":"Überstellungsfrist bei Flucht","frist":"bis 3 Jahre","grundlage":"AMM-VO"},{"was":"Zuständigkeit Ersteinreisestaat","frist":"20 Monate","grundlage":"AMM-VO"},{"was":"Eurodac: Mindestalter","frist":"6 Jahre","grundlage":"Eurodac-VO"},{"was":"Ausreisefrist (Regel)","frist":"7–30 Tage","grundlage":"§ 59 Abs. 1 AufenthG"},{"was":"Vorbereitungshaft","frist":"max. 6 Wochen","grundlage":"§ 62 Abs. 2 AufenthG"},{"was":"Sicherungshaft","frist":"6 Monate, max. 18 Monate","grundlage":"§ 62 Abs. 3, 4 AufenthG"},{"was":"Ausreisegewahrsam","frist":"max. 28 Tage","grundlage":"§ 62b AufenthG"},{"was":"Mitwirkungshaft","frist":"max. 14 Tage","grundlage":"§ 62 Abs. 6 AufenthG"},{"was":"Sekundärmigrationszentrum Sachsen","frist":"max. 24 Monate (Familien 12)","grundlage":"§ 47 Abs. 1b, 1c AsylG"}],"normen":[{"norm":"§ 11 AufenthG","titel":"Einreise- und Aufenthaltsverbot","inhalt":"Nach Ausweisung, Zurückschiebung oder Abschiebung wird ein befristetes Einreise- und Aufenthaltsverbot erlassen.","praxis":"Verstoß: Straftat nach § 95 Abs. 2 Nr. 1 AufenthG."},{"norm":"§ 14a AufenthG","titel":"Screening an der Außengrenze","inhalt":"Überprüfung nach der Screening-VO an der Außengrenze; Verbringen und Überprüfungshaft.","praxis":"Flughäfen/Seehäfen – regelmäßig Bundespolizei."},{"norm":"§ 15b AufenthG","titel":"Überprüfung im Bundesgebiet","inhalt":"Festhalten und Verbringen zur Überprüfung nach Art. 7 Screening-VO; Freilassung, wenn nicht bis Ende des Folgetages richterlich angeordnet.","praxis":"Kernnorm für das Screening im Inland durch die Landespolizei."},{"norm":"§ 48 AufenthG","titel":"Ausweisrechtliche Pflichten","inhalt":"Pass vorlegen und überlassen; Mitwirkung bei Passbeschaffung; Durchsuchung nach Dokumenten (Abs. 3); Auslesen von Datenträgern (Abs. 3a), Auswertung (Abs. 3b).","praxis":"Dokumente: ohne Asylgesuch bei ausreisepflichtigen Personen nach § 50 Abs. 5 AufenthG in Verwahrung nehmen und der Ausländerbehörde zuleiten; mit Asylgesuch nach § 21 Abs. 1 AsylG verwahren und weiterleiten. Bescheinigung aushändigen."},{"norm":"§ 49 AufenthG","titel":"Identitätsfeststellung","inhalt":"Überprüfung, Feststellung und Sicherung der Identität; ED-Maßnahmen.","praxis":"Falsche Angaben: § 95 Abs. 1 Nr. 5."},{"norm":"§ 50 AufenthG","titel":"Ausreisepflicht","inhalt":"Ausreisepflichtig ist, wer einen erforderlichen Aufenthaltstitel nicht oder nicht mehr besitzt.","praxis":"Ausreisepflicht ≠ vollziehbare Ausreisepflicht."},{"norm":"§ 58 AufenthG","titel":"Abschiebung","inhalt":"Voraussetzungen der Abschiebung; Abs. 1a UMA; Abs. 5–10 Betreten und Durchsuchen von Wohnungen, Nachtzeit, Richtervorbehalt.","praxis":"Durchsuchung: Richter, bei Gefahr im Verzug durchführende Behörde."},{"norm":"§ 59 AufenthG","titel":"Androhung der Abschiebung","inhalt":"Androhung mit Ausreisefrist (7–30 Tage); Termin der Abschiebung darf nicht angekündigt werden.","praxis":"Termine nicht an Betroffene oder Unterstützer weitergeben."},{"norm":"§ 60 AufenthG","titel":"Verbot der Abschiebung","inhalt":"Abschiebungsverbote u. a. bei Flüchtlingseigenschaft, EMRK-Verletzung, erheblicher konkreter Gefahr.","praxis":"Prüfung durch BAMF/Ausländerbehörde, nicht durch die Einsatzkraft."},{"norm":"§ 60a AufenthG","titel":"Duldung","inhalt":"Vorübergehende Aussetzung der Abschiebung; Abs. 2c Vermutung der Reisefähigkeit, qualifizierte ärztliche Bescheinigung.","praxis":"Gültige Duldung = keine Abschiebung ohne Widerruf."},{"norm":"§ 62 AufenthG","titel":"Abschiebungshaft","inhalt":"Vorbereitungs-, Sicherungs-, Mitwirkungshaft; Abs. 5 vorläufige Ingewahrsamnahme ohne vorherige richterliche Anordnung.","praxis":"Unverzüglich Richter; mildere Mittel prüfen."},{"norm":"§ 62a AufenthG","titel":"Vollzug der Abschiebungshaft","inhalt":"Vollzug grundsätzlich in speziellen Hafteinrichtungen, getrennt von Strafgefangenen.","praxis":"Sachsen: Einrichtung in Dresden."},{"norm":"§ 62b AufenthG","titel":"Ausreisegewahrsam","inhalt":"Bis zu 28 Tage zur Sicherung der Durchführbarkeit der Abschiebung.","praxis":"Vollzug im Transitbereich/Unterkunft mit Ausreisemöglichkeit."},{"norm":"§ 71 AufenthG","titel":"Zuständigkeit","inhalt":"Abs. 4a: Zuständigkeit für Screening-Fälle (u. a. Polizeien der Länder). Abs. 5: Landespolizei auch zuständig für Zurückschiebung, Abschiebung, Festnahme, Haftantrag.","praxis":"Rechtsgrundlage für das eigene Tätigwerden."},{"norm":"§ 72 Abs. 4 AufenthG","titel":"Beteiligung der StA","inhalt":"Abschiebung bei erhobener Klage oder laufendem Ermittlungsverfahren nur im Einvernehmen mit der Staatsanwaltschaft (Satz 1); nicht erforderlich bei geringem Strafverfolgungsinteresse, u. a. bei Verfahren nur nach § 95 AufenthG, § 9 FreizügG/EU oder Delikten nach Satz 5 (Satz 3–5).","praxis":"Vor Rückführung Verfahrensstand prüfen."},{"norm":"§ 95 AufenthG","titel":"Strafvorschriften","inhalt":"Unerlaubter Aufenthalt, unerlaubte Einreise, Verstoß gegen Einreiseverbot, falsche Angaben.","praxis":"Abs. 5: Art. 31 GFK."},{"norm":"§§ 96, 97 AufenthG","titel":"Einschleusen","inhalt":"Einschleusen von Ausländern; mit Todesfolge; gewerbs- und bandenmäßig.","praxis":"Geschleuste = Zeugen, Beweise sichern."},{"norm":"§ 16 AsylG","titel":"Sicherung der Identität","inhalt":"ED-Behandlung von Asylsuchenden.","praxis":"Auch durch die Polizei bei Asylgesuch."},{"norm":"§ 19 AsylG","titel":"Aufgaben der Ausländerbehörde und der Polizei","inhalt":"Weiterleitung von Asylsuchenden an die zuständige Aufnahmeeinrichtung; ED-Behandlung.","praxis":"Ist ein Screening erforderlich, zuerst Screening, dann Weiterleitung (§ 19 Abs. 1 Satz 2 AsylG); ED-Behandlung vor der Weiterleitung (Abs. 2). Folgt die Person der Weiterleitung nicht, gilt der Asylantrag als nicht gestellt (§ 20 AsylG) – Belehrung nach § 20 aushändigen."},{"norm":"§ 55 AsylG","titel":"Aufenthaltsgestattung","inhalt":"Aufenthalt zur Durchführung des Asylverfahrens ist gestattet.","praxis":"Gestattete sind nicht vollziehbar ausreisepflichtig."},{"norm":"§ 56 AsylG","titel":"Räumliche Beschränkung","inhalt":"Räumlich beschränkt auf den Bezirk der Ausländerbehörde der zuständigen Aufnahmeeinrichtung (§ 56 Abs. 1 AsylG); erlischt nach drei Monaten gestatteten Aufenthalts, nicht aber solange die Wohnpflicht in der Aufnahmeeinrichtung besteht (§ 59a Abs. 1 AsylG).","praxis":"Erstverstoß § 86 (OWi), wiederholt § 85 (Straftat)."},{"norm":"§§ 69–70a AsylG","titel":"Asylverfahrenshaft","inhalt":"Neue Haftform seit GEAS; nur durch richterliche Anordnung; Verhältnismäßigkeit, mildere Mittel. Vorläufiges Festhalten durch die für den Haftantrag zuständige Behörde nur nach § 69 Abs. 4 AsylG (schriftlich anordnen, unverzüglich vorführen, Freilassung spätestens mit Ablauf des Folgetages).","praxis":"Umsetzung von Art. 10 Aufnahme-RL."},{"norm":"Art. 7 Screening-VO","titel":"Screening im Hoheitsgebiet","inhalt":"Überprüfung unerlaubt aufhältiger Drittstaatsangehöriger, die nicht an der Außengrenze überprüft wurden.","praxis":"Max. 3 Tage."},{"norm":"Art. 44 AMM-VO","titel":"Haft zur Überstellung","inhalt":"Inhaftnahme zur Sicherung der Überstellung bei erheblicher Fluchtgefahr bzw. Sicherheitsgefahr.","praxis":"Ersetzt Art. 28 Dublin III."},{"norm":"Art. 46 AMM-VO","titel":"Überstellungsfristen","inhalt":"6 Monate; bis 1 Jahr bei Haft; bis 3 Jahre bei Flucht.","praxis":"Flucht/Untertauchen dokumentieren und melden."}],"glossar":[{"begriff":"AMM-VO","erklaerung":"Asyl- und Migrationsmanagement-Verordnung (EU) 2024/1351 – regelt u. a. die Zuständigkeit für Asylverfahren (Nachfolger Dublin III) und den Solidaritätsmechanismus."},{"begriff":"Ankunftsnachweis","erklaerung":"Bescheinigung über die Meldung als Asylsuchender; dokumentiert den Status vor förmlicher Antragstellung."},{"begriff":"Aufenthaltsgestattung","erklaerung":"Aufenthaltsrecht während des Asylverfahrens (§ 55 AsylG)."},{"begriff":"Ausreisegewahrsam","erklaerung":"Kurzfristige Freiheitsentziehung bis 28 Tage zur Sicherung der Abschiebung (§ 62b AufenthG)."},{"begriff":"AVVO","erklaerung":"Asylverfahrensverordnung (EU) 2024/1348 – einheitliches Verfahren für internationalen Schutz inkl. Grenzverfahren."},{"begriff":"AZR","erklaerung":"Ausländerzentralregister beim BVA."},{"begriff":"BAMF","erklaerung":"Bundesamt für Migration und Flüchtlinge – entscheidet über Asylanträge und Zuständigkeit nach AMM-VO."},{"begriff":"Duldung","erklaerung":"Vorübergehende Aussetzung der Abschiebung (§ 60a AufenthG). Kein Aufenthaltstitel, Ausreisepflicht bleibt bestehen."},{"begriff":"EES","erklaerung":"Einreise-/Ausreisesystem der EU: erfasst Ein- und Ausreisen von Drittstaatsangehörigen an den Außengrenzen (Kurzaufenthalte) – hilft, Überschreitungen der 90 Tage nachzuweisen."},{"begriff":"Eurodac","erklaerung":"EU-Datenbank für biometrische Daten (Fingerabdrücke, Gesichtsbild) von Schutzsuchenden und irregulär Einreisenden/Aufhältigen; ab 6 Jahren."},{"begriff":"Folgeantrag","erklaerung":"Erneuter Asylantrag nach bestandskräftiger Ablehnung; Recht auf Verbleib kann eingeschränkt sein."},{"begriff":"GEAS","erklaerung":"Gemeinsames Europäisches Asylsystem; reformiert 2024, anwendbar seit 12.06.2026."},{"begriff":"GEAS-Anpassungsgesetz","erklaerung":"Bundesgesetz zur Anpassung von AsylG, AufenthG u. a. an die GEAS-Reform; in Kraft seit 12.06.2026."},{"begriff":"Grenzverfahren","erklaerung":"Asylverfahren an der Außengrenze (in DE v. a. Flughäfen), max. 12 Wochen; Personen gelten als nicht eingereist."},{"begriff":"LDS","erklaerung":"Landesdirektion Sachsen – obere Ausländerbehörde, u. a. mit der Zentralen Ausländerbehörde (ZAB)."},{"begriff":"Rückkehrentscheidung","erklaerung":"Behördliche Entscheidung, die den Aufenthalt als illegal feststellt und eine Rückkehrverpflichtung auferlegt; in DE i. d. R. Abschiebungsandrohung."},{"begriff":"Screening","erklaerung":"Überprüfung nach der Screening-VO: Identität, Gesundheit, Vulnerabilität, Sicherheit, Eurodac – Außengrenze 7 Tage, Inland 3 Tage."},{"begriff":"Sekundärmigration","erklaerung":"Weiterwanderung von Schutzsuchenden aus dem zuständigen in einen anderen EU-Staat."},{"begriff":"Sekundärmigrationszentrum","erklaerung":"Einrichtung für Personen, für die ein anderer Mitgliedstaat zuständig ist; Sachsen: Dresden seit 01.07.2026."},{"begriff":"Sicherer Herkunftsstaat","erklaerung":"Staat, bei dem vermutet wird, dass keine Verfolgung stattfindet; führt zu beschleunigtem Verfahren. Listen auf EU- und nationaler Ebene."},{"begriff":"Solidaritätsmechanismus","erklaerung":"Verpflichtende, aber flexible Solidarität nach AMM-VO: Umsiedlung, finanzielle Beiträge oder andere Unterstützung; jährlicher Pool mind. 30.000 Umsiedlungen."},{"begriff":"UMA","erklaerung":"Unbegleitete minderjährige Ausländer/innen."},{"begriff":"VIS","erklaerung":"Visa-Informationssystem der EU: enthält erteilte Schengen-Visa mit Fingerabdrücken und Lichtbild."},{"begriff":"Vollzugshilfe","erklaerung":"Unterstützung einer anderen Behörde durch die Polizei bei der Anwendung unmittelbaren Zwangs; Verantwortung für die Rechtmäßigkeit der Maßnahme bei der ersuchenden Behörde."},{"begriff":"Vulnerabilität","erklaerung":"Besondere Schutzbedürftigkeit, z. B. Minderjährige, Schwangere, Menschen mit Behinderung, Opfer von Folter oder Menschenhandel."},{"begriff":"ZAB","erklaerung":"Zentrale Ausländerbehörde der Landesdirektion Sachsen (Chemnitz) – u. a. zuständig für aufenthaltsbeendende Maßnahmen."},{"begriff":"Zurückschiebung","erklaerung":"Aufenthaltsbeendigung kurz nach unerlaubter Einreise (§ 57 AufenthG)."},{"begriff":"Zurückweisung","erklaerung":"Verweigerung der Einreise an der Grenze (§ 15 AufenthG)."},{"begriff":"Überprüfungshaft","erklaerung":"Haft zur Durchführung des Screenings (§§ 14a, 15b AufenthG)."},{"begriff":"Überstellung","erklaerung":"Verbringung einer Person in den nach AMM-VO zuständigen Mitgliedstaat (früher: Dublin-Überstellung)."}],"quiz":[{"kapitel":"screening","frage":"Wohin gehören die Ergebnisse der Sicherheitskontrolle (Datenbanktreffer)?","antworten":["In das Formular, das die Person erhält","In eine interne Anlage, die der Person nicht ausgehändigt wird","Nirgendwohin – sie werden nicht dokumentiert","In die Belehrung"],"richtig":1,"erklaerung":"Datenbanktreffer sind polizeiliche Erkenntnisse; sie werden getrennt dokumentiert."},{"kapitel":"screening","frage":"Worüber muss die Person nach Art. 11 Screening-VO informiert werden?","antworten":["Nur über die Dauer","Zweck, Dauer, Ablauf, Rechte und Pflichten, Asylrecht, Einreise-/Rückkehrregeln, Datenschutz","Nur über das Asylrecht","Gar nicht, erst die LDS informiert"],"richtig":1,"erklaerung":"Art. 11 verlangt eine umfassende Information in einer verständlichen Sprache."},{"kapitel":"screening","frage":"Eine vietnamesische Frau reiste mit einem Schengen-Besuchsvisum über Prag ein. Sie ist seit fünf Monaten in Leipzig. Screening?","antworten":["Ja – sie hält sich unerlaubt auf","Nein – kontrollierte Einreise; unerlaubter Aufenthalt, Rückkehrverfahren über die Ausländerbehörde","Nur wenn sie Asyl beantragt","Ja, aber nur 3 Tage"],"richtig":1,"erklaerung":"Es gibt einen Hinweis auf eine Kontrolle an der Außengrenze (Visum, Einreise). Die Screening-VO greift nicht; § 95 Abs. 1 Nr. 2 AufenthG prüfen."},{"kapitel":"screening","frage":"Dieselbe Frau hat keinen Pass dabei. Wie lässt sich die kontrollierte Einreise trotzdem feststellen?","antworten":["Gar nicht – dann immer Screening","Über eine Abfrage im VIS bzw. EES","Durch ihre bloße Aussage","Über das Melderegister"],"richtig":1,"erklaerung":"VIS enthält das erteilte Visum mit Biometrie, EES die registrierte Einreise."},{"kapitel":"screening","frage":"Ein Syrer wurde 2025 nach Syrien abgeschoben. Jetzt wird er ohne Papiere in Leipzig kontrolliert; wie er zurückkam, sagt er nicht. Screening?","antworten":["Nein – er ist ja bereits in Eurodac","Ja – nach Verlassen des Schengen-Raums ist die unkontrollierte Rückkehr ein neuer unerlaubter Grenzübertritt; zusätzlich Einreiseverbot und § 95 Abs. 2 Nr. 1 AufenthG","Nur Strafanzeige, kein Screening","Sofort abschieben ohne weitere Prüfung"],"richtig":1,"erklaerung":"Frühere Registrierung ersetzt kein Screening nach einer neuen unerlaubten Einreise. Frühere Daten beschleunigen aber die Identifizierung."},{"kapitel":"screening","frage":"Ein Afghane wurde nach der AMM-VO nach Italien überstellt und ist nun wieder in Leipzig. Screening?","antworten":["Ja – er ist neu eingereist","Nein – er hat den Schengen-Raum nie verlassen; Zuständigkeitsverfahren und Überstellung weiterbetreiben","Ja, weil Italien zuständig ist","Nur mit Zustimmung Italiens"],"richtig":1,"erklaerung":"Eine Überstellung innerhalb der EU ist kein Verlassen des Schengen-Raums; es gibt keine Einreise über eine Außengrenze."},{"kapitel":"screening","frage":"Ein Georgier hat eine gültige italienische Aufenthaltserlaubnis und lebt seit einem Jahr in Leipzig. Screening?","antworten":["Ja","Nein – erlaubte Einreise; nach 90 Tagen unerlaubter Aufenthalt, Rückkehr in den Ausstellerstaat","Nur wenn er arbeitet","Nur Ordnungswidrigkeit"],"richtig":1,"erklaerung":"Titel anderer Schengen-Staaten erlauben nur 90 Tage in 180 Tagen; Screening kommt nicht in Betracht."},{"kapitel":"screening","frage":"Ein zweijähriges Kind unerlaubt aufhältiger Eltern wurde in Leipzig geboren. Screening?","antworten":["Ja, ab 6 Jahren","Nein – es hat nie eine Außengrenze überschritten","Ja, zusammen mit den Eltern","Nur Eurodac-Erfassung"],"richtig":1,"erklaerung":"Die Screening-VO setzt einen unerlaubten Grenzübertritt voraus."},{"kapitel":"screening","frage":"Ein früher abgeschobener Mann reist mit neuem Visum über den Flughafen Berlin ein, obwohl ein Einreiseverbot besteht. Screening?","antworten":["Ja – wegen des Einreiseverbots","Nein – kontrollierte Einreise; aber Einreise trotz Verbots ist strafbar (§ 95 Abs. 2 Nr. 1 AufenthG)","Nein, und auch keine Straftat, weil er ein Visum hat","Nur Bußgeld"],"richtig":1,"erklaerung":"Screening entfällt bei kontrollierter Einreise; das Einreiseverbot wirkt trotzdem."},{"kapitel":"screening","frage":"Kontrolle am Hauptbahnhof Leipzig: Ein Mann ohne Papiere gibt an, aus Afghanistan zu kommen. Die Abfragen ergeben keine Treffer, und es gibt keinen Hinweis auf eine Grenzkontrolle. Was ist zu tun?","antworten":["Kein Screening, nur Anzeige","Screening durchführen (Art. 7 Screening-VO, § 15b AufenthG)","Sofort abschieben","Person entlassen"],"richtig":1,"erklaerung":"Drittstaatsangehöriger, unerlaubt aufhältig, kein Hinweis auf Kontrolle an der Außengrenze, nicht erfasst → Screening."},{"kapitel":"screening","frage":"Eine Frau mit polnischem Personalausweis hat kein Ticket und keine Wohnadresse. Screening?","antworten":["Ja","Nein – EU-Bürgerin, Screening-VO gilt nicht","Nur bei Asylgesuch","Nur nachts"],"richtig":1,"erklaerung":"Die Screening-VO gilt nur für Drittstaatsangehörige."},{"kapitel":"screening","frage":"Ein Mann legt eine gültige Duldung des Landkreises Leipzig vor. Screening
