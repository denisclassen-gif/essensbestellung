":"Sonstige Bemerkungen","typ":"mehrzeilig"}]}]},"dokumente":[{"id":"formular","titel":"Überprüfungsformular","untertitel":"Art. 17 Screening-VO – Arbeitsentwurf","icon":"doc.text.fill","beschreibung":"Alle Angaben des Screenings in einem Dokument.","pflichtfelder":["vorgang","dienststelle","sachbearbeiter","aufgriff_zeit","aufgriff_ort","name","vorname","geburtsdatum","geschlecht","staatsangehoerigkeit","sprachen","dokumente","reiseweg","grund","schleusung","abfrage_inpol","abfrage_azr","abfrage_sis","abfrage_eurodac","ed","eurodac","gesundheitsbehoerde","vulnerabilitaet","asyl","weiterleitung"],"abschnitte":[{"titel":"","text":"**Hinweis:** Arbeitsentwurf auf Grundlage von Art. 17 VO (EU) 2024/1356. Maßgeblich ist der amtliche Vordruck bzw. die Maske im Vorgangsbearbeitungssystem.\n\n| Vorgangsnummer | {{vorgang}}\n| Dienststelle | {{dienststelle}}\n| Sachbearbeitung | {{sachbearbeiter}} ({{erreichbarkeit}})"},{"titel":"1. Aufgriff","text":"| Zeitpunkt | {{aufgriff_zeit}}\n| Ort | {{aufgriff_ort}}\n| Anlass | {{anlass}}\n| Rechtsgrundlage | Art. 7 VO (EU) 2024/1356, § 15b AufenthG"},{"titel":"2. Personalien","text":"| Familienname | {{name}}\n| Vorname(n) | {{vorname}}\n| Geburtsdatum | {{geburtsdatum}}\n| Geschlecht | {{geschlecht}}\n| Staatsangehörigkeit | {{staatsangehoerigkeit}}\n| Geburtsort | {{geburtsort}}\n| Weitere Personalien / Aliase | {{alias}}\n| Sprachen | {{sprachen}}\n| Sprachmittlung | {{dolmetscher}}\n| Dokumente | {{dokumente}}\n| Dokumentenangaben | {{dokument_details}}"},{"titel":"3. Einreise und Reiseweg","text":"| Einreise (ca.) | {{einreise_datum}}\n| Ort des Grenzübertritts | {{einreise_ort}}\n| Reiseweg / Transit | {{reiseweg}}\n| Grund für Einreise/Aufenthalt | {{grund}}\n| Hinweise auf Schleusung | {{schleusung}}\n| Einzelheiten | {{schleusung_details}}"},{"titel":"4. Identitäts- und Sicherheitsprüfung","text":"| INPOL | {{abfrage_inpol}}\n| AZR | {{abfrage_azr}}\n| SIS | {{abfrage_sis}}\n| Eurodac / Fast-ID | {{abfrage_eurodac}}\n| Weitere Abfragen | {{abfrage_weitere}}\n| Erkenntnisse | {{treffer_details}}"},{"titel":"5. Biometrische Daten","text":"| ED-Behandlung | {{ed}}\n| Eurodac | {{eurodac}}\n| Zeitpunkt | {{biometrie_zeit}}\n| Bemerkungen | {{biometrie_bemerkung}}"},{"titel":"6. Vorläufige Gesundheitskontrolle","text":"| Gesundheitsbehörde | {{gesundheitsbehoerde}}\n| Informiert am | {{gesundheit_zeit}}\n| Beobachtungen | {{beschwerden}}"},{"titel":"7. Vorläufige Vulnerabilitätsprüfung","text":"| Hinweise | {{vulnerabilitaet}}\n| Beobachtungen | {{vulnerabilitaet_details}}\n| Jugendamt | {{jugendamt}}"},{"titel":"8. Antrag auf internationalen Schutz","text":"| Schutzersuchen | {{asyl}}\n| Wortlaut | {{asyl_wortlaut}}\n| Zeitpunkt | {{asyl_zeit}}"},{"titel":"9. Festhalten","text":"| Festgehalten | {{festgehalten}}\n| Beginn | {{festhalten_beginn}}\n| Ort | {{unterbringung}}\n| Richterliche Entscheidung spätestens | {{frist_richter}}"},{"titel":"10. Ergebnis und Weiterleitung","text":"| Weiterleitung | {{weiterleitung}}\n| Übergeben an | {{uebergabe_an}}\n| Zeitpunkt | {{uebergabe_zeit}}\n| Screening endet spätestens | {{frist_screening}}\n| Sichergestellte Gegenstände | {{sichergestellt}}\n| Bemerkungen | {{bemerkungen}}\n\nLeipzig, {{heute}}\n\n\n______________________________\n{{sachbearbeiter}}"}]},{"id":"belehrung","titel":"Belehrung","untertitel":"Deutsch / English – zum Aushändigen","icon":"text.bubble.fill","beschreibung":"Information der Person über das Screening, zweisprachig mit Unterschriftsfeldern.","pflichtfelder":["name","vorname","aufgriff_zeit","sprachen"],"abschnitte":[{"titel":"Information über die Überprüfung (Screening)","text":"| Name | {{name}}, {{vorname}}\n| Datum / Uhrzeit | {{aufgriff_zeit}}\n| Sprachmittlung | {{dolmetscher}}"},{"titel":"Deutsch","text":"Sie werden nach Art. 7 der Verordnung (EU) 2024/1356 und § 15b Aufenthaltsgesetz überprüft (Screening). Die Überprüfung dauert höchstens drei Tage.\n\nDabei geschieht Folgendes:\n• Ihre Identität wird festgestellt.\n• Es wird eine Sicherheitsüberprüfung in Datenbanken durchgeführt.\n• Ihre Fingerabdrücke und ein Gesichtsbild werden aufgenommen und in Eurodac gespeichert.\n• Eine Gesundheitsbehörde führt eine vorläufige Gesundheitskontrolle durch.\n• Es wird geprüft, ob Sie besonderen Schutz benötigen.\n\nSie sind verpflichtet, mitzuwirken und wahrheitsgemäße Angaben zu machen.\n\nSie können **jederzeit internationalen Schutz (Asyl) beantragen**. Wenn Sie festgehalten werden, entscheidet ein Gericht spätestens bis zum Ende des folgenden Tages. Sie haben das Recht, einen Rechtsbeistand und auf Wunsch Ihr Konsulat zu benachrichtigen."},{"titel":"English","text":"You are being screened under Article 7 of Regulation (EU) 2024/1356 and Section 15b of the German Residence Act. The screening lasts no longer than three days.\n\nThe screening includes:\n• identification of your person,\n• a security check in databases,\n• taking your fingerprints and a facial image and storing them in Eurodac,\n• a preliminary health check carried out by a health authority,\n• a check whether you have special needs.\n\nYou are obliged to cooperate and to provide truthful information.\n\nYou may **apply for international protection (asylum) at any time**. If you are held, a court will decide by the end of the following day at the latest. You have the right to contact a lawyer and, if you wish, your consulate."},{"titel":"Bestätigung / Confirmation","text":"Die Belehrung wurde mir in einer Sprache erläutert, die ich verstehe. / This information was explained to me in a language I understand.\n\nSprache / Language: {{sprachen}}\n\n\n______________________________          ______________________________\nUnterschrift / Signature                           Sprachmittler:in / Interpreter\n\n\n______________________________\nBelehrende:r Beamt:in ({{sachbearbeiter}}), {{heute}}\n\nUnterschrift verweigert: ☐"}]},{"id":"festhalten","titel":"Festhalten & Antrag an das Gericht","untertitel":"§ 15b AufenthG, Art. 104 GG","icon":"building.columns.fill","beschreibung":"Vermerk über das Festhalten und Antrag auf richterliche Entscheidung.","bedingung":{"feld":"festgehalten","wert":"Ja"},"pflichtfelder":["vorgang","dienststelle","sachbearbeiter","name","vorname","geburtsdatum","staatsangehoerigkeit","aufgriff_zeit","festhalten_beginn","festhalten_grund","milderes_mittel","unterbringung","gericht"],"abschnitte":[{"titel":"","text":"An das {{gericht}}\n– Bereitschaftsdienst –\n\n| Vorgangsnummer | {{vorgang}}\n| Dienststelle | {{dienststelle}}\n| Sachbearbeitung | {{sachbearbeiter}} ({{erreichbarkeit}})"},{"titel":"Antrag auf Anordnung der Fortdauer des Festhaltens zur Durchführung der Überprüfung","text":"Es wird beantragt, die Fortdauer des Festhaltens der nachstehend bezeichneten Person zur Durchführung der Überprüfung nach Art. 7 VO (EU) 2024/1356 i. V. m. § 15b AufenthG anzuordnen.\n\n| Familienname | {{name}}\n| Vorname(n) | {{vorname}}\n| Geburtsdatum | {{geburtsdatum}}\n| Geschlecht | {{geschlecht}}\n| Staatsangehörigkeit | {{staatsangehoerigkeit}}"},{"titel":"Sachverhalt","text":"Die Person wurde am {{aufgriff_zeit}} in {{aufgriff_ort}} angetroffen (Anlass: {{anlass}}). Ein Aufenthaltsnachweis lag nicht vor. Hinweise auf eine Kontrolle an einer Außengrenze oder eine bereits erfolgte Überprüfung ergaben sich nicht.\n\n| Abfrage INPOL | {{abfrage_inpol}}\n| Abfrage AZR | {{abfrage_azr}}\n| Abfrage SIS | {{abfrage_sis}}\n| Eurodac / Fast-ID | {{abfrage_eurodac}}\n| Erkenntnisse | {{treffer_details}}"},{"titel":"Begründung","text":"Die Überprüfung kann ohne Festhalten nicht oder nur unter erheblichen Schwierigkeiten durchgeführt werden:\n\n{{festhalten_grund}}\n\n**Mildere Mittel:** {{milderes_mittel}}\n\n| Beginn des Festhaltens | {{festhalten_beginn}}\n| Ort des Festhaltens | {{unterbringung}}\n| Richterliche Entscheidung spätestens | {{frist_richter}}\n| Höchstdauer der Überprüfung bis | {{frist_screening}}\n| Schutzersuchen | {{asyl}}\n| Hinweise Schutzbedürftigkeit | {{     <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
    ${v > 0 ? `<circle cx="38" cy="38" r="${r}" fill="none" stroke="url(#rg)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c * v} ${c}" transform="rotate(-90 38 38)"/>` : ""}
    <defs><linearGradient id="rg"><stop offset="0" stop-color="#61c7b0"/><stop offset="1" stop-color="#006b5c"/></linearGradient></defs>
    <text x="38" y="43" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor">${p} %</text></svg>`;

// ================= Router mit Übergängen =================
const app = document.getElementById("app");
const topEl = document.getElementById("top");
const titleEl = document.getElementById("title");
const backBtn = document.getElementById("back");
backBtn.innerHTML = svg("chevl", 2.4) + "Zurück";
const TABS = [["start", "Start", "home"], ["fall", "Unterlagen", "docs"], ["wissen", "Wissen", "books"], ["lernen", "Lernen", "grad"], ["mehr", "Mehr", "dots"]];
let stack = [];
let tab = "start";
let heroView = false;

function uebergang(richtung, fn) {
  const html = document.documentElement;
  if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    html.classList.add(richtung === "back" ? "vt-back" : "vt-fwd");
    const t = document.startViewTransition(() => fn(false));
    t.finished.finally(() => html.classList.remove("vt-fwd", "vt-back"));
  } else fn(true, richtung);
}
function go(view, push = true) {
  uebergang(push ? "fwd" : "fade", animiert => {
    if (push) stack.push(view); else stack = [view];
    render(animiert ? (push ? "enter-fwd" : "enter-fade") : "");
  });
}
function zurueck() {
  if (stack.length < 2) return;
  uebergang("back", animiert => { stack.pop(); render(animiert ? "enter-back" : ""); });
}
backBtn.onclick = zurueck;
function render(anim = "", scroll = true) {
  const v = stack[stack.length - 1];
  const out = v();
  heroView = !!out.hero;
  backBtn.hidden = stack.length <= 1;
  titleEl.textContent = out.title;
  topEl.classList.toggle("plain", !heroView);
  app.className = anim;
  app.innerHTML = out.hero ? out.html : `<div class="pad">${out.html}</div>`;
  out.bind && out.bind();
  if (scroll) window.scrollTo(0, 0);
  onScroll();
  beobachten();
  markTab();
}
function neuZeichnen() { const y = window.scrollY; render("", false); window.scrollTo(0, y); }

// Parallax & Kopfleiste
function onScroll() {
  const y = window.scrollY;
  const hero = app.querySelector(".hero");
  if (hero) {
    const inner = hero.querySelector(".inner"), d1 = hero.querySelector(".deco1"), d2 = hero.querySelector(".deco2");
    const h = hero.offsetHeight;
    inner.style.transform = `translateY(${y * 0.35}px)`;
    inner.style.opacity = Math.max(0, 1 - y / (h * 0.7));
    d1.style.transform = `translateY(${y * 0.2}px)`;
    d2.style.transform = `translateY(${y * -0.12}px)`;
    topEl.classList.toggle("solid", y > h - 90);
  } else {
    topEl.classList.toggle("solid", y > 4);
  }
}
addEventListener("scroll", onScroll, { passive: true });

// Einblenden beim Scrollen
let io = null;
function beobachten() {
  const els = app.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
  els.forEach((e, i) => { e.style.transitionDelay = `${Math.min(i, 6) * 35}ms`; io.observe(e); });
}

  const nav = document.getElementById("tabs");

  nav.querySelectorAll("button").forEach(b => { const on = b.dataset.t === tab; b.classList.toggle("on", on); if (on) aktiv = b; });

  if (aktiv && pill) { pill.style.left = aktiv.offsetLeft + "px"; pill.style.width = aktiv.offsetWidth + "px"; }

const SP = C.screening;
function maxTiefe(id) { const k = SP.knoten[id]; return k.typ !== "frage" ? 0 : 1 + Math.max(...k.antworten.map(a => maxTiefe(a.ziel))); }
function ScreeningWizard() {

    const z = ["Screening-Prüfung – Prüfprotokoll", "Erstellt: " + fmtDatum(new Date()), ""];

    z.push("", "Ergebnis: " + k.titel);
    if (k.rechtsgrundlage) z.push("Rechtsgrundlage: " + k.rechtsgrundlage);
    z.push("", "Erstellt mit GEAS Hilfe (inoffizielle Arbeitshilfe). Enthält keine personenbezogenen Daten.");

      bind: () => {

  }
  return view;
}

const TRENNER = "; ";

function erfuellt(b) {
  if (!b) return true;
  const l = auswahl(b.feld);
  if (b.wert.startsWith("!")) return l.length > 0 && !l.includes(b.wert.slice(1));
  return l.includes(b.wert);
}

function Erfassung(start) {
  let index = start;
  const sch = C.fall.schritte;
  const view = () => {
    const s = sch[index], o = offenIn(s).length;
    return {
      title: `Schritt ${index + 1} von ${sch.length}`,
      html: `${bar((index + 1) / sch.length)}
        <div class="stepper" id="stp">${sch.map((x, i) => `<button class="${i === index ? "cur" : offenIn(x).length ? "" : "done"}" data-g="${i}">${offenIn(x).length ? icon(x.icon) : svg("check", 2.6)}${esc(x.titel)}</button>`).join("")}</div>
        <div style="display:flex;gap:14px;align-items:center;margin:8px 0 6px">${ico(s.icon, index + 1, "lg")}
          <div><h2 class="rounded" style="margin:0;font-size:30px">${esc(s.titel)}</h2>
          <div class="small" id="offen" style="font-weight:700;color:${o ? "var(--coral)" : "var(--ok)"}">${o ? `${o} Pflichtangabe${o === 1 ? "" : "n"} offen` : "Alle Pflichtangaben erfasst"}</div></div></div>
        <p class="small" style="font-size:15px">${esc(s.beschreibung)}</p>
        <div id="felder">${s.felder.filter(sichtbar).map(feldHTML).join("")}</div>
        <div class="bottombar">
          ${index > 0 ? `<button class="btn glassy" id="ep" style="flex:.6">${svg("chevl", 2.2)} Zurück</button>` : ""}
          ${index < sch.length - 1 ? `<button class="btn" id="en">Weiter ${svg("chevr", 2.2)}</button>` : `<button class="btn" id="ef" style="${farbVars(2)}">${svg("docs")} Fertig – zu den Unterlagen</button>`}
        </div>`,
      bind: () => {
        const cur = app.querySelector("#stp .cur"); cur && cur.scrollIntoView({ inline: "center", block: "nearest" });
        const gehe = z => { if (z === index) return; vibrate(); const r = z > index ? "fwd" : "back"; uebergang(r, anim => { index = z; render(anim ? (r === "fwd" ? "enter-fwd" : "enter-back") : ""); }); };
        app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => gehe(+b.dataset.g));
        const ep = $("ep"); if (ep) ep.onclick = () => gehe(index - 1);
        const en = $("en"); if (en) en.onclick = () => gehe(index + 1);
        const ef = $("ef"); if (ef) ef.onclick = () => { vibrate(); stack.pop(); if (stack[stack.length - 1] !== FallUebersicht) stack.push(FallUebersicht); uebergang("back", anim => render(anim ? "enter-back" : "")); };
        verdrahten();
      }
    };
    function aktualisieren(struktur) {
      // Pflicht-Anzeige und bedingte Felder aktualisieren, ohne den Fokus zu verlieren
      const o = offenIn(sch[index]).length, el = $("offen");
      el.textContent = o ? `${o} Pflichtangabe${o === 1 ? "" : "n"} offen` : "Alle Pflichtangaben erfasst";
      el.style.color = o ? "var(--coral)" : "var(--ok)";
      if (struktur) { $("felder").innerHTML = sch[index].felder.filter(sichtbar).map(feldHTML).join(""); verdrahten(); }
      app.querySelectorAll(".pflicht").forEach(p => { const f = p.closest(".field, .box")?.querySelector("[data-f],[data-dt],[data-chip],[data-now]"); const id = f && (f.dataset.f || f.dataset.dt || f.dataset.chip || f.dataset.now); if (id) p.classList.toggle("ok", !leer(id)); });
      const stp = app.querySelectorAll("#stp button"); sch.forEach((x, i) => { if (i !== index) stp[i].className = offenIn(x).length ? "" : "done"; });
    }
    function verdrahten() {
      app.querySelectorAll("[data-f]").forEach(el => {
        el.oninput = () => { setze(el.dataset.f, el.value); if (el.tagName === "TEXTAREA") { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; } aktualisieren(false); };
        if (el.tagName === "TEXTAREA") { el.style.height = "auto"; el.style.height = Math.max(96, el.scrollHeight) + "px"; }
      });
      app.querySelectorAll("[data-dt]").forEach(el => el.oninput = () => { setze(el.dataset.dt, el.value); aktualisieren(false); });
      app.querySelectorAll("[data-now]").forEach(el => el.onclick = () => { vibrate(); setze(el.dataset.now, lokalISO(new Date())); aktualisieren(true); });
      app.querySelectorAll("[data-clr]").forEach(el => el.onclick = () => { vibrate(); setze(el.dataset.clr, ""); aktualisieren(true); });
      app.querySelectorAll("[data-chip]").forEach(el => el.onclick = () => {
        vibrate();
        const id = el.dataset.chip, o = el.dataset.o, f = FELDER[id];
        let l = auswahl(id);
        if (f.typ === "mehrfach") {
          if (l.includes(o)) l = l.filter(x => x !== o);
          else if (o.startsWith("Kein")) l = [o];
          else { l = l.filter(x => !x.startsWith("Kein")); l.push(o); }
        } else l = l.includes(o) ? [] : [o];
        setze(id, l.join(TRENNER));
        aktualisieren(true);
      });
    }
  };
  return view;
}

// Dokumente erzeugen
function platzhalter(id) {
  if (id === "heute") return fmtDatum(new Date());
  const a = aufgriff();
  if (id === "frist_richter") { if (wert("festgehalten") === "Nein") return "entfällt – kein Festhalten"; return a ? fmtDatum(richterFrist(a)) : "—"; }
  if (id === "frist_screening") return a ? fmtDatum(screeningFrist(a)) : "—";
  const v = wert(id).trim();
  if (!v) return "—";
  if (FELDER[id] && FELDER[id].typ === "datumzeit") { const d = new Date(v); if (!isNaN(d)) return fmtDatum(d); }
  return v;
}
const einsetzen = t => t.replace(/\{\{(\w+)\}\}/g, (_, id) => platzhalter(id));
function blockHTML(text) {
  let html = "", tab = [], liste = [], abs = [];
  const fertig = () => {
    if (tab.length) { html += `<table>${tab.join("")}</table>`; tab = []; }
    if (liste.length) { html += `<ul>${liste.join("")}</ul>`; liste = []; }
    if (abs.length) { html += `<p>${abs.join("\n")}</p>`; abs = []; }
  };
  for (const z of text.split("\n")) {
    if (z.startsWith("| ")) {
      if (liste.length || abs.length) fertig();
      const t = z.slice(2).split(" | ");
      tab.push(`<tr><td class="l">${inline(t[0])}</td><td>${inline(t.slice(1).join(" | "))}</td></tr>`);
    } else if (z.startsWith("• ")) {
      if (tab.length || abs.length) fertig();
      liste.push(`<li>${inline(z.slice(2))}</li>`);
    } else if (!z.trim()) {
      if (!abs.length) { fertig(); html += "<p>&nbsp;</p>"; } else fertig();
    } else {
      if (tab.length || liste.length) fertig();
      abs.push(inline(z));
    }
  }
  fertig();
  return html;
}
const dokHTML = docs => docs.map((d, i) => `<section class="dok${i ? " neu" : ""}">
  <header><div class="marke">GEAS Hilfe · Screening</div><span class="entwurf">ENTWURF</span></header>

  <footer>Erstellt am ${esc(fmtDatum(new Date()))} mit GEAS Hilfe (inoffizielle Arbeitshilfe). Entwurf – maßgeblich sind die amtlichen Vordrucke.</footer></section>`).join("");

  };
}
// Quiz und Karten halten ihren Zustand in einer Closure und liefern die Ansichtsfunktion zurück.
function Quiz(fragenIn, titel, pruefung = false) {
  const fragen = shuffle(fragenIn);
  let i = 0, punkte = 0, gewaehlt = null;
  const view = () => {
    if (i >= fragen.length) {
      const q = punkte / fragen.length;
      return {
        title: titel,
        html: `<div style="text-align:center;padding:30px 0" class="enter-fade">${ring(q).replace('class="ring"', 'class="ring" style="width:160px;height:160px"')}
          <h2 class="rounded" style="font-size:30px">${punkte} von ${fragen.length} richtig</h2>
          <p class="small" style="font-size:16px">${q >= .8 ? "Sehr gut – bestanden." : q >= .6 ? "Bestanden – einzelne Themen wiederholen." : "Nicht bestanden – Kapitel noch einmal durcharbeiten."}</p></div>
          <button class="btn" id="again">${svg("rotate")} Noch einmal</button>`,
        bind: () => $("again").onclick = () => { stack[stack.length - 1] = Quiz(fragenIn, titel, pruefung); render("enter-fade"); }
      };
    }
    const f = fragen[i];
    const cls = j => gewaehlt === null ? "" : pruefung ? (j === gewaehlt ? "sel" : "") : j === f.richtig ? "ok" : j === gewaehlt ? "bad" : "";
    return {
      title: titel,
      html: `${bar(i / fragen.length)}<div class="small" style="margin-top:10px">Frage ${i + 1} von ${fragen.length}</div>
        <div class="qtitle rounded">${esc(f.frage)}</div>
        ${f.antworten.map((a, j) => `<button class="opt glass press ${cls(j)}" data-a="${j}" ${gewaehlt !== null ? "disabled" : ""}>${esc(a)}</button>`).join("")}
        ${gewaehlt !== null && !pruefung ? `<div class="expl glass enter-fade"><b style="color:${gewaehlt === f.richtig ? "var(--ok)" : "var(--coral)"}">${gewaehlt === f.richtig ? "Richtig" : "Leider falsch"}</b><div>${esc(f.erklaerung)}</div></div>` : ""}
        ${gewaehlt !== null ? `<button class="btn" id="next">${i + 1 < fragen.length ? "Weiter" : "Auswertung"} ${svg("chevr", 2.2)}</button>` : ""}`,
      bind: () => {
        app.querySelectorAll("[data-a]").forEach(el => el.onclick = () => {
          if (gewaehlt !== null) return;
          vibrate();
          gewaehlt = +el.dataset.a;
          const ok = gewaehlt === f.richtig;
          if (ok) punkte++;
          const st = S.quiz[f.frage] || { r: 0, f: 0 };
          ok ? st.r++ : st.f++; st.ok = ok; S.quiz[f.frage] = st; save();
          neuZeichnen();
        });
        const n = $("next");
        if (n) n.onclick = () => { vibrate(); uebergang("fwd", anim => { i++; gewaehlt = null; render(anim ? "enter-fwd" : ""); }); };
      }
    };
  };
  return view;
}
function Karten() {
  let nurNeu = true, stapel = [], i = 0, back = false;
  const alle = () => C.glossar.map(g => ({ id: "g:" + g.begriff, v: g.begriff, h: g.erklaerung }))
    .concat(C.normen.map(n => ({ id: "n:" + n.norm, v: n.norm + "\n" + n.titel, h: n.inhalt + "\n\nPraxis: " + n.praxis })));
  const bau = () => { stapel = shuffle(alle().filter(k => !nurNeu || !S.karten.includes(k.id))); i = 0; back = false; };
  bau();
  return () => {
    const k = stapel[i];
    return {
      title: "Karteikarten",
      html: `<label class="confirm glass" style="margin-bottom:14px"><input type="checkbox" id="nn" ${nurNeu ? "checked" : ""}> Nur noch nicht gewusste Karten</label>
        ${!k ? `<div class="glass" style="padding:40px 20px;text-align:center"><b class="rounded" style="font-size:22px">Alle Karten gewusst!</b><button class="btn glassy" id="all">Alle Karten erneut üben</button></div>` : `
        <div class="small" style="margin:0 4px 8px">Karte ${i + 1} von ${stapel.length}</div>
        <div class="flip ${back ? "back" : ""}" id="fc" role="button" tabindex="0" aria-label="Karte umdrehen">
          <div class="inner"><div class="face glass"><div class="front rounded">${esc(k.v)}</div></div><div class="face b glass"><div>${esc(k.h)}</div></div></div></div>
        <p class="small" style="text-align:center">Tippen zum Umdrehen</p>
        <div class="hstack"><button class="btn glassy" id="no" style="color:#e08600">${svg("rotate")} Nochmal</button><button class="btn" id="yes">${svg("check", 2.6)} Gewusst</button></div>`}`,
      bind: () => {
        $("nn").onchange = e => { nurNeu = e.target.checked; bau(); neuZeichnen(); };
        const all = $("all"); if (all) all.onclick = () => { nurNeu = false; bau(); neuZeichnen(); };
        const fc = $("fc"); if (!fc) return;
        fc.onclick = () => { vibrate(); back = !back; fc.classList.toggle("back", back); };
        const next = known => {
          vibrate();
          S.karten = S.karten.filter(x => x !== k.id); if (known) S.karten.push(k.id); save();
          back = false; if (i + 1 < stapel.length) i++; else bau();
          uebergang("fwd", anim => render(anim ? "enter-fwd" : ""));
        };
        $("no").onclick = () => next(false);
        $("yes").onclick = () => next(true);
      }
    };
  };
}

// ================= Mehr =================
function kontakte() { if (!S.kontakte) S.kontakte = C.kontakte.map(k => ({ ...k })); return S.kontakte; }
function Mehr() {
  return {
    title: "Mehr",
    html: `<div style="display:flex;gap:16px;align-items:center;margin:4px 0 8px">
        <span style="padding:14px;border-radius:22px;background:linear-gradient(135deg,#075c50,#003d35);display:grid">${EMBLEM(46)}</span>
        <div><b class="rounded" style="font-size:24px">${esc(C.meta.titel)}</b><div class="small">Version ${esc(C.meta.version)} · Stand ${esc(C.meta.stand)}</div></div></div>
      <h3 class="sec">Einsatz</h3>${rowtile('id="kt"', "Wichtige Erreichbarkeiten", "Eigene Telefonliste der Dienststelle", "phone", 0)}
      <h3 class="sec">Hilfe</h3>${rowtile('id="ob"', "Einführung erneut ansehen", "", "play", 1)}
      <h3 class="sec">Über diese App</h3>
      <section class="prose glass reveal"><h4>Wichtiger Hinweis</h4><p>${esc(C.meta.hinweis)}</p></section>
      <section class="prose glass reveal"><h4>Quellen & Rechtsstand</h4><ul>${C.quellen.map(q => `<li>${esc(q)}</li>`).join("")}</ul></section>
      <section class="prose glass reveal"><h4>Auf dem iPhone installieren</h4><p>In Safari öffnen → Teilen → „Zum Home-Bildschirm“. Die App funktioniert danach wie eine normale App – auch offline.</p></section>`,
    bind: () => { $("kt").onclick = () => { vibrate(); go(Kontakte); }; $("ob").onclick = () => onboarding(true); }
  };
}
function Kontakte() {
  const ks = kontakte();
  return {
    title: "Erreichbarkeiten",
    html: `${ks.map((k, i) => {
        const tel = (k.telefon || "").replace(/[^\d+]/g, "");
        return `<div class="rowtile glass reveal">${ico("phone", i, "sm")}<span class="txt" data-e="${i}" style="cursor:pointer"><span class="t">${esc(k.name)}</span><br><span class="s">${esc(k.rolle)}</span><br>
          <span style="font-size:14px;font-variant-numeric:tabular-nums;color:${k.telefon ? "inherit" : "#e08600"}">${k.telefon ? esc(k.telefon) : "Nummer noch nicht hinterlegt – tippen"}</span></span>
          ${tel ? `<a href="tel:${tel}" class="ico sm" style="background:linear-gradient(135deg,#0b8c78,#006b5c)" aria-label="${esc(k.name)} anrufen">${svg("phone")}</a>` : ""}</div>`;
      }).join("")}
      <p class="small">Bitte die dienstlich gültigen Nummern selbst eintragen. Die Daten bleiben ausschließlich auf diesem Gerät.</p>
      <button class="btn glassy" id="add">${svg("plus", 2.4)} Kontakt hinzufügen</button>`,
    bind: () => { app.querySelectorAll("[data-e]").forEach(el => el.onclick = () => editKontakt(+el.dataset.e)); $("add").onclick = () => editKontakt(-1); }
  };
}
function editKontakt(i) {
  const ks = kontakte();
  const k = i >= 0 ? ks[i] : { name: "", rolle: "", telefon: "" };
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="sheet" role="dialog" aria-label="Kontakt bearbeiten">
    <h2 class="rounded" style="font-size:24px">${i >= 0 ? "Kontakt bearbeiten" : "Neuer Kontakt"}</h2>
    <label class="f" for="kn">Name / Stelle</label><input type="text" id="kn" value="${esc(k.name)}">
    <label class="f" for="kr2">Zuständigkeit</label><input type="text" id="kr2" value="${esc(k.rolle)}">
    <label class="f" for="kp">Telefon</label><input type="tel" id="kp" value="${esc(k.telefon)}">
    <button class="btn" id="ks" style="margin-top:18px">Sichern</button>
    ${i >= 0 ? '<button class="btn glassy danger" id="kd">Löschen</button>' : ""}
    <button class="btn glassy" id="kc">Abbrechen</button></div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); neuZeichnen(); };
  m.onclick = e => { if (e.target === m) close(); };
  m.querySelector("#kc").onclick = close;
  m.querySelector("#ks").onclick = () => {
    const neu = { name: m.querySelector("#kn").value.trim(), rolle: m.querySelector("#kr2").value.trim(), telefon: m.querySelector("#kp").value.trim() };
    if (!neu.name) return;
    if (i >= 0) ks[i] = neu; else ks.push(neu);
    save(); close();
  };
  const d = m.querySelector("#kd");
  if (d) d.onclick = () => { if (confirm("Kontakt löschen?")) { ks.splice(i, 1); save(); close(); } };
}

// ================= Einführung =================
function onboarding(erneut = false) {
  if (!erneut) { try { if (localStorage.getItem("geas.onboarding.v2") === "1") return; } catch (e) {} }
  const seiten = C.onboarding;
  let i = 0;
  const m = document.createElement("div");
  m.className = "modal";
  const icons = { "hand.wave": "wave", "checkmark.shield": "shieldcheck", "exclamationmark.triangle": "alert", "square.grid.2x2": "grid", "lock.shield": "lock" };
  const draw = () => {
    const last = i === seiten.length - 1, p = seiten[i];
    m.innerHTML = `<div class="sheet" role="dialog" aria-label="Einführung">
      <div class="small" style="display:flex;justify-content:space-between"><span>Einführung ${i + 1} von ${seiten.length}</span>${last ? "" : '<a href="#" id="oj">Zum letzten Schritt</a>'}</div>
      <div class="icon">${i === 0 ? `<span class="emb">${EMBLEM(70)}</span>` : `<span class="ico xl" style="background:linear-gradient(135deg,${pal(i)[0]},${pal(i)[1]})">${svg(icons[p.icon] || "info")}</span>`}</div>
      <h2 class="rounded">${esc(p.titel)}</h2><div class="prose" style="padding:0;font-size:18px">${rich(p.text)}</div>
      <div class="dots">${seiten.map((_, j) => `<span class="${j === i ? "on" : ""}"></span>`).join("")}</div>
      ${last ? `<label class="confirm glass"><input type="checkbox" id="oc"> Ich habe den Hinweis gelesen und verstanden.</label>
        <button class="btn" id="og" disabled>Los geht's</button>` :
        `<div class="hstack">${i > 0 ? `<button class="btn glassy" id="op">Zurück</button>` : ""}<button class="btn" id="on">Weiter</button></div>`}
    </div>`;
    const q = s => m.querySelector(s);
    if (q("#oj")) q("#oj").onclick = e => { e.preventDefault(); i = seiten.length - 1; draw(); };
    if (q("#op")) q("#op").onclick = () => { i--; draw(); };
    if (q("#on")) q("#on").onclick = () => { vibrate(); i++; draw(); };
    if (q("#oc")) q("#oc").onchange = e => { q("#og").disabled = !e.target.checked; };
    if (q("#og")) q("#og").onclick = () => { try { localStorage.setItem("geas.onboarding.v2", "1"); } catch (e) {} m.remove(); };
    const sh = m.querySelector(".sheet"); sh.style.animation = "none"; sh.scrollTop = 0;
  };
  draw();
  m.querySelector(".sheet").style.animation = "";
  document.body.appendChild(m);
}

renderTabs();
stack = [ROOT.start];
render("enter-fade");
onboarding();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
