name: GEAS Hilfe – iOS-Build

on:
  push:
    paths:
      - "geas-app/**"
      - ".github/workflows/geas-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Screening-Entscheidungsbaum gegen Beispielfälle prüfen
        run: node geas-app/tests/screening_faelle.mjs
      - name: Neueste Xcode-Version wählen (Liquid Glass benötigt Xcode 26)
        run: |
          ls -d /Applications/Xcode*.app || true
          NEUESTE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Verwende $NEUESTE"
          sudo xcode-select -s "$NEUESTE"
          xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Xcode-Projekt erzeugen
        working-directory: geas-app/ios
        run: xcodegen generate
      - name: Für den iOS-Simulator bauen (ohne Signatur)
        working-directory: geas-app/ios
        shell: bash {0}
        run: |
          xcodebuild -project GEASHilfe.xcodeproj -scheme GEASHilfe \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          STATUS=$?
          grep -E "error:|\*\* BUILD" build.log | sort -u | head -80 || true
          if [ $STATUS -ne 0 ]; then grep -B2 -A6 "error:" build.log | head -250; fi
          exit $STATUS
      - name: Bildschirmfotos im Simulator
        if: success()
        working-directory: geas-app/ios
        shell: bash {0}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          geraete = json.load(sys.stdin)['devices']
          for runtime, liste in sorted(geraete.items(), reverse=True):
              if 'iOS' not in runtime: continue
              for g in liste:
                  if g['name'].startswith('iPhone') and 'Pro' in g['name'] and 'Max' not in g['name']:
                      print(g['udid']); sys.exit()
          ")
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name GEASHilfe.app -path "*Debug-iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          ID=de.polizei.sachsen.leipzig.geashilfe
          mkdir -p "$GITHUB_WORKSPACE/geas-app/bilder"
          foto() { sleep 6; xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/geas-app/bilder/$1.png"; xcrun simctl terminate "$UDID" $ID; }
          xcrun simctl launch "$UDID" $ID; foto 1-einfuehrung
          xcrun simctl launch "$UDID" $ID -geas.onboarding.v2 YES; foto 2-start-hell
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl launch "$UDID" $ID -geas.onboarding.v2 YES; foto 3-start-dunkel
          ls -la "$GITHUB_WORKSPACE/geas-app/bilder"
      - name: Bildschirmfotos hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bildschirmfotos
          path: geas-app/bilder
